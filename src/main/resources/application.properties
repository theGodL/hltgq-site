# ===== Open-Meteo weather integration =====
openmeteo.base-url=https://api.open-meteo.com/v1
openmeteo.connect-timeout-ms=3000
openmeteo.read-timeout-ms=5000
weather.cache.ttl-minutes=10
weather.cache.ttl-jitter-minutes=3
# stale max age (hours): within it an expired value is still served while refreshing in background
# card 6h = acceptable lag for realtime weather; hourly 24h = window keeps 7-day history, lag hardly matters
weather.card.stale-max-hours=6
weather.hourly.stale-max-hours=24
weather.single-flight.timeout-seconds=3
weather.rate-limit.qps=10
weather.hourly.past-days=7
# forecast days for weather hourly window (model forecast window needs up to 16 days = 384h)
weather.hourly.forecast-days=16
# default location name (\u5357\u6392 = nanpai), overridable by request param
weather.default-location=\u5357\u6392

# ===== weather upgrade: irrigation district reference center (single source: typhoon distance / warmup) =====
weather.site-lon=116.359678
weather.site-lat=30.378607

# ===== weather upgrade N1: 40-day daily forecast (two segments) =====
# default/returned days, capped at 1~40 (>40 treated as 40)
weather.daily.days=40
# per-SEGMENT freshness TTL (minutes) + jitter; expireAt = segment pulledAt + TTL (never a top-level clock)
weather.daily.cache-ttl-minutes=180
weather.daily.cache-jitter-minutes=30
# stale max age (hours): a segment older than this counts as MISSING -> sync refill (not "serve old")
weather.daily.stale-max-hours=24
# single-flight wait (seconds) for daily segment refill: must cover the slowest segment upstream (EC46 ~2-5s)
weather.daily.single-flight-wait-seconds=8
# segment A boundary: 1~16 days from forecast API, beyond that segment B
weather.daily.exact-days=16
# segment B: seasonal EC46 (50 members, aggregated server-side)
weather.seasonal.base-url=https://seasonal-api.open-meteo.com/v1
weather.seasonal.model=ecmwf_ec46
weather.seasonal.forecast-days=46
weather.long-range.connect-timeout-ms=3000
weather.long-range.read-timeout-ms=10000
# named thread pools (slow foreign sources must never block ForkJoinPool.commonPool)
weather.upstream.pool-size=2
weather.upstream.pool-max=4
weather.upstream.pool-queue=64
weather.refresh.pool-size=2
weather.refresh.pool-max=4
weather.refresh.pool-queue=64

# ===== weather upgrade N4: rain trend (computed from daily cache on the fly, no own cache) =====
# member precipitation threshold (mm) used to derive probability when aggregating EC46 members
weather.rain-trend.min-rain-threshold=0.1

# ===== weather upgrade N3: typhoon observation (NMC jsonp, no coordinate in cache key) =====
typhoon.nmc.base-url=https://typhoon.nmc.cn/weatherservice/typhoon/jsons
typhoon.cache-ttl-minutes=30
typhoon.cache-jitter-minutes=10
typhoon.stale-max-hours=6
typhoon.connect-timeout-ms=3000
typhoon.read-timeout-ms=8000

# ===== weather upgrade P3a: warmup task (daily + typhoon only; radar warmup belongs to P3b) =====
weather.warmup.enabled=false
# empty = use weather.site-lon/lat (single source); fill only when warming multiple sites (comma separated)
weather.warmup.locations=
# daily: every 3h, offset 30min from the 3h segment TTL; typhoon: every 30min, aligned with its cache TTL
weather.warmup.daily-cron=0 30 1,4,7,10,13,16,19,22 * * ?
weather.warmup.typhoon-cron=0 10,40 * * * ?

