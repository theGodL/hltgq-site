# ===== flood-drought overview: preset warm-up for first screen (2026-09-13) =====
# purpose: /flood-drought-decision.html auto-loads GET /flood-drought/overview on entry
# (history + preset prediction, ms-level read path, never triggers the model).
# preset runner: checks window [tomorrow 08:00, today+13 08:00] every warm-delay,
# submits ONE short-forecast run when no fresh completed/calculating record covers it.
# display is stale-while-revalidate: overview always serves the newest usable record
# (across the day boundary the previous record still fills the days it fully covers),
# the runner refreshes in background so morning/afternoon visits both see fresh forecasts.
flood-drought.overview.enabled=true
# first check 60s after startup, then every 4h (fixed delay)
flood-drought.overview.warm-initial-delay-ms=60000
flood-drought.overview.warm-delay-ms=14400000
# reuse a completed record covering the window when younger than this (hours); older -> rerun
flood-drought.overview.refresh-hours=3
# soft-delete preset schemes older than this (hours) to keep the scheme list tidy; 0 = keep forever
flood-drought.overview.cleanup-hours=48

