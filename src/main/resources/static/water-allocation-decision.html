<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>配水决策</title>
<link rel="stylesheet" href="./lib/canal-topo.css">
<script src="./lib/model-api.js"></script>
<script src="./lib/canal-topo.js"></script>
<script src="./lib/canal-topo-layout.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;max-width:100%;overflow:hidden}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:#f0f2f5;color:#333;font-size:14px}
.page-wrap{height:100%;min-height:0;padding:16px;display:flex;flex-direction:column;gap:12px;width:100%;max-width:100%;box-sizing:border-box;overflow:hidden}
.breadcrumb{color:#999;font-size:13px;flex-shrink:0}
.breadcrumb .sep{margin:0 6px}
.breadcrumb .cur{color:#333}

.main-layout{display:flex;gap:12px;flex:1;min-height:0;min-width:0;width:100%;align-items:stretch}
.left-panel{width:260px;max-width:100%;flex-shrink:0;background:#fff;border-radius:8px;box-shadow:0 1px 2px rgba(0,0,0,.03);display:flex;flex-direction:column;min-height:0;overflow:hidden}
.left-search{padding:14px 14px 10px;display:flex;align-items:center;gap:8px;flex-shrink:0}
.search-box{flex:1;position:relative;min-width:0}
.search-box input{width:100%;height:32px;border:1px solid #d9d9d9;border-radius:16px;padding:0 12px 0 34px;font-size:13px;outline:none;background:#fff;color:#333}
.search-box input:focus{border-color:#1677ff;box-shadow:0 0 0 2px rgba(22,119,255,.1)}
.search-box .ico{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:#bfbfbf;pointer-events:none;display:flex}
.search-collapse{width:28px;height:28px;border:none;background:transparent;cursor:pointer;color:#999;border-radius:4px;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
.search-collapse:hover{background:#f5f5f5;color:#1677ff}
.left-list{flex:1;overflow-y:auto;min-height:0;padding:0 0 8px}
.list-item{padding:12px 18px 12px 15px;cursor:pointer;color:#333;font-size:14px;line-height:22px;user-select:none;transition:background .15s,color .15s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-left:3px solid transparent}
.list-item:hover{background:#f5f5f5}
.list-item.active{background:#e6f4ff;color:#1677ff;font-weight:500;border-left-color:#1677ff}
.list-item.is-muted{color:#999}
.list-item .status-tip{font-size:12px;color:#999;margin-left:4px}

.right-panel{flex:1;min-width:0;display:flex;flex-direction:column;min-height:0;overflow:hidden;background:#fff;border-radius:8px;box-shadow:0 1px 2px rgba(0,0,0,.03)}
.right-scroll{flex:1;overflow-y:auto;overflow-x:hidden;min-height:0;padding:16px 20px 20px}

.stats-row{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px;flex-shrink:0}
.stat-card{background:#fafafa;border:1px solid #f0f0f0;border-radius:8px;padding:16px 20px}
.stat-card .label{color:#999;font-size:13px;margin-bottom:8px}
.stat-card .value{font-size:24px;font-weight:700;color:#1f1f1f;line-height:1.2}
.stat-card .value .unit{font-size:13px;font-weight:400;color:#999;margin-left:4px}

.map-toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.map-toolbar .chart-title{margin:0;font-size:14px;font-weight:500;color:#333}
.map-filters{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.map-filters .field{height:32px;border:1px solid #d9d9d9;border-radius:6px;padding:0 11px;font-size:14px;outline:none;background:#fff;color:#333;width:140px}
.map-filters .field:focus{border-color:#1677ff;box-shadow:0 0 0 2px rgba(22,119,255,.1)}
.tenday-slider-wrap{position:relative;width:180px;height:28px;flex-shrink:0}
.tenday-slider-wrap::before{content:'';position:absolute;left:0;right:0;top:50%;height:4px;margin-top:-2px;background:#e8e8e8;border-radius:2px;z-index:0;pointer-events:none}
.tenday-slider-wrap input[type=range]{position:absolute;left:0;top:8px;width:100%;margin:0;pointer-events:none;appearance:none;background:transparent;height:12px;z-index:1}
.tenday-slider-wrap input[type=range]::-webkit-slider-runnable-track{height:4px;background:transparent;border:none}
.tenday-slider-wrap input[type=range]::-webkit-slider-thumb{appearance:none;width:14px;height:14px;border-radius:50%;background:#1677ff;cursor:pointer;pointer-events:auto;margin-top:-5px;border:2px solid #fff;box-shadow:0 0 0 1px #91caff;position:relative;z-index:2}
.tenday-slider-wrap input[type=range]::-moz-range-track{height:4px;background:transparent;border:none}
.tenday-slider-wrap input[type=range]::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:#1677ff;cursor:pointer;pointer-events:auto;border:2px solid #fff;box-shadow:0 0 0 1px #91caff;position:relative;z-index:2}
.date-sep{color:#bbb;flex-shrink:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:5px;padding:0 16px;height:32px;border:1px solid transparent;border-radius:6px;cursor:pointer;font-size:14px;white-space:nowrap;transition:all .2s;background:#fff}
.btn-default{color:#333;border-color:#d9d9d9}
.btn-default:hover{color:#1677ff;border-color:#1677ff}
.topo-fullscreen{height:28px;width:28px;padding:0;flex-shrink:0}

.topo-wrap{position:relative;border:1px solid #f0f0f0;border-radius:8px;background:#fff;overflow:hidden;min-height:480px;width:100%;max-width:100%;flex:1}
.topo-svg{display:block;width:1880px;height:1020px;padding:0;user-select:none;pointer-events:none;text-rendering:geometricPrecision;shape-rendering:geometricPrecision}
.topo-viewport{height:min(620px,calc(100vh - 260px));width:100%;max-width:100%;overflow:hidden;cursor:grab;background:#fafafa;touch-action:none}
.topo-viewport.is-dragging{cursor:grabbing}
.topo-canvas{width:1880px;height:1020px;transform-origin:0 0;will-change:transform}
.topo-wrap:fullscreen,.topo-wrap:-webkit-full-screen{display:flex;align-items:center;justify-content:center;width:100%;height:100%;min-height:0;border:none;border-radius:0;background:#f0f2f5}
.topo-wrap:fullscreen .topo-viewport,.topo-wrap:-webkit-full-screen .topo-viewport{width:100%;height:100%;max-width:none;max-height:none}
.topo-pan-hint{position:absolute;left:12px;bottom:10px;z-index:2;font-size:12px;color:#999;background:rgba(255,255,255,.9);padding:2px 8px;border-radius:4px;pointer-events:none}
.topo-var-pill{fill:#3d9a48;stroke:#2d7a36;stroke-width:.75}
.topo-var-pill.supply{fill:#1677ff;stroke:#0958d9;stroke-width:.75}
.topo-var-txt{fill:#fff;font-size:11px;font-weight:700;font-family:Consolas,'Microsoft YaHei',sans-serif;pointer-events:none}
.topo-main-label{font-family:SimHei,'Microsoft YaHei',sans-serif;font-size:17px;fill:#cf1322;font-weight:700}
.topo-legend{position:absolute;right:12px;bottom:12px;z-index:2;background:#fff;border:1px solid #111;padding:10px 14px 8px;font-family:SimHei,'Microsoft YaHei',sans-serif;color:#111;min-width:340px;box-shadow:none;border-radius:0}
.topo-legend .lg-title{text-align:center;font-size:18px;font-weight:700;margin-bottom:10px;letter-spacing:4px}
.topo-legend .lg-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px 18px;align-items:center}
.topo-legend .lg-row{display:flex;align-items:center;gap:8px;font-size:12px;line-height:1.4;color:#111}
.topo-legend .lg-foot{text-align:right;margin-top:8px;font-size:11px;color:#5b9bd5}
.tag-legend{display:flex;align-items:center;gap:16px;margin-top:10px;padding-top:8px;border-top:1px solid #eee;font-size:12px;color:#333}
.tag-legend .chip{display:inline-flex;align-items:center;gap:6px}
.tag-legend .sw{width:28px;height:14px;border-radius:3px;display:inline-block}

.toast{position:fixed;left:50%;top:24px;transform:translateX(-50%);background:rgba(0,0,0,.75);color:#fff;padding:8px 16px;border-radius:6px;font-size:13px;z-index:2000;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}

@media (max-width:1100px){
  .main-layout{flex-direction:column}
  .left-panel{width:100%;max-height:200px}
  .stats-row{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="page-wrap">
    <!-- 面包屑暂隐藏，后续可能不需要
<div class="breadcrumb">
    <span>智能决策</span><span class="sep">/</span>
    <span class="cur">配水决策</span>
  </div>
  -->

  <div class="main-layout">
    <div class="left-panel">
      <div class="left-search">
        <div class="search-box">
          <span class="ico">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="1.8"/><path d="M16.5 16.5L21 21" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
          </span>
          <input type="text" id="scheme-search" placeholder="请输入关键字" autocomplete="off">
        </div>
        <button type="button" class="search-collapse" id="scheme-collapse" title="收起/展开">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M4 7h16M4 12h10M4 17h16" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        </button>
      </div>
      <div class="left-list" id="scheme-list"></div>
    </div>

    <div class="right-panel">
      <div class="right-scroll">
        <div class="stats-row" id="stats-row">
          <div class="stat-card"><div class="label">总需水量</div><div class="value">—<span class="unit">万m³</span></div></div>
          <div class="stat-card"><div class="label">总建议供水</div><div class="value">—<span class="unit">万m³</span></div></div>
          <div class="stat-card"><div class="label">不满足需水支渠</div><div class="value">—<span class="unit">条</span></div></div>
        </div>

        <div class="chart-card">
        <div class="map-toolbar">
          <div class="chart-title">配水调度</div>
          <div class="map-filters">
            <select class="field" id="map-tenday" style="min-width:140px" title="选择旬"></select>
            <div class="tenday-slider-wrap" title="拖动切换旬">
              <input type="range" id="map-tenday-slider" min="0" max="0" value="0" step="1">
            </div>
            <span class="date-sep" id="map-tenday-label" style="color:#666;font-size:13px;min-width:72px"></span>
            <button type="button" class="btn btn-default topo-fullscreen" id="topo-full-btn" title="全屏">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
          </div>
        </div>
        <div id="topo-mount"></div>
        </div>
      </div>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
(function () {
  function $(id) { return document.getElementById(id); }
  function toast(msg) {
    var el = $('toast');
    if (!el) return;
    el.textContent = msg || '';
    el.classList.add('show');
    clearTimeout(toast._t);
    toast._t = setTimeout(function () { el.classList.remove('show'); }, 2200);
  }
  function fmtNum(v, d) {
    if (v == null || v === '' || Number.isNaN(Number(v))) return '—';
    return Number(v).toLocaleString('zh-CN', { minimumFractionDigits: d, maximumFractionDigits: d });
  }

  const BRANCH_LAYOUT = (window.CanalTopo && CanalTopo.BRANCH_LAYOUT) || [];

  var API = window.ModelApi;
  var schemes = [];
  var activeId = '';
  var activeScheme = null;
  var activeBranches = [];
  var schemeYear = new Date().getFullYear();

  function pad2(n) { return n < 10 ? '0' + n : '' + n; }

  /** "5月上旬" → { month:5, day:1 }；中旬→11，下旬→21 */
  function parseTendayLabel(label) {
    var m = String(label || '').match(/(\d{1,2})\s*月\s*(上|中|下)\s*旬/);
    if (!m) return null;
    var month = Number(m[1]);
    var day = m[2] === '上' ? 1 : m[2] === '中' ? 11 : 21;
    return { month: month, day: day };
  }

  function tendayToDate(label, year) {
    var p = parseTendayLabel(label);
    if (!p) return '';
    var y = year || schemeYear;
    return y + '-' + pad2(p.month) + '-' + pad2(p.day);
  }

  function lastDayOfMonth(year, month) {
    return new Date(year, month, 0).getDate();
  }

  function tendayEndDate(label, year) {
    var p = parseTendayLabel(label);
    if (!p) return '';
    var y = year || schemeYear;
    var day = p.day === 1 ? 10 : p.day === 11 ? 20 : lastDayOfMonth(y, p.month);
    return y + '-' + pad2(p.month) + '-' + pad2(day);
  }

  function collectTendayLabels(detail) {
    var labels = [];
    var seen = {};
    function push(lab) {
      if (!lab || seen[lab]) return;
      seen[lab] = true;
      labels.push(lab);
    }
    ((detail && detail.scaleFactors) || []).forEach(function (x) { push(x.tendayLabel); });
    ((detail && detail.branchDetails) || []).forEach(function (x) { push(x.tendayLabel); });
    return labels;
  }

  function renderList() {
    var q = ($('scheme-search').value || '').trim();
    var html = schemes.filter(function (s) {
      var name = s.schemeName || s.name || '';
      return !q || name.indexOf(q) >= 0;
    }).map(function (s) {
      var name = s.schemeName || s.name || s.id;
      var muted = s.status && s.status !== 'completed';
      return '<div class="list-item' + (String(s.id) === String(activeId) ? ' active' : '') +
        (muted ? ' is-muted' : '') + '" data-id="' + s.id + '">' + name +
        (muted ? '<span class="status-tip">(' + (API.statusLabel ? API.statusLabel(s.status) : s.status) + ')</span>' : '') +
        '</div>';
    }).join('');
    $('scheme-list').innerHTML = html || '<div style="padding:24px;text-align:center;color:#bbb">暂无方案</div>';
  }

  function renderStats(rec) {
    if (!rec) {
      $('stats-row').innerHTML =
        '<div class="stat-card"><div class="label">总需水量</div><div class="value">—<span class="unit">万m³</span></div></div>' +
        '<div class="stat-card"><div class="label">总建议供水</div><div class="value">—<span class="unit">万m³</span></div></div>' +
        '<div class="stat-card"><div class="label">不满足需水支渠</div><div class="value">—<span class="unit">条</span></div></div>';
      return;
    }
    $('stats-row').innerHTML =
      '<div class="stat-card"><div class="label">总需水量</div><div class="value">' + fmtNum(rec.totalDemand, 0) + '<span class="unit">万m³</span></div></div>' +
      '<div class="stat-card"><div class="label">总建议供水</div><div class="value">' + fmtNum(rec.totalSupply, 0) + '<span class="unit">万m³</span></div></div>' +
      '<div class="stat-card"><div class="label">不满足需水支渠</div><div class="value">' + fmtNum(rec.unsatisfiedCount, 0) + '<span class="unit">条</span></div></div>';
  }

  function branchMetricMap() {
    var map = {};
    (activeBranches || []).forEach(function (r) {
      var k = r.key || r.branchName;
      map[k] = r;
      if (!map[r.branchName]) map[r.branchName] = r;
    });
    return map;
  }

  function placeBox(b, tw, th, nameH, nameW) {
    var x = 0, y = 0;
    switch (b.place) {
      case 'down':
        x = b.cx - tw / 2;
        y = b.tip + 6 + nameH + 2;
        break;
      case 'up':
        x = b.cx - tw / 2;
        y = b.tip - 8 - nameH - th - 2;
        break;
      case 'upSide':
        x = b.cx + 8;
        y = b.tip - th - 2;
        break;
      case 'hLeft':
        x = b.cx - nameW - tw - 6;
        y = b.tip - th / 2;
        break;
      case 'hRight':
        x = b.cx + nameW + 4;
        y = b.tip - th / 2;
        break;
      case 'hBelow':
        x = b.cx - tw / 2;
        y = b.tip + 14;
        break;
      case 'hAbove':
        x = b.cx - tw / 2;
        y = b.tip - th - 5;
        break;
      default:
        x = b.cx - tw / 2;
        y = b.tip + 10;
    }
    return { x: x, y: y };
  }

  function renderTopoTags() {
    var layer = $('topo-var-layer');
    if (!layer) return;
    var metricMap = branchMetricMap();
    var padX = 5, th = 16, gap = 3;
    var boxes = [];

    BRANCH_LAYOUT.forEach(function (b) {
      var key = b.key || b.name;
      var row = metricMap[key] || metricMap[b.name];
      var demandVal = row && row.demand != null ? Number(row.demand).toFixed(1) : '—';
      var supplyVal = row && row.supply != null ? Number(row.supply).toFixed(1) : '—';
      var fs = Math.max(11, (b.fs || 10) + 1);
      var nameH = b.name.length * (fs + 1);
      var nameW = b.name.length * fs;
      var twD = Math.max(30, String(demandVal).length * 7.0 + padX * 2);
      var twS = Math.max(30, String(supplyVal).length * 7.0 + padX * 2);
      var pos = placeBox(b, twD, th, nameH, nameW);

      // 双标签并排：需水(绿) + 配水(蓝)，按 place 调整第二枚偏移避免叠字
      var x1 = pos.x, y1 = pos.y, x2, y2;
      if (b.place === 'hLeft') {
        // 向左排列：配水在更左，需水靠近渠名
        x2 = x1 - twS - gap;
        y2 = y1;
      } else if (b.place === 'up' || b.place === 'hAbove') {
        // 上下叠放：配水在需水上方
        x2 = x1 + (twD - twS) / 2;
        y2 = y1 - th - gap;
      } else if (b.place === 'upSide') {
        x2 = x1 + twD + gap;
        y2 = y1;
      } else {
        // down / hRight / default：配水在需水右侧
        x2 = x1 + twD + gap;
        y2 = y1;
      }

      boxes.push({
        name: b.name, val: demandVal, x: x1, y: y1, w: twD, h: th,
        key: key + ':d', kind: 'demand', title: b.name + ' 需水：' + demandVal + ' 万m³'
      });
      boxes.push({
        name: b.name, val: supplyVal, x: x2, y: y2, w: twS, h: th,
        key: key + ':s', kind: 'supply',
        title: b.name + ' 配水：' + supplyVal + ' 万m³'
      });
    });

    // 简单避让
    boxes.sort(function (a, b) { return a.y - b.y || a.x - b.x; });
    for (var i = 0; i < boxes.length; i++) {
      for (var j = 0; j < i; j++) {
        var A = boxes[i], B = boxes[j];
        if (A.x < B.x + B.w + 2 && A.x + A.w + 2 > B.x && A.y < B.y + B.h + 2 && A.y + A.h + 2 > B.y) {
          A.y = B.y + B.h + 3;
        }
      }
    }

    var ns = 'http://www.w3.org/2000/svg';
    layer.innerHTML = '';
    boxes.forEach(function (box) {
      var g = document.createElementNS(ns, 'g');
      g.setAttribute('data-branch', box.key);
      var rect = document.createElementNS(ns, 'rect');
      rect.setAttribute('x', box.x);
      rect.setAttribute('y', box.y);
      rect.setAttribute('width', box.w);
      rect.setAttribute('height', box.h);
      rect.setAttribute('rx', '3');
      rect.setAttribute('ry', '3');
      var cls = 'topo-var-pill';
      if (box.kind === 'supply') cls += ' supply';
      rect.setAttribute('class', cls);
      var title = document.createElementNS(ns, 'title');
      title.textContent = box.title;
      var text = document.createElementNS(ns, 'text');
      text.setAttribute('class', 'topo-var-txt');
      text.setAttribute('x', box.x + box.w / 2);
      text.setAttribute('y', box.y + box.h / 2 + 4);
      text.setAttribute('text-anchor', 'middle');
      text.textContent = box.val;
      g.appendChild(title);
      g.appendChild(rect);
      g.appendChild(text);
      layer.appendChild(g);
    });
  }

  var topoApi = null;
  function fitTopo() {
    if (topoApi && typeof topoApi.fitToScreen === 'function') topoApi.fitToScreen();
  }
  var initTopoPanZoom = { fitToScreen: fitTopo };

  async function loadBranches(startDate) {
    if (!activeId || !API || !API.decision) return;
    try {
      var data = await API.decision.branches(activeId, startDate || null);
      activeBranches = (data && data.branches) || [];
      if (data && data.tendayLabel) {
        syncTendayUi(data.tendayLabel);
      }
      renderTopoTags();
    } catch (e) {
      activeBranches = [];
      renderTopoTags();
      toast((e && e.message) || '支渠数据加载失败');
    }
  }

  var schemeTendayLabels = [];

  function syncTendayUi(label) {
    var sel = $('map-tenday');
    var slider = $('map-tenday-slider');
    var tip = $('map-tenday-label');
    if (!sel) return;
    if (label && schemeTendayLabels.indexOf(label) < 0) {
      schemeTendayLabels.push(label);
      fillTendayControls(label);
    }
    if (label && schemeTendayLabels.indexOf(label) >= 0) sel.value = label;
    var idx = schemeTendayLabels.indexOf(sel.value);
    if (slider && idx >= 0) slider.value = idx;
    if (tip) tip.textContent = sel.value || '';
  }

  function fillTendayControls(prefer) {
    var sel = $('map-tenday');
    var slider = $('map-tenday-slider');
    if (!sel) return;
    sel.innerHTML = schemeTendayLabels.map(function (p) {
      return '<option value="' + p + '">' + p + '</option>';
    }).join('') || '<option value="">暂无旬</option>';
    var max = Math.max(0, schemeTendayLabels.length - 1);
    if (slider) {
      slider.min = 0;
      slider.max = max;
      slider.disabled = !schemeTendayLabels.length;
    }
    var pick = prefer && schemeTendayLabels.indexOf(prefer) >= 0
      ? prefer
      : (schemeTendayLabels[0] || '');
    if (pick) sel.value = pick;
    syncTendayUi(sel.value);
  }

  function selectedTendayStartDate() {
    var label = $('map-tenday') && $('map-tenday').value;
    return label ? tendayToDate(label, schemeYear) : null;
  }

  async function selectScheme(id) {
    activeId = String(id || '');
    activeScheme = schemes.find(function (s) { return String(s.id) === activeId; }) || null;
    activeBranches = [];
    schemeTendayLabels = [];
    renderList();
    renderStats(null);
    renderTopoTags();
    if (!activeScheme) return;
    if (activeScheme.status && activeScheme.status !== 'completed') {
      toast('方案未完成，无法查看详情');
      return;
    }
    if (!API || !API.decision) {
      toast('接口客户端未加载');
      return;
    }
    try {
      var detail = await API.decision.detail(activeId);
      var rec = (detail && detail.record) || detail || {};
      renderStats(rec);
      if (rec.createdAt) {
        var y = Number(String(rec.createdAt).slice(0, 4));
        if (y) schemeYear = y;
      }
      schemeTendayLabels = collectTendayLabels(detail);
      fillTendayControls(schemeTendayLabels[0]);
      await loadBranches(selectedTendayStartDate());
    } catch (e) {
      renderStats(null);
      toast((e && e.message) || '加载方案失败');
    }
  }

  async function loadSchemeList() {
    if (!API || !API.decision) {
      toast('接口客户端未加载');
      return;
    }
    try {
      schemes = (await API.decision.list()) || [];
      renderList();
      var first = schemes.find(function (s) { return s.status === 'completed'; }) || schemes[0];
      if (first) await selectScheme(first.id);
      else {
        renderStats(null);
        renderTopoTags();
      }
    } catch (e) {
      schemes = [];
      renderList();
      toast((e && e.message) || '方案列表加载失败');
    }
  }

  // 图例补充：需水/配水色块（挂载拓扑后再注入）
  function enrichLegend() {
    var legend = document.querySelector('.topo-legend');
    if (!legend || legend.querySelector('.tag-legend')) return;
    var div = document.createElement('div');
    div.className = 'tag-legend';
    div.innerHTML =
      '<span class="chip"><span class="sw" style="background:#3d9a48"></span>需水</span>' +
      '<span class="chip"><span class="sw" style="background:#1677ff"></span>配水</span>';
    legend.appendChild(div);
  }

  $('scheme-list').addEventListener('click', function (e) {
    var item = e.target.closest('.list-item');
    if (!item) return;
    selectScheme(item.dataset.id);
  });
  $('scheme-search').addEventListener('input', renderList);
  $('scheme-collapse').addEventListener('click', function () {
    var list = $('scheme-list');
    list.style.display = list.style.display === 'none' ? '' : 'none';
  });
  $('topo-full-btn').addEventListener('click', function () {
    var wrap = $('topo-wrap');
    if (!wrap) return;
    if (!document.fullscreenElement) {
      (wrap.requestFullscreen || wrap.webkitRequestFullscreen).call(wrap);
    } else {
      (document.exitFullscreen || document.webkitExitFullscreen).call(document);
    }
  });
  document.addEventListener('fullscreenchange', function () {
    setTimeout(function () {
      if (typeof initTopoPanZoom.fitToScreen === 'function') initTopoPanZoom.fitToScreen();
    }, 80);
  });
  $('map-tenday').addEventListener('change', function () {
    syncTendayUi($('map-tenday').value);
    loadBranches(selectedTendayStartDate());
  });
  $('map-tenday-slider').addEventListener('input', function () {
    var idx = Number($('map-tenday-slider').value) || 0;
    var label = schemeTendayLabels[idx];
    if (!label) return;
    $('map-tenday').value = label;
    syncTendayUi(label);
    loadBranches(selectedTendayStartDate());
  });


  CanalTopo.mount('#topo-mount').then(function (api) {
    topoApi = api;
    enrichLegend();
    renderTopoTags();
    fitTopo();
  }).catch(function (err) {
    toast((err && err.message) || '拓扑图加载失败');
  });
  loadSchemeList();
  window.addEventListener('resize', function () {
    clearTimeout(window.__topoFit);
    window.__topoFit = setTimeout(function () {
      fitTopo();
    }, 100);
  });
})();
</script>
</body>
</html>
