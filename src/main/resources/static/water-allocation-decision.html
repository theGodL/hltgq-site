<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>配水决策</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;max-width:100%;overflow:hidden}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:#f0f2f5;color:#333;font-size:14px}
.page-wrap{height:100%;min-height:0;padding:16px;display:flex;flex-direction:column;gap:12px;width:100%;max-width:100%;box-sizing:border-box;overflow:hidden}
.breadcrumb{color:#999;font-size:13px;flex-shrink:0}
.breadcrumb .sep{margin:0 6px}
.breadcrumb .cur{color:#333}

.main-layout{display:flex;gap:12px;flex:1;min-height:0;min-width:0;width:100%;align-items:stretch}
.left-panel{width:260px;max-width:100%;flex-shrink:0;background:#fff;border-radius:8px;box-shadow:0 1px 2px rgba(0,0,0,.03);display:flex;flex-direction:column;min-height:0;overflow:hidden}
.left-search{padding:14px 14px 10px;display:flex;align-items:center;gap:8px;flex-shrink:0}
.search-box{flex:1;position:relative;min-width:0}
.search-box input{width:100%;height:32px;border:1px solid #d9d9d9;border-radius:16px;padding:0 12px 0 34px;font-size:13px;outline:none;background:#fff;color:#333}
.search-box input:focus{border-color:#1677ff;box-shadow:0 0 0 2px rgba(22,119,255,.1)}
.search-box .ico{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:#bfbfbf;pointer-events:none;display:flex}
.search-collapse{width:28px;height:28px;border:none;background:transparent;cursor:pointer;color:#999;border-radius:4px;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
.search-collapse:hover{background:#f5f5f5;color:#1677ff}
.left-list{flex:1;overflow-y:auto;min-height:0;padding:0 0 8px}
.list-item{padding:12px 18px 12px 15px;cursor:pointer;color:#333;font-size:14px;line-height:22px;user-select:none;transition:background .15s,color .15s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-left:3px solid transparent}
.list-item:hover{background:#f5f5f5}
.list-item.active{background:#e6f4ff;color:#1677ff;font-weight:500;border-left-color:#1677ff}

.right-panel{flex:1;min-width:0;display:flex;flex-direction:column;min-height:0;overflow:hidden;background:#fff;border-radius:8px;box-shadow:0 1px 2px rgba(0,0,0,.03)}
.right-scroll{flex:1;overflow-y:auto;overflow-x:hidden;min-height:0;padding:16px 20px 20px}

.stats-row{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px;flex-shrink:0}
.stat-card{background:#fafafa;border:1px solid #f0f0f0;border-radius:8px;padding:16px 20px}
.stat-card .label{color:#999;font-size:13px;margin-bottom:8px}
.stat-card .value{font-size:24px;font-weight:700;color:#1f1f1f;line-height:1.2}
.stat-card .value .unit{font-size:13px;font-weight:400;color:#999;margin-left:4px}

.map-toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.map-toolbar .chart-title{margin:0;font-size:14px;font-weight:500;color:#333}
.map-filters{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.map-filters .field{height:32px;border:1px solid #d9d9d9;border-radius:6px;padding:0 11px;font-size:14px;outline:none;background:#fff;color:#333;width:140px}
.map-filters .field:focus{border-color:#1677ff;box-shadow:0 0 0 2px rgba(22,119,255,.1)}
.date-sep{color:#bbb;flex-shrink:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:5px;padding:0 16px;height:32px;border:1px solid transparent;border-radius:6px;cursor:pointer;font-size:14px;white-space:nowrap;transition:all .2s;background:#fff}
.btn-default{color:#333;border-color:#d9d9d9}
.btn-default:hover{color:#1677ff;border-color:#1677ff}
.topo-fullscreen{height:28px;width:28px;padding:0;flex-shrink:0}

.topo-wrap{position:relative;border:1px solid #f0f0f0;border-radius:8px;background:#fff;overflow:hidden;min-height:480px;width:100%;max-width:100%;flex:1}
.topo-svg{display:block;width:1880px;height:1020px;padding:0;user-select:none;pointer-events:none;text-rendering:geometricPrecision;shape-rendering:geometricPrecision}
.topo-viewport{height:min(620px,calc(100vh - 260px));width:100%;max-width:100%;overflow:hidden;cursor:grab;background:#fafafa;touch-action:none}
.topo-viewport.is-dragging{cursor:grabbing}
.topo-canvas{width:1880px;height:1020px;transform-origin:0 0;will-change:transform}
.topo-wrap:fullscreen,.topo-wrap:-webkit-full-screen{display:flex;align-items:center;justify-content:center;width:100%;height:100%;min-height:0;border:none;border-radius:0;background:#f0f2f5}
.topo-wrap:fullscreen .topo-viewport,.topo-wrap:-webkit-full-screen .topo-viewport{width:100%;height:100%;max-width:none;max-height:none}
.topo-pan-hint{position:absolute;left:12px;bottom:10px;z-index:2;font-size:12px;color:#999;background:rgba(255,255,255,.9);padding:2px 8px;border-radius:4px;pointer-events:none}
.topo-var-pill{fill:#3d9a48;stroke:#2d7a36;stroke-width:.75}
.topo-var-pill.supply{fill:#1677ff;stroke:#0958d9;stroke-width:.75}
.topo-var-pill.unmet{fill:#fa8c16;stroke:#d46b08;stroke-width:.75}
.topo-var-txt{fill:#fff;font-size:11px;font-weight:700;font-family:Consolas,'Microsoft YaHei',sans-serif;pointer-events:none}
.topo-main-label{font-family:SimHei,'Microsoft YaHei',sans-serif;font-size:17px;fill:#cf1322;font-weight:700}
.topo-legend{position:absolute;right:12px;bottom:12px;z-index:2;background:#fff;border:1px solid #111;padding:10px 14px 8px;font-family:SimHei,'Microsoft YaHei',sans-serif;color:#111;min-width:340px;box-shadow:none;border-radius:0}
.topo-legend .lg-title{text-align:center;font-size:18px;font-weight:700;margin-bottom:10px;letter-spacing:4px}
.topo-legend .lg-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px 18px;align-items:center}
.topo-legend .lg-row{display:flex;align-items:center;gap:8px;font-size:12px;line-height:1.4;color:#111}
.topo-legend .lg-foot{text-align:right;margin-top:8px;font-size:11px;color:#5b9bd5}
.tag-legend{display:flex;align-items:center;gap:16px;margin-top:10px;padding-top:8px;border-top:1px solid #eee;font-size:12px;color:#333}
.tag-legend .chip{display:inline-flex;align-items:center;gap:6px}
.tag-legend .sw{width:28px;height:14px;border-radius:3px;display:inline-block}

.toast{position:fixed;left:50%;top:24px;transform:translateX(-50%);background:rgba(0,0,0,.75);color:#fff;padding:8px 16px;border-radius:6px;font-size:13px;z-index:2000;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}

@media (max-width:1100px){
  .main-layout{flex-direction:column}
  .left-panel{width:100%;max-height:200px}
  .stats-row{grid-template-columns:1fr}
}
</style>
</head>

  function fmtNum(v, d) {

  /** mock：接口就绪后替换 */
  function loadMockSchemes() {
    // unique by key（同名支渠用 key 区分）
    var branchNames = [];
    var seen = {};
    BRANCH_LAYOUT.forEach(function (b) {
      var k = b.key || b.name;
      if (seen[k]) return;
      seen[k] = true;
      branchNames.push({ key: k, name: b.name });
    });

    function makeScheme(id, title, seed) {
      var rnd = function (i, a, b) {
        var x = Math.sin(seed * 12.9898 + i * 78.233) * 43758.5453;
        return a + (x - Math.floor(x)) * (b - a);
      };
      var branches = branchNames.map(function (b, i) {
        var demand = Math.round(rnd(i, 8, 48) * 10) / 10;
        var ratio = rnd(i + 50, 0.55, 1.05);
        var supply = Math.round(demand * ratio * 10) / 10;
        var satisfied = supply + 0.05 >= demand;
        // 固定约 8 条不满足（方案 1）
        if (id === '1' && i < 8) {
          supply = Math.round(demand * rnd(i + 90, 0.4, 0.75) * 10) / 10;
          satisfied = false;
        }
        return {
          key: b.key,
          branchName: b.name,
          demand: demand,
          supply: supply,
          isSatisfied: satisfied
        };
      });
      var totalDemand = branches.reduce(function (s, r) { return s + r.demand; }, 0);
      var totalSupply = branches.reduce(function (s, r) { return s + r.supply; }, 0);
      var unsatisfiedCount = branches.filter(function (r) { return !r.isSatisfied; }).length;
      return {
        id: String(id),
        name: title,
        totalDemand: Math.round(totalDemand * 10) / 10,
        totalSupply: Math.round(totalSupply * 10) / 10,
        unsatisfiedCount: unsatisfiedCount,
        startDate: '2027-05-01',
        endDate: '2027-05-10',
        branches: branches
      };
    }

    // 方案1 用截图量级微调
    var list = [];
    for (var i = 1; i <= 9; i++) {
      list.push(makeScheme(i, '配水调度结果' + i, i * 17 + 3));
    }
    list[0].totalDemand = 8048;
    list[0].totalSupply = 6740;
    list[0].unsatisfiedCount = 8;
    return list;
  }

  var schemes = loadMockSchemes();
  var activeId = '';
  var activeScheme = null;

  function renderList() {
    var q = ($('scheme-search').value || '').trim();
    var html = schemes.filter(function (s) {
      return !q || s.name.indexOf(q) >= 0;
    }).map(function (s) {
      return '<div class="list-item' + (s.id === activeId ? ' active' : '') + '" data-id="' + s.id + '">' + s.name + '</div>';
    }).join('');
    $('scheme-list').innerHTML = html || '<div style="padding:24px;text-align:center;color:#bbb">暂无方案</div>';
  }

  function renderStats(s) {
    if (!s) {
      $('stats-row').innerHTML =
        '<div class="stat-card"><div class="label">总需水量</div><div class="value">—<span class="unit">万m³</span></div></div>' +
        '<div class="stat-card"><div class="label">总建议供水</div><div class="value">—<span class="unit">万m³</span></div></div>' +
        '<div class="stat-card"><div class="label">不满足需水支渠</div><div class="value">—<span class="unit">条</span></div></div>';
      return;
    }
    $('stats-row').innerHTML =
      '<div class="stat-card"><div class="label">总需水量</div><div class="value">' + fmtNum(s.totalDemand, 0) + '<span class="unit">万m³</span></div></div>' +
      '<div class="stat-card"><div class="label">总建议供水</div><div class="value">' + fmtNum(s.totalSupply, 0) + '<span class="unit">万m³</span></div></div>' +
      '<div class="stat-card"><div class="label">不满足需水支渠</div><div class="value">' + fmtNum(s.unsatisfiedCount, 0) + '<span class="unit">条</span></div></div>';
  }

  function branchMetricMap() {
    var map = {};
    if (!activeScheme) return map;
    (activeScheme.branches || []).forEach(function (r) {
      var k = r.key || r.branchName;
      map[k] = r;
      // also index by name for branches without key collisions handled via key
      if (!map[r.branchName]) map[r.branchName] = r;
    });
    return map;
  }

  function placeBox(b, tw, th, nameH, nameW) {
    var x = 0, y = 0;
    switch (b.place) {
      case 'down':
        x = b.cx - tw / 2;
        y = b.tip + 6 + nameH + 2;
        break;
      case 'up':
        x = b.cx - tw / 2;
        y = b.tip - 8 - nameH - th - 2;
        break;
      case 'upSide':
        x = b.cx + 8;
        y = b.tip - th - 2;
        break;
      case 'hLeft':
        x = b.cx - nameW - tw - 6;
        y = b.tip - th / 2;
        break;
      case 'hRight':
        x = b.cx + nameW + 4;
        y = b.tip - th / 2;
        break;
      case 'hBelow':
        x = b.cx - tw / 2;
        y = b.tip + 14;
        break;
      case 'hAbove':
        x = b.cx - tw / 2;
        y = b.tip - th - 5;
        break;
      default:
        x = b.cx - tw / 2;
        y = b.tip + 10;
    }
    return { x: x, y: y };
  }

  function renderTopoTags() {
    var layer = $('topo-var-layer');
    if (!layer) return;
    var metricMap = branchMetricMap();
    var padX = 5, th = 16, gap = 3;
    var boxes = [];

    BRANCH_LAYOUT.forEach(function (b) {
      var key = b.key || b.name;
      var row = metricMap[key] || metricMap[b.name];
      var demandVal = row && row.demand != null ? Number(row.demand).toFixed(1) : '—';
      var supplyVal = row && row.supply != null ? Number(row.supply).toFixed(1) : '—';
      var unmet = row && row.isSatisfied === false;
      var fs = Math.max(11, (b.fs || 10) + 1);
      var nameH = b.name.length * (fs + 1);
      var nameW = b.name.length * fs;
      var twD = Math.max(30, String(demandVal).length * 7.0 + padX * 2);
      var twS = Math.max(30, String(supplyVal).length * 7.0 + padX * 2);
      var pos = placeBox(b, twD, th, nameH, nameW);

      // 双标签并排：需水(绿) + 配水(蓝/橙)，按 place 调整第二枚偏移避免叠字
      var x1 = pos.x, y1 = pos.y, x2, y2;
      if (b.place === 'hLeft') {
        // 向左排列：配水在更左，需水靠近渠名
        x2 = x1 - twS - gap;
        y2 = y1;
      } else if (b.place === 'up' || b.place === 'hAbove') {
        // 上下叠放：配水在需水上方
        x2 = x1 + (twD - twS) / 2;
        y2 = y1 - th - gap;
      } else if (b.place === 'upSide') {
        x2 = x1 + twD + gap;
        y2 = y1;
      } else {
        // down / hRight / default：配水在需水右侧
        x2 = x1 + twD + gap;
        y2 = y1;
      }

      boxes.push({
        name: b.name, val: demandVal, x: x1, y: y1, w: twD, h: th,
        key: key + ':d', kind: 'demand', title: b.name + ' 需水：' + demandVal + ' 万m³'
      });
      boxes.push({
        name: b.name, val: supplyVal, x: x2, y: y2, w: twS, h: th,
        key: key + ':s', kind: unmet ? 'unmet' : 'supply',
        title: b.name + ' 配水：' + supplyVal + ' 万m³' + (unmet ? '（不满足）' : '')
      });
    });

    // 简单避让
    boxes.sort(function (a, b) { return a.y - b.y || a.x - b.x; });
    for (var i = 0; i < boxes.length; i++) {
      for (var j = 0; j < i; j++) {
        var A = boxes[i], B = boxes[j];
        if (A.x < B.x + B.w + 2 && A.x + A.w + 2 > B.x && A.y < B.y + B.h + 2 && A.y + A.h + 2 > B.y) {
          A.y = B.y + B.h + 3;
        }
      }
    }

    var ns = 'http://www.w3.org/2000/svg';
    layer.innerHTML = '';
    boxes.forEach(function (box) {
      var g = document.createElementNS(ns, 'g');
      g.setAttribute('data-branch', box.key);
      var rect = document.createElementNS(ns, 'rect');
      rect.setAttribute('x', box.x);
      rect.setAttribute('y', box.y);
      rect.setAttribute('width', box.w);
      rect.setAttribute('height', box.h);
      rect.setAttribute('rx', '3');
      rect.setAttribute('ry', '3');
      var cls = 'topo-var-pill';
      if (box.kind === 'supply') cls += ' supply';
      if (box.kind === 'unmet') cls += ' unmet';
      rect.setAttribute('class', cls);
      var title = document.createElementNS(ns, 'title');
      title.textContent = box.title;
      var text = document.createElementNS(ns, 'text');
      text.setAttribute('class', 'topo-var-txt');
      text.setAttribute('x', box.x + box.w / 2);
      text.setAttribute('y', box.y + box.h / 2 + 4);
      text.setAttribute('text-anchor', 'middle');
      text.textContent = box.val;
      g.appendChild(title);
      g.appendChild(rect);
      g.appendChild(text);
      layer.appendChild(g);
    });
  }

  function initTopoPanZoom() {
    var vp = $('topo-viewport');
    var canvas = $('topo-canvas');
    var svg = $('topo-svg');
    if (!vp || !canvas || !svg) return;
    var BASE_W = 1880, BASE_H = 1020;
    svg.setAttribute('viewBox', '0 0 ' + BASE_W + ' ' + BASE_H);
    var x = 0, y = 0, scale = 1;
    var dragging = false, sx = 0, sy = 0, ox = 0, oy = 0;
    function apply() {
      canvas.style.transform = 'translate(' + x + 'px,' + y + 'px) scale(' + scale + ')';
    }
    function fitToScreen() {
      var rect = vp.getBoundingClientRect();
      if (!rect.width || !rect.height) return;
      var pad = 16;
      var next = Math.min((rect.width - pad * 2) / BASE_W, (rect.height - pad * 2) / BASE_H);
      scale = Math.max(0.15, Math.min(2.4, next));
      x = (rect.width - BASE_W * scale) / 2;
      y = (rect.height - BASE_H * scale) / 2;
      apply();
    }
    fitToScreen();
    vp.addEventListener('pointerdown', function (e) {
      if (e.button !== 0) return;
      dragging = true; vp.classList.add('is-dragging');
      sx = e.clientX; sy = e.clientY; ox = x; oy = y;
      vp.setPointerCapture(e.pointerId);
    });
    vp.addEventListener('pointermove', function (e) {
      if (!dragging) return;
      x = ox + (e.clientX - sx);
      y = oy + (e.clientY - sy);
      apply();
    });
    function endDrag(e) {
      dragging = false;
      vp.classList.remove('is-dragging');
      try { vp.releasePointerCapture(e.pointerId); } catch (_) {}
    }
    vp.addEventListener('pointerup', endDrag);
    vp.addEventListener('pointercancel', endDrag);
    vp.addEventListener('wheel', function (e) {
      e.preventDefault();
      var rect = vp.getBoundingClientRect();
      var mx = e.clientX - rect.left;
      var my = e.clientY - rect.top;
      var prev = scale;
      var factor = e.deltaY < 0 ? 1.1 : 0.9;
      scale = Math.max(0.15, Math.min(2.4, scale * factor));
      x = mx - (mx - x) * (scale / prev);
      y = my - (my - y) * (scale / prev);
      apply();
    }, { passive: false });
    initTopoPanZoom.fitToScreen = fitToScreen;
  }

  function selectScheme(id) {
    activeId = String(id || '');
    activeScheme = schemes.find(function (s) { return s.id === activeId; }) || null;
    renderList();
    renderStats(activeScheme);
    if (activeScheme) {
      $('map-start').value = activeScheme.startDate || '2027-05-01';
      $('map-end').value = activeScheme.endDate || '2027-05-10';
    }
    renderTopoTags();
  }

  // 图例补充：需水/配水色块
  (function enrichLegend() {
    var legend = document.querySelector('.topo-legend');
    if (!legend || legend.querySelector('.tag-legend')) return;
    var div = document.createElement('div');
    div.className = 'tag-legend';
    div.innerHTML =
      '<span class="chip"><span class="sw" style="background:#3d9a48"></span>需水</span>' +
      '<span class="chip"><span class="sw" style="background:#1677ff"></span>配水</span>' +
      '<span class="chip"><span class="sw" style="background:#fa8c16"></span>配水(不满足)</span>';
    legend.appendChild(div);
  })();

  $('scheme-list').addEventListener('click', function (e) {
    var item = e.target.closest('.list-item');
    if (!item) return;
    selectScheme(item.dataset.id);
  });
  $('scheme-search').addEventListener('input', renderList);
  $('scheme-collapse').addEventListener('click', function () {
    var list = $('scheme-list');
    list.style.display = list.style.display === 'none' ? '' : 'none';
  });
  $('topo-full-btn').addEventListener('click', function () {
    var wrap = $('topo-wrap');
    if (!wrap) return;
    if (!document.fullscreenElement) {
      (wrap.requestFullscreen || wrap.webkitRequestFullscreen).call(wrap);
    } else {
      (document.exitFullscreen || document.webkitExitFullscreen).call(document);
    }
  });
  document.addEventListener('fullscreenchange', function () {
    setTimeout(function () {
      if (typeof initTopoPanZoom.fitToScreen === 'function') initTopoPanZoom.fitToScreen();
    }, 80);
  });
  $('map-start').addEventListener('change', function () { toast('可切换日期（mock）'); });
  $('map-end').addEventListener('change', function () { toast('可切换日期（mock）'); });

  initTopoPanZoom();
  selectScheme(schemes[0] && schemes[0].id);
  window.addEventListener('resize', function () {
    clearTimeout(window.__topoFit);
    window.__topoFit = setTimeout(function () {
      if (typeof initTopoPanZoom.fitToScreen === 'function') initTopoPanZoom.fitToScreen();
    }, 100);
  });
})();
