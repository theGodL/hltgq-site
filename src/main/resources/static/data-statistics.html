<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>数据统计</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;max-width:100%;overflow:hidden}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:#f0f2f5;color:#333;font-size:14px}
.page-wrap{height:100%;min-height:0;padding:16px;display:flex;flex-direction:column;gap:12px;width:100%;max-width:100%;overflow:hidden}
.breadcrumb{color:#999;font-size:13px;flex-shrink:0}
.breadcrumb .sep{margin:0 6px}
.breadcrumb .cur{color:#333}

.main-scroll{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;display:flex;flex-direction:column;gap:12px;padding-right:2px}
/* 禁止被 flex 压缩，否则表格只剩表头像“折叠” */
.main-scroll > *{flex-shrink:0}
.card{background:#fff;border-radius:8px;box-shadow:0 1px 2px rgba(0,0,0,.03)}

.kpi-row{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;flex-shrink:0}
.kpi-card{display:flex;align-items:center;gap:14px;padding:18px 20px;min-height:88px}
.kpi-icon{width:48px;height:48px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.kpi-icon.blue{background:#e6f4ff;color:#1677ff}
.kpi-icon.green{background:#f6ffed;color:#52c41a}
.kpi-icon.cyan{background:#e6fffb;color:#13c2c2}
.kpi-icon.orange{background:#fff2e8;color:#fa8c16}
.kpi-icon.red{background:#fff1f0;color:#f5222d}
.kpi-meta{min-width:0}
.kpi-value{font-size:28px;font-weight:700;color:#1f1f1f;line-height:1.2}
.kpi-label{margin-top:4px;font-size:13px;color:#8c8c8c;line-height:1.3}

.filter-card{padding:14px 16px;flex-shrink:0}
.filter-bar{display:flex;align-items:center;flex-wrap:wrap;gap:12px}
.filter-item{display:flex;align-items:center;gap:8px}
.filter-item label{color:#666;font-size:14px;white-space:nowrap}
.filter-item input[type=date]{width:160px;height:32px;border:1px solid #d9d9d9;border-radius:6px;padding:0 11px;font-size:13px;outline:none;background:#fff;color:#333}
.filter-item input[type=date]:focus{border-color:#1677ff;box-shadow:0 0 0 2px rgba(22,119,255,.1)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:5px;padding:0 16px;height:32px;border:1px solid transparent;border-radius:6px;cursor:pointer;font-size:14px;white-space:nowrap;transition:all .2s;background:#fff}
.btn-primary{background:#1677ff;color:#fff;border-color:#1677ff}
.btn-primary:hover{background:#4096ff;border-color:#4096ff}
.btn-ghost{height:28px;padding:0 12px;font-size:13px;color:#1677ff;border-color:#91caff;background:#fff;border-radius:4px}
.btn-ghost:hover{color:#4096ff;border-color:#4096ff;background:#f0f5ff}

.section-card{padding:0;overflow:visible}
.section-hd{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 10px}
.section-title{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:600;color:#1f1f1f;line-height:22px}
.section-title::before{content:'';width:3px;height:14px;border-radius:2px;background:#1677ff;flex-shrink:0}
.section-bd{padding:0 16px 12px}

.table-wrap{width:100%;overflow-x:auto}
table.data-table{width:100%;border-collapse:collapse;font-size:13px}
table.data-table thead th{background:#fafafa;color:#595959;font-weight:500;padding:11px 10px;border-bottom:1px solid #f0f0f0;text-align:center;white-space:nowrap}
table.data-table tbody td{padding:12px 10px;border-bottom:1px solid #f0f0f0;text-align:center;color:#333;white-space:nowrap}
table.data-table tbody tr:last-child td{border-bottom:none}
table.data-table tbody tr:hover td{background:#fafafa}
table.data-table td.left,table.data-table th.left{text-align:left}

.rate-cell{display:inline-flex;align-items:center;gap:8px;min-width:120px;justify-content:center}
.rate-bar{width:72px;height:8px;border-radius:4px;background:#f0f0f0;overflow:hidden;flex-shrink:0}
.rate-bar > i{display:block;height:100%;border-radius:4px}
.rate-bar.ok > i{background:#52c41a}
.rate-bar.warn > i{background:#faad14}
.rate-bar.danger > i{background:#f5222d}
.rate-bar.muted > i{background:#bfbfbf}
.rate-txt{min-width:42px;text-align:left;color:#333}

.tag{display:inline-block;padding:1px 8px;border-radius:4px;font-size:12px;line-height:20px;font-weight:500}
.tag-ok{background:#f6ffed;color:#52c41a}
.tag-warn{background:#fff7e6;color:#fa8c16}
.tag-danger{background:#fff1f0;color:#f5222d}
.tag-muted{background:#f5f5f5;color:#8c8c8c}
.tag-missing{background:#fff1f0;color:#f5222d}
.tag-recovered{background:#f6ffed;color:#52c41a}

.status-text.ok{color:#52c41a}
.status-text.warn{color:#fa8c16}
.status-text.danger{color:#f5222d}

.pg-bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0 4px;flex-wrap:wrap}
.pg-info{color:#666;font-size:13px}
.pg-btns{display:flex;align-items:center;gap:4px}
.pg-btn{min-width:28px;height:28px;padding:0 6px;border:1px solid #d9d9d9;background:#fff;border-radius:4px;cursor:pointer;font-size:13px;color:#333;transition:all .2s;display:inline-flex;align-items:center;justify-content:center}
.pg-btn:hover:not([disabled]):not(.active){border-color:#1677ff;color:#1677ff}
.pg-btn.active{background:#1677ff;border-color:#1677ff;color:#fff}
.pg-btn[disabled]{color:#d9d9d9;cursor:not-allowed}
.pg-ellipsis{padding:0 4px;color:#999;font-size:13px}

.bottom-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.bottom-row .section-card{min-width:0}

.toast{position:fixed;left:50%;top:24px;transform:translateX(-50%);background:rgba(0,0,0,.75);color:#fff;padding:8px 16px;border-radius:6px;font-size:13px;z-index:2000;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}

.modal-mask{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:1000;display:none;align-items:center;justify-content:center;padding:24px}
.modal-mask.show{display:flex}
.modal{width:min(480px,100%);background:#fff;border-radius:10px;box-shadow:0 8px 28px rgba(0,0,0,.15);overflow:hidden}
.modal-hd{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid #f0f0f0}
.modal-hd h3{font-size:16px;font-weight:600}
.modal-close{width:28px;height:28px;border:none;background:transparent;border-radius:4px;cursor:pointer;color:#999;font-size:18px;line-height:1}
.modal-close:hover{background:#f5f5f5;color:#333}
.modal-bd{padding:16px 18px 20px}
.detail-grid{display:grid;grid-template-columns:88px 1fr;gap:10px 12px;font-size:13px}
.detail-grid .k{color:#8c8c8c}
.detail-grid .v{color:#333}

@media (max-width:1280px){.kpi-row{grid-template-columns:repeat(3,1fr)}}
@media (max-width:1100px){.bottom-row{grid-template-columns:1fr}}
@media (max-width:900px){.kpi-row{grid-template-columns:repeat(2,1fr)}}
@media (max-width:600px){
  .kpi-row{grid-template-columns:1fr}
  html,body{overflow:auto}
  .page-wrap{height:auto;min-height:100%;overflow:visible}
}
</style>
</head>
<body>
<div class="page-wrap">
  <div class="breadcrumb">
    <span>水利工程安全运行监测</span><span class="sep">/</span>
    <span class="cur">数据统计</span>
  </div>

  <div class="main-scroll">
    <div class="kpi-row" id="kpi-row"></div>

    <div class="card filter-card">
      <div class="filter-bar">
        <div class="filter-item">
          <label>开始日期</label>
          <input type="date" id="start-date">
        </div>
        <div class="filter-item">
          <label>结束日期</label>
          <input type="date" id="end-date">
        </div>
        <button type="button" class="btn btn-primary" id="query-btn">查询</button>
      </div>
    </div>

    <div class="card section-card">
      <div class="section-hd">
        <div class="section-title">站点到报明细</div>
        <button type="button" class="btn btn-primary" id="export-arrival">导出</button>
      </div>
      <div class="section-bd">
        <div class="table-wrap">
          <table class="data-table">
            <thead>
              <tr>
                <th style="width:56px">序号</th>
                <th class="left">站点名称</th>
                <th>编号</th>
                <th>报文类型</th>
                <th>应到次数</th>
                <th>实到次数</th>
                <th>缺报次数</th>
                <th>到报率</th>
                <th>状态</th>
              </tr>
            </thead>
            <tbody id="arrival-tbody"></tbody>
          </table>
        </div>
        <div class="pg-bar">
          <div class="pg-info" id="arrival-pg-info"></div>
          <div class="pg-btns" id="arrival-pg-btns"></div>
        </div>
      </div>
    </div>

    <div class="card section-card">
      <div class="section-hd">
        <div class="section-title">缺测明细</div>
        <button type="button" class="btn btn-primary" id="export-missing">导出</button>
      </div>
      <div class="section-bd">
        <div class="table-wrap">
          <table class="data-table">
            <thead>
              <tr>
                <th style="width:56px">序号</th>
                <th class="left">站点名称</th>
                <th>编号</th>
                <th>缺测时间段</th>
                <th>缺测时长</th>
                <th>数据类型</th>
                <th>当前状态</th>
                <th>操作</th>
              </tr>
            </thead>
            <tbody id="missing-tbody"></tbody>
          </table>
        </div>
        <div class="pg-bar">
          <div class="pg-info" id="missing-pg-info"></div>
          <div class="pg-btns" id="missing-pg-btns"></div>
        </div>
      </div>
    </div>

    <div class="card section-card">
      <div class="section-bd" style="padding-top:8px">
        <div class="table-wrap">
          <table class="data-table">
            <thead>
              <tr>
                <th class="left">服务名称</th>
                <th>运行状态</th>
                <th>启动时间</th>
                <th>运行时长</th>
                <th>CPU</th>
                <th>内存</th>
                <th>今日请求</th>
                <th>成功率</th>
              </tr>
            </thead>
            <tbody id="service-tbody"></tbody>
          </table>
        </div>
      </div>
    </div>

    <div class="bottom-row">
      <div class="card section-card">
        <div class="section-hd">
          <div class="section-title">数据采集状态统计</div>
        </div>
        <div class="section-bd">
          <div class="table-wrap">
            <table class="data-table">
              <thead>
                <tr>
                  <th class="left">数据类型</th>
                  <th>应采</th>
                  <th>实采</th>
                  <th>成功</th>
                  <th>失败</th>
                  <th>成功率</th>
                  <th>失败率</th>
                </tr>
              </thead>
              <tbody id="collect-tbody"></tbody>
            </table>
          </div>
        </div>
      </div>

      <div class="card section-card">
        <div class="section-hd">
          <div class="section-title">信息发布情况</div>
        </div>
        <div class="section-bd">
          <div class="table-wrap">
            <table class="data-table">
              <thead>
                <tr>
                  <th class="left">发布类型</th>
                  <th>次数</th>
                  <th>成功</th>
                  <th>失败</th>
                  <th>成功率</th>
                  <th>最近发布</th>
                  <th>状态</th>
                </tr>
              </thead>
              <tbody id="publish-tbody"></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="modal-mask" id="detail-mask">
  <div class="modal" role="dialog" aria-modal="true">
    <div class="modal-hd">
      <h3>缺测详情</h3>
      <button type="button" class="modal-close" id="detail-close" aria-label="关闭">×</button>
    </div>
    <div class="modal-bd">
      <div class="detail-grid" id="detail-grid"></div>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
(function () {
  var PAGE_SIZE = 20;

  var STATION_SEED = [
    { name: '渠首水位站', code: 'QS-001', type: '分钟报', expected: 1440 },
    { name: '东干渠1#流量站', code: 'DG-001', type: '整点报', expected: 24 },
    { name: '东干渠2#水位站', code: 'DG-002', type: '分钟报', expected: 1440 },
    { name: '西干渠1#水位站', code: 'XG-001', type: '分钟报', expected: 1440 },
    { name: '西干渠2#流量站', code: 'XG-002', type: '整点报', expected: 24 },
    { name: '南支渠1#水位站', code: 'NZ-001', type: '分钟报', expected: 1440 },
    { name: '南支渠2#流量站', code: 'NZ-002', type: '整点报', expected: 24 },
    { name: '南支渠3#水位站', code: 'NZ-003', type: '分钟报', expected: 1440 },
    { name: '北干渠1#流量站', code: 'BG-001', type: '整点报', expected: 24 },
    { name: '北干渠2#水位站', code: 'BG-002', type: '分钟报', expected: 1440 },
    { name: '总干渠1#水位站', code: 'ZG-001', type: '分钟报', expected: 1440 },
    { name: '总干渠2#流量站', code: 'ZG-002', type: '整点报', expected: 24 },
    { name: '太宿干渠1#水位站', code: 'TS-001', type: '分钟报', expected: 1440 },
    { name: '太怀干渠1#流量站', code: 'TH-001', type: '整点报', expected: 24 },
    { name: '花凉亭库区水位站', code: 'HL-001', type: '分钟报', expected: 1440 },
    { name: '进水闸流量站', code: 'JS-001', type: '整点报', expected: 24 },
    { name: '泄洪闸水位站', code: 'XH-001', type: '分钟报', expected: 1440 },
    { name: '分水闸1#流量站', code: 'FS-001', type: '整点报', expected: 24 },
    { name: '节制闸水位站', code: 'JZ-001', type: '分钟报', expected: 1440 },
    { name: '退水闸流量站', code: 'TSG-001', type: '整点报', expected: 24 }
  ];

  var ARRIVAL_FIXED = [
    { name: '渠首水位站', code: 'QS-001', type: '分钟报', expected: 1440, actual: 1440, missing: 0, rate: 100, status: '正常' },
    { name: '东干渠1#流量站', code: 'DG-001', type: '整点报', expected: 24, actual: 24, missing: 0, rate: 100, status: '正常' },
    { name: '西干渠1#水位站', code: 'XG-001', type: '分钟报', expected: 1440, actual: 1398, missing: 42, rate: 97.1, status: '偏低' },
    { name: '南支渠2#流量站', code: 'NZ-002', type: '整点报', expected: 24, actual: 22, missing: 2, rate: 91.7, status: '偏低' },
    { name: '北干渠1#流量站', code: 'BG-001', type: '整点报', expected: 24, actual: 18, missing: 6, rate: 75.0, status: '异常' },
    { name: '南支渠3#水位站', code: 'NZ-003', type: '分钟报', expected: 1440, actual: 0, missing: 1440, rate: 0, status: '未到报' }
  ];

  var MISSING_FIXED = [
    { name: '南支渠3#水位站', code: 'NZ-003', period: '00:00 ~ 09:57', duration: '9小时57分', dataType: '水位', status: '缺测中' },
    { name: '西干渠2#流量站', code: 'XG-002', period: '00:00 ~ 06:00', duration: '6小时', dataType: '流量', status: '缺测中' },
    { name: '东干渠2#水位站', code: 'DG-002', period: '03:15 ~ 03:45', duration: '30分钟', dataType: '水位', status: '已恢复' },
    { name: '渠首水位站', code: 'QS-001', period: '05:20 ~ 05:25', duration: '5分钟', dataType: '水位', status: '已恢复' },
    { name: '北干渠1#流量站', code: 'BG-001', period: '07:00 ~ 07:30', duration: '30分钟', dataType: '流量', status: '已恢复' }
  ];

  var SERVICES = [
    { name: '数据接收服务', status: '运行中', start: '08-15 03:00', uptime: '18天6时', cpu: 23, mem: 45, requests: 128456, success: 99.1 },
    { name: '数据解析服务', status: '运行中', start: '08-15 03:00', uptime: '18天6时', cpu: 31, mem: 52, requests: 126890, success: 98.7 },
    { name: '数据存储服务', status: '运行中', start: '08-20 01:30', uptime: '13天8时', cpu: 28, mem: 61, requests: 125340, success: 99.5 },
    { name: '信息发布服务', status: '运行中', start: '08-15 03:05', uptime: '18天6时', cpu: 12, mem: 34, requests: 8642, success: 99.8 },
    { name: '告警推送服务', status: '重启中', start: '09-02 09:15', uptime: '42分钟', cpu: 8, mem: 22, requests: 156, success: 95.2 }
  ];

  var COLLECT = [
    { type: '水位数据', expect: 4320, actual: 4285, ok: 4270, fail: 15, okRate: 99.7, failRate: 0.3 },
    { type: '流量数据', expect: 2880, actual: 2850, ok: 2835, fail: 15, okRate: 99.5, failRate: 0.5 },
    { type: '雨量数据', expect: 1440, actual: 1440, ok: 1440, fail: 0, okRate: 100, failRate: 0 },
    { type: '闸门开度', expect: 960, actual: 945, ok: 938, fail: 7, okRate: 99.3, failRate: 0.7 },
    { type: '视频数据', expect: 720, actual: 710, ok: 698, fail: 12, okRate: 98.5, failRate: 1.5 }
  ];

  var PUBLISH = [
    { type: '水情通报', count: 12, ok: 12, fail: 0, okRate: 100, latest: '09-02 08:00', status: '正常' },
    { type: '调度指令', count: 8, ok: 8, fail: 0, okRate: 100, latest: '09-02 07:30', status: '正常' },
    { type: '预警信息', count: 2, ok: 1, fail: 1, okRate: 50, latest: '09-01 16:20', status: '异常' },
    { type: '日报/周报', count: 5, ok: 5, fail: 0, okRate: 100, latest: '09-01 18:00', status: '正常' }
  ];

  var KPI = {
    totalStations: 156,
    todayRate: 98.7,
    monthRate: 99.1,
    unreported: 2,
    missingToday: 5
  };

  var state = {
    arrival: { page: 1, list: [] },
    missing: { page: 1, list: [] }
  };

  function pad2(n) { return n < 10 ? '0' + n : '' + n; }
  function todayStr() {
    var d = new Date();
    return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
  }
  function daysAgo(n) {
    var d = new Date();
    d.setDate(d.getDate() - n);
    return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
  }
  function toast(msg) {
    var el = document.getElementById('toast');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(toast._t);
    toast._t = setTimeout(function () { el.classList.remove('show'); }, 1800);
  }
  function fmtInt(n) {
    return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
  }
  function fmtRate(r) {
    return (Number.isInteger(r) ? r : Number(r).toFixed(1)) + '%';
  }

  function buildArrivalMock() {
    var list = ARRIVAL_FIXED.slice();
    var patterns = [
      { rate: 100, status: '正常' },
      { rate: 100, status: '正常' },
      { rate: 97.1, status: '偏低' },
      { rate: 91.7, status: '偏低' },
      { rate: 90.3, status: '偏低' },
      { rate: 75.0, status: '异常' },
      { rate: 0, status: '未到报' }
    ];
    var i = list.length;
    while (list.length < 156) {
      var seed = STATION_SEED[i % STATION_SEED.length];
      var p = patterns[i % patterns.length];
      var expected = seed.expected;
      var actual = Math.round(expected * p.rate / 100);
      list.push({
        name: seed.name,
        code: seed.code.replace(/-(\d+)$/, '-' + pad2((i % 90) + 1)),
        type: seed.type,
        expected: expected,
        actual: actual,
        missing: expected - actual,
        rate: p.rate,
        status: p.status
      });
      i++;
    }
    return list;
  }

  function buildMissingMock() {
    var list = MISSING_FIXED.slice();
    var statuses = ['缺测中', '已恢复', '已恢复', '已恢复'];
    var types = ['水位', '流量'];
    var periods = [
      ['00:00 ~ 09:57', '9小时57分'],
      ['00:00 ~ 06:00', '6小时'],
      ['03:15 ~ 03:45', '30分钟'],
      ['05:20 ~ 05:25', '5分钟'],
      ['07:00 ~ 07:30', '30分钟'],
      ['10:00 ~ 11:20', '1小时20分'],
      ['14:00 ~ 14:15', '15分钟']
    ];
    var i = list.length;
    while (list.length < 156) {
      var seed = STATION_SEED[i % STATION_SEED.length];
      var pe = periods[i % periods.length];
      list.push({
        name: seed.name,
        code: seed.code.replace(/-(\d+)$/, '-' + pad2((i % 90) + 1)),
        period: pe[0],
        duration: pe[1],
        dataType: types[i % 2],
        status: statuses[i % statuses.length]
      });
      i++;
    }
    return list;
  }

  function rateClass(rate) {
    if (rate >= 100) return 'ok';
    if (rate >= 90) return 'warn';
    if (rate > 0) return 'danger';
    return 'muted';
  }
  function arrivalTagClass(status) {
    if (status === '正常') return 'tag-ok';
    if (status === '偏低') return 'tag-warn';
    if (status === '异常') return 'tag-danger';
    return 'tag-muted';
  }
  function okRateTagClass(rate) {
    return rate >= 99 ? 'tag-ok' : 'tag-warn';
  }

  function renderKpi() {
    var icons = {
      blue: '<svg width="24" height="24" viewBox="0 0 24 24" fill="none"><path d="M4.5 17.5h15M6 17.5V9.5M10 17.5V7M14 17.5v-5M18 17.5V11" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/><circle cx="18.5" cy="6.5" r="2.2" stroke="currentColor" stroke-width="1.5"/><path d="M12 4.5c-1.8 2.2-3 4-3 5.8a3 3 0 0 0 6 0c0-1.8-1.2-3.6-3-5.8z" stroke="currentColor" stroke-width="1.4"/></svg>',
      green: '<svg width="24" height="24" viewBox="0 0 24 24" fill="none"><rect x="4" y="4" width="16" height="16" rx="3" stroke="currentColor" stroke-width="1.7"/><path d="M8 12.2l2.6 2.6L16.2 9" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>',
      cyan: '<svg width="24" height="24" viewBox="0 0 24 24" fill="none"><path d="M4 16l4-5 3.5 3.5L16 8l4 5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/><path d="M4 19h16" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>',
      orange: '<svg width="24" height="24" viewBox="0 0 24 24" fill="none"><rect x="4" y="4" width="16" height="16" rx="3" stroke="currentColor" stroke-width="1.7"/><path d="M8.5 8.5l7 7M15.5 8.5l-7 7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>',
      red: '<svg width="24" height="24" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="8" fill="currentColor"/></svg>'
    };
    var items = [
      { icon: 'blue', value: KPI.totalStations, label: '监测站点总数' },
      { icon: 'green', value: KPI.todayRate + '%', label: '今日数据到报率' },
      { icon: 'cyan', value: KPI.monthRate + '%', label: '本月平均到报率' },
      { icon: 'orange', value: KPI.unreported, label: '未到报站点' },
      { icon: 'red', value: KPI.missingToday, label: '今日缺测站点' }
    ];
    document.getElementById('kpi-row').innerHTML = items.map(function (it) {
      return '<div class="card kpi-card"><div class="kpi-icon ' + it.icon + '">' + icons[it.icon] +
        '</div><div class="kpi-meta"><div class="kpi-value">' + it.value +
        '</div><div class="kpi-label">' + it.label + '</div></div></div>';
    }).join('');
  }

  function pageSlice(list, page) {
    var start = (page - 1) * PAGE_SIZE;
    return list.slice(start, start + PAGE_SIZE);
  }
  function totalPages(list) {
    return Math.max(1, Math.ceil(list.length / PAGE_SIZE));
  }

  function renderPager(infoId, btnsId, list, page, onChange) {
    var total = list.length;
    var pages = totalPages(list);
    document.getElementById(infoId).textContent =
      '共 ' + total + ' 条记录，每页 ' + PAGE_SIZE + ' 条，当前第 ' + page + '/' + pages + ' 页';

    var windowPages = pages <= 5 ? [] : [1, 2, 3, '…', pages];
    if (pages <= 5) {
      for (var i = 1; i <= pages; i++) windowPages.push(i);
    }

    var html = '<button type="button" class="pg-btn" data-page="' + (page - 1) + '"' + (page <= 1 ? ' disabled' : '') + '>‹</button>';
    windowPages.forEach(function (p) {
      if (p === '…') html += '<span class="pg-ellipsis">…</span>';
      else {
        html += '<button type="button" class="pg-btn' + (p === page ? ' active' : '') +
          '" data-page="' + p + '">' + p + '</button>';
      }
    });
    html += '<button type="button" class="pg-btn" data-page="' + (page + 1) + '"' + (page >= pages ? ' disabled' : '') + '>›</button>';

    var box = document.getElementById(btnsId);
    box.innerHTML = html;
    box.querySelectorAll('.pg-btn').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var p = Number(btn.getAttribute('data-page'));
        if (!p || p < 1 || p > pages || p === page) return;
        onChange(p);
      });
    });
  }

  function renderArrival() {
    var list = state.arrival.list;
    var page = state.arrival.page;
    var rows = pageSlice(list, page);
    var start = (page - 1) * PAGE_SIZE;
    document.getElementById('arrival-tbody').innerHTML = rows.map(function (r, idx) {
      var cls = rateClass(r.rate);
      return '<tr>' +
        '<td>' + (start + idx + 1) + '</td>' +
        '<td class="left">' + r.name + '</td>' +
        '<td>' + r.code + '</td>' +
        '<td>' + r.type + '</td>' +
        '<td>' + r.expected + '</td>' +
        '<td>' + r.actual + '</td>' +
        '<td>' + r.missing + '</td>' +
        '<td><div class="rate-cell"><span class="rate-bar ' + cls + '"><i style="width:' + r.rate + '%"></i></span>' +
        '<span class="rate-txt">' + fmtRate(r.rate) + '</span></div></td>' +
        '<td><span class="tag ' + arrivalTagClass(r.status) + '">' + r.status + '</span></td>' +
        '</tr>';
    }).join('');
    renderPager('arrival-pg-info', 'arrival-pg-btns', list, page, function (p) {
      state.arrival.page = p;
      renderArrival();
    });
  }

  function renderMissing() {
    var list = state.missing.list;
    var page = state.missing.page;
    var rows = pageSlice(list, page);
    var start = (page - 1) * PAGE_SIZE;
    document.getElementById('missing-tbody').innerHTML = rows.map(function (r, idx) {
      var tagCls = r.status === '缺测中' ? 'tag-missing' : 'tag-recovered';
      return '<tr>' +
        '<td>' + (start + idx + 1) + '</td>' +
        '<td class="left">' + r.name + '</td>' +
        '<td>' + r.code + '</td>' +
        '<td>' + r.period + '</td>' +
        '<td>' + r.duration + '</td>' +
        '<td>' + r.dataType + '</td>' +
        '<td><span class="tag ' + tagCls + '">' + r.status + '</span></td>' +
        '<td><button type="button" class="btn btn-ghost detail-btn" data-idx="' + (start + idx) + '">详情</button></td>' +
        '</tr>';
    }).join('');
    document.querySelectorAll('.detail-btn').forEach(function (btn) {
      btn.addEventListener('click', function () {
        openDetail(list[Number(btn.getAttribute('data-idx'))]);
      });
    });
    renderPager('missing-pg-info', 'missing-pg-btns', list, page, function (p) {
      state.missing.page = p;
      renderMissing();
    });
  }

  function renderServices() {
    document.getElementById('service-tbody').innerHTML = SERVICES.map(function (s) {
      var cls = s.status === '运行中' ? 'ok' : 'warn';
      return '<tr>' +
        '<td class="left">' + s.name + '</td>' +
        '<td><span class="status-text ' + cls + '">' + s.status + '</span></td>' +
        '<td>' + s.start + '</td>' +
        '<td>' + s.uptime + '</td>' +
        '<td>' + s.cpu + '%</td>' +
        '<td>' + s.mem + '%</td>' +
        '<td>' + fmtInt(s.requests) + '</td>' +
        '<td>' + s.success.toFixed(1) + '%</td>' +
        '</tr>';
    }).join('');
  }

  function renderCollect() {
    document.getElementById('collect-tbody').innerHTML = COLLECT.map(function (r) {
      return '<tr>' +
        '<td class="left">' + r.type + '</td>' +
        '<td>' + fmtInt(r.expect) + '</td>' +
        '<td>' + fmtInt(r.actual) + '</td>' +
        '<td>' + fmtInt(r.ok) + '</td>' +
        '<td>' + fmtInt(r.fail) + '</td>' +
        '<td><span class="tag ' + okRateTagClass(r.okRate) + '">' + fmtRate(r.okRate) + '</span></td>' +
        '<td>' + fmtRate(r.failRate) + '</td>' +
        '</tr>';
    }).join('');
  }

  function renderPublish() {
    document.getElementById('publish-tbody').innerHTML = PUBLISH.map(function (r) {
      var cls = r.status === '正常' ? 'ok' : 'warn';
      return '<tr>' +
        '<td class="left">' + r.type + '</td>' +
        '<td>' + r.count + '</td>' +
        '<td>' + r.ok + '</td>' +
        '<td>' + r.fail + '</td>' +
        '<td>' + fmtRate(r.okRate) + '</td>' +
        '<td>' + r.latest + '</td>' +
        '<td><span class="status-text ' + cls + '">' + r.status + '</span></td>' +
        '</tr>';
    }).join('');
  }

  function openDetail(row) {
    if (!row) return;
    var fields = [
      ['站点名称', row.name],
      ['编号', row.code],
      ['缺测时间段', row.period],
      ['缺测时长', row.duration],
      ['数据类型', row.dataType],
      ['当前状态', row.status]
    ];
    document.getElementById('detail-grid').innerHTML = fields.map(function (f) {
      return '<div class="k">' + f[0] + '</div><div class="v">' + f[1] + '</div>';
    }).join('');
    document.getElementById('detail-mask').classList.add('show');
  }

  function query() {
    var start = document.getElementById('start-date').value;
    var end = document.getElementById('end-date').value;
    if (start && end && start > end) {
      toast('结束日期不能早于开始日期');
      return;
    }
    state.arrival.page = 1;
    state.missing.page = 1;
    state.arrival.list = buildArrivalMock();
    state.missing.list = buildMissingMock();
    renderAll();
    toast('已按日期刷新（Mock）');
  }

  function renderAll() {
    renderKpi();
    renderArrival();
    renderMissing();
    renderServices();
    renderCollect();
    renderPublish();
  }

  function exportCsv(filename, headers, rows) {
    var lines = [headers.join(',')].concat(rows.map(function (r) {
      return r.map(function (c) {
        var s = String(c == null ? '' : c);
        return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
      }).join(',');
    }));
    var blob = new Blob(['\ufeff' + lines.join('\n')], { type: 'text/csv;charset=utf-8;' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = filename;
    a.click();
    URL.revokeObjectURL(a.href);
  }

  document.getElementById('start-date').value = daysAgo(6);
  document.getElementById('end-date').value = todayStr();
  document.getElementById('query-btn').addEventListener('click', query);
  document.getElementById('export-arrival').addEventListener('click', function () {
    exportCsv('站点到报明细.csv',
      ['序号', '站点名称', '编号', '报文类型', '应到次数', '实到次数', '缺报次数', '到报率', '状态'],
      state.arrival.list.map(function (r, i) {
        return [i + 1, r.name, r.code, r.type, r.expected, r.actual, r.missing, fmtRate(r.rate), r.status];
      })
    );
    toast('已导出到报明细');
  });
  document.getElementById('export-missing').addEventListener('click', function () {
    exportCsv('缺测明细.csv',
      ['序号', '站点名称', '编号', '缺测时间段', '缺测时长', '数据类型', '当前状态'],
      state.missing.list.map(function (r, i) {
        return [i + 1, r.name, r.code, r.period, r.duration, r.dataType, r.status];
      })
    );
    toast('已导出缺测明细');
  });
  document.getElementById('detail-close').addEventListener('click', function () {
    document.getElementById('detail-mask').classList.remove('show');
  });
  document.getElementById('detail-mask').addEventListener('click', function (e) {
    if (e.target === this) this.classList.remove('show');
  });

  state.arrival.list = buildArrivalMock();
  state.missing.list = buildMissingMock();
  renderAll();
})();
</script>
</body>
</html>
