<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>数据统计</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;max-width:100%;overflow:hidden}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:#f0f2f5;color:#333;font-size:14px}
.page-wrap{height:100%;min-height:0;padding:16px;display:flex;flex-direction:column;gap:12px;width:100%;max-width:100%;overflow:hidden}
.breadcrumb{color:#999;font-size:13px;flex-shrink:0}
.breadcrumb .sep{margin:0 6px}
.breadcrumb .cur{color:#333}

.main-scroll{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;display:flex;flex-direction:column;gap:12px;padding-right:2px}
.main-scroll > *{flex-shrink:0}
.card{background:#fff;border-radius:8px;box-shadow:0 1px 2px rgba(0,0,0,.03)}

.kpi-row{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;flex-shrink:0}
.kpi-card{display:flex;align-items:center;gap:14px;padding:18px 20px;min-height:88px}
.kpi-icon{width:48px;height:48px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.kpi-icon.blue{background:#e6f4ff;color:#1677ff}
.kpi-icon.green{background:#f6ffed;color:#52c41a}
.kpi-icon.cyan{background:#e6fffb;color:#13c2c2}
.kpi-icon.orange{background:#fff2e8;color:#fa8c16}
.kpi-icon.red{background:#fff1f0;color:#f5222d}
.kpi-meta{min-width:0}
.kpi-value{font-size:28px;font-weight:700;color:#1f1f1f;line-height:1.2}
.kpi-label{margin-top:4px;font-size:13px;color:#8c8c8c;line-height:1.3}

.filter-card{padding:14px 16px;flex-shrink:0}
.filter-bar{display:flex;align-items:center;flex-wrap:wrap;gap:12px}
.filter-item{display:flex;align-items:center;gap:8px}
.filter-item label{color:#666;font-size:14px;white-space:nowrap}
.filter-item input[type=date]{width:160px;height:32px;border:1px solid #d9d9d9;border-radius:6px;padding:0 11px;font-size:13px;outline:none;background:#fff;color:#333}
.filter-item input[type=date]:focus{border-color:#1677ff;box-shadow:0 0 0 2px rgba(22,119,255,.1)}
.filter-hint{color:#8c8c8c;font-size:12px;margin-left:4px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:5px;padding:0 16px;height:32px;border:1px solid transparent;border-radius:6px;cursor:pointer;font-size:14px;white-space:nowrap;transition:all .2s;background:#fff}
.btn-primary{background:#1677ff;color:#fff;border-color:#1677ff}
.btn-primary:hover{background:#4096ff;border-color:#4096ff}
.btn-primary:disabled{opacity:.65;cursor:not-allowed}
.section-card{padding:0;overflow:visible}
.section-hd{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 10px}
.section-title{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:600;color:#1f1f1f;line-height:22px}
.section-title::before{content:'';width:3px;height:14px;border-radius:2px;background:#1677ff;flex-shrink:0}
.section-bd{padding:0 16px 12px}

.table-wrap{width:100%;overflow-x:auto}
table.data-table{width:100%;border-collapse:collapse;font-size:13px}
table.data-table thead th{background:#F7FAFD;color:#595959;font-weight:500;padding:11px 10px;border-bottom:1px solid #f0f0f0;text-align:center;white-space:nowrap}
table.data-table tbody td{padding:12px 10px;border-bottom:1px solid #f0f0f0;text-align:center;color:#333;white-space:nowrap}
table.data-table tbody tr:last-child td{border-bottom:none}
table.data-table tbody tr:hover td{background:#fafafa}
table.data-table td.left,table.data-table th.left{text-align:left}
table.data-table td.empty{color:#bbb;padding:36px 10px}

.rate-cell{display:inline-flex;align-items:center;gap:8px;min-width:120px;justify-content:center}
.rate-bar{width:72px;height:8px;border-radius:4px;background:#f0f0f0;overflow:hidden;flex-shrink:0}
.rate-bar > i{display:block;height:100%;border-radius:4px}
.rate-bar.ok > i{background:#52c41a}
.rate-bar.warn > i{background:#faad14}
.rate-bar.danger > i{background:#f5222d}
.rate-bar.muted > i{background:#bfbfbf}
.rate-txt{min-width:42px;text-align:left;color:#333}

.tag{display:inline-block;padding:1px 8px;border-radius:4px;font-size:12px;line-height:20px;font-weight:500}
.tag-ok{background:#f6ffed;color:#52c41a}
.tag-warn{background:#fff7e6;color:#fa8c16}
.tag-danger{background:#fff1f0;color:#f5222d}
.tag-muted{background:#f5f5f5;color:#8c8c8c}
.tag-missing{background:#fff1f0;color:#f5222d}
.tag-recovered{background:#f6ffed;color:#52c41a}

.status-text.ok{color:#52c41a}
.status-text.warn{color:#fa8c16}
.status-text.danger{color:#f5222d}

.pg-bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0 4px;flex-wrap:wrap}
.pg-info{color:#666;font-size:13px}
.pg-btns{display:flex;align-items:center;gap:4px}
.pg-btn{min-width:28px;height:28px;padding:0 6px;border:1px solid #d9d9d9;background:#fff;border-radius:4px;cursor:pointer;font-size:13px;color:#333;transition:all .2s;display:inline-flex;align-items:center;justify-content:center}
.pg-btn:hover:not([disabled]):not(.active){border-color:#1677ff;color:#1677ff}
.pg-btn.active{background:#1677ff;border-color:#1677ff;color:#fff}
.pg-btn[disabled]{color:#d9d9d9;cursor:not-allowed}
.pg-ellipsis{padding:0 4px;color:#999;font-size:13px}

.bottom-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.bottom-row .section-card{min-width:0}

.toast{position:fixed;left:50%;top:24px;transform:translateX(-50%);background:rgba(0,0,0,.75);color:#fff;padding:8px 16px;border-radius:6px;font-size:13px;z-index:2000;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}

@media (max-width:1280px){.kpi-row{grid-template-columns:repeat(3,1fr)}}
@media (max-width:1100px){.bottom-row{grid-template-columns:1fr}}
@media (max-width:900px){.kpi-row{grid-template-columns:repeat(2,1fr)}}
@media (max-width:600px){
  .kpi-row{grid-template-columns:1fr}
  html,body{overflow:auto}
  .page-wrap{height:auto;min-height:100%;overflow:visible}
}
</style>
</head>
<body>
<div class="page-wrap">
  <div class="breadcrumb">
    <span>业务中心</span><span class="sep">/</span>
    <span class="cur">数据统计</span>
  </div>

  <div class="main-scroll">
    <div class="kpi-row" id="kpi-row"></div>

    <div class="card filter-card">
      <div class="filter-bar">
        <div class="filter-item">
          <label>开始日期</label>
          <input type="date" id="start-date">
        </div>
        <div class="filter-item">
          <label>结束日期</label>
          <input type="date" id="end-date">
        </div>
        <button type="button" class="btn btn-primary" id="query-btn">查询</button>
        <span class="filter-hint" id="stat-hint">统计口径：今日 / 本月（已结束完整窗）；信息发布为今日</span>
      </div>
    </div>

    <div class="card section-card">
      <div class="section-hd">
        <div class="section-title">站点到报明细</div>
        <button type="button" class="btn btn-primary" id="export-arrival">导出</button>
      </div>
      <div class="section-bd">
        <div class="table-wrap">
          <table class="data-table">
            <thead>
              <tr>
                <th style="width:56px">序号</th>
                <th class="left">站点名称</th>
                <th>编号</th>
                <th>报文类型</th>
                <th>应到次数</th>
                <th>实到次数</th>
                <th>缺报次数</th>
                <th>到报率</th>
                <th>状态</th>
              </tr>
            </thead>
            <tbody id="arrival-tbody"></tbody>
          </table>
        </div>
        <div class="pg-bar">
          <div class="pg-info" id="arrival-pg-info"></div>
          <div class="pg-btns" id="arrival-pg-btns"></div>
        </div>
      </div>
    </div>

    <div class="card section-card">
      <div class="section-hd">
        <div class="section-title">缺测明细</div>
        <button type="button" class="btn btn-primary" id="export-missing">导出</button>
      </div>
      <div class="section-bd">
        <div class="table-wrap">
          <table class="data-table">
            <thead>
              <tr>
                <th style="width:56px">序号</th>
                <th class="left">站点名称</th>
                <th>编号</th>
                <th>缺测时间段</th>
                <th>缺测时长</th>
                <th>数据类型</th>
                <th>当前状态</th>
              </tr>
            </thead>
            <tbody id="missing-tbody"></tbody>
          </table>
        </div>
        <div class="pg-bar">
          <div class="pg-info" id="missing-pg-info"></div>
          <div class="pg-btns" id="missing-pg-btns"></div>
        </div>
      </div>
    </div>

    <div class="card section-card">
      <div class="section-bd" style="padding-top:8px">
        <div class="table-wrap">
          <table class="data-table">
            <thead>
              <tr>
                <th class="left">服务名称</th>
                <th>运行状态</th>
                <th>启动时间</th>
                <th>运行时长</th>
                <th>CPU</th>
                <th>内存</th>
                <th>今日请求</th>
                <th>成功率</th>
              </tr>
            </thead>
            <tbody id="service-tbody"></tbody>
          </table>
        </div>
      </div>
    </div>

    <div class="bottom-row">
      <div class="card section-card">
        <div class="section-hd">
          <div class="section-title">数据采集状态统计</div>
        </div>
        <div class="section-bd">
          <div class="table-wrap">
            <table class="data-table">
              <thead>
                <tr>
                  <th class="left">数据类型</th>
                  <th>应采</th>
                  <th>实采</th>
                  <th>成功</th>
                  <th>失败</th>
                  <th>成功率</th>
                  <th>失败率</th>
                </tr>
              </thead>
              <tbody id="collect-tbody"></tbody>
            </table>
          </div>
        </div>
      </div>

      <div class="card section-card">
        <div class="section-hd">
          <div class="section-title">信息发布情况</div>
        </div>
        <div class="section-bd">
          <div class="table-wrap">
            <table class="data-table">
              <thead>
                <tr>
                  <th class="left">发布类型</th>
                  <th>次数</th>
                  <th>成功</th>
                  <th>失败</th>
                  <th>成功率</th>
                  <th>最近发布</th>
                  <th>状态</th>
                </tr>
              </thead>
              <tbody id="publish-tbody"></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function () {
  var API = '/hltgq-site';
  var PAGE_SIZE = 10;

  var MAX_RANGE_DAYS = 730;
  var MAX_MISS_DAYS = 31;

  var state = {
    kpi: null,
    arrival: { page: 1, list: [] },
    missing: { page: 1, list: [] },
    services: [],
    process: null,
    collect: [],
    publish: [],
    range: { mode: 'today', start: null, end: null, missClamped: false }
  };

  function pad2(n) { return n < 10 ? '0' + n : '' + n; }
  function todayStr() {
    var d = new Date();
    return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
  }
  function parseYmd(s) {
    if (!s || !/^\d{4}-\d{2}-\d{2}$/.test(s)) return null;
    var p = s.split('-').map(Number);
    var d = new Date(p[0], p[1] - 1, p[2]);
    if (d.getFullYear() !== p[0] || d.getMonth() !== p[1] - 1 || d.getDate() !== p[2]) return null;
    return d;
  }
  function ymdFromDate(d) {
    return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
  }
  function daySpan(start, end) {
    var a = parseYmd(start);
    var b = parseYmd(end);
    if (!a || !b) return null;
    return Math.round((b - a) / 86400000) + 1;
  }
  function addDaysYmd(ymd, delta) {
    var d = parseYmd(ymd);
    if (!d) return ymd;
    d.setDate(d.getDate() + delta);
    return ymdFromDate(d);
  }
  function qs(params) {
    var p = new URLSearchParams();
    Object.keys(params).forEach(function (k) {
      var v = params[k];
      if (v == null || v === '') return;
      p.set(k, String(v));
    });
    var s = p.toString();
    return s ? ('?' + s) : '';
  }

  /** 解析日期控件 → startDate/endDate；无参=今日口径 */
  function resolveRange() {
    var start = document.getElementById('start-date').value.trim();
    var end = document.getElementById('end-date').value.trim();
    var today = todayStr();

    if (!start && !end) {
      return { ok: true, mode: 'today', start: null, end: null, qs: '', missQs: '', missClamped: false };
    }
    if (start && !parseYmd(start)) return { ok: false, msg: '开始日期格式无效' };
    if (end && !parseYmd(end)) return { ok: false, msg: '结束日期格式无效' };

    // 与 mq 约定：只传 start=该日至今日；只传 end=该单日；都传=闭区间
    var effStart = start || end;
    var effEnd = end || (start ? today : end);
    if (start && end && start > end) {
      return { ok: false, msg: '开始日期不能晚于结束日期' };
    }
    var span = daySpan(effStart, effEnd);
    if (span == null) return { ok: false, msg: '日期无效' };
    if (span > MAX_RANGE_DAYS) {
      return { ok: false, msg: '查询区间不能超过 ' + MAX_RANGE_DAYS + ' 天' };
    }

    var mode = (effStart === today && effEnd === today) ? 'today' : 'range';
    var q;
    if (start && end) q = qs({ startDate: start, endDate: end });
    else if (start && !end) q = qs({ startDate: start });
    else q = qs({ endDate: end });

    var missStart = effStart;
    var missEnd = effEnd;
    var missClamped = false;
    if (span > MAX_MISS_DAYS) {
      missStart = addDaysYmd(effEnd, -(MAX_MISS_DAYS - 1));
      missClamped = true;
    }
    var missQ = qs({ startDate: missStart, endDate: missEnd });

    return {
      ok: true,
      mode: mode,
      start: effStart,
      end: effEnd,
      qs: q,
      missQs: missQ,
      missClamped: missClamped
    };
  }
  function toast(msg) {
    var el = document.getElementById('toast');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(toast._t);
    toast._t = setTimeout(function () { el.classList.remove('show'); }, 2200);
  }
  function fmtInt(n) {
    var v = Number(n);
    if (!Number.isFinite(v)) return '-';
    return String(Math.round(v)).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
  }
  function fmtRate(r) {
    var v = Number(r);
    if (!Number.isFinite(v)) return '-';
    return (Number.isInteger(v) ? v : v.toFixed(1)) + '%';
  }
  function fmtNum(r, digits) {
    var v = Number(r);
    if (!Number.isFinite(v)) return '-';
    return Number.isInteger(v) ? String(v) : v.toFixed(digits == null ? 1 : digits);
  }
  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  /** 到报状态：100 正常 / ≥80 偏低 / >0 异常 / 0 未到报 */
  function arrivalStatus(rate) {
    var r = Number(rate);
    if (!Number.isFinite(r) || r <= 0) return '未到报';
    if (r >= 100) return '正常';
    if (r >= 80) return '偏低';
    return '异常';
  }
  function rateClass(rate) {
    var r = Number(rate);
    if (r >= 100) return 'ok';
    if (r >= 80) return 'warn';
    if (r > 0) return 'danger';
    return 'muted';
  }
  function arrivalTagClass(status) {
    if (status === '正常') return 'tag-ok';
    if (status === '偏低') return 'tag-warn';
    if (status === '异常') return 'tag-danger';
    return 'tag-muted';
  }
  function okRateTagClass(rate) {
    return Number(rate) >= 99 ? 'tag-ok' : 'tag-warn';
  }

  function fmtPeriod(startTm, endTm) {
    var a = String(startTm || '').replace('T', ' ').slice(0, 19);
    var b = String(endTm || '').replace('T', ' ').slice(0, 19);
    if (!a && !b) return '-';
    if (a && b && a.slice(0, 10) === b.slice(0, 10) && a.length >= 16 && b.length >= 16) {
      return a.slice(11, 16) + ' ~ ' + b.slice(11, 16);
    }
    return (a || '-') + ' ~ ' + (b || '-');
  }
  function fmtDuration(mins) {
    var m = Math.max(0, Math.round(Number(mins) || 0));
    var h = Math.floor(m / 60);
    var r = m % 60;
    if (h <= 0) return r + '分钟';
    if (r === 0) return h + '小时';
    return h + '小时' + r + '分';
  }
  function fmtUptime(mins) {
    var m = Math.max(0, Math.round(Number(mins) || 0));
    var d = Math.floor(m / (60 * 24));
    var h = Math.floor((m % (60 * 24)) / 60);
    var r = m % 60;
    if (d > 0) return d + '天' + h + '时';
    if (h > 0) return h + '时' + (r ? r + '分' : '');
    return r + '分钟';
  }
  function fmtStart(tm) {
    var s = String(tm || '').replace('T', ' ').slice(0, 16);
    if (!s) return '-';
    // MM-DD HH:mm
    if (s.length >= 16) return s.slice(5, 16);
    return s;
  }
  function fmtMem(process) {
    if (!process) return '-';
    var used = Number(process.memoryUsedMB);
    var max = Number(process.memoryMaxMB);
    if (Number.isFinite(used) && Number.isFinite(max) && max > 0) {
      return Math.round(used / max * 100) + '%';
    }
    if (Number.isFinite(used)) return used + 'MB';
    return '-';
  }

  async function fetchApi(path) {
    var res = await fetch(API + path, { credentials: 'include' });
    var body = null;
    try { body = await res.json(); } catch (e) { body = null; }
    if (!res.ok) {
      var msg = (body && (body.message || body.msg)) || ('HTTP ' + res.status);
      throw new Error(msg);
    }
    if (body && typeof body === 'object' && !Array.isArray(body) && ('data' in body) && ('code' in body || 'msg' in body || 'message' in body)) {
      if (body.code != null && Number(body.code) !== 0) {
        throw new Error(body.msg || body.message || '请求失败');
      }
      return body.data;
    }
    return body;
  }

  function mapArrival(list) {
    return (Array.isArray(list) ? list : []).map(function (r) {
      var rate = Number(r.arrivalRate);
      return {
        name: r.siteName || '-',
        code: r.stcd || '-',
        type: r.msgType || '-',
        expected: r.expected,
        actual: r.arrived,
        missing: r.missed,
        rate: rate,
        status: arrivalStatus(rate)
      };
    });
  }

  function mapMissing(list) {
    return (Array.isArray(list) ? list : []).map(function (r) {
      var types = Array.isArray(r.dataTypes) ? r.dataTypes.join('、') : (r.dataType || '-');
      return {
        name: r.siteName || '-',
        code: r.stcd || '-',
        period: fmtPeriod(r.startTm, r.endTm),
        duration: fmtDuration(r.missMinutes),
        dataType: types || '-',
        status: r.status || '-'
      };
    });
  }

  function mapServices(data) {
    var process = (data && data.process) || null;
    var services = (data && Array.isArray(data.services)) ? data.services : [];
    return {
      process: process,
      services: services.map(function (s) {
        return {
          name: s.name || '-',
          status: s.status || '-',
          start: fmtStart(process && process.startTime),
          uptime: fmtUptime(process && process.uptimeMinutes),
          cpu: process && process.cpu != null ? Number(process.cpu) : null,
          memText: fmtMem(process),
          requests: s.todayRequests,
          success: s.successRate
        };
      })
    };
  }

  function mapCollect(list) {
    return (Array.isArray(list) ? list : []).map(function (r) {
      return {
        type: r.dataType || '-',
        expect: r.expected,
        actual: r.collected,
        ok: r.success,
        fail: r.failed,
        okRate: r.successRate,
        failRate: r.failRate
      };
    });
  }

  /** 视频行：仅接口失败/缺失时省略；collected=0 照常显示（区间历史口径） */
  function mapVideoCollect(data) {
    if (!data || typeof data !== 'object') return null;
    var row = Array.isArray(data) ? data[0] : data;
    if (!row) return null;
    return {
      type: row.dataType || '视频数据',
      expect: row.expected,
      actual: row.collected,
      ok: row.success,
      fail: row.failed,
      okRate: row.successRate,
      failRate: row.failRate
    };
  }

  function mergeCollect(mqList, videoRow) {
    var rows = mapCollect(mqList);
    if (videoRow) rows.push(videoRow);
    return rows;
  }

  function mapPublish(data) {
    var rows = Array.isArray(data) ? data : (data ? [data] : []);
    return rows.map(function (r) {
      return {
        type: r.type || '预警信息',
        count: r.count,
        ok: r.ok,
        fail: r.fail,
        okRate: r.okRate,
        latest: r.latest == null || r.latest === '' ? '--' : String(r.latest).replace('T', ' ').slice(0, 19),
        status: r.status || '正常'
      };
    });
  }

  function renderKpi() {
    var k = state.kpi || {};
    var icons = {
      blue: '<svg width="24" height="24" viewBox="0 0 24 24" fill="none"><path d="M4.5 17.5h15M6 17.5V9.5M10 17.5V7M14 17.5v-5M18 17.5V11" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/><circle cx="18.5" cy="6.5" r="2.2" stroke="currentColor" stroke-width="1.5"/><path d="M12 4.5c-1.8 2.2-3 4-3 5.8a3 3 0 0 0 6 0c0-1.8-1.2-3.6-3-5.8z" stroke="currentColor" stroke-width="1.4"/></svg>',
      green: '<svg width="24" height="24" viewBox="0 0 24 24" fill="none"><rect x="4" y="4" width="16" height="16" rx="3" stroke="currentColor" stroke-width="1.7"/><path d="M8 12.2l2.6 2.6L16.2 9" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>',
      cyan: '<svg width="24" height="24" viewBox="0 0 24 24" fill="none"><path d="M4 16l4-5 3.5 3.5L16 8l4 5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/><path d="M4 19h16" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>',
      orange: '<svg width="24" height="24" viewBox="0 0 24 24" fill="none"><rect x="4" y="4" width="16" height="16" rx="3" stroke="currentColor" stroke-width="1.7"/><path d="M8.5 8.5l7 7M15.5 8.5l-7 7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>',
      red: '<svg width="24" height="24" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="8" fill="currentColor"/></svg>'
    };
    var noReport = Array.isArray(k.noReportSites) ? k.noReportSites.length : 0;
    var missed = Array.isArray(k.missedSites) ? k.missedSites.length : 0;
    var isRange = state.range && state.range.mode === 'range';
    var items = [
      { icon: 'blue', value: k.stationTotal != null ? k.stationTotal : '-', label: '监测站点总数' },
      { icon: 'green', value: k.todayArrivalRate != null ? fmtNum(k.todayArrivalRate) + '%' : '-', label: isRange ? '区间到报率' : '今日数据到报率' },
      { icon: 'cyan', value: k.monthAvgArrivalRate != null ? fmtNum(k.monthAvgArrivalRate) + '%' : '-', label: isRange ? '区间平均到报率' : '本月平均到报率' },
      { icon: 'orange', value: noReport, label: '未到报站点' },
      { icon: 'red', value: missed, label: isRange ? '区间缺测站点' : '今日缺测站点' }
    ];
    document.getElementById('kpi-row').innerHTML = items.map(function (it) {
      return '<div class="card kpi-card"><div class="kpi-icon ' + it.icon + '">' + icons[it.icon] +
        '</div><div class="kpi-meta"><div class="kpi-value">' + it.value +
        '</div><div class="kpi-label">' + it.label + '</div></div></div>';
    }).join('');

    var hint = document.getElementById('stat-hint');
    var parts = [];
    if (isRange) {
      parts.push('统计区间：' + state.range.start + ' ~ ' + state.range.end);
      if (k.statStartDate) parts.push('起点 ' + k.statStartDate);
    } else if (k.statStartDate) {
      parts.push('统计口径：今日 / 本月（起始 ' + k.statStartDate + '）');
    } else {
      parts.push('统计口径：今日 / 本月（已结束完整窗）');
    }
    parts.push('信息发布为今日');
    if (state.range && state.range.missClamped) {
      parts.push('缺测明细仅最近 ' + MAX_MISS_DAYS + ' 天');
    }
    hint.textContent = parts.join('；');
  }

  function pageSlice(list, page) {
    var start = (page - 1) * PAGE_SIZE;
    return list.slice(start, start + PAGE_SIZE);
  }
  function totalPages(list) {
    return Math.max(1, Math.ceil((list.length || 0) / PAGE_SIZE));
  }

  function renderPager(infoId, btnsId, list, page, onChange) {
    var total = list.length;
    var pages = totalPages(list);
    document.getElementById(infoId).textContent =
      '共 ' + total + ' 条记录，每页 ' + PAGE_SIZE + ' 条，当前第 ' + page + '/' + pages + ' 页';

    var windowPages = [];
    if (pages <= 5) {
      for (var i = 1; i <= pages; i++) windowPages.push(i);
    } else {
      windowPages = [1, 2, 3, '…', pages];
    }

    var html = '<button type="button" class="pg-btn" data-page="' + (page - 1) + '"' + (page <= 1 ? ' disabled' : '') + '>‹</button>';
    windowPages.forEach(function (p) {
      if (p === '…') html += '<span class="pg-ellipsis">…</span>';
      else {
        html += '<button type="button" class="pg-btn' + (p === page ? ' active' : '') +
          '" data-page="' + p + '">' + p + '</button>';
      }
    });
    html += '<button type="button" class="pg-btn" data-page="' + (page + 1) + '"' + (page >= pages ? ' disabled' : '') + '>›</button>';

    var box = document.getElementById(btnsId);
    box.innerHTML = html;
    box.querySelectorAll('.pg-btn').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var p = Number(btn.getAttribute('data-page'));
        if (!p || p < 1 || p > pages || p === page) return;
        onChange(p);
      });
    });
  }

  function emptyRow(colspan, text) {
    return '<tr><td class="empty" colspan="' + colspan + '">' + esc(text) + '</td></tr>';
  }

  function renderArrival() {
    var list = state.arrival.list;
    var page = state.arrival.page;
    var tbody = document.getElementById('arrival-tbody');
    if (!list.length) {
      tbody.innerHTML = emptyRow(9, '暂无数据');
      renderPager('arrival-pg-info', 'arrival-pg-btns', list, 1, function () {});
      return;
    }
    var rows = pageSlice(list, page);
    var start = (page - 1) * PAGE_SIZE;
    tbody.innerHTML = rows.map(function (r, idx) {
      var cls = rateClass(r.rate);
      var w = Math.max(0, Math.min(100, Number(r.rate) || 0));
      return '<tr>' +
        '<td>' + (start + idx + 1) + '</td>' +
        '<td class="left">' + esc(r.name) + '</td>' +
        '<td>' + esc(r.code) + '</td>' +
        '<td>' + esc(r.type) + '</td>' +
        '<td>' + esc(r.expected) + '</td>' +
        '<td>' + esc(r.actual) + '</td>' +
        '<td>' + esc(r.missing) + '</td>' +
        '<td><div class="rate-cell"><span class="rate-bar ' + cls + '"><i style="width:' + w + '%"></i></span>' +
        '<span class="rate-txt">' + fmtRate(r.rate) + '</span></div></td>' +
        '<td><span class="tag ' + arrivalTagClass(r.status) + '">' + esc(r.status) + '</span></td>' +
        '</tr>';
    }).join('');
    renderPager('arrival-pg-info', 'arrival-pg-btns', list, page, function (p) {
      state.arrival.page = p;
      renderArrival();
    });
  }

  function renderMissing() {
    var list = state.missing.list;
    var page = state.missing.page;
    var tbody = document.getElementById('missing-tbody');
    if (!list.length) {
      tbody.innerHTML = emptyRow(7, '暂无数据');
      renderPager('missing-pg-info', 'missing-pg-btns', list, 1, function () {});
      return;
    }
    var rows = pageSlice(list, page);
    var start = (page - 1) * PAGE_SIZE;
    tbody.innerHTML = rows.map(function (r, idx) {
      var tagCls = r.status === '缺测中' ? 'tag-missing' : 'tag-recovered';
      return '<tr>' +
        '<td>' + (start + idx + 1) + '</td>' +
        '<td class="left">' + esc(r.name) + '</td>' +
        '<td>' + esc(r.code) + '</td>' +
        '<td>' + esc(r.period) + '</td>' +
        '<td>' + esc(r.duration) + '</td>' +
        '<td>' + esc(r.dataType) + '</td>' +
        '<td><span class="tag ' + tagCls + '">' + esc(r.status) + '</span></td>' +
        '</tr>';
    }).join('');
    renderPager('missing-pg-info', 'missing-pg-btns', list, page, function (p) {
      state.missing.page = p;
      renderMissing();
    });
  }

  function renderServices() {
    var list = state.services;
    var tbody = document.getElementById('service-tbody');
    if (!list.length) {
      tbody.innerHTML = emptyRow(8, '暂无数据');
      return;
    }
    tbody.innerHTML = list.map(function (s) {
      var cls = s.status === '运行中' ? 'ok' : 'warn';
      return '<tr>' +
        '<td class="left">' + esc(s.name) + '</td>' +
        '<td><span class="status-text ' + cls + '">' + esc(s.status) + '</span></td>' +
        '<td>' + esc(s.start) + '</td>' +
        '<td>' + esc(s.uptime) + '</td>' +
        '<td>' + (s.cpu == null ? '-' : fmtNum(s.cpu) + '%') + '</td>' +
        '<td>' + esc(s.memText) + '</td>' +
        '<td>' + fmtInt(s.requests) + '</td>' +
        '<td>' + fmtRate(s.success) + '</td>' +
        '</tr>';
    }).join('');
  }

  function renderCollect() {
    var list = state.collect;
    var tbody = document.getElementById('collect-tbody');
    if (!list.length) {
      tbody.innerHTML = emptyRow(7, '暂无数据');
      return;
    }
    tbody.innerHTML = list.map(function (r) {
      return '<tr>' +
        '<td class="left">' + esc(r.type) + '</td>' +
        '<td>' + fmtInt(r.expect) + '</td>' +
        '<td>' + fmtInt(r.actual) + '</td>' +
        '<td>' + fmtInt(r.ok) + '</td>' +
        '<td>' + fmtInt(r.fail) + '</td>' +
        '<td><span class="tag ' + okRateTagClass(r.okRate) + '">' + fmtRate(r.okRate) + '</span></td>' +
        '<td>' + fmtRate(r.failRate) + '</td>' +
        '</tr>';
    }).join('');
  }

  function renderPublish() {
    var list = state.publish;
    var tbody = document.getElementById('publish-tbody');
    if (!list.length) {
      tbody.innerHTML = emptyRow(7, '暂无数据');
      return;
    }
    tbody.innerHTML = list.map(function (r) {
      var cls = r.status === '正常' ? 'ok' : 'warn';
      return '<tr>' +
        '<td class="left">' + esc(r.type) + '</td>' +
        '<td>' + esc(r.count) + '</td>' +
        '<td>' + esc(r.ok) + '</td>' +
        '<td>' + esc(r.fail) + '</td>' +
        '<td>' + fmtRate(r.okRate) + '</td>' +
        '<td>' + esc(r.latest) + '</td>' +
        '<td><span class="status-text ' + cls + '">' + esc(r.status) + '</span></td>' +
        '</tr>';
    }).join('');
  }

  function renderAll() {
    renderKpi();
    renderArrival();
    renderMissing();
    renderServices();
    renderCollect();
    renderPublish();
  }

  function setLoadingTables(text) {
    document.getElementById('arrival-tbody').innerHTML = emptyRow(9, text);
    document.getElementById('missing-tbody').innerHTML = emptyRow(7, text);
    document.getElementById('service-tbody').innerHTML = emptyRow(8, text);
    document.getElementById('collect-tbody').innerHTML = emptyRow(7, text);
    document.getElementById('publish-tbody').innerHTML = emptyRow(7, text);
  }

  async function loadAll(showToast) {
    var range = resolveRange();
    if (!range.ok) {
      toast(range.msg);
      return;
    }
    state.range = {
      mode: range.mode,
      start: range.start,
      end: range.end,
      missClamped: range.missClamped
    };

    var btn = document.getElementById('query-btn');
    btn.disabled = true;
    setLoadingTables('加载中...');
    try {
      var q = range.qs;
      var mq = range.missQs || q;
      // publish-stats 不受区间参数影响，始终今日口径
      var results = await Promise.allSettled([
        fetchApi('/data-statistics/arrival-stats' + q),
        fetchApi('/data-statistics/arrival-detail' + q),
        fetchApi('/data-statistics/miss-detail' + mq),
        fetchApi('/data-statistics/service-status' + q),
        fetchApi('/data-statistics/collect-stats' + q),
        fetchApi('/data-statistics/publish-stats'),
        fetchApi('/data-statistics/video-collect' + q)
      ]);

      var errors = [];
      function take(i, fallback, soft) {
        var r = results[i];
        if (r.status === 'fulfilled') return r.value;
        if (!soft) errors.push(r.reason && r.reason.message ? r.reason.message : '接口失败');
        return fallback;
      }

      state.kpi = take(0, null) || {};
      state.arrival.list = mapArrival(take(1, []));
      state.arrival.page = 1;
      state.missing.list = mapMissing(take(2, []));
      state.missing.page = 1;

      var svc = mapServices(take(3, { process: null, services: [] }));
      state.process = svc.process;
      state.services = svc.services;
      // 视频行失败/缺失时静默省略，不计入硬错误；collected=0 仍展示
      state.collect = mergeCollect(take(4, []), mapVideoCollect(take(6, null, true)));
      state.publish = mapPublish(take(5, []));

      renderAll();

      if (errors.length === results.length) {
        toast('数据加载失败：' + errors[0]);
      } else if (errors.length) {
        toast('部分数据加载失败（' + errors.length + '）');
      } else if (range.missClamped) {
        toast('缺测明细已截取最近 ' + MAX_MISS_DAYS + ' 天');
      } else if (showToast) {
        toast('已刷新');
      }
    } catch (e) {
      console.error(e);
      toast((e && e.message) || '数据加载失败');
      setLoadingTables('加载失败，请重试');
    } finally {
      btn.disabled = false;
    }
  }

  function exportCsv(filename, headers, rows) {
    var lines = [headers.join(',')].concat(rows.map(function (r) {
      return r.map(function (c) {
        var s = String(c == null ? '' : c);
        return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
      }).join(',');
    }));
    var blob = new Blob(['\ufeff' + lines.join('\n')], { type: 'text/csv;charset=utf-8;' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = filename;
    a.click();
    URL.revokeObjectURL(a.href);
  }

  // 默认今日口径（与无参接口一致）；可改区间后点查询
  document.getElementById('start-date').value = todayStr();
  document.getElementById('end-date').value = todayStr();
  document.getElementById('query-btn').addEventListener('click', function () {
    loadAll(true);
  });
  document.getElementById('export-arrival').addEventListener('click', function () {
    if (!state.arrival.list.length) { toast('暂无数据可导出'); return; }
    exportCsv('站点到报明细.csv',
      ['序号', '站点名称', '编号', '报文类型', '应到次数', '实到次数', '缺报次数', '到报率', '状态'],
      state.arrival.list.map(function (r, i) {
        return [i + 1, r.name, r.code, r.type, r.expected, r.actual, r.missing, fmtRate(r.rate), r.status];
      })
    );
    toast('已导出到报明细');
  });
  document.getElementById('export-missing').addEventListener('click', function () {
    if (!state.missing.list.length) { toast('暂无数据可导出'); return; }
    exportCsv('缺测明细.csv',
      ['序号', '站点名称', '编号', '缺测时间段', '缺测时长', '数据类型', '当前状态'],
      state.missing.list.map(function (r, i) {
        return [i + 1, r.name, r.code, r.period, r.duration, r.dataType, r.status];
      })
    );
    toast('已导出缺测明细');
  });

  loadAll(false);
})();
</script>
</body>
</html>
