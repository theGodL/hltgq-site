<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>水质演变趋势</title>
<script src="./lib/echarts.min.js"></script>
<script src="./lib/chart-data-zoom.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;max-width:100%;overflow:hidden}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:#f0f2f5;color:#333;font-size:14px}
.page-wrap{height:100%;min-height:0;padding:16px;display:flex;flex-direction:column;gap:12px;width:100%;max-width:100%;box-sizing:border-box;overflow:hidden}
.breadcrumb{color:#999;font-size:13px;flex-shrink:0}
.breadcrumb .sep{margin:0 6px}
.breadcrumb .cur{color:#333}

.main-layout{display:flex;gap:12px;flex:1;min-height:0;min-width:0;width:100%;align-items:stretch}
.left-panel{width:260px;max-width:100%;flex-shrink:0;background:#fff;border-radius:8px;box-shadow:0 1px 2px rgba(0,0,0,.03);display:flex;flex-direction:column;min-height:0;overflow:hidden}
.left-search{padding:14px 14px 10px;display:flex;align-items:center;gap:8px;flex-shrink:0}
.search-box{flex:1;position:relative;min-width:0}
.search-box input{width:100%;height:32px;border:1px solid #d9d9d9;border-radius:16px;padding:0 12px 0 34px;font-size:13px;outline:none;background:#fff;color:#333}
.search-box input:focus{border-color:#1677ff;box-shadow:0 0 0 2px rgba(22,119,255,.1)}
.search-box .ico{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:#bfbfbf;pointer-events:none;display:flex}
.search-collapse{width:28px;height:28px;border:none;background:transparent;cursor:pointer;color:#999;border-radius:4px;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
.search-collapse:hover{background:#f5f5f5;color:#1677ff}
.left-list{flex:1;overflow-y:auto;min-height:0;padding:0 0 8px}
.list-item{padding:12px 18px 12px 15px;cursor:pointer;color:#333;font-size:14px;line-height:22px;user-select:none;transition:background .15s,color .15s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-left:3px solid transparent}
.list-item:hover{background:#f5f5f5}
.list-item.active{background:#e6f4ff;color:#1677ff;font-weight:500;border-left-color:#1677ff}

.right-panel{flex:1;min-width:0;display:flex;flex-direction:column;min-height:0;overflow:hidden;gap:12px}

.stats-row{display:grid;grid-template-columns:repeat(3,1fr);gap:0;background:#fff;border-radius:8px;box-shadow:0 1px 2px rgba(0,0,0,.03);overflow:hidden;flex-shrink:0}
.stat-card{padding:20px 20px;position:relative;min-height:96px}
.stat-card:not(:last-child)::after{content:'';position:absolute;right:0;top:22%;bottom:22%;width:1px;background:#f0f0f0}
.stat-card .label{color:#999;font-size:13px;margin-bottom:12px;line-height:20px}
.stat-card .value{font-size:26px;font-weight:700;color:#1f1f1f;line-height:1.2}
.stat-card .value .unit{font-size:13px;font-weight:400;color:#999;margin-left:6px}

.chart-card{flex:1;min-height:0;background:#fff;border-radius:8px;box-shadow:0 1px 2px rgba(0,0,0,.03);padding:16px 16px 12px;display:flex;flex-direction:column}
.chart-hd{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:8px;flex-shrink:0}
.chart-title{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:700;color:#1f1f1f;line-height:22px}
.chart-title::before{content:'';width:3px;height:14px;background:#1677ff;border-radius:1px;flex-shrink:0}
.date-range{display:flex;align-items:center;gap:6px}
.date-range .field{width:140px;height:32px;border:1px solid #d9d9d9;border-radius:6px;padding:0 11px;font-size:13px;outline:none;background:#fff;color:#333}
.date-range .field:focus{border-color:#1677ff;box-shadow:0 0 0 2px rgba(22,119,255,.1)}
.date-sep{color:#999}
.chart-box{flex:1;min-height:280px;width:100%}

.toast{position:fixed;left:50%;top:24px;transform:translateX(-50%);background:rgba(0,0,0,.75);color:#fff;padding:8px 16px;border-radius:6px;font-size:13px;z-index:2000;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}

@media (max-width:1100px){
  .main-layout{flex-direction:column}
  .left-panel{width:100%;max-height:220px}
  .stats-row{grid-template-columns:repeat(2,1fr)}
}
@media (max-width:640px){
  .stats-row{grid-template-columns:1fr}
  .stat-card::after{display:none !important}
}
</style>
</head>
<body>
<div class="page-wrap">
  <!-- 面包屑暂隐藏，后续可能不需要
  <div class="breadcrumb">
    <span>水质监测</span><span class="sep">/</span>
    <span class="cur">水质演变趋势</span>
  </div>
  -->

  <div class="main-layout">
    <div class="left-panel">
      <div class="left-search">
        <div class="search-box">
          <span class="ico">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="1.8"/><path d="M16.5 16.5L21 21" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
          </span>
          <input type="text" id="station-search" placeholder="请输入关键字" autocomplete="off">
        </div>
        <button type="button" class="search-collapse" id="station-collapse" title="收起/展开">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M4 7h16M4 12h10M4 17h16" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        </button>
      </div>
      <div class="left-list" id="station-list"></div>
    </div>

    <div class="right-panel">
      <div class="stats-row" id="stats-row"></div>

      <div class="chart-card">
        <div class="chart-hd">
          <div class="chart-title">主要水质指标变化趋势</div>
          <div class="date-range">
            <input type="date" class="field" id="start-date">
            <span class="date-sep">—</span>
            <input type="date" class="field" id="end-date">
          </div>
        </div>
        <div class="chart-box" id="chart-trend"></div>
      </div>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
(function () {
  var API = '/hltgq-site';
  var MAX_RANGE_DAYS = 31;

  function $(id) { return document.getElementById(id); }
  function pad2(n) { return n < 10 ? '0' + n : '' + n; }
  function todayStr() {
    var d = new Date();
    return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
  }
  function daysAgo(n) {
    var d = new Date();
    d.setDate(d.getDate() - n);
    return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
  }
  function toast(msg) {
    var el = $('toast');
    if (!el) return;
    el.textContent = msg || '';
    el.classList.add('show');
    clearTimeout(toast._t);
    toast._t = setTimeout(function () { el.classList.remove('show'); }, 2200);
  }
  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  async function fetchApi(path) {
    var res = await fetch(API + path, { credentials: 'include' });
    var body = null;
    try { body = await res.json(); } catch (e) { body = null; }
    if (!res.ok) {
      var msg = (body && (body.message || body.msg)) || ('HTTP ' + res.status);
      throw new Error(msg);
    }
    if (body && typeof body === 'object' && !Array.isArray(body) && ('data' in body) && ('code' in body || 'msg' in body || 'message' in body)) {
      if (body.code != null && Number(body.code) !== 0) {
        throw new Error(body.msg || body.message || '请求失败');
      }
      return body.data;
    }
    return body;
  }

  function isEmptyVal(v) {
    return v === null || v === undefined || v === '' || Number(v) === -9991;
  }
  function fmtNum(v) {
    if (v === null || v === undefined || v === '') return '—';
    if (Number(v) === -9991) return '--';
    var n = Number(v);
    if (!Number.isFinite(n)) return '—';
    return String(n);
  }
  function daySpan(start, end) {
    if (!start || !end) return null;
    var a = new Date(start.replace(/-/g, '/') + ' 00:00:00');
    var b = new Date(end.replace(/-/g, '/') + ' 00:00:00');
    if (isNaN(a.getTime()) || isNaN(b.getTime())) return null;
    return Math.round((b - a) / 86400000) + 1;
  }

  var stations = [];
  var activeId = '';
  var listCollapsed = false;
  var chart = null;
  var loading = false;

  function setDefaultDates() {
    $('start-date').value = daysAgo(6);
    $('end-date').value = todayStr();
  }

  function getRange() {
    var start = ($('start-date').value || '').trim();
    var end = ($('end-date').value || '').trim();
    if (!start || !end) return { ok: false, msg: '请选择日期区间' };
    if (start > end) return { ok: false, msg: '开始日期不能晚于结束日期' };
    var span = daySpan(start, end);
    if (span == null) return { ok: false, msg: '日期无效' };
    if (span > MAX_RANGE_DAYS) {
      return { ok: false, msg: '查询跨度建议不超过 ' + MAX_RANGE_DAYS + ' 天' };
    }
    return {
      ok: true,
      start: start,
      end: end,
      startTime: start + ' 00:00:00',
      endTime: end + ' 23:59:59'
    };
  }

  function renderList() {
    var q = ($('station-search').value || '').trim();
    var html = stations.filter(function (s) {
      return !q || String(s.name || '').indexOf(q) >= 0;
    }).map(function (s) {
      return '<div class="list-item' + (String(s.id) === String(activeId) ? ' active' : '') +
        '" data-id="' + esc(s.id) + '">' + esc(s.name || s.id) + '</div>';
    }).join('');
    $('station-list').innerHTML = html ||
      '<div style="padding:24px;text-align:center;color:#bbb">暂无站点数据</div>';
  }

  function renderStats(row) {
    var s = row || {};
    var items = [
      { label: '溶解氧', value: fmtNum(s.dox), unit: 'mg/L' },
      { label: 'COD', value: fmtNum(s.codcr), unit: 'mg/L' },
      { label: '氨氮', value: fmtNum(s.nh3n), unit: 'mg/L' }
    ];
    $('stats-row').innerHTML = items.map(function (it) {
      var showUnit = it.unit && it.value !== '—' && it.value !== '--';
      return '<div class="stat-card"><div class="label">' + esc(it.label) + '</div><div class="value">' +
        esc(it.value) + (showUnit ? '<span class="unit">' + esc(it.unit) + '</span>' : '') +
        '</div></div>';
    }).join('');
  }

  function ensureChart() {
    var el = $('chart-trend');
    if (!el || !window.echarts) return null;
    if (!chart) chart = echarts.init(el);
    return chart;
  }

  function emptyChart(tip) {
    var c = ensureChart();
    if (!c) return;
    c.clear();
    c.setOption({
      title: {
        text: tip || '暂无数据',
        left: 'center',
        top: 'middle',
        textStyle: { color: '#bbb', fontSize: 14, fontWeight: 'normal' }
      }
    });
  }

  function renderTrend(points) {
    var c = ensureChart();
    if (!c) return;
    var list = Array.isArray(points) ? points : [];
    if (!list.length) {
      emptyChart('暂无趋势数据');
      return;
    }
    var x = list.map(function (p) {
      var h = String(p.hour || '').replace('T', ' ');
      return h.length >= 16 ? h.slice(5, 16) : h;
    });
    var seriesDefs = [
      { name: '溶解氧', key: 'dox', color: '#1677ff' },
      { name: 'COD', key: 'codcr', color: '#52c41a' },
      { name: '氨氮', key: 'nh3n', color: '#fa8c16' }
    ];
    var option = {
      color: seriesDefs.map(function (s) { return s.color; }),
      tooltip: {
        trigger: 'axis',
        backgroundColor: 'rgba(255,255,255,.96)',
        borderColor: '#e8e8e8',
        borderWidth: 1,
        textStyle: { color: '#333', fontSize: 12 }
      },
      legend: {
        top: 4,
        left: 'center',
        itemWidth: 10,
        itemHeight: 10,
        textStyle: { color: '#666', fontSize: 12 }
      },
      grid: { left: 48, right: 24, top: 40, bottom: 56 },
      xAxis: {
        type: 'category',
        data: x,
        boundaryGap: false,
        axisTick: { show: false },
        axisLine: { lineStyle: { color: '#e8e8e8' } },
        axisLabel: { color: '#8c8c8c', fontSize: 11 }
      },
      yAxis: {
        type: 'value',
        name: 'mg/L',
        nameTextStyle: { color: '#8c8c8c', fontSize: 11 },
        axisLine: { show: false },
        axisTick: { show: false },
        splitLine: { lineStyle: { color: '#f0f0f0' } },
        axisLabel: { color: '#8c8c8c', fontSize: 12 }
      },
      series: seriesDefs.map(function (s) {
        return {
          name: s.name,
          type: 'line',
          smooth: false,
          showSymbol: false,
          connectNulls: false,
          lineStyle: { width: 2 },
          data: list.map(function (p) {
            return isEmptyVal(p[s.key]) ? null : Number(p[s.key]);
          })
        };
      })
    };
    if (typeof buildChartDataZoom === 'function') {
      option.dataZoom = buildChartDataZoom();
    }
    c.clear();
    c.setOption(option, true);
    setTimeout(function () { if (chart) chart.resize(); }, 40);
  }

  async function loadSites() {
    try {
      var list = await fetchApi('/water-quality/sites');
      stations = (Array.isArray(list) ? list : []).map(function (x) {
        return { id: x.code, name: x.name };
      });
      renderList();
      if (stations.length) {
        await loadStation(stations[0].id);
      } else {
        activeId = '';
        renderStats(null);
        emptyChart('暂无站点数据');
      }
    } catch (e) {
      console.error(e);
      stations = [];
      renderList();
      renderStats(null);
      emptyChart('站点加载失败');
      toast((e && e.message) || '站点加载失败');
    }
  }

  async function loadMonitoring(code) {
    var data = await fetchApi('/water-quality/monitoring?stcds=' + encodeURIComponent(code));
    var row = Array.isArray(data) ? data[0] : data;
    renderStats(row || null);
  }

  async function loadTrend(code) {
    var range = getRange();
    if (!range.ok) {
      toast(range.msg);
      emptyChart(range.msg);
      return;
    }
    var p = new URLSearchParams({
      stcd: code,
      startTime: range.startTime,
      endTime: range.endTime
    });
    var data = await fetchApi('/water-quality/trend?' + p.toString());
    renderTrend((data && data.points) || []);
  }

  async function loadStation(id) {
    activeId = id == null ? '' : String(id);
    renderList();
    if (!activeId) {
      renderStats(null);
      emptyChart('请选择站点');
      return;
    }
    if (loading) return;
    loading = true;
    try {
      var results = await Promise.allSettled([
        loadMonitoring(activeId),
        loadTrend(activeId)
      ]);
      var errs = results.filter(function (r) { return r.status === 'rejected'; });
      if (errs.length === 2) {
        toast((errs[0].reason && errs[0].reason.message) || '加载失败');
      } else if (errs.length) {
        toast((errs[0].reason && errs[0].reason.message) || '部分数据加载失败');
      }
    } finally {
      loading = false;
    }
  }

  async function onDateChange() {
    if (!activeId) {
      toast('请先选择站点');
      return;
    }
    var range = getRange();
    if (!range.ok) {
      toast(range.msg);
      return;
    }
    try {
      await loadTrend(activeId);
    } catch (e) {
      console.error(e);
      emptyChart((e && e.message) || '趋势加载失败');
      toast((e && e.message) || '趋势加载失败');
    }
  }

  $('station-list').addEventListener('click', function (e) {
    var item = e.target.closest('.list-item');
    if (!item) return;
    loadStation(item.getAttribute('data-id'));
  });
  $('station-search').addEventListener('input', renderList);
  $('station-collapse').addEventListener('click', function () {
    listCollapsed = !listCollapsed;
    $('station-list').style.display = listCollapsed ? 'none' : '';
  });
  $('start-date').addEventListener('change', onDateChange);
  $('end-date').addEventListener('change', onDateChange);
  window.addEventListener('resize', function () {
    if (chart) chart.resize();
  });

  setDefaultDates();
  renderStats(null);
  emptyChart('加载中...');
  loadSites();
})();
</script>
</body>
</html>
