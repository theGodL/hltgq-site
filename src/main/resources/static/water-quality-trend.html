<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>水质演变趋势</title>
<script src="./lib/echarts.min.js"></script>
<script src="./lib/chart-data-zoom.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;max-width:100%;overflow:hidden}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:#f0f2f5;color:#333;font-size:14px}
.page-wrap{height:100%;min-height:0;padding:16px;display:flex;flex-direction:column;gap:12px;width:100%;max-width:100%;box-sizing:border-box;overflow:hidden}
.breadcrumb{color:#999;font-size:13px;flex-shrink:0}
.breadcrumb .sep{margin:0 6px}
.breadcrumb .cur{color:#333}

.main-layout{display:flex;gap:12px;flex:1;min-height:0;min-width:0;width:100%;align-items:stretch}
.left-panel{width:260px;max-width:100%;flex-shrink:0;background:#fff;border-radius:8px;box-shadow:0 1px 2px rgba(0,0,0,.03);display:flex;flex-direction:column;min-height:0;overflow:hidden}
.left-search{padding:14px 14px 10px;display:flex;align-items:center;gap:8px;flex-shrink:0}
.search-box{flex:1;position:relative;min-width:0}
.search-box input{width:100%;height:32px;border:1px solid #d9d9d9;border-radius:16px;padding:0 12px 0 34px;font-size:13px;outline:none;background:#fff;color:#333}
.search-box input:focus{border-color:#1677ff;box-shadow:0 0 0 2px rgba(22,119,255,.1)}
.search-box .ico{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:#bfbfbf;pointer-events:none;display:flex}
.search-collapse{width:28px;height:28px;border:none;background:transparent;cursor:pointer;color:#999;border-radius:4px;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
.search-collapse:hover{background:#f5f5f5;color:#1677ff}
.left-list{flex:1;overflow-y:auto;min-height:0;padding:0 0 8px}
.list-item{padding:12px 18px 12px 15px;cursor:pointer;color:#333;font-size:14px;line-height:22px;user-select:none;transition:background .15s,color .15s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-left:3px solid transparent}
.list-item:hover{background:#f5f5f5}
.list-item.active{background:#e6f4ff;color:#1677ff;font-weight:500;border-left-color:#1677ff}

.right-panel{flex:1;min-width:0;display:flex;flex-direction:column;min-height:0;overflow:hidden;gap:12px}

.stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:0;background:#fff;border-radius:8px;box-shadow:0 1px 2px rgba(0,0,0,.03);overflow:hidden;flex-shrink:0}
.stat-card{padding:20px 20px;position:relative;min-height:96px}
.stat-card:not(:last-child)::after{content:'';position:absolute;right:0;top:22%;bottom:22%;width:1px;background:#f0f0f0}
.stat-card .label{color:#999;font-size:13px;margin-bottom:12px;line-height:20px}
.stat-card .value{font-size:26px;font-weight:700;color:#1f1f1f;line-height:1.2}
.stat-card .value .unit{font-size:13px;font-weight:400;color:#999;margin-left:6px}

.chart-card{flex:1;min-height:0;background:#fff;border-radius:8px;box-shadow:0 1px 2px rgba(0,0,0,.03);padding:16px 16px 12px;display:flex;flex-direction:column}
.chart-hd{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:8px;flex-shrink:0}
.chart-title{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:700;color:#1f1f1f;line-height:22px}
.chart-title::before{content:'';width:3px;height:14px;background:#1677ff;border-radius:1px;flex-shrink:0}
.date-range{display:flex;align-items:center;gap:6px}
.date-range .field{width:140px;height:32px;border:1px solid #d9d9d9;border-radius:6px;padding:0 11px;font-size:13px;outline:none;background:#fff;color:#333}
.date-range .field:focus{border-color:#1677ff;box-shadow:0 0 0 2px rgba(22,119,255,.1)}
.date-sep{color:#999}
.chart-box{flex:1;min-height:280px;width:100%}

.toast{position:fixed;left:50%;top:24px;transform:translateX(-50%);background:rgba(0,0,0,.75);color:#fff;padding:8px 16px;border-radius:6px;font-size:13px;z-index:2000;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}

@media (max-width:1100px){
  .main-layout{flex-direction:column}
  .left-panel{width:100%;max-height:220px}
  .stats-row{grid-template-columns:repeat(2,1fr)}
}
@media (max-width:640px){
  .stats-row{grid-template-columns:1fr}
  .stat-card::after{display:none !important}
}
</style>
</head>
<body>
<div class="page-wrap">
  <div class="breadcrumb">
    <span>水质监测</span><span class="sep">/</span>
    <span class="cur">水质演变趋势</span>
  </div>

  <div class="main-layout">
    <div class="left-panel">
      <div class="left-search">
        <div class="search-box">
          <span class="ico">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="1.8"/><path d="M16.5 16.5L21 21" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
          </span>
          <input type="text" id="station-search" placeholder="请输入关键字" autocomplete="off">
        </div>
        <button type="button" class="search-collapse" id="station-collapse" title="收起/展开">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M4 7h16M4 12h10M4 17h16" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        </button>
      </div>
      <div class="left-list" id="station-list"></div>
    </div>

    <div class="right-panel">
      <div class="stats-row" id="stats-row"></div>

      <div class="chart-card">
        <div class="chart-hd">
          <div class="chart-title">主要水质指标变化趋势</div>
          <div class="date-range">
            <input type="date" class="field" id="start-date">
            <span class="date-sep">—</span>
            <input type="date" class="field" id="end-date">
          </div>
        </div>
        <div class="chart-box" id="chart-trend"></div>
      </div>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
(function () {
  function $(id) { return document.getElementById(id); }
  function toast(msg) {
    var el = $('toast');
    if (!el) return;
    el.textContent = msg || '';
    el.classList.add('show');
    clearTimeout(toast._t);
    toast._t = setTimeout(function () { el.classList.remove('show'); }, 2200);
  }

  var stations = [];
  var activeId = '';
  var listCollapsed = false;
  var chart = null;

  function renderList() {
    var q = ($('station-search').value || '').trim();
    var html = stations.filter(function (s) {
      return !q || String(s.name || '').indexOf(q) >= 0;
    }).map(function (s) {
      return '<div class="list-item' + (String(s.id) === String(activeId) ? ' active' : '') + '" data-id="' + s.id + '">' +
        (s.name || s.id) + '</div>';
    }).join('');
    $('station-list').innerHTML = html ||
      '<div style="padding:24px;text-align:center;color:#bbb">暂无站点数据</div>';
  }

  function renderStats(summary) {
    var s = summary || {};
    var items = [
      { label: '当前综合水质等级', value: s.grade != null ? s.grade : '—', unit: '' },
      { label: '溶解氧', value: s.do != null ? s.do : '—', unit: 'mg/L' },
      { label: '高锰酸盐指数', value: s.codmn != null ? s.codmn : '—', unit: 'mg/L' },
      { label: '氨氮', value: s.nh3 != null ? s.nh3 : '—', unit: 'mg/L' }
    ];
    $('stats-row').innerHTML = items.map(function (it) {
      return '<div class="stat-card"><div class="label">' + it.label + '</div><div class="value">' +
        it.value + (it.unit && it.value !== '—' ? '<span class="unit">' + it.unit + '</span>' : '') +
        '</div></div>';
    }).join('');
  }

  function ensureChart() {
    var el = $('chart-trend');
    if (!el || !window.echarts) return null;
    if (!chart) chart = echarts.init(el);
    return chart;
  }

  function emptyChart(tip) {
    var c = ensureChart();
    if (!c) return;
    c.clear();
    c.setOption({
      title: {
        text: tip || '暂无数据',
        left: 'center',
        top: 'middle',
        textStyle: { color: '#bbb', fontSize: 14, fontWeight: 'normal' }
      }
    });
  }

  /** 接口就绪后在此拉取并渲染；当前无水质接口，保持空态 */
  function loadStation(id) {
    activeId = id == null ? '' : String(id);
    renderList();
    renderStats(null);
    emptyChart('水质接口未接入，暂无数据');
    setTimeout(function () { if (chart) chart.resize(); }, 40);
  }

  $('station-list').addEventListener('click', function (e) {
    var item = e.target.closest('.list-item');
    if (!item) return;
    loadStation(item.dataset.id);
  });
  $('station-search').addEventListener('input', renderList);
  $('station-collapse').addEventListener('click', function () {
    listCollapsed = !listCollapsed;
    $('station-list').style.display = listCollapsed ? 'none' : '';
  });
  $('start-date').addEventListener('change', function () {
    toast('水质接口未接入');
  });
  $('end-date').addEventListener('change', function () {
    toast('水质接口未接入');
  });
  window.addEventListener('resize', function () {
    if (chart) chart.resize();
  });

  loadStation('');
})();
</script>
</body>
</html>
