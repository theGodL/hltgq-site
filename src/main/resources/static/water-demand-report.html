<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>需水上报</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:#fff;color:#333;font-size:14px;-webkit-font-smoothing:antialiased}
.page-wrap{padding:20px 24px 48px}

/* 页面头部:仅右侧「新增需水上报」(页面标题由平台菜单展示,页内不重复) */
.page-head{display:flex;align-items:center;justify-content:flex-end;gap:12px;margin-bottom:16px}

/* 按钮(与值班管理页保持一致) */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:36px;padding:0 16px;border:1px solid transparent;border-radius:6px;font-size:14px;font-family:inherit;cursor:pointer;white-space:nowrap;transition:all .2s}
.btn-primary{background:#1677ff;color:#fff;border-color:#1677ff}
.btn-primary:hover{background:#4096ff;border-color:#4096ff}
.btn-primary:active{background:#0958d9;border-color:#0958d9}
.btn-default{background:#fff;color:#333;border-color:#d9d9d9}
.btn-default:hover{color:#1677ff;border-color:#1677ff}
.btn-danger{background:#ff4d4f;color:#fff;border-color:#ff4d4f}
.btn-danger:hover{background:#ff7875;border-color:#ff7875}
.btn:disabled{opacity:.6;cursor:not-allowed;pointer-events:none}
.btn svg{display:block;flex-shrink:0}

/* 工具栏:左侧状态 Tab(带计数),右侧搜索框 */
.toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.tabs{display:flex;align-items:center;gap:4px}
.tab{position:relative;display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 12px;border:none;border-radius:6px;background:none;font-size:14px;font-family:inherit;color:#595959;cursor:pointer;transition:all .2s}
.tab:hover{color:#1677ff;background:#e6f4ff}
.tab.active{color:#1677ff;font-weight:500}
.tab.active::after{content:'';position:absolute;left:12px;right:12px;bottom:1px;height:2px;border-radius:1px;background:#1677ff}
.tab-num{display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:18px;padding:0 6px;border-radius:9px;background:#f0f0f0;color:#8c8c8c;font-size:12px;font-weight:400;line-height:1}
.tab.active .tab-num{background:#e6f4ff;color:#1677ff}
.search-wrap{position:relative;width:280px}
.srch-icon{position:absolute;left:10px;top:50%;transform:translateY(-50%);display:inline-flex;color:#bfbfbf;pointer-events:none}
.search-input{width:100%;height:36px;border:1px solid #d9d9d9;border-radius:6px;padding:0 12px 0 32px;font-size:14px;font-family:inherit;color:#333;outline:none;transition:border-color .2s,box-shadow .2s}
.search-input:focus{border-color:#1677ff;box-shadow:0 0 0 2px rgba(22,119,255,.1)}
.search-input::placeholder{color:#bfbfbf}

/* 表格(与值班管理页保持一致) */
.tbl{width:100%;border-collapse:collapse;table-layout:fixed;font-size:14px}
.tbl th{background:#fafafa;color:#333;font-weight:600;text-align:left;padding:12px 16px;border:1px solid #f0f0f0;white-space:normal;line-height:20px}
.tbl td{padding:12px 16px;border:1px solid #f0f0f0;color:#333;line-height:22px;vertical-align:middle;overflow-wrap:break-word}
.cell-main{font-weight:600;color:#1f1f1f;line-height:22px}
.cell-range{display:block;color:#333;line-height:22px}
.amt{font-weight:600;color:#1f1f1f}
.amt .unit{margin-left:2px;font-size:12px;color:#8c8c8c;font-weight:400}
.empty-cell{text-align:center;color:#bfbfbf;padding:32px 0}

/* 审核状态:圆点 + 文字(审核意见为独立列展示) */
.st-tag{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:12px;font-size:12px;font-weight:500;line-height:1;white-space:nowrap}
.st-tag::before{content:'';width:6px;height:6px;border-radius:50%;background:currentColor;flex-shrink:0}
.st-tag.wait{background:#fff7e6;color:#fa8c16}
.st-tag.pass{background:#f6ffed;color:#52c41a}
.st-tag.reject{background:#fff1f0;color:#ff4d4f}

/* 操作列链接 */
.act{color:#1677ff;cursor:pointer;transition:color .2s;white-space:nowrap}
.act:hover{color:#4096ff}
.act.del{color:#ff4d4f}
.act.del:hover{color:#ff7875}
.tbl td .act + .act{margin-left:14px}

/* 分页栏(居右:共 N 条 / 页码 / 每页条数 / 跳页) */
.pg-bar{display:flex;align-items:center;justify-content:flex-end;padding:16px 0 0;gap:8px;flex-wrap:wrap}
.pg-info{color:#333;font-size:13px;margin-right:4px}
.pg-btns{display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.pg-btn{min-width:32px;height:32px;padding:0 6px;border:1px solid #d9d9d9;background:#fff;border-radius:6px;cursor:pointer;font-size:13px;color:#333;transition:all .2s;display:inline-flex;align-items:center;justify-content:center}
.pg-btn:hover:not([disabled]):not(.active){border-color:#1677ff;color:#1677ff}
.pg-btn.active{border-color:#1677ff;color:#1677ff}
.pg-btn[disabled]{color:#bfbfbf;cursor:not-allowed}
.pg-btn[data-pg="prev"],.pg-btn[data-pg="next"]{border-color:transparent;background:transparent;font-size:16px;color:#8c8c8c}
.pg-btn[data-pg="prev"]:hover:not([disabled]),.pg-btn[data-pg="next"]:hover:not([disabled]){border-color:transparent;background:transparent;color:#1677ff}
.pg-ellipsis{min-width:20px;height:32px;display:inline-flex;align-items:center;justify-content:center;color:#8c8c8c;font-size:13px;user-select:none;letter-spacing:1px}
.pg-size{height:32px;border:1px solid #d9d9d9;border-radius:6px;font-size:13px;color:#333;background:#fff;padding:0 8px;outline:none}
.pg-jump{display:flex;align-items:center;gap:6px;font-size:13px;color:#333}
.pg-jump input{width:52px;height:32px;border:1px solid #d9d9d9;border-radius:6px;text-align:center;font-size:13px;color:#333;background:#fff;outline:none;padding:0 8px}
.pg-jump input:focus{border-color:#1677ff}

/* 弹窗(居中模态:新增/编辑、审核、编制指令、删除确认共用) */
.ov{display:none;position:fixed;inset:0;z-index:1000;background:rgba(0,0,0,.45);align-items:flex-start;justify-content:center;padding:24px;overflow-y:auto}
.ov.show{display:flex}
/* 弹窗(内容超高时:内容区内部滚动,底部按钮固定在弹窗下方) */
.modal{position:relative;background:#fff;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);width:100%;display:flex;flex-direction:column;max-height:calc(100vh - 48px)}
.modal-sm{max-width:460px;margin-top:16vh}
.modal-md{max-width:560px;margin-top:10vh;max-height:78vh}
.modal-lg{max-width:720px;margin-top:6vh;max-height:78vh}
.modal-x{position:absolute;top:16px;right:16px;display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;padding:0;border:none;border-radius:4px;background:none;color:#595959;cursor:pointer;transition:color .2s,background .2s}
.modal-x:hover{color:#262626;background:#f5f5f5}
.modal-hd{padding:20px 24px 0;font-size:18px;font-weight:600;color:#1f1f1f;flex-shrink:0}
.modal-bd{padding:16px 24px 0;flex:1;min-height:0;overflow-y:auto}
.modal-ft{display:flex;justify-content:flex-end;gap:8px;padding:16px 24px 20px;border-top:1px solid #f0f0f0;margin-top:18px;flex-shrink:0}
.modal-ft .btn{height:36px;padding:0 18px}
.confirm-text{font-size:14px;color:#333;line-height:22px;word-break:break-all}

/* 表单(弹窗内:两列网格 + 必填红星 + 字段提示) */
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}
.form-grid .span2{grid-column:span 2}
.form-item{margin-bottom:18px}
.form-item > label{display:block;margin-bottom:8px;font-size:14px;color:#333}
.req{color:#ff4d4f;font-style:normal;margin-left:2px}
.ipt{width:100%;height:36px;border:1px solid #d9d9d9;border-radius:6px;background:#fff;padding:0 12px;font-size:14px;font-family:inherit;color:#333;outline:none;transition:border-color .2s,box-shadow .2s}
.ipt:focus{border-color:#1677ff;box-shadow:0 0 0 2px rgba(22,119,255,.1)}
.ipt::placeholder{color:#bfbfbf}
textarea.ipt{height:auto;min-height:88px;padding:8px 12px;line-height:22px;resize:vertical}
input[type="date"].ipt,input[type="datetime-local"].ipt{cursor:pointer}
input[type="number"].ipt::-webkit-outer-spin-button,input[type="number"].ipt::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
input[type="number"].ipt{-moz-appearance:textfield;appearance:textfield}
.f-tip{margin-top:6px;font-size:12px;color:#8c8c8c;line-height:18px}

/* 用水时间:年/月下拉 + 旬多选(标签式复选框) + 派生时段提示 */
.period-row{display:flex;gap:8px}
.period-row .ipt{flex:1;min-width:0;cursor:pointer;padding-right:8px}
.xun-group{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.xun-item{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 14px;border:1px solid #d9d9d9;border-radius:6px;cursor:pointer;font-size:14px;color:#333;transition:all .2s;user-select:none}
.xun-item:hover{border-color:#1677ff;color:#1677ff}
.xun-item.checked{border-color:#1677ff;background:#e6f4ff;color:#1677ff}
.xun-item input{width:14px;height:14px;accent-color:#1677ff;cursor:pointer}
.period-tip strong{color:#1677ff;font-weight:500}

/* 下拉(统一支持输入模糊搜索) */
.select-wrap{position:relative}
.sel-input{width:100%;height:36px;border:1px solid #d9d9d9;border-radius:6px;background:#fff;padding:0 32px 0 12px;font-size:14px;font-family:inherit;color:#333;outline:none;cursor:pointer;transition:border-color .2s,box-shadow .2s}
.sel-input:focus{border-color:#1677ff;box-shadow:0 0 0 2px rgba(22,119,255,.1)}
.sel-input::placeholder{color:#bfbfbf}
.chev{position:absolute;right:12px;top:50%;transform:translateY(-50%);display:inline-flex;pointer-events:none}
.sel-dd{display:none;position:absolute;left:0;right:0;top:calc(100% + 4px);z-index:30;max-height:224px;overflow-y:auto;background:#fff;border:1px solid #f0f0f0;border-radius:6px;box-shadow:0 6px 16px rgba(0,0,0,.08);padding:4px}
.sel-dd.open{display:block}
.dd-opt{padding:8px 12px;border-radius:4px;cursor:pointer;color:#333;font-size:14px;line-height:20px}
.dd-opt:hover{background:#f5f5f5}
.dd-opt.active{background:#e6f4ff;color:#1677ff;font-weight:500}
.dd-empty{padding:10px 12px;font-size:13px;color:#bfbfbf;text-align:center}

/* 审核弹窗:只读详情键值行 */
.kv-list{margin-bottom:18px}
.kv-row{display:flex;justify-content:space-between;gap:14px;line-height:30px;font-size:14px}
.kv-row .k{color:#8c8c8c;flex-shrink:0}
.kv-row .v{color:#333;text-align:right;word-break:break-all}

/* 编制指令弹窗:计划配额绿色提示条 */
.plan-tip{display:none;margin-top:10px;padding:9px 12px;border:1px solid #b7eb8f;border-radius:6px;background:#f6ffed;color:#389e0d;font-size:13px;line-height:20px}
.plan-tip.show{display:flex;align-items:flex-start;gap:8px}
.plan-tip svg{flex-shrink:0;margin-top:3px}

/* 轻提示 */
.toast{position:fixed;top:24px;left:50%;z-index:1500;padding:9px 18px;border:1px solid #d9d9d9;border-radius:6px;background:#fff;box-shadow:0 6px 16px rgba(0,0,0,.12);font-size:14px;color:#333;opacity:0;pointer-events:none;transform:translate(-50%,-16px);transition:opacity .25s,transform .25s;max-width:80vw}
.toast.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<div class="page-wrap">
  <!-- 页面头部:仅右侧新增按钮(页面标题由平台菜单展示,页内不重复) -->
  <div class="page-head">
    <button type="button" class="btn btn-primary" id="btn-add">
      <svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true">
        <path d="M6 1v10M1 6h10" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
      </svg>新增需水上报
    </button>
  </div>

  <!-- 工具栏:状态 Tab(带计数) + 搜索框 -->
  <div class="toolbar">
    <div class="tabs" id="tabs">
      <button type="button" class="tab active" data-st="">全部<span class="tab-num" id="tab-num-all">0</span></button>
      <button type="button" class="tab" data-st="wait">待审核<span class="tab-num" id="tab-num-wait">0</span></button>
      <button type="button" class="tab" data-st="pass">已通过<span class="tab-num" id="tab-num-pass">0</span></button>
      <button type="button" class="tab" data-st="reject">已驳回<span class="tab-num" id="tab-num-reject">0</span></button>
    </div>
    <div class="search-wrap">
      <span class="srch-icon">
        <svg width="14" height="14" viewBox="0 0 16 16" fill="none" aria-hidden="true">
          <circle cx="7" cy="7" r="4.5" stroke="currentColor" stroke-width="1.4"/>
          <path d="M10.6 10.6L14.4 14.4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
        </svg>
      </span>
      <input type="text" class="search-input" id="f-kw" placeholder="搜索单号 / 用水户 / 用途" autocomplete="off">
    </div>
  </div>

  <!-- 需水上报列表 -->
  <table class="tbl">
    <colgroup>
      <col style="width:9%"><col style="width:10%"><col style="width:9%"><col style="width:11%">
      <col style="width:14%"><col style="width:9%"><col style="width:9%"><col style="width:15%">
      <col style="width:14%">
    </colgroup>
    <thead>
      <tr>
        <th>上报单号</th><th>上报时间</th><th>用水户</th><th>计划水量<br>（万m³）</th>
        <th>用水时间</th><th>用途</th><th>审核状态</th><th>审核意见</th><th>操作</th>
      </tr>
    </thead>
    <tbody id="tbl-body"></tbody>
  </table>

  <!-- 分页栏 -->
  <div class="pg-bar" id="pg-bar"></div>
</div>

<!-- 新增/编辑需水上报弹窗(共用;编辑时多「审核状态」下拉) -->
<div class="ov" id="form-ov">
  <div class="modal modal-lg" role="dialog" aria-label="需水上报">
    <button type="button" class="modal-x" data-close="form-ov" aria-label="关闭">
      <svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true">
        <path d="M1.5 1.5l11 11M12.5 1.5l-11 11" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
      </svg>
    </button>
    <div class="modal-hd">
      <div id="form-title">新增需水上报</div>
    </div>
    <div class="modal-bd">
      <div class="form-grid">
        <div class="form-item">
          <label>用水户 <i class="req">*</i></label>
          <div class="select-wrap">
            <input type="text" class="sel-input" id="f-farmer" placeholder="输入名称/编号搜索" autocomplete="off">
            <span class="chev"><svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M2.5 4.5L6 8l3.5-3.5" stroke="#bfbfbf" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
            <div class="sel-dd" id="farmer-dd"></div>
          </div>
        </div>
        <div class="form-item">
          <label>计划水量（万m³） <i class="req">*</i></label>
          <input type="number" class="ipt" id="f-amount" min="0" step="0.01" placeholder="0" autocomplete="off">
        </div>
        <div class="form-item">
          <label>用途</label>
          <div class="select-wrap">
            <input type="text" class="sel-input" id="f-usage" placeholder="如 水稻泡田灌溉" autocomplete="off">
            <span class="chev"><svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M2.5 4.5L6 8l3.5-3.5" stroke="#bfbfbf" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
            <div class="sel-dd" id="usage-dd"></div>
          </div>
        </div>
        <div class="form-item">
          <label>用水时间（年 / 月） <i class="req">*</i></label>
          <div class="period-row">
            <select class="ipt" id="f-year" aria-label="用水年份"></select>
            <select class="ipt" id="f-month" aria-label="用水月份"></select>
          </div>
        </div>
        <div class="form-item span2">
          <label>旬（可多选） <i class="req">*</i></label>
          <div class="xun-group" id="f-xun-group">
            <label class="xun-item"><input type="checkbox" value="1">上旬</label>
            <label class="xun-item"><input type="checkbox" value="2">中旬</label>
            <label class="xun-item"><input type="checkbox" value="3">下旬</label>
          </div>
          <div class="f-tip period-tip" id="period-tip">请选择旬，选择后自动带出用水时段</div>
        </div>
        <div class="form-item span2">
          <label>备注 / 审核意见</label>
          <textarea class="ipt" id="f-remark" placeholder="选填"></textarea>
        </div>
      </div>
    </div>
    <div class="modal-ft">
      <button type="button" class="btn btn-default" id="btn-form-cancel">取消</button>
      <button type="button" class="btn btn-primary" id="btn-form-save">
        <svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M2 6.2L4.8 9 10 3.4" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>保存
      </button>
    </div>
  </div>
</div>

<!-- 审核需水上报弹窗(详情 + 审核结果 + 审核意见) -->
<div class="ov" id="audit-ov">
  <div class="modal modal-md" role="dialog" aria-label="审核需水上报">
    <button type="button" class="modal-x" data-close="audit-ov" aria-label="关闭">
      <svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true">
        <path d="M1.5 1.5l11 11M12.5 1.5l-11 11" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
      </svg>
    </button>
    <div class="modal-hd">
      <div>审核需水上报</div>
    </div>
    <div class="modal-bd">
      <div class="kv-list" id="audit-kv"></div>
      <div class="form-item">
        <label>审核结果 <i class="req">*</i></label>
        <div class="select-wrap">
          <input type="text" class="sel-input" id="f-audit-result" placeholder="请选择审核结果" autocomplete="off">
          <span class="chev"><svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M2.5 4.5L6 8l3.5-3.5" stroke="#bfbfbf" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
          <div class="sel-dd" id="audit-result-dd"></div>
        </div>
      </div>
      <div class="form-item" style="margin-bottom:0">
        <label>审核意见</label>
        <textarea class="ipt" id="f-audit-opinion" placeholder="请输入审核意见"></textarea>
      </div>
    </div>
    <div class="modal-ft">
      <button type="button" class="btn btn-default" id="btn-audit-cancel">取消</button>
      <button type="button" class="btn btn-primary" id="btn-audit-ok">
        <svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M2 6.2L4.8 9 10 3.4" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>提交审核结果
      </button>
    </div>
  </div>
</div>

<!-- 查看需水上报弹窗(只读详情) -->
<div class="ov" id="view-ov">
  <div class="modal modal-md" role="dialog" aria-label="查看需水上报">
    <button type="button" class="modal-x" data-close="view-ov" aria-label="关闭">
      <svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true">
        <path d="M1.5 1.5l11 11M12.5 1.5l-11 11" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
      </svg>
    </button>
    <div class="modal-hd">
      <div>查看需水上报</div>
    </div>
    <div class="modal-bd">
      <div class="kv-list" id="view-kv"></div>
    </div>
    <div class="modal-ft">
      <button type="button" class="btn btn-default" id="btn-view-close">关闭</button>
    </div>
  </div>
</div>

<!-- 编制调度指令弹窗(关联用水计划/需水申请,自动带出用水户计划用量) -->
<div class="ov" id="plan-ov">
  <div class="modal modal-lg" role="dialog" aria-label="编制调度指令">
    <button type="button" class="modal-x" data-close="plan-ov" aria-label="关闭">
      <svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true">

            <span class="chev"><svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M2.5 4.5L6 8l3.5-3.5" stroke="#bfbfbf" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></span>

            <span class="chev"><svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M2.5 4.5L6 8l3.5-3.5" stroke="#bfbfbf" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></span>

            <span class="chev"><svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M2.5 4.5L6 8l3.5-3.5" stroke="#bfbfbf" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></span>

<div class="ov" id="confirm-ov">

<!-- 轻提示 -->
<div class="toast" id="toast"></div>

<script>
(function () {
  'use strict';

  /* ===================== 接口层 =====================
   * 本页数据全部来自后端接口(/hltgq-site/water-demand/*,经 dev-proxy 代理);
   * 字典/闸口/用水户下拉均由接口返回,前端不写死;
   * 写操作失败时优先展示后端应答 message 文案(见文档 0.2)。
   * ===================================================== */

  var API_BASE = '/hltgq-site';

  /**
   * 统一请求封装:method 方法;url 路径(可带 query);body 请求体(可空);cb(err, data) 回调。
   * 401 提示重新登录;其余非 2xx 直接上屏后端 message。
   */
  function api(method, url, body, cb) {
    var opts = { method: method, headers: {} };
    if (body != null) {
      opts.headers['Content-Type'] = 'application/json';
      opts.body = JSON.stringify(body);
    }
    fetch(API_BASE + url, opts).then(function (res) {
      return res.json().catch(function () { return {}; }).then(function (data) {
        if (res.status === 401) { toast(data.message || '未登录或会话已过期'); cb(new Error('unauthorized')); return; }
        if (!res.ok) { toast(data.message || ('请求失败(' + res.status + ')')); cb(new Error(data.message || String(res.status))); return; }
        cb(null, data);
      });
    }, function () {
      /* 仅收拢 fetch 自身的网络故障;业务回调(渲染等)内的异常不再吞掉,直接冒泡到控制台便于排查 */
      toast('网络异常，请稍后重试');
      cb(new Error('network'));
    });
  }

  /* 下拉/字典数据源(初始化时自接口加载,前端不写死) */
  var USERS = [];      // 用水户 4.5 /water-demand/users: {id,name,userNo,irrigationArea}
  var GATES = [];      // 调度闸口(已选户按户收敛;未选户为全量计量池) 1.4 /water-user/gates、/water-user/meta
  var USAGES = [];     // 用途联想 4.1 /water-demand/meta
  var OWNERS = [];     // 调度负责人 5.1 /water-dispatch/meta owners: {id,name}(平台用户;与调度指令模块同源)
  var PLANS = [];      // 已生效计划 5.5 /water-dispatch/plans(选中用水户后带配额字段)
  var APPLIES = [];    // 已通过需水 5.6 /water-dispatch/demands
  var PRICE_CACHE = {}; // 户水价缓存(审核弹窗展示,来源 /water-user/detail)

  /** 审核结果选项(审核弹窗;action 与 4.9 接口参数同码) */
  var AUDIT_RESULTS = [
    { value: 'pass', label: '通过' },
    { value: 'reject', label: '驳回' }
  ];

  /* 需水上报列表由服务端分页提供(见 loadList);水价按户异步查询(见 PRICE_CACHE) */

  /** 审核状态 → 文案与徽标样式 */
  var STATUS_META = {
    wait: { text: '待审核', cls: 'wait' },
    pass: { text: '已通过', cls: 'pass' },
    reject: { text: '已驳回', cls: 'reject' }
  };

  /* ===================== 基础工具 ===================== */
  var $ = function (id) { return document.getElementById(id); };

  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  var toastEl = $('toast');
  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toast._t);
    toast._t = setTimeout(function () { toastEl.classList.remove('show'); }, 1800);
  }

  /** 数字展示:保留最多 2 位小数并去除末尾多余的 0(如 1.7999999 → 1.8) */
  function fmtAmount(n) {
    var v = Number(n);
    if (!isFinite(v)) return String(n);
    return String(Math.round(v * 100) / 100);
  }

  function pad2(n) { return (n < 10 ? '0' : '') + n; }

  /** 今天的 'yyyy-MM-dd' */
  function todayStr() {
    var d = new Date();
    return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
  }

  /** 当前时间 'yyyy-MM-ddTHH:mm'(datetime-local) */
  function nowInputStr() {
    var d = new Date();
    return todayStr() + 'T' + pad2(d.getHours()) + ':' + pad2(d.getMinutes());
  }

  /* ===================== 用水时间(年/月 + 旬多选) ===================== */

  /** 旬编码 → 中文名(顺序即展示顺序) */
  var XUN_NAMES = { '1': '上旬', '2': '中旬', '3': '下旬' };

  /** 年下拉:当年-2 ~ 当年+1 */
  function fillYearOptions(selected) {
    var y = new Date().getFullYear();
    var html = '';
    for (var i = y - 2; i <= y + 1; i++) {
      html += '<option value="' + i + '"' + (i === selected ? ' selected' : '') + '>' + i + ' 年</option>';
    }
    $('f-year').innerHTML = html;
  }

  /** 月下拉:1~12 */
  function fillMonthOptions(selected) {
    var html = '';
    for (var m = 1; m <= 12; m++) {
      html += '<option value="' + m + '"' + (m === selected ? ' selected' : '') + '>' + m + ' 月</option>';
    }
    $('f-month').innerHTML = html;
  }

  /** 勾选旬(编码数组,兼容中文名) */
  function setXun(values) {
    var picked = {};
    (values || []).forEach(function (v) { picked[String(v)] = true; });
    Array.prototype.forEach.call($('f-xun-group').querySelectorAll('input'), function (el) {
      el.checked = !!picked[el.value];
    });
  }

  /** 当前勾选的旬编码(升序) */
  function pickedXuns() {
    var out = [];
    Array.prototype.forEach.call($('f-xun-group').querySelectorAll('input'), function (el) {
      if (el.checked) out.push(Number(el.value));
    });
    return out.sort();
  }

  /** 旬首末日:上旬 1~10 / 中旬 11~20 / 下旬 21~月末 */
  function xunRange(year, month, xun) {
    var lastDay = new Date(year, month, 0).getDate(); // month 为 1~12 时,第 0 天即当月最后一天
    if (xun === 1) return [1, 10];
    if (xun === 2) return [11, 20];
    return [21, lastDay];
  }

  function fmtDate(d) {
    return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
  }

  /** 默认旬:按今天落在哪一旬(新增时保持旧版「默认今天」的习惯) */
  function currentXun() {
    var day = new Date().getDate();
    return day <= 10 ? 1 : (day <= 20 ? 2 : 3);
  }

  /** 旬勾选变化:同步标签高亮 + 自动带出用水时段(最早旬首日 ~ 最晚旬末日) */
  function syncPeriod() {
    Array.prototype.forEach.call($('f-xun-group').querySelectorAll('input'), function (el) {
      el.parentNode.classList.toggle('checked', el.checked);
    });
    var tip = $('period-tip');
    var xuns = pickedXuns();
    if (!xuns.length) {
      tip.textContent = '请选择旬，选择后自动带出用水时段';
      return;
    }
    var year = Number($('f-year').value);
    var month = Number($('f-month').value);
    var labels = [];
    var start = null;
    var end = null;
    xuns.forEach(function (xun) {
      var range = xunRange(year, month, xun);
      var s = new Date(year, month - 1, range[0]);
      var e = new Date(year, month - 1, range[1]);
      if (!start || s < start) start = s;
      if (!end || e > end) end = e;
      labels.push(XUN_NAMES[String(xun)]);
    });
    tip.innerHTML = '用水时段：<strong>' + fmtDate(start) + ' 至 ' + fmtDate(end) + '</strong>（' + labels.join('、') + '）';
  }

  /** 行数据用水时间展示:年 + 月 + 旬(可多选) + 派生时段;旧数据无旬列时只显示时段 */
  function periodText(row) {
    var range = (row.startDate || '-') + ' 至 ' + (row.endDate || '-');
    if (!row.periodYear || !row.periodMonth) return range;
    return row.periodYear + '年' + row.periodMonth + '月'
      + (row.xunText ? ' ' + row.xunText : '') + '（' + range + '）';
  }

  /** 按 id 从当前页行数据中找(操作列/弹窗用) */
  function findRow(id) {
    for (var i = 0; i < S.rows.length; i++) {
      if (S.rows[i].id === id) return S.rows[i];
    }
    return null;
  }

  /** 用水户下拉回填文案:名称（户号) */
  function userLabel(u) { return u.name + '（' + u.userNo + '）'; }
  /** 行数据回填文案:名称（户号) */
  function rowUserLabel(r) { return (r.waterUserName || '-') + (r.waterUserNo ? '（' + r.waterUserNo + '）' : ''); }

  /** 水价(元/m³):按户异步查 /water-user/detail,前端缓存 */
  function loadPrice(userId, cb) {
    if (!userId) { cb('—'); return; }
    if (PRICE_CACHE[userId] != null) { cb(PRICE_CACHE[userId]); return; }
    api('GET', '/water-user/detail?id=' + encodeURIComponent(userId), null, function (err, d) {
      var txt = !err && d && d.waterPrice != null ? Number(d.waterPrice).toFixed(3) : '—';
      if (!err) PRICE_CACHE[userId] = txt;
      cb(txt);
    });
  }

  /** 设置搜索下拉的值:label 为展示文案,value 为真实值(存 dataset) */
  function setSel(id, label, value) {
    var el = $(id);
    el.value = label || '';
    el.dataset.value = value || '';
  }

  /* ===================== 列表状态与渲染 ===================== */
  /** 列表状态:筛选/分页参数 + 最近一次服务端响应(0.1 分页结构) */
  var S = { tab: '', kw: '', page: 1, size: 10, total: 0, pages: 1, rows: [] };

  /** 拉取列表(服务端筛选+分页,4.3) */
  var listSeq = 0;
  function loadList() {
    var seq = ++listSeq;
    var q = '?page=' + S.page + '&size=' + S.size;
    if (S.kw) q += '&keyword=' + encodeURIComponent(S.kw);
    if (S.tab) q += '&status=' + encodeURIComponent(S.tab);
    api('GET', '/water-demand/page' + q, null, function (err, data) {
      if (err || seq !== listSeq) return;
      S.total = data.total || 0;
      S.pages = Math.max(1, data.pages || 1);
      S.rows = data.records || [];
      if (S.page > S.pages) { S.page = S.pages; loadList(); return; }
      renderRows(S.rows);
      renderPager();
    });
  }

  /** 拉取 Tab 角标统计(4.2,无状态筛选全量) */
  function loadStats() {
    api('GET', '/water-demand/stats', null, function (err, data) {
      if (err || !data) return;
      $('tab-num-all').textContent = data.total;
      $('tab-num-wait').textContent = data.wait;
      $('tab-num-pass').textContent = data.pass;
      $('tab-num-reject').textContent = data.reject;
    });
  }

  /** 操作列:全状态可查看;待审核→审核/编辑/删除;已通过→编制指令/编辑/删除;已驳回→编辑/删除 */
  function actionCell(row) {
    var id = esc(row.id);
    // 查看为只读操作,所有状态均可用
    var html = '<span class="act" data-action="view" data-id="' + id + '">查看</span>';
    if (row.status === 'wait') {
      html += '<span class="act" data-action="audit" data-id="' + id + '">审核</span>';
    }
    if (row.status === 'pass') {
      html += '<span class="act" data-action="plan" data-id="' + id + '">编制指令</span>';
    }
    if (row.status !== 'pass') {
      html += '<span class="act" data-action="edit" data-id="' + id + '">编辑</span>';
    }
    html += '<span class="act del" data-action="delete" data-id="' + id + '">删除</span>';
    return '<td>' + html + '</td>';
  }

  /** 审核状态列:徽标 */
  function statusCell(row) {
    var meta = STATUS_META[row.status] || { text: row.status, cls: '' };
    return '<td><span class="st-tag ' + meta.cls + '">' + esc(meta.text) + '</span></td>';
  }

  /** 审核意见列(独立列;无意见显示 -) */
  function opinionCell(row) {
    return '<td>' + esc(row.auditOpinion || '-') + '</td>';
  }

  /** 用水时间列:年月 + 旬 + 派生时段(旧数据无旬列时只显示时段) */
  function periodCell(r) {
    var html = '';
    if (r.periodYear && r.periodMonth) {
      html += '<span class="cell-main">' + esc(r.periodYear) + '年' + esc(r.periodMonth) + '月'
        + (r.xunText ? ' ' + esc(r.xunText) : '') + '</span>';
    }
    html += '<span class="cell-range">' + esc(r.startDate) + ' 至 ' + esc(r.endDate) + '</span>';
    return '<td>' + html + '</td>';
  }

  function renderRows(records) {
    if (!records.length) {
      $('tbl-body').innerHTML = '<tr><td colspan="9" class="empty-cell">暂无数据</td></tr>';
      return;
    }
    $('tbl-body').innerHTML = records.map(function (r) {
      return '<tr>'
        + '<td><span class="cell-main">' + esc(r.demandNo) + '</span></td>'
        + '<td>' + esc(r.applyTime || '-') + '</td>'
        + '<td>' + esc(r.waterUserName || '-') + '</td>'
        + '<td><span class="amt">' + esc(fmtAmount(r.amount)) + '<span class="unit">万m³</span></span></td>'
        + periodCell(r)
        + '<td>' + esc(r.usage || '-') + '</td>'
        + statusCell(r)
        + opinionCell(r)
        + actionCell(r)
        + '</tr>';
    }).join('');
  }

  /** 页码序列:总页数 ≤7 全展示,否则首尾 + 当前±1 + 省略号 */
  function pageNumbers(cur, total) {
    if (total <= 7) {
      var all = [];
      for (var i = 1; i <= total; i++) all.push(i);
      return all;
    }
    var out = [1];
    var start = Math.max(2, cur - 1);
    var end = Math.min(total - 1, cur + 1);
    if (start > 2) out.push('...');
    for (var p = start; p <= end; p++) out.push(p);
    if (end < total - 1) out.push('...');
    out.push(total);
    return out;
  }

  function renderPager() {
    var totalPages = S.pages;
    var sizes = [10, 20, 50];
    var html = '<span class="pg-info">共 ' + S.total + ' 条</span><div class="pg-btns">'
      + '<button class="pg-btn" data-pg="prev"' + (S.page <= 1 ? ' disabled' : '') + '>‹</button>';
    pageNumbers(S.page, totalPages).forEach(function (p) {
      html += p === '...'
        ? '<span class="pg-ellipsis">···</span>'
        : '<button class="pg-btn' + (p === S.page ? ' active' : '') + '" data-pg="' + p + '">' + p + '</button>';
    });
    html += '<button class="pg-btn" data-pg="next"' + (S.page >= totalPages ? ' disabled' : '') + '>›</button></div>'
      + '<select class="pg-size" id="pg-size">'
      + sizes.map(function (n) { return '<option value="' + n + '"' + (n === S.size ? ' selected' : '') + '>' + n + ' 条/页</option>'; }).join('')
      + '</select>'
      + '<span class="pg-jump">跳至<input type="text" id="pg-jump" inputmode="numeric" aria-label="跳至页码" value="' + S.page + '" autocomplete="off">页</span>';
    $('pg-bar').innerHTML = html;
  }

  /** 列表整体刷新:列表(服务端筛选/分页) + 角标统计 */
  function renderAll() {
    loadList();
    loadStats();
  }

  /** 跳转到指定页(越界收敛,非法值还原) */
  function jumpToPage(val) {
    var n = parseInt(String(val).trim(), 10);
    var target = isNaN(n) ? S.page : Math.min(S.pages, Math.max(1, n));
    var box = $('pg-jump');
    if (box) box.value = String(target);
    if (target === S.page) return;
    S.page = target;
    renderAll();
  }

  /* ===================== 下拉(统一支持输入模糊搜索) ===================== */
  var openDd = null; // 当前展开的面板

  function closeDd() {
    if (openDd) { openDd.classList.remove('open'); openDd = null; }
  }

  // 点击下拉之外区域收起面板
  document.addEventListener('click', function (e) {
    if (!e.target.closest('.select-wrap')) closeDd();
  });

  function openDdPanel(dd) {
    if (openDd === dd) { closeDd(); return; }
    if (openDd) openDd.classList.remove('open');
    dd.classList.add('open');
    openDd = dd;
  }

  /**
   * 可搜索下拉(全页面统一):
   * 点击展开全量(当前项高亮),输入关键字实时过滤,点选项回填并记录 dataset.value
   */
  function bindSearchSelect(inputId, ddId, optionsFn, emptyText, onPick) {
    var input = $(inputId);
    var dd = $(ddId);
    function renderDd(kw) {
      var lk = kw.toLowerCase();
      var opts = optionsFn().filter(function (o) { return !lk || o.label.toLowerCase().indexOf(lk) >= 0; });
      dd.innerHTML = opts.length
        ? opts.map(function (o) {
            return '<div class="dd-opt' + (input.dataset.value === o.value ? ' active' : '') + '" data-value="' + esc(o.value) + '">' + esc(o.label) + '</div>';
          }).join('')
        : '<div class="dd-empty">' + esc(emptyText || '无匹配项') + '</div>';
    }
    input.addEventListener('click', function () {
      if (openDd === dd) { closeDd(); return; }
      // 已选中值,或输入文本正好命中某选项文案(如回填/选中「不关联」类空值选项)时展开全量;手输关键字才过滤
      var kw = input.value.trim();
      var hitLabel = optionsFn().some(function (o) { return String(o.label) === kw; });
      renderDd((input.dataset.value || hitLabel) ? '' : kw);
      openDdPanel(dd);
    });
    input.addEventListener('input', function () {
      input.dataset.value = ''; // 手动编辑后原选中失效,需重新选择
      renderDd(input.value.trim());
      if (openDd !== dd) openDdPanel(dd);
    });
    dd.addEventListener('click', function (e) {
      var opt = e.target.closest('.dd-opt');
      if (!opt) return;
      input.value = opt.textContent;
      input.dataset.value = opt.dataset.value || '';
      closeDd();
      if (onPick) onPick(input.dataset.value);
    });
  }

  /* 各下拉选项数据源(数据均来自接口,不写死) */
  function userOptions() { return USERS.map(function (u) { return { value: u.id, label: userLabel(u) }; }); }
  /** 闸口候选:仅当前所选用水户的关联闸口组(1.4 收敛;与 5.8 保存校验同口径,不用 1.1 全量池) */
  function gateOptions() { return GATES.map(function (g) { return { value: g.id, label: g.name }; }); }
  function findGate(id) {
    for (var i = 0; i < GATES.length; i++) { if (GATES[i].id === id) return GATES[i]; }
    return null;
  }
  function usageOptions() { return USAGES.map(function (u) { return { value: u, label: u }; }); }
  /** 负责人候选:平台用户(5.1 owners),value=用户 id、label=姓名 */
  function ownerOptions() { return OWNERS.map(function (o) { return { value: o.id, label: o.name }; }); }
  function ownerNameOf(id) {
    for (var i = 0; i < OWNERS.length; i++) { if (OWNERS[i].id === id) return OWNERS[i].name; }
    return '';
  }
  /** 关联用水计划下拉:首项「不关联」(与调度指令页同口径;选中后提交不传 planId) */
  var NO_PLAN_LABEL = '— 不关联用水计划 —';
  function planOptions() {
    return [{ value: '', label: NO_PLAN_LABEL }].concat(PLANS.map(function (p) {
      return { value: p.id, label: p.planNo + ' · ' + p.planName };
    }));
  }
  /** 关联需水申请:仅已通过的上报单可选(4.6,选中用水户后按户过滤) */
  function applyOptions() {
    return APPLIES.map(function (r) {
      return { value: r.id, label: r.demandNo + ' · ' + (r.waterUserName || '') + ' · ' + fmtAmount(r.amount) + '万m³' };
    });
  }
  function findApply(id) {
    for (var i = 0; i < APPLIES.length; i++) { if (APPLIES[i].id === id) return APPLIES[i]; }
    return null;
  }

  /* ===================== 弹窗开合 ===================== */
  function openModal(id) { closeDd(); $(id).classList.add('show'); }
  function closeModal(id) { $(id).classList.remove('show'); closeDd(); }

  // 右上角 X 统一关闭
  Array.prototype.forEach.call(document.querySelectorAll('.modal-x'), function (btn) {
    btn.addEventListener('click', function () { closeModal(btn.dataset.close); });
  });

  /* ===================== 新增/编辑弹窗 ===================== */
  var formState = { mode: 'add', id: null };

  function openFormModal(mode, row) {
    formState.mode = mode;
    formState.id = row ? row.id : null;
    $('form-title').textContent = mode === 'add' ? '新增需水上报' : '编辑需水上报';

    // 默认值:用水时间取当前年月与今天所在旬,其余清空
    var now = new Date();
    setSel('f-farmer', '', '');
    $('f-amount').value = '';
    setSel('f-usage', '', '');
    fillYearOptions(now.getFullYear());
    fillMonthOptions(now.getMonth() + 1);
    setXun([String(currentXun())]);
    $('f-remark').value = '';

    if (mode === 'edit' && row) {
      setSel('f-farmer', rowUserLabel(row), row.waterUserId);
      $('f-amount').value = fmtAmount(row.amount);
      setSel('f-usage', row.usage || '', row.usage || '');
      fillYearOptions(row.periodYear || now.getFullYear());
      fillMonthOptions(row.periodMonth || (now.getMonth() + 1));
      setXun(row.xunList && row.xunList.length ? row.xunList : []);
      $('f-remark').value = row.remark || '';
    }
    syncPeriod();
    openModal('form-ov');
  }

  $('btn-form-cancel').addEventListener('click', function () { closeModal('form-ov'); });

  $('btn-form-save').addEventListener('click', function () {
    var waterUserId = $('f-farmer').dataset.value;
    var amount = $('f-amount').value.trim();
    var year = Number($('f-year').value);
    var month = Number($('f-month').value);
    var xuns = pickedXuns();
    if (!waterUserId) { toast('请选择「用水户」'); return; }
    if (!amount || !(Number(amount) > 0)) { toast('请填写「计划水量」(大于 0)'); return; }
    if (!year) { toast('请选择「用水年份」'); return; }
    if (!month) { toast('请选择「用水月份」'); return; }
    if (!xuns.length) { toast('请至少选择一个旬'); return; }

    // 0.3:数量按万m³提交,前端收敛 ≤2 位小数;起止日期由后端按旬派生
    var payload = {
      waterUserId: waterUserId,
      amount: Number(Number(amount).toFixed(2)),
      periodYear: year,
      periodMonth: month,
      xunList: xuns.map(String)
    };
    if ($('f-usage').value.trim()) payload.usage = $('f-usage').value.trim();
    if ($('f-remark').value.trim()) payload.remark = $('f-remark').value.trim();

    var isAdd = formState.mode === 'add';
    var url = isAdd ? '/water-demand/create' : '/water-demand/update?id=' + encodeURIComponent(formState.id);
    var btn = this;
    btn.disabled = true;
    api(isAdd ? 'POST' : 'PUT', url, payload, function (err) {
      btn.disabled = false;
      if (err) return; // 失败文案 api() 已上屏(0.2)
      closeModal('form-ov');
      toast(isAdd ? '新增成功' : '保存成功');
      S.page = 1; // 保存后回第一页,便于看到最新数据
      renderAll();
    });
  });

  /* ===================== 审核弹窗 ===================== */
  var auditId = null;
  var lastDefaultOpinion = ''; // 上次自动填充的意见,用于判断是否可被新的默认值覆盖

  function kvRow(k, v) {
    return '<div class="kv-row"><span class="k">' + esc(k) + '</span><span class="v">' + esc(v) + '</span></div>';
  }

  /** 审核弹窗信息区(水价异步回填,见 openAuditModal) */
  function auditKvHtml(row, priceText) {
    return [
      kvRow('用水户', row.waterUserName || '-'),
      kvRow('计划水量', fmtAmount(row.amount) + ' 万m³'),
      kvRow('用水时间', periodText(row)),

  function openAuditModal(row) {
    auditId = row.id;

  }

  /** 切换审核结果时:意见为空或仍是上次自动填充值时,替换为对应默认意见 */
  function onAuditResultPick(val) {
    var def = val === 'pass' ? '同意，按灌区水量调度计划执行' : '申请水量超出计划余额，请核减后重新申报';
    var ta = $('f-audit-opinion');
    if (!ta.value.trim() || ta.value.trim() === lastDefaultOpinion) ta.value = def;
    lastDefaultOpinion = def;
  }

  $('btn-audit-cancel').addEventListener('click', function () { closeModal('audit-ov'); });

  $('btn-audit-ok').addEventListener('click', function () {
    var result = $('f-audit-result').dataset.value;
    var opinion = $('f-audit-opinion').value.trim();
    if (!result) { toast('请选择「审核结果」'); return; }
    if (result === 'reject' && !opinion) { toast('请填写驳回意见'); return; } // 4.9:reject 必填意见
    // 4.9:query 参数提交(id/action/opinion)
    var url = '/water-demand/audit?id=' + encodeURIComponent(auditId)
      + '&action=' + encodeURIComponent(result)
      + '&opinion=' + encodeURIComponent(opinion);
    var btn = this;
    btn.disabled = true;
    api('POST', url, null, function (err) {
      btn.disabled = false;
      if (err) return;
      closeModal('audit-ov');
      renderAll();
      toast('审核结果已提交');
    });
  });

  /* ===================== 查看弹窗(只读详情,复用审核弹窗 KV 样式) ===================== */
  var viewId = null;

  /** 查看弹窗信息区(含审核状态与意见;水价异步回填,见 openViewModal) */
  function viewKvHtml(row, priceText) {
    var meta = STATUS_META[row.status] || { text: row.status };
    return [
      kvRow('用水户', row.waterUserName || '-'),
      kvRow('计划水量', fmtAmount(row.amount) + ' 万m³'),

  function openViewModal(row) {

    $('view-kv').innerHTML = viewKvHtml(row, '查询中…');
    // 水价按户异步查询(/water-user/detail),弹窗未切换时回填
    loadPrice(row.waterUserId, function (priceText) {

      $('view-kv').innerHTML = viewKvHtml(row, priceText + ' 元/m³');
    });
    openModal('view-ov');
  }

  $('btn-view-close').addEventListener('click', function () { closeModal('view-ov'); });

  /* ===================== 编制指令弹窗(提交 /water-dispatch/create,5.7) ===================== */

  /** 关联需水申请下拉文案:XS0016 · 县工业园区管委会 · 4.1万m³ */
  function applyLabelOf(r) {
    return r.demandNo + ' · ' + (r.waterUserName || '') + ' · ' + fmtAmount(r.amount) + '万m³';
  }

  /** 配额数据源联动:按户刷新「已生效计划」与「已通过需水」下拉(5.5/5.6) */
  var quotaSeq = 0;
  function loadPlansAndApplies(userId, cb) {
    var seq = ++quotaSeq;
    PLANS = [];
    APPLIES = [];
    updatePlanTip();
    if (!userId) { if (cb) cb(); return; }
    var left = 2;
    function tryDone() {
      if (seq !== quotaSeq || --left > 0) return;
      updatePlanTip();
      if (cb) cb();
    }
    api('GET', '/water-dispatch/plans?userId=' + encodeURIComponent(userId), null, function (err, arr) {
      if (seq === quotaSeq && !err) PLANS = arr || [];
      tryDone();
    });
    api('GET', '/water-dispatch/demands?userId=' + encodeURIComponent(userId), null, function (err, arr) {
      if (seq === quotaSeq && !err) APPLIES = arr || [];
      tryDone();
    });
  }

  /**
   * 调度闸口下拉:已选用水户=该户关联闸口组(1.4 收敛);
   * 未选户=全量可计量闸口池(/water-user/meta gates,渠道量水点/闸站)。
   */
  var gateSeq = 0;
  function loadFormGates(userId, cb) {
    var seq = ++gateSeq;
    var url = userId ? '/water-user/gates?userId=' + encodeURIComponent(userId) : '/water-user/meta';
    api('GET', url, null, function (err, d) {
      if (seq !== gateSeq) return;
      var list = err ? [] : (userId ? d : (d && d.gates));
      GATES = Array.isArray(list) ? list : [];
      if (!err && userId && !GATES.length) toast('该用水户未配置关联闸口，请先配置');
      if (cb) cb();
    });
  }

  /** 按需水申请带出用水户/放水量/执行时间,并按户刷新配额下拉与闸口下拉 */
  function fillPlanByApply(row) {
    setSel('f-plan', '', '');
    setSel('f-p-farmer', rowUserLabel(row), row.waterUserId);
    setSel('f-p-gate', '', '');
    $('f-p-amount').value = fmtAmount(row.amount);
    // 需水上报按旬申报,自动带出旬首日 08:00 作为执行时间(可再改)
    if (row.startDate) $('f-p-exec').value = row.startDate + 'T08:00';
    loadPlansAndApplies(row.waterUserId);
    // 申报闸口落在该户闸口组内才回填,否则留空要求重选(避免带着非法值提交后被 5.8 拦)
    loadFormGates(row.waterUserId, function () {
      var g = row.gateId ? findGate(row.gateId) : null;
      if (g) setSel('f-p-gate', row.gateName || g.name, g.id);
    });
  }

  /** 选中用水计划后展示该用水户的配额提示条(5.5:userPlanWater/userScheduledQty,单位 m³) */
  function updatePlanTip() {
    var planId = $('f-plan').dataset.value;
    var userId = $('f-p-farmer').dataset.value;
    var plan = null;
    PLANS.forEach(function (p) { if (p.id === planId) plan = p; });
    var tip = $('plan-tip');
    if (!plan || !userId || plan.userPlanWater == null) { tip.classList.remove('show'); return; }
    var remain = Math.max(0, (plan.userPlanWater - (plan.userScheduledQty || 0)) / 10000);
    $('plan-tip-text').textContent = '本计划中该用水户计划用水量：' + fmtAmount(plan.userPlanWater / 10000)
      + ' 万m³ · 已下达调度 ' + fmtAmount((plan.userScheduledQty || 0) / 10000)
      + ' 万m³ · 剩余可下达 ' + fmtAmount(remain) + ' 万m³';
    tip.classList.add('show');
  }

  /** 手动更换弹窗内用水户:刷新下拉,且已选需水单不属于新户时清空(5.7 一致性);清空户则恢复全量闸口池 */
  function onPlanFarmerPick(userId) {
    setSel('f-plan', '', '');
    setSel('f-p-gate', '', ''); // 换户:闸口候选按新户收敛,原选择作废重选
    loadFormGates(userId);
    loadPlansAndApplies(userId, function () {
      var sel = $('f-apply').dataset.value;
      if (sel && !findApply(sel)) {
        setSel('f-apply', '', '');
        $('f-p-amount').value = '';
        $('f-p-exec').value = '';
      }
    });
  }

  function openPlanModal(row) {
    // 关联需水申请默认选中当前上报单,并带出用水户/闸口/放水量/执行时间
    setSel('f-plan', '', '');
    setSel('f-p-gate', '', '');
    $('plan-tip').classList.remove('show');
    setSel('f-apply', applyLabelOf(row), row.id);
    setSel('f-p-owner', '', '');
    $('f-p-exec').value = '';
    $('f-p-height').value = '';
    $('f-p-remark').value = '';
    fillPlanByApply(row);
    if (!$('f-p-exec').value) $('f-p-exec').value = nowInputStr();
    openModal('plan-ov');
  }

  $('btn-plan-cancel').addEventListener('click', function () { closeModal('plan-ov'); });

  $('btn-plan-ok').addEventListener('click', function () {
    var userId = $('f-p-farmer').dataset.value;
    if (!$('f-p-gate').dataset.value) { toast('请选择「调度闸口」'); return; }
    var amount = $('f-p-amount').value.trim();
    if (amount && !(Number(amount) > 0)) { toast('「计划放水量」须大于 0'); return; }
    var exec = $('f-p-exec').value;
    if (!exec) { toast('请选择「执行时间」'); return; }
    var heightRaw = $('f-p-height').value.trim();
    var height = null;
    if (heightRaw !== '') {
      height = Number(heightRaw);
      if (!(height >= 0 && height <= 999)) { toast('「指定闸门高度」须在 0~999 cm 之间'); return; }
      if (Math.floor(height) !== height) { toast('「指定闸门高度」须为整数'); return; }
    }

    var payload = {
      gateId: $('f-p-gate').dataset.value,
      execTime: exec
    };
    if (userId) payload.waterUserId = userId;
    if (amount) payload.planAmount = Number(Number(amount).toFixed(2)); // 万m³,≤2 位小数(0.3)
    if (height != null) payload.gateHeightCm = height;
    if ($('f-plan').dataset.value) payload.planId = $('f-plan').dataset.value;
    if ($('f-apply').dataset.value) payload.demandId = $('f-apply').dataset.value;
    // 负责人:下拉选中传 id(后端按 id 回查固化姓名快照,不信任文本);仅手填时按文本入库
    var ownerId = $('f-p-owner').dataset.value;
    var ownerText = $('f-p-owner').value.trim();
    if (ownerId) {
      payload.ownerUserId = ownerId;
      payload.owner = ownerNameOf(ownerId) || ownerText;
    } else if (ownerText) {
      payload.owner = ownerText;
    }
    if ($('f-p-remark').value.trim()) payload.remark = $('f-p-remark').value.trim();

    var btn = this;
    btn.disabled = true;
    api('POST', '/water-dispatch/create', payload, function (err) {
      btn.disabled = false;
      if (err) return;
      closeModal('plan-ov');
      toast('调度指令已编制');
      renderAll();
    });
  });

  // 分页:翻页 / 每页条数 / 跳页
  $('pg-bar').addEventListener('click', function (e) {
    var btn = e.target.closest('[data-pg]');
    if (!btn || btn.disabled) return;
    var v = btn.dataset.pg;
    if (v === 'prev') S.page = Math.max(1, S.page - 1);
    else if (v === 'next') S.page = Math.min(S.pages, S.page + 1);
    else S.page = Number(v);
    renderAll();
  });
  $('pg-bar').addEventListener('change', function (e) {
    if (e.target.id !== 'pg-size') return;
    S.size = Number(e.target.value) || 10;
    S.page = 1;
    renderAll();
  });
  $('pg-bar').addEventListener('keydown', function (e) {
    if (e.target.id === 'pg-jump' && e.key === 'Enter') jumpToPage(e.target.value);
  });
  $('pg-bar').addEventListener('blur', function (e) {
    if (e.target.id === 'pg-jump') jumpToPage(e.target.value);
  }, true);

  // 表格操作:查看 / 审核 / 编制指令 / 编辑 / 删除
  $('tbl-body').addEventListener('click', function (e) {
    var el = e.target.closest('.act');
    if (!el) return;
    var row = findRow(el.dataset.id);
    if (!row) return;
    var action = el.dataset.action;
    if (action === 'view') openViewModal(row);
    else if (action === 'audit') openAuditModal(row);
    else if (action === 'plan') openPlanModal(row);
    else if (action === 'edit') {
      if (row.status === 'pass') { toast('已通过的上报单不可编辑'); return; }
      openFormModal('edit', row);
    } else if (action === 'delete') askDelete(row);
  });

  /* ===================== 初始化:并行拉取字典/下拉(接口) + 首屏 ===================== */
  bindSearchSelect('f-farmer', 'farmer-dd', userOptions, '无匹配用水户');
  bindSearchSelect('f-usage', 'usage-dd', usageOptions, '无匹配用途');
  bindSearchSelect('f-audit-result', 'audit-result-dd', function () { return AUDIT_RESULTS; }, '无匹配项', onAuditResultPick);
  bindSearchSelect('f-plan', 'plan-dd', planOptions, '无匹配计划', updatePlanTip);
  bindSearchSelect('f-apply', 'apply-dd', applyOptions, '无匹配申请', function (val) {
    var row = findApply(val);
    if (row) fillPlanByApply(row);
  });
  bindSearchSelect('f-p-farmer', 'p-farmer-dd', userOptions, '无匹配用水户', onPlanFarmerPick);
  bindSearchSelect('f-p-gate', 'p-gate-dd', gateOptions, '请选择调度闸口(已选户仅限该户关联闸口组)');
  bindSearchSelect('f-p-owner', 'p-owner-dd', ownerOptions, '无匹配负责人');

  // 用水时间:年/月/旬变更后自动带出用水时段
  $('f-year').addEventListener('change', syncPeriod);
  $('f-month').addEventListener('change', syncPeriod);
  $('f-xun-group').addEventListener('change', syncPeriod);

  // 4.1 表单元数据(用途联想)
  api('GET', '/water-demand/meta', null, function (err, d) {
    if (!err && d) USAGES = d.usages || [];
  });
  // 4.5 用水户下拉(仅正常状态)
  api('GET', '/water-demand/users', null, function (err, d) {
    if (!err) USERS = Array.isArray(d) ? d : [];
  });
  // 5.1 调度负责人候选(平台用户;与调度指令模块同源同口径)
  api('GET', '/water-dispatch/meta', null, function (err, d) {
    if (!err && d) OWNERS = d.owners || [];
  });
  // 调度闸口:已选户按户收敛,未选户拉全量计量闸口池(见 loadFormGates)

  renderAll();
})();
</script>
<script src="./lib/date-placeholder.js"></script>
</body>
</html>
