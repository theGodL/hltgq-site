<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>水位数据</title>
<script src="/hltgq-site/lib/xlsx.full.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:#f0f2f5;color:#333;font-size:14px}
.page-wrap{min-height:100vh;display:flex;flex-direction:column;padding:16px}
.breadcrumb{color:#999;margin-bottom:12px;font-size:13px}
.breadcrumb .sep{margin:0 6px}
.breadcrumb .cur{color:#333}
.card{flex:1;display:flex;flex-direction:column;background:#fff;border-radius:4px;box-shadow:0 1px 4px rgba(0,0,0,.08)}
.filter-bar{display:flex;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:16px;padding:16px 16px 0}
.filter-item{display:flex;align-items:center;gap:6px}
.filter-item label{color:#666;font-size:13px;white-space:nowrap}
.filter-bar select,.filter-bar input{height:32px;border:1px solid #d9d9d9;border-radius:4px;padding:0 10px;font-size:13px;outline:none;background:#fff;transition:border-color .2s}
.filter-bar select:focus,.filter-bar input:focus{border-color:#1677ff}
.filter-bar select{min-width:120px}
.filter-bar input[type=datetime-local]{width:178px}
.filter-actions{margin-left:auto;display:flex;gap:8px}
.btn{display:inline-flex;align-items:center;gap:5px;padding:0 15px;height:32px;border:1px solid transparent;border-radius:4px;cursor:pointer;font-size:13px;white-space:nowrap;transition:all .2s}
.btn-primary{background:#1677ff;color:#fff;border-color:#1677ff}
.btn-primary:hover{background:#4096ff;border-color:#4096ff}
.btn-default{background:#fff;color:#333;border-color:#d9d9d9}
.btn-default:hover{color:#1677ff;border-color:#1677ff}
.tbl-wrap{overflow-x:auto;padding:0 16px 16px;flex:1}
table{width:100%;border-collapse:collapse;font-size:13px}
thead tr{background:#fafafa}
th{padding:10px 12px;text-align:left;color:#595959;font-weight:500;border:1px solid #bfbfbf;white-space:nowrap}
td{padding:10px 12px;border:1px solid #c9c9c9;color:#333}
tbody tr:hover td{background:#fafafa}
.empty{text-align:center;color:#bbb;padding:40px;font-size:13px}
.acts{display:flex;gap:10px;align-items:center}
.act-btn{background:none;border:none;cursor:pointer;padding:2px 4px;border-radius:2px;font-size:13px;line-height:1;transition:opacity .2s}
.act-btn:hover{opacity:.7}
.act-edit{color:#1677ff}
.pg-bar{display:flex;align-items:center;justify-content:flex-end;padding:0 16px 12px;gap:4px}
.pg-info{color:#666;font-size:13px;margin-right:8px}
.pg-btn{min-width:28px;height:28px;padding:0 4px;border:1px solid #d9d9d9;background:#fff;border-radius:4px;cursor:pointer;font-size:13px;color:#333;transition:all .2s;display:inline-flex;align-items:center;justify-content:center}
.pg-btn:hover:not([disabled]):not(.active){border-color:#1677ff;color:#1677ff}
.pg-btn.active{background:#1677ff;border-color:#1677ff;color:#fff}
.pg-btn[disabled]{color:#d9d9d9;cursor:not-allowed}
.pg-ellipsis{padding:0 4px;color:#999;font-size:13px}
.pg-size{height:28px;border:1px solid #d9d9d9;border-radius:4px;padding:0 6px;font-size:13px;outline:none;background:#fff;margin-right:4px;cursor:pointer}
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:1000;align-items:center;justify-content:center}
.overlay.show{display:flex}
.modal{background:#fff;border-radius:8px;max-width:95vw;max-height:90vh;overflow-y:auto;box-shadow:0 8px 32px rgba(0,0,0,.15)}
.modal-hd{padding:14px 20px;border-bottom:1px solid #f0f0f0;display:flex;align-items:center;justify-content:space-between}
.modal-hd span{font-size:15px;font-weight:500}
.modal-close{background:none;border:none;cursor:pointer;color:#999;font-size:20px;line-height:1;padding:0 2px}
.modal-close:hover{color:#333}
.modal-bd{padding:20px}
.modal-ft{padding:12px 20px;border-top:1px solid #f0f0f0;display:flex;justify-content:flex-end;gap:8px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.f-item{display:flex;flex-direction:column;gap:4px}
.f-item label{color:#666;font-size:13px}
.f-item input{height:32px;border:1px solid #d9d9d9;border-radius:4px;padding:0 10px;font-size:13px;outline:none;width:100%;transition:border-color .2s}
.f-item input:focus{border-color:#1677ff}
.f-item input[readonly]{background:#f5f5f5;color:#999;cursor:not-allowed}
</style>
</head>
<body>
<div class="page-wrap">
  <div class="breadcrumb">
    <span>业务中心</span><span class="sep">/</span>
    <span class="cur">水利工程安全运行监测子系统</span>
  </div>

  <div class="card">
    <div class="filter-bar">
      <div class="filter-item">
        <label>站点：</label>
        <select id="river-stcd"><option value="">全部站点</option></select>
      </div>
      <div class="filter-item">
        <label>开始时间：</label>
        <input type="datetime-local" id="river-start">
      </div>
      <div class="filter-item">
        <label>结束时间：</label>
        <input type="datetime-local" id="river-end">
      </div>
      <div class="filter-actions">
        <button class="btn btn-primary" id="river-query-btn">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
          查询
        </button>
        <button class="btn btn-default" onclick="reset()">重置</button>
        <button class="btn btn-default" id="river-export-btn">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
          导出Excel
        </button>
      </div>
    </div>
    <div class="tbl-wrap">
      <table>
        <thead>
          <tr>
            <th>测站编码</th><th>测站名称</th><th>观测时间</th>
            <th>水位(m)</th><th>流量(m³/s)</th>
            <th>水流特征码</th><th>测点编号</th><th>操作</th>
          </tr>
        </thead>
        <tbody id="river-tbody"></tbody>
      </table>
    </div>
    <div class="pg-bar" id="river-pg"></div>
  </div>
</div>

<div class="overlay" id="edit-overlay">
  <div class="modal" style="width:540px">
    <div class="modal-hd"><span id="edit-title">编辑水位数据</span><button class="modal-close" data-close="edit-overlay">×</button></div>
    <div class="modal-bd"><div class="form-grid" id="edit-grid"></div></div>
    <div class="modal-ft">
      <button class="btn btn-default" data-close="edit-overlay">取消</button>
      <button class="btn btn-primary" id="edit-save-btn">保存</button>
    </div>
  </div>
</div>

<script>
// ===== 状态 =====
const S = {
  stations: [],
  riverRows: [],
  page: 1, size: 20, total: 0, mode: 'latest',
  editIdx: null,
};

// ===== 工具 =====
const $ = id => document.getElementById(id);
const fmtDt  = v => v ? String(v).replace('T',' ').slice(0,19) : '-';
// -9991 = 设备异常 → 展示 '--'；-999 = 设备不存在 → 不展示（空白）；null/undefined → '-'
const isErr = v => v !== null && v !== undefined && v !== '' && +v === -9991;
const isMissing = v => v !== null && v !== undefined && v !== '' && +v === -999;
const fmtN   = v => (v === null || v === undefined) ? '-' : (isMissing(v) ? '' : (isErr(v) ? '--' : v));
const fmtN2  = v => (v === null || v === undefined) ? '-' : (isMissing(v) ? '' : (isErr(v) ? '--' : (+v).toFixed(2)));
const pad    = n => String(n).padStart(2, '0');
const dtToApi = v => v ? v.replace('T',' ') + ':00' : null;

function stName(stcd) {
  const t = (stcd || '').trim();
  const s = S.stations.find(x => (x.stcd || '').trim() === t);
  return s ? (s.stnm || '-') : '-';
}

function buildParams(withPage = true) {
  const p = new URLSearchParams();
  if (withPage) { p.set('page', S.page); p.set('size', S.size); }
  const stcd = $('river-stcd').value;
  const s = $('river-start').value;
  const e = $('river-end').value;
  if (stcd) p.set('stcd', stcd);
  if (s) p.set('startTime', dtToApi(s));
  if (e) p.set('endTime', dtToApi(e));
  return p;
}

function setDefaultTimes() {
  const now = new Date();
  const fmt = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
  $('river-start').value = fmt(new Date(now - 7 * 24 * 3600e3));
  $('river-end').value   = fmt(now);
}

// ===== 初始化 =====
async function init() {
  await loadStations();
  fetchLatest();
  $('river-query-btn').addEventListener('click', query);
  $('river-export-btn').addEventListener('click', doExport);
  $('edit-save-btn').addEventListener('click', saveEdit);
  document.querySelectorAll('[data-close]').forEach(btn =>
    btn.addEventListener('click', () => closeModal(btn.dataset.close)));
  document.querySelectorAll('.overlay').forEach(el =>
    el.addEventListener('click', e => { if (e.target === el) closeModal(el.id); }));
  $('river-tbody').addEventListener('click', onTableClick);
  $('river-stcd').addEventListener('change', () => {
    if (!$('river-stcd').value) {
      $('river-start').value = '';
      $('river-end').value   = '';
      fetchLatest();
    }
  });
}

async function loadStations() {
  try {
    const metrics = await fetch('/hltgq-site/station-metrics').then(r => r.json()) || [];
    // 只保留有水位数据的站点
    S.stations = metrics.filter(s => s.type === 'water' || s.type === 'all');
    const sel = $('river-stcd');
    S.stations.forEach(s => {
      const o = document.createElement('option');
      o.value = s.stcd;
      o.textContent = `${(s.stcd||'').trim()}${s.stnm ? ' - ' + s.stnm : ''}`;
      sel.appendChild(o);
    });
  } catch(e) { console.error('加载站点失败', e); }
}

// ===== 查询 =====
function query() {
  S.page = 1;
  const stcd = $('river-stcd').value;
  const hasTime = $('river-start').value || $('river-end').value;
  if (!stcd && !hasTime) {
    fetchLatest();
  } else {
    if (stcd && !hasTime) setDefaultTimes();
    S.mode = 'paged';
    fetchData();
  }
}

function reset() {
  $('river-stcd').value  = '';
  $('river-start').value = '';
  $('river-end').value   = '';
  S.page = 1;
  fetchLatest();
}

async function fetchLatest() {
  S.mode = 'latest';
  try {
    const rows = await fetch('/hltgq-site/st-river-r/latest').then(r => r.json());
    S.riverRows = rows;
    renderTable(rows);
    $('river-pg').innerHTML = `<span class="pg-info">共 ${rows.length} 条（最新数据）</span>`;
  } catch(e) { console.error('加载最新数据失败', e); }
}

async function fetchData() {
  try {
    const res = await fetch(`/hltgq-site/st-river-r/page?${buildParams()}`);
    const d = await res.json();
    S.total = d.total || 0;
    S.page  = d.current || 1;
    S.riverRows = d.records || [];
    renderTable(S.riverRows);
    renderPg();
  } catch(e) { console.error('获取数据失败', e); }
}

// ===== 渲染 =====
const SVG_EDIT = `<svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04a1 1 0 0 0 0-1.41l-2.34-2.34a1 1 0 0 0-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg>`;

function actHtml(i) {
  return `<div class="acts"><button class="act-btn act-edit" data-i="${i}" title="编辑">${SVG_EDIT}</button></div>`;
}

function renderTable(rows) {
  $('river-tbody').innerHTML = rows.length ? rows.map((r, i) => `<tr>
    <td>${(r.stcd||'').trim()}</td><td>${stName(r.stcd)}</td><td>${fmtDt(r.tm)}</td>
    <td>${fmtN2(r.z)}</td><td>${fmtN(r.q)}</td>
    <td>${r.flwchrcd||'-'}</td><td>${r.wptn||'-'}</td>
    <td>${actHtml(i)}</td>
  </tr>`).join('') : `<tr><td colspan="8" class="empty">暂无数据</td></tr>`;
}

// ===== 分页 =====
function renderPg() {
  const { total, page, size } = S;
  const tp = Math.max(1, Math.ceil(total / size));
  let html = `<span class="pg-info">共 ${total} 条</span>`;
  html += `<select class="pg-size" onchange="changeSize(this.value)">`;
  [10,20,30,50,100].forEach(s => {
    html += `<option value="${s}" ${s===size?'selected':''}>${s}条/页</option>`;
  });
  html += `</select>`;
  if (tp > 1) {
    html += pgBtn('‹', page > 1, `goPage(${page-1})`);
    pageNums(page, tp).forEach(n => {
      if (n === '…') html += `<span class="pg-ellipsis">…</span>`;
      else html += pgBtn(n, true, `goPage(${n})`, n === page);
    });
    html += pgBtn('›', page < tp, `goPage(${page+1})`);
  }
  $('river-pg').innerHTML = html;
}

function changeSize(size) { S.size = +size; S.page = 1; fetchData(); }

function pgBtn(label, enabled, onclick, active = false) {
  return `<button class="pg-btn${active?' active':''}" ${!enabled?'disabled':''} onclick="${onclick}">${label}</button>`;
}

function pageNums(cur, total) {
  if (total <= 7) return Array.from({length:total},(_,i)=>i+1);
  if (cur <= 4)   return [1,2,3,4,5,'…',total];
  if (cur >= total-3) return [1,'…',total-4,total-3,total-2,total-1,total];
  return [1,'…',cur-1,cur,cur+1,'…',total];
}

function goPage(p) { S.page = p; fetchData(); }

// ===== 导出 =====
async function doExport() {
  try {
    const res = await fetch(`/hltgq-site/st-river-r/export?${buildParams(false)}`);
    const rows = await res.json();
    const headers = ['测站编码','测站名称','观测时间','水位(m)','流量(m³/s)','水流特征码','测点编号'];
    // 导出：-9991 设备异常统一转 '--'；-999 设备不存在转空白
    const data = rows.map(r => [(r.stcd||'').trim(), stName(r.stcd), fmtDt(r.tm),
      (r.z != null && +r.z === -9991) ? '--' : (r.z != null && +r.z === -999 ? '' : r.z),
      (r.q != null && +r.q === -9991) ? '--' : (r.q != null && +r.q === -999 ? '' : r.q),
      r.flwchrcd, r.wptn]);
    const ws = XLSX.utils.aoa_to_sheet([headers, ...data]);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, '水位数据');
    XLSX.writeFile(wb, `水位数据_${new Date().toLocaleDateString('zh-CN').replace(/\//g,'-')}.xlsx`);
  } catch(e) { alert('导出失败：' + e.message); }
}

// ===== 行操作 =====
function onTableClick(e) {
  const btn = e.target.closest('button[data-i]');
  if (!btn) return;
  const idx = +btn.dataset.i;
  const row = S.riverRows[idx];
  if (btn.classList.contains('act-edit')) openEdit(idx, row);
}

// ===== 编辑弹窗 =====
function openEdit(idx, r) {
  S.editIdx = idx;
  $('edit-title').textContent = '编辑水位数据';
  const fields = [
    {id:'e-stcd',     label:'测站编码',   val:r.stcd,          ro:true},
    {id:'e-tm',       label:'观测时间',   val:fmtDt(r.tm),     ro:true},
    {id:'e-z',        label:'水位(m)',    val:r.z,             num:true},
    {id:'e-q',        label:'流量(m³/s)',val:r.q,             num:true},
    {id:'e-flwchrcd', label:'水流特征码', val:r.flwchrcd||''},
    {id:'e-wptn',     label:'测点编号',   val:r.wptn||''},
  ];
  $('edit-grid').innerHTML = fields.map(f =>
    `<div class="f-item"><label>${f.label}</label>
     <input id="${f.id}" type="${f.num?'number':'text'}" step="${f.num?'any':''}"
       value="${f.val??''}" ${f.ro?'readonly':''}></div>`
  ).join('');
  openModal('edit-overlay');
}

async function saveEdit() {
  const orig = S.riverRows[S.editIdx];
  const nf = id => { const v = $(id).value; return v===''?null:+v; };
  const sf = id => $(id).value || null;
  const body = { stcd:orig.stcd, tm:orig.tm, z:nf('e-z'), q:nf('e-q'), flwchrcd:sf('e-flwchrcd'), wptn:sf('e-wptn') };
  try {
    const res = await fetch('/hltgq-site/st-river-r', { method:'PUT', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body) });
    if (res.ok) {
      closeModal('edit-overlay');
      if (S.mode === 'latest') fetchLatest(); else fetchData();
    } else alert('保存失败');
  } catch(e) { alert('保存失败：' + e.message); }
}

// ===== Modal =====
function openModal(id)  { $(id).classList.add('show'); }
function closeModal(id) { $(id).classList.remove('show'); }

init();
</script>
</body>
</html>
