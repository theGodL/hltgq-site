<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>调度方案</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:#fff;color:#333;font-size:14px;-webkit-font-smoothing:antialiased}
.page-wrap{padding:20px 24px 48px}

/* 页面头部:仅右侧「新增调度方案」(页面标题由平台菜单展示,页内不重复) */
.page-head{display:flex;align-items:center;justify-content:flex-end;gap:12px;margin-bottom:16px}

/* 按钮(与需水上报/值班管理页保持一致) */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:36px;padding:0 16px;border:1px solid transparent;border-radius:6px;font-size:14px;font-family:inherit;cursor:pointer;white-space:nowrap;transition:all .2s}
.btn-primary{background:#1677ff;color:#fff;border-color:#1677ff}
.btn-primary:hover{background:#4096ff;border-color:#4096ff}
.btn-primary:active{background:#0958d9;border-color:#0958d9}
.btn-default{background:#fff;color:#333;border-color:#d9d9d9}
.btn-default:hover{color:#1677ff;border-color:#1677ff}
.btn-danger{background:#ff4d4f;color:#fff;border-color:#ff4d4f}
.btn-danger:hover{background:#ff7875;border-color:#ff7875}
.btn:disabled{opacity:.6;cursor:not-allowed;pointer-events:none}
.btn svg{display:block;flex-shrink:0}

/* 工具栏:搜索框 + 状态/关联计划筛选下拉 + 重置 */
.toolbar{display:flex;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.search-wrap{position:relative;width:280px}
.srch-icon{position:absolute;left:10px;top:50%;transform:translateY(-50%);display:inline-flex;color:#bfbfbf;pointer-events:none}
.search-input{width:100%;height:36px;border:1px solid #d9d9d9;border-radius:6px;padding:0 12px 0 32px;font-size:14px;font-family:inherit;color:#333;outline:none;transition:border-color .2s,box-shadow .2s}
.search-input:focus{border-color:#1677ff;box-shadow:0 0 0 2px rgba(22,119,255,.1)}
.search-input::placeholder{color:#bfbfbf}
.filter-sel{width:170px}
.filter-sel.wide{width:240px}

/* 表格横向滚动容器:宽度只增不减(脚本 initTblGrowOnlyWidth 控制),页面收窄时表格宽度保持不动,由本容器出现横向滚动条 */
.tbl-wrap{overflow-x:auto}

/* 表格(与需水上报页保持一致) */
.tbl{width:100%;border-collapse:collapse;table-layout:fixed;font-size:14px}
.tbl th{background:#fafafa;color:#333;font-weight:600;text-align:left;padding:12px 16px;border:1px solid #f0f0f0;white-space:nowrap}
.tbl td{padding:12px 16px;border:1px solid #f0f0f0;color:#333;line-height:22px;vertical-align:middle;overflow-wrap:break-word}
.cell-main{font-weight:600;color:#1f1f1f;line-height:22px}
.cell-range{display:block;color:#333;line-height:22px}
.amt{font-weight:600;color:#1f1f1f}
.amt .unit{margin-left:2px;font-size:12px;color:#8c8c8c;font-weight:400}
.empty-cell{text-align:center;color:#bfbfbf;padding:32px 0}

/* 关联计划类型标签(年度=紫 / 月度=蓝 / 旬度=青) */
.plan-tag{display:inline-flex;align-items:center;height:18px;padding:0 6px;border-radius:4px;font-size:12px;line-height:1;margin-right:6px;vertical-align:1px}
.plan-tag.year{background:#f9f0ff;color:#722ed1}
.plan-tag.month{background:#e6f4ff;color:#1677ff}
.plan-tag.ten{background:#e6fffb;color:#08979c}

/* 执行状态/计费徽标:圆点 + 文字 */
.st-tag{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:12px;font-size:12px;font-weight:500;line-height:1;white-space:nowrap}
.st-tag::before{content:'';width:6px;height:6px;border-radius:50%;background:currentColor;flex-shrink:0}
.st-tag.pending{background:#fff7e6;color:#fa8c16}
.st-tag.running{background:#e6f4ff;color:#1677ff}
.st-tag.done{background:#f6ffed;color:#52c41a}
.st-tag.canceled{background:#f0f0f0;color:#8c8c8c}
.st-tag.unbilled{background:#fff7e6;color:#fa8c16}
.st-tag.billed{background:#f6ffed;color:#52c41a}
.st-op{display:block;margin-top:4px;font-size:12px;color:#8c8c8c;line-height:18px}

/* 操作列链接(td 保持标准单元格与其余列对齐;内层 .act-box 承载 flex 排布:固定单行不换行,gap 控制列距/行距) */
.act{color:#1677ff;cursor:pointer;transition:color .2s;white-space:nowrap}
.act:hover{color:#4096ff}
.act.del{color:#ff4d4f}
.act.del:hover{color:#ff7875}
.col-act .act-box{display:flex;flex-wrap:nowrap;align-items:center;gap:8px 14px}

/* 分页栏(居右:共 N 条 / 页码 / 每页条数 / 跳页) */
.pg-bar{display:flex;align-items:center;justify-content:flex-end;padding:16px 0 0;gap:8px;flex-wrap:wrap}
.pg-info{color:#333;font-size:13px;margin-right:4px}
.pg-btns{display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.pg-btn{min-width:32px;height:32px;padding:0 6px;border:1px solid #d9d9d9;background:#fff;border-radius:6px;cursor:pointer;font-size:13px;color:#333;transition:all .2s;display:inline-flex;align-items:center;justify-content:center}
.pg-btn:hover:not([disabled]):not(.active){border-color:#1677ff;color:#1677ff}
.pg-btn.active{border-color:#1677ff;color:#1677ff}
.pg-btn[disabled]{color:#bfbfbf;cursor:not-allowed}
.pg-btn[data-pg="prev"],.pg-btn[data-pg="next"]{border-color:transparent;background:transparent;font-size:16px;color:#8c8c8c}
.pg-btn[data-pg="prev"]:hover:not([disabled]),.pg-btn[data-pg="next"]:hover:not([disabled]){border-color:transparent;background:transparent;color:#1677ff}
.pg-ellipsis{min-width:20px;height:32px;display:inline-flex;align-items:center;justify-content:center;color:#8c8c8c;font-size:13px;user-select:none;letter-spacing:1px}
.pg-size{height:32px;border:1px solid #d9d9d9;border-radius:6px;font-size:13px;color:#333;background:#fff;padding:0 8px;outline:none}
.pg-jump{display:flex;align-items:center;gap:6px;font-size:13px;color:#333}
.pg-jump input{width:52px;height:32px;border:1px solid #d9d9d9;border-radius:6px;text-align:center;font-size:13px;color:#333;background:#fff;outline:none;padding:0 8px}
.pg-jump input:focus{border-color:#1677ff}

/* 弹窗(居中模态:新增/编辑、删除确认共用) */
.ov{display:none;position:fixed;inset:0;z-index:1000;background:rgba(0,0,0,.45);align-items:flex-start;justify-content:center;padding:24px;overflow-y:auto}
.ov.show{display:flex}
/* 弹窗(内容超高时:内容区内部滚动,底部按钮固定在弹窗下方) */
.modal{position:relative;background:#fff;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);width:100%;display:flex;flex-direction:column;max-height:calc(100vh - 48px)}
.modal-sm{max-width:460px;margin-top:16vh}
.modal-lg{max-width:720px;margin-top:6vh;max-height:78vh}
.modal-x{position:absolute;top:16px;right:16px;display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;padding:0;border:none;border-radius:4px;background:none;color:#595959;cursor:pointer;transition:color .2s,background .2s}
.modal-x:hover{color:#262626;background:#f5f5f5}
.modal-hd{padding:20px 24px 0;font-size:18px;font-weight:600;color:#1f1f1f;flex-shrink:0}
.modal-bd{padding:16px 24px 0;flex:1;min-height:0;overflow-y:auto}
.modal-ft{display:flex;justify-content:flex-end;gap:8px;padding:16px 24px 20px;border-top:1px solid #f0f0f0;margin-top:18px;flex-shrink:0}
.modal-ft .btn{height:36px;padding:0 18px}
.confirm-text{font-size:14px;color:#333;line-height:22px;word-break:break-all}

/* 表单(弹窗内:两列网格 + 必填红星 + 字段提示) */
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}
.form-grid .span2{grid-column:span 2}
.form-item{margin-bottom:18px}
.form-item > label{display:block;margin-bottom:8px;font-size:14px;color:#333}
.req{color:#ff4d4f;font-style:normal;margin-left:2px}
.ipt{width:100%;height:36px;border:1px solid #d9d9d9;border-radius:6px;background:#fff;padding:0 12px;font-size:14px;font-family:inherit;color:#333;outline:none;transition:border-color .2s,box-shadow .2s}
.ipt:focus{border-color:#1677ff;box-shadow:0 0 0 2px rgba(22,119,255,.1)}
.ipt::placeholder{color:#bfbfbf}
textarea.ipt{height:auto;min-height:88px;padding:8px 12px;line-height:22px;resize:vertical}
input[type="datetime-local"].ipt{cursor:pointer}
input[type="number"].ipt::-webkit-outer-spin-button,input[type="number"].ipt::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
input[type="number"].ipt{-moz-appearance:textfield;appearance:textfield}
.f-tip{margin-top:6px;font-size:12px;color:#8c8c8c;line-height:18px}

/* 下拉(统一支持输入模糊搜索) */
.select-wrap{position:relative}
.sel-input{width:100%;height:36px;border:1px solid #d9d9d9;border-radius:6px;background:#fff;padding:0 32px 0 12px;font-size:14px;font-family:inherit;color:#333;outline:none;cursor:pointer;transition:border-color .2s,box-shadow .2s}
.sel-input:focus{border-color:#1677ff;box-shadow:0 0 0 2px rgba(22,119,255,.1)}
.sel-input::placeholder{color:#bfbfbf}
.chev{position:absolute;right:12px;top:50%;transform:translateY(-50%);display:inline-flex;pointer-events:none}
.sel-dd{display:none;position:absolute;left:0;right:0;top:calc(100% + 4px);z-index:30;max-height:224px;overflow-y:auto;background:#fff;border:1px solid #f0f0f0;border-radius:6px;box-shadow:0 6px 16px rgba(0,0,0,.08);padding:4px}
.sel-dd.open{display:block}
.dd-opt{padding:8px 12px;border-radius:4px;cursor:pointer;color:#333;font-size:14px;line-height:20px}
.dd-opt:hover{background:#f5f5f5}
.dd-opt.active{background:#e6f4ff;color:#1677ff;font-weight:500}
.dd-empty{padding:10px 12px;font-size:13px;color:#bfbfbf;text-align:center}

/* 计划配额提示条:绿色=已关联且查到配额;青色=未关联/未查到(需手工填写) */
.plan-tip{display:none;margin-top:10px;padding:9px 12px;border:1px solid #87e8de;border-radius:6px;background:#e6fffb;color:#08979c;font-size:13px;line-height:20px}
.plan-tip.show{display:flex;align-items:flex-start;gap:8px}
.plan-tip .tip-ico{flex-shrink:0;margin-top:3px}
.plan-tip.ok{border-color:#b7eb8f;background:#f6ffed;color:#389e0d}
.plan-tip .tip-ico-info{display:inline-flex}
.plan-tip .tip-ico-ok{display:none}
.plan-tip.ok .tip-ico-info{display:none}
.plan-tip.ok .tip-ico-ok{display:inline-flex}

/* 轻提示 */
.toast{position:fixed;top:24px;left:50%;z-index:1500;padding:9px 18px;border:1px solid #d9d9d9;border-radius:6px;background:#fff;box-shadow:0 6px 16px rgba(0,0,0,.12);font-size:14px;color:#333;opacity:0;pointer-events:none;transform:translate(-50%,-16px);transition:opacity .25s,transform .25s;max-width:80vw}
.toast.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<div class="page-wrap">
  <!-- 页面头部:仅右侧新增按钮(页面标题由平台菜单展示,页内不重复) -->
  <div class="page-head">
    <button type="button" class="btn btn-primary" id="btn-add">
      <svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true">
        <path d="M6 1v10M1 6h10" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
      </svg>新增调度方案
    </button>
  </div>

  <!-- 工具栏:搜索 + 状态筛选 + 关联计划筛选 + 重置 -->
  <div class="toolbar">
    <div class="search-wrap">
      <span class="srch-icon">
        <svg width="14" height="14" viewBox="0 0 16 16" fill="none" aria-hidden="true">
          <circle cx="7" cy="7" r="4.5" stroke="currentColor" stroke-width="1.4"/>
          <path d="M10.6 10.6L14.4 14.4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
        </svg>
      </span>
      <input type="text" class="search-input" id="f-kw" placeholder="搜索方案编号 / 用水户 / 闸口" autocomplete="off">
    </div>
    <div class="filter-sel">
      <div class="select-wrap">
        <input type="text" class="sel-input" id="f-flt-status" placeholder="全部状态" autocomplete="off">
        <span class="chev"><svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M2.5 4.5L6 8l3.5-3.5" stroke="#bfbfbf" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
        <div class="sel-dd" id="flt-status-dd"></div>
      </div>
    </div>
    <div class="filter-sel wide">
      <div class="select-wrap">
        <input type="text" class="sel-input" id="f-flt-plan" placeholder="全部关联计划" autocomplete="off">
        <span class="chev"><svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M2.5 4.5L6 8l3.5-3.5" stroke="#bfbfbf" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
        <div class="sel-dd" id="flt-plan-dd"></div>
      </div>
    </div>
    <button type="button" class="btn btn-default" id="btn-reset">重置</button>
  </div>

  <!-- 调度方案列表(宽度只增不减:收窄时表格不动,容器出横向滚动条) -->
  <div class="tbl-wrap">
    <table class="tbl">
      <colgroup>
        <col style="width:9%"><col style="width:11%"><col style="width:6%"><col style="width:12%">
        <col style="width:9%"><col style="width:10%"><col style="width:11%"><col style="width:9%">
        <col style="width:7%"><col style="width:16%">
      </colgroup>
      <thead>
        <tr>
          <th>方案编号</th><th>方案时间</th><th>用水户</th><th>关联用水计划</th><th>调度闸口</th>
          <th>计划放水量（万m³）</th><th>执行时段</th><th>执行状态</th><th>计费</th><th>操作</th>
        </tr>
      </thead>
      <tbody id="tbl-body"></tbody>
    </table>
  </div>

  <!-- 分页栏 -->
  <div class="pg-bar" id="pg-bar"></div>
</div>

<!-- 新增/编辑调度方案弹窗(共用) -->
<div class="ov" id="form-ov">
  <div class="modal modal-lg" role="dialog" aria-label="调度方案">
    <button type="button" class="modal-x" data-close="form-ov" aria-label="关闭">
      <svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true">
        <path d="M1.5 1.5l11 11M12.5 1.5l-11 11" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
      </svg>
    </button>
    <div class="modal-hd">
      <div id="form-title">新增调度方案</div>
    </div>
    <div class="modal-bd">
      <div class="form-item">
        <label>关联用水计划</label>
        <div class="select-wrap">
          <input type="text" class="sel-input" id="f-plan" placeholder="输入计划名称搜索" autocomplete="off">
          <span class="chev"><svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M2.5 4.5L6 8l3.5-3.5" stroke="#bfbfbf" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
          <div class="sel-dd" id="plan-dd"></div>
        </div>
        <div class="f-tip">关联后将根据计划自动带出用水户的计划用水量</div>
        <div class="plan-tip" id="plan-tip">
          <svg class="tip-ico tip-ico-info" width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><rect x="1.5" y="2.5" width="9" height="8" rx="1.5" stroke="currentColor" stroke-width="1.2"/><path d="M1.5 5h9M4 1.5v2M8 1.5v2" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>
          <svg class="tip-ico tip-ico-ok" width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M2 6.2L4.8 9 10 3.4" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span id="plan-tip-text"></span>
        </div>
      </div>
      <div class="form-grid">
        <div class="form-item">
          <label>关联需水申请</label>
          <div class="select-wrap">
            <input type="text" class="sel-input" id="f-apply" placeholder="选择已通过的需水申请" autocomplete="off">
            <span class="chev"><svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M2.5 4.5L6 8l3.5-3.5" stroke="#bfbfbf" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
            <div class="sel-dd" id="apply-dd"></div>
          </div>
        </div>
        <div class="form-item">
          <label>用水户 <i class="req">*</i></label>
          <div class="select-wrap">
            <input type="text" class="sel-input" id="f-p-farmer" placeholder="输入名称/编号搜索" autocomplete="off">
            <span class="chev"><svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M2.5 4.5L6 8l3.5-3.5" stroke="#bfbfbf" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
            <div class="sel-dd" id="p-farmer-dd"></div>
          </div>
        </div>
        <div class="form-item">
          <label>调度闸口 <i class="req">*</i></label>
          <div class="select-wrap">
            <input type="text" class="sel-input" id="f-p-gate" placeholder="输入名称/编号搜索" autocomplete="off">
            <span class="chev"><svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M2.5 4.5L6 8l3.5-3.5" stroke="#bfbfbf" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
            <div class="sel-dd" id="p-gate-dd"></div>
          </div>
          <div class="f-tip">指定闸口：按正位归集</div>
        </div>
        <div class="form-item">
          <label>计划放水量（万m³） <i class="req">*</i></label>
          <input type="number" class="ipt" id="f-p-amount" min="0" step="0.01" placeholder="0" autocomplete="off">
          <div class="f-tip">关联计划时可自动带出；请核对本次调度量。</div>
        </div>
        <div class="form-item">
          <label>开始时间 <i class="req">*</i></label>
          <input type="datetime-local" class="ipt" id="f-p-start">
        </div>
        <div class="form-item">
          <label>结束时间 <i class="req">*</i></label>
          <input type="datetime-local" class="ipt" id="f-p-end">
        </div>
        <div class="form-item">
          <label>调度负责人</label>
          <div class="select-wrap">
            <input type="text" class="sel-input" id="f-p-owner" placeholder="搜索并选择调度负责人" autocomplete="off" maxlength="50">
            <span class="chev"><svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M2.5 4.5L6 8l3.5-3.5" stroke="#bfbfbf" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
            <div class="sel-dd" id="p-owner-dd"></div>
          </div>
          <div class="f-tip">候选为平台用户（5.1 owners），与需水上报页「编制方案」同一池</div>
        </div>
        <div class="form-item span2">
          <label>备注</label>
          <textarea class="ipt" id="f-p-remark" placeholder="选填"></textarea>
        </div>
      </div>
    </div>
    <div class="modal-ft">
      <button type="button" class="btn btn-default" id="btn-form-cancel">取消</button>
      <button type="button" class="btn btn-primary" id="btn-form-save">
        <svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M2 6.2L4.8 9 10 3.4" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>保存
      </button>
    </div>
  </div>
</div>

<!-- 删除确认弹窗 -->
<div class="ov" id="confirm-ov">
  <div class="modal modal-sm" role="dialog" aria-label="删除确认">
    <button type="button" class="modal-x" data-close="confirm-ov" aria-label="关闭">
      <svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true">
        <path d="M1.5 1.5l11 11M12.5 1.5l-11 11" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
      </svg>
    </button>
    <div class="modal-hd">删除调度方案</div>
    <div class="modal-bd">
      <p class="confirm-text" id="confirm-text"></p>
    </div>
    <div class="modal-ft">
      <button type="button" class="btn btn-default" id="btn-del-cancel">取消</button>
      <button type="button" class="btn btn-danger" id="btn-del-ok">
        <svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M2 6.2L4.8 9 10 3.4" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>确认删除
      </button>
    </div>
  </div>
</div>

<!-- 轻提示 -->
<div class="toast" id="toast"></div>

<script>
(function () {
  'use strict';

  /* ==================== 接口层(数据全部来自后端接口,经 dev-proxy 代理) ==================== */

  var API_BASE = '/hltgq-site';

  function api(method, url, body, cb) {
    var opts = { method: method, headers: {} };
    if (body != null) {
      opts.headers['Content-Type'] = 'application/json';
      opts.body = JSON.stringify(body);
    }
    fetch(API_BASE + url, opts).then(function (res) {
      return res.json().catch(function () { return {}; }).then(function (data) {
        if (res.status === 401) { toast(data.message || '未登录或会话已过期'); cb(new Error('unauthorized')); return; }
        if (!res.ok) { toast(data.message || ('请求失败(' + res.status + ')')); cb(new Error(data.message || String(res.status))); return; }
        cb(null, data);
      });
    }, function () {
      /* 仅收拢 fetch 自身的网络故障;业务回调(渲染等)内的异常不再吞掉,直接冒泡到控制台便于排查 */
      toast('网络异常，请稍后重试');
      cb(new Error('network'));
    });
  }

  /* 下拉/字典数据源(初始化或联动时自接口加载,前端不写死) */
  var USERS = [];      // 弹窗用水户(收敛) /water-dispatch/users(新增): 带 planId 仅该计划明细内正常户
  var GATES = [];      // 弹窗闸口(收敛) /water-user/gates?userId=(新增): {id,code,name}; 未配置为空数组
  var PLANS = [];      // 全量已生效计划 5.5 /water-dispatch/plans(筛选下拉/表格徽标)
  var FORM_PLANS = []; // 弹窗内计划(5.5:userId 非空仅该户明细内计划,含配额字段)
  var PLANS_USER = ''; // FORM_PLANS 配额字段对应的用水户 id
  var APPLIES = [];    // 已通过需水 5.6 /water-dispatch/demands
  var OWNERS = [];     // 调度负责人候选 5.1 /water-dispatch/meta owners: {id,name}(平台用户)
  var NO_PLAN_LABEL = '— 不关联用水计划 —'; // f-plan「不关联」选项文案(选项列表与编辑回填共用)
  var NO_DEMAND_LABEL = '— 不关联（直接编制）—'; // f-apply「不关联」选项文案(选项列表与编辑回填共用)
  var STATUSES = [     // 筛选字典(5.1 meta.statuses 覆盖;默认与 0.4 一致)
    { value: 'pending', label: '待执行' },
    { value: 'running', label: '执行中' },
    { value: 'done', label: '已完成' },
    { value: 'canceled', label: '已取消' }
  ];

  /** 执行状态元信息(徽标文案/配色;英文码与 0.4 一致) */
  var STATUS_META = {
    pending: { text: '待执行', cls: 'pending' },
    running: { text: '执行中', cls: 'running' },
    done: { text: '已完成', cls: 'done' },
    canceled: { text: '已取消', cls: 'canceled' }
  };

  /** 计划类型中文名 → 标签配色类名(5.5 planTypeName:年度/月度/旬度) */
  var PLAN_TYPE_CLS = { '年度': 'year', '月度': 'month', '旬度': 'ten' };

  /* ==================== 基础工具 ==================== */

  function $(id) { return document.getElementById(id); }

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  /** 数字格式化:保留2位小数去掉尾零 */
  function fmtAmount(n) {
    var v = Number(n);
    if (!isFinite(v)) return '';
    return String(Math.round(v * 100) / 100);
  }

  function pad2(n) { return (n < 10 ? '0' : '') + n; }

  function todayStr() {
    var d = new Date();
    return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
  }

  function nowInputStr() {
    var d = new Date();
    return todayStr() + 'T' + pad2(d.getHours()) + ':' + pad2(d.getMinutes());
  }

  /** datetime-local 值(2026-10-08T08:00) → 展示格式(2026-10-08 08:00) */
  function dtToText(v) { return String(v || '').replace('T', ' '); }

  var toastTimer = null;
  function toast(msg) {
    var t = $('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.classList.remove('show'); }, 2200);
  }

  /** 用水户下拉回填文案:名称（户号） */
  function userLabel(u) { return u.name + '（' + u.userNo + '）'; }
  /** 行数据回填文案:名称（户号） */
  function rowUserLabel(r) { return (r.waterUserName || '-') + (r.waterUserNo ? '（' + r.waterUserNo + '）' : ''); }
  function userOptions() { return USERS.map(function (u) { return { value: u.id, label: userLabel(u) }; }); }
  /** 按 id 从当前用水户列表找(收敛校验用) */
  function findUser(id) {
    for (var i = 0; i < USERS.length; i++) { if (USERS[i].id === id) return USERS[i]; }
    return null;
  }

  function gateOptions() { return GATES.map(function (g) { return { value: g.id, label: g.name }; }); }

  /** 负责人候选:平台用户(5.1 owners),value=用户 id、label=姓名;与需水页「编制方案」同口径 */
  function ownerOptions() { return OWNERS.map(function (o) { return { value: o.id, label: o.name }; }); }
  function ownerNameOf(id) {
    for (var i = 0; i < OWNERS.length; i++) { if (OWNERS[i].id === id) return OWNERS[i].name; }
    return '';
  }
  /** 存量姓名回填:能在候选池命中时一并记录 id(重新保存即固化快照),否则仅按文本展示 */
  function setSelOwnerByName(name) {
    var text = name || '';
    var id = '';
    for (var i = 0; i < OWNERS.length; i++) { if (OWNERS[i].name === text) { id = OWNERS[i].id; break; } }
    setSel('f-p-owner', text, id);
  }

  function findPlan(id) {
    for (var i = 0; i < FORM_PLANS.length; i++) { if (FORM_PLANS[i].id === id) return FORM_PLANS[i]; }
    for (var j = 0; j < PLANS.length; j++) { if (PLANS[j].id === id) return PLANS[j]; }
    return null;
  }
  /** 计划下拉文案:planNo · planName */
  function planLabelOf(p) { return p.planNo + ' · ' + p.planName; }
  function planOptions() {
    return [{ value: '', label: NO_PLAN_LABEL }].concat(FORM_PLANS.map(function (p) {
      return { value: p.id, label: planLabelOf(p) };
    }));
  }

  function findDemand(id) {
    for (var i = 0; i < APPLIES.length; i++) { if (APPLIES[i].id === id) return APPLIES[i]; }
    return null;
  }
  /** 需水申请下拉/回填文案:demandNo · 户名 · X万m³ */
  function demandLabelOf(r) {
    return r.demandNo + ' · ' + (r.waterUserName || '') + ' · ' + fmtAmount(r.amount) + '万m³';
  }
  function demandOptions() {
    return [{ value: '', label: NO_DEMAND_LABEL }].concat(APPLIES.map(function (d) {
      return { value: d.id, label: demandLabelOf(d) };
    }));
  }

  /* ==================== 通用模糊搜索下拉 ==================== */

  var openDd = null;

  function closeDd() {
    if (openDd) openDd.classList.remove('open');
    openDd = null;
  }

  function openDdPanel(dd) {
    closeDd();
    dd.classList.add('open');
    openDd = dd;
  }

  function bindSearchSelect(inputId, ddId, optionsFn, emptyText, onPick) {
    var input = $(inputId);
    var dd = $(ddId);

    function renderDd(kw) {
      var list = optionsFn();
      var lower = String(kw || '').toLowerCase();
      var data = list.filter(function (o) {
        return !lower || String(o.label).toLowerCase().indexOf(lower) !== -1;
      });
      if (!data.length) {
        dd.innerHTML = '<div class="dd-empty">' + esc(emptyText || '无匹配数据') + '</div>';
        return;
      }
      dd.innerHTML = data.map(function (o) {
        var active = input.dataset.value && o.value === input.dataset.value ? ' active' : '';
        return '<div class="dd-opt' + active + '" data-value="' + esc(o.value) + '">' + esc(o.label) + '</div>';
      }).join('');
    }

    // 点击展开:未手动输入(输入为空,或与最近一次选中/回填的文案快照一致)时展示全量枚举;手动输入内容后才按关键词过滤
    input.addEventListener('click', function () {
      if (openDd === dd) { closeDd(); return; }
      var kw = input.value.trim();
      // 不能按 dataset.value 判空(“全部状态/不关联”类选项的 value 为 '')；以选中/回填时记录的文案快照为准,枚举命中仅作兜底
      var pristine = !kw || kw === (input.dataset.label || '')
        || optionsFn().some(function (o) { return String(o.label) === kw; });
      renderDd(pristine ? '' : kw);
      openDdPanel(dd);
    });

    input.addEventListener('input', function () {
      input.dataset.value = '';
      input.dataset.label = ''; // 手动输入后清除文案快照,展开时按输入内容过滤
      renderDd(input.value.trim());
      if (openDd !== dd) openDdPanel(dd);
    });

    dd.addEventListener('mousedown', function (e) {
      var opt = e.target.closest('.dd-opt');
      if (!opt) return;
      e.preventDefault();
      input.value = opt.textContent;
      input.dataset.label = opt.textContent; // 记录选中项文案快照(供展开时判断“未手动输入”,“不关联”类空值选项同样适用)
      input.dataset.value = opt.dataset.value || '';
      closeDd();
      if (onPick) onPick(input.dataset.value);
    });
  }

  /* ==================== 列表渲染与筛选分页 ==================== */

  /** 列表状态:筛选/分页参数 + 最近一次服务端响应(0.1 分页结构) */
  var S = { kw: '', status: '', planId: '', page: 1, size: 10, total: 0, pages: 1, rows: [] };

  /** 按 id 从当前页行数据中找(操作列/弹窗用) */
  function findRowById(id) {
    for (var i = 0; i < S.rows.length; i++) {
      if (S.rows[i].id === id) return S.rows[i];
    }
    return null;
  }

  /** 拉取列表(服务端筛选+分页,5.3) */
  var listSeq = 0;
  function loadList() {
    var seq = ++listSeq;
    var q = '?page=' + S.page + '&size=' + S.size;
    if (S.kw) q += '&keyword=' + encodeURIComponent(S.kw);
    if (S.status) q += '&status=' + encodeURIComponent(S.status);
    if (S.planId) q += '&planId=' + encodeURIComponent(S.planId);
    api('GET', '/water-dispatch/page' + q, null, function (err, data) {
      if (err || seq !== listSeq) return;
      S.total = data.total || 0;
      S.pages = Math.max(1, data.pages || 1);
      S.rows = data.records || [];
      if (S.page > S.pages) { S.page = S.pages; loadList(); return; }
      renderRows(S.rows);
      renderPager();
    });
  }

  function planCell(r) {
    if (!r.planName) return '<td>-</td>';
    var p = r.planId ? findPlan(r.planId) : null;
    var html = esc(r.planName);
    if (p && p.planTypeName) {
      html += ' <span class="plan-tag ' + (PLAN_TYPE_CLS[p.planTypeName] || 'month') + '">' + esc(p.planTypeName) + '</span>';
    }
    if (r.planNo) html += ' · <span style="color:#8c8c8c">' + esc(r.planNo) + '</span>';
    return '<td>' + html + '</td>';
  }

  function statusCell(r) {
    var meta = STATUS_META[r.status] || { text: r.status, cls: '' };
    var html = '<span class="st-tag ' + meta.cls + '">' + esc(meta.text) + '</span>';
    if (r.trail > 0) html += '<span class="st-op">留痕记录 ' + r.trail + ' 条</span>';
    return '<td>' + html + '</td>';
  }

  /** 操作列:按接口文档状态机显隐(编辑=待执行且未计费;开始=待执行;完成=执行中;取消=待执行/执行中且未计费;删除=未计费不限状态) */
  function actionCell(r) {
    var id = esc(r.id);
    var acts = [];
    if (r.status === 'pending' && !r.billed) acts.push('<span class="act" data-action="edit" data-id="' + id + '">编辑</span>');
    if (r.status === 'pending') acts.push('<span class="act" data-action="start" data-id="' + id + '">开始</span>');
    if (r.status === 'running') acts.push('<span class="act" data-action="done" data-id="' + id + '">完成</span>');
    if ((r.status === 'pending' || r.status === 'running') && !r.billed) acts.push('<span class="act" data-action="cancel" data-id="' + id + '">取消</span>');
    if (!r.billed) acts.push('<span class="act del" data-action="delete" data-id="' + id + '">删除</span>');
    return '<td class="col-act"><div class="act-box">' + (acts.length ? acts.join('') : '-') + '</div></td>';
  }

  function renderRows(rows) {
    if (!rows.length) {
      $('tbl-body').innerHTML = '<tr><td class="empty-cell" colspan="10">暂无数据</td></tr>';
      return;
    }
    $('tbl-body').innerHTML = rows.map(function (r) {
      return '<tr>'
        + '<td><span class="cell-main">' + esc(r.dispatchNo || r.id) + '</span></td>'
        + '<td>' + esc(r.createTime || '-') + '</td>'
        + '<td>' + esc(r.waterUserName || '-') + '</td>'
        + planCell(r)
        + '<td>' + esc(r.gateName || '-') + '</td>'
        + '<td><span class="amt">' + esc(fmtAmount(r.planAmount)) + '<span class="unit">万m³</span></span></td>'
        + '<td><span class="cell-range">' + esc(r.startTime) + '</span><span class="cell-range">至 ' + esc(r.endTime) + '</span></td>'
        + statusCell(r)
        + '<td><span class="st-tag ' + (r.billed ? 'billed' : 'unbilled') + '">' + (r.billed ? '已计费' : '未计费') + '</span></td>'
        + actionCell(r)
        + '</tr>';
    }).join('');
  }

  /** 页码序列:超过7页时用省略号收缩 */
  function pageNumbers(total, cur) {
    if (total <= 7) {
      var arr = [];
      for (var i = 1; i <= total; i++) arr.push(i);
      return arr;
    }
    if (cur <= 4) return [1, 2, 3, 4, 5, '...', total];
    if (cur >= total - 3) return [1, '...', total - 4, total - 3, total - 2, total - 1, total];
    return [1, '...', cur - 1, cur, cur + 1, '...', total];
  }

  function renderPager() {
    var pages = S.pages;
    if (S.page > pages) S.page = pages;
    var nums = pageNumbers(pages, S.page);
    var btns = nums.map(function (n) {
      if (n === '...') return '<span class="pg-ellipsis">···</span>';
      return '<button type="button" class="pg-btn' + (n === S.page ? ' active' : '') + '" data-pg="page" data-num="' + n + '">' + n + '</button>';
    }).join('');
    $('pg-bar').innerHTML =
      '<span class="pg-info">共 ' + S.total + ' 条</span>'
      + '<span class="pg-btns">'
      + '<button type="button" class="pg-btn" data-pg="prev"' + (S.page <= 1 ? ' disabled' : '') + '>‹</button>'
      + btns
      + '<button type="button" class="pg-btn" data-pg="next"' + (S.page >= pages ? ' disabled' : '') + '>›</button>'
      + '</span>'
      + '<select class="pg-size" id="pg-size">'
      + [10, 20, 50].map(function (n) { return '<option value="' + n + '"' + (n === S.size ? ' selected' : '') + '>' + n + ' 条/页</option>'; }).join('')
      + '</select>'
      + '<span class="pg-jump">前往<input type="number" id="pg-jump" min="1" max="' + pages + '" value="' + S.page + '">页</span>';
  }

  function renderAll() {
    loadList();
  }

  /* ==================== 弹窗逻辑 ==================== */

  var formMode = 'add'; // add | edit
  var editId = '';
  var delId = '';

  function openModal(id) { $(id).classList.add('show'); }
  function closeModal(id) { $(id).classList.remove('show'); }

  function setSel(inputId, label, value) {
    var el = $(inputId);
    el.value = label || '';
    el.dataset.value = value || '';
    el.dataset.label = label || ''; // 记录回填文案快照:展开下拉时据此判断“未手动输入”
  }

  /** 全量已生效计划(5.5 无 userId):筛选下拉 + 列表表格徽标共用 */
  function loadPlansAll() {
    api('GET', '/water-dispatch/plans', null, function (err, arr) {
      if (!err) PLANS = arr || [];
      if (S.rows.length) renderRows(S.rows); // 计划数据就绪后补充列表徽标
    });
  }

  /** 弹窗内计划下拉(5.5 增强):无 userId 为全部已生效;userId 非空仅该户明细内计划并补充配额字段 */
  var planSeq = 0;
  function loadPlans(userId, cb) {
    var seq = ++planSeq;
    FORM_PLANS = [];
    PLANS_USER = userId || '';
    updatePlanTip();
    var url = '/water-dispatch/plans' + (userId ? '?userId=' + encodeURIComponent(userId) : '');
    api('GET', url, null, function (err, arr) {
      if (seq !== planSeq) return;
      if (!err) FORM_PLANS = arr || [];
      updatePlanTip();
      if (cb) cb();
    });
  }

  /** 弹窗内用水户下拉(收敛 /water-dispatch/users 新增):planId 非空仅该计划明细内正常状态户 */
  var formUserSeq = 0;
  function loadFormUsers(planId, cb) {
    var seq = ++formUserSeq;
    var url = '/water-dispatch/users' + (planId ? '?planId=' + encodeURIComponent(planId) : '');
    api('GET', url, null, function (err, arr) {
      if (seq !== formUserSeq) return;
      if (!err) USERS = Array.isArray(arr) ? arr : [];
      if (cb) cb();
    });
  }

  /** 弹窗内闸口下拉(收敛 /water-user/gates 新增):仅该户关联闸口组(主闸口在前);空数组=未配置给提示 */
  var gateSeq = 0;
  function loadFormGates(userId, cb) {
    var seq = ++gateSeq;
    if (!userId) { GATES = []; if (cb) cb(); return; }
    api('GET', '/water-user/gates?userId=' + encodeURIComponent(userId), null, function (err, arr) {
      if (seq !== gateSeq) return;
      if (!err) GATES = Array.isArray(arr) ? arr : [];
      if (!err && !GATES.length) toast('该用水户未配置关联闸口，请先配置');
      if (cb) cb();
    });
  }

  /** 按户刷新需水申请下拉(5.6):仅已通过,可按户过滤 */
  var demandSeq = 0;
  function loadDemands(userId, cb) {
    var seq = ++demandSeq;
    var url = '/water-dispatch/demands' + (userId ? '?userId=' + encodeURIComponent(userId) : '');
    api('GET', url, null, function (err, arr) {
      if (seq !== demandSeq) return;
      if (!err) APPLIES = arr || [];
      if (cb) cb();
    });
  }

  /** 计划配额提示条(5.5/5.0.1):关联计划+选中用水户且有配额时展示(接口 m³→万m³) */
  function updatePlanTip() {
    var tip = $('plan-tip');
    var userId = $('f-p-farmer').dataset.value;
    var plan = userId && userId === PLANS_USER ? findPlan($('f-plan').dataset.value) : null;
    if (!plan || plan.userPlanWater == null) { tip.classList.remove('show'); return; }
    var remain = Math.max(0, (plan.userPlanWater - (plan.userScheduledQty || 0)) / 10000);
    $('plan-tip-text').textContent = '本计划中该用水户计划用水量：' + fmtAmount(plan.userPlanWater / 10000)
      + ' 万m³ · 已下达调度 ' + fmtAmount((plan.userScheduledQty || 0) / 10000)
      + ' 万m³ · 剩余可下达 ' + fmtAmount(remain) + ' 万m³';
    tip.className = 'plan-tip ok show';
  }

  /** 计划变更:户列表收敛到该计划明细内正常户(不关联则全量);原户不在其中时清空其依赖项 */
  function onPlanPick(planId) {
    loadFormUsers(planId || '', function () {
      var uid = $('f-p-farmer').dataset.value;
      if (uid && !findUser(uid)) {
        setSel('f-p-farmer', '');
        setSel('f-p-gate', '');
        GATES = [];
        setSel('f-apply', '');
        $('f-p-amount').value = '';
        $('f-p-start').value = '';
        $('f-p-end').value = '';
        loadDemands('');
        toast('原用水户不在该计划明细内，已清空，请重新选择');
      }
      updatePlanTip();
    });
  }

  /** 选中需水申请后自动带出用水户/放水量/起止时间,并按户刷新计划/闸口下拉(5.6);原选计划属该户明细时保留,不属于才收敛清空 */
  function fillByDemand() {
    var d = findDemand($('f-apply').dataset.value);
    if (!d) { updatePlanTip(); return; }
    setSel('f-p-farmer', rowUserLabel(d), d.waterUserId || '');
    setSel('f-p-gate', '');
    $('f-p-amount').value = fmtAmount(d.amount);
    $('f-p-start').value = d.startDate + 'T08:00';
    $('f-p-end').value = d.endDate + 'T18:00';
    loadPlans(d.waterUserId, function () {
      // 与「更换用水户」同一收敛规则:原选计划不在该户明细内时才清空,否则保留
      var sel = $('f-plan').dataset.value;
      if (sel && !findPlan(sel)) { setSel('f-plan', ''); updatePlanTip(); }
    });
    loadFormGates(d.waterUserId);
  }

  /** 弹窗内更换用水户:计划收敛该户明细内计划(不属于则清空),闸口收敛该户并重选,需水不一致时清空(5.7) */
  function onFormUserPick(userId) {
    loadPlans(userId, function () {
      var sel = $('f-plan').dataset.value;
      if (sel && !findPlan(sel)) { setSel('f-plan', ''); updatePlanTip(); }
    });
    setSel('f-p-gate', '');
    loadFormGates(userId);
    loadDemands(userId, function () {
      var sel = $('f-apply').dataset.value;
      if (sel && !findDemand(sel)) {
        setSel('f-apply', '');
        $('f-p-amount').value = '';
        $('f-p-start').value = '';
        $('f-p-end').value = '';
      }
    });
  }

  function openFormModal(mode, row) {
    formMode = mode;
    editId = row ? row.id : '';
    $('form-title').textContent = mode === 'edit' ? '编辑调度方案' : '新增调度方案';

    setSel('f-plan', '');
    if (mode === 'edit' && row) {
      // 新增时选的「不关联」在编辑回填时带出对应文案,避免两个字段打开时空白
      if (row.planId) setSel('f-plan', (row.planNo ? row.planNo + ' · ' : '') + (row.planName || ''), row.planId);
      else setSel('f-plan', NO_PLAN_LABEL, '');
      if (row.demandId) setSel('f-apply', row.demandNo || '', row.demandId);
      else setSel('f-apply', NO_DEMAND_LABEL, '');
      setSel('f-p-farmer', rowUserLabel(row), row.waterUserId);
      setSel('f-p-gate', (row.gateName || ''), row.gateId);
      $('f-p-amount').value = fmtAmount(row.planAmount);
      $('f-p-start').value = String(row.startTime || '').replace(' ', 'T');
      $('f-p-end').value = String(row.endTime || '').replace(' ', 'T');
      setSelOwnerByName(row.owner);
      $('f-p-remark').value = row.remark || '';

      // 下拉数据按收敛规则回填:户=该计划内(关联计划时)/全量,计划=该户,闸口=该户,需水=该户
      loadFormUsers(row.planId || '');
      loadPlans(row.waterUserId, function () {
        var p = findPlan(row.planId);
        if (p) setSel('f-plan', planLabelOf(p), p.id);
      });
      loadDemands(row.waterUserId, function () {
        var d = findDemand(row.demandId);
        if (d) setSel('f-apply', demandLabelOf(d), d.id);
      });
      loadFormGates(row.waterUserId);
    } else {
      setSel('f-apply', '');
      setSel('f-p-farmer', '');
      setSel('f-p-gate', '');
      $('f-p-amount').value = '';
      $('f-p-start').value = nowInputStr();
      $('f-p-end').value = nowInputStr();
      setSel('f-p-owner', '', '');
      $('f-p-remark').value = '';
      loadFormUsers('');   // 全量正常状态户
      loadPlans('');       // 全部已生效计划
      loadDemands('');
      loadFormGates('');   // 未选户:闸口列表待收敛
    }
    openModal('form-ov');
  }

  function saveForm() {
    var planId = $('f-plan').dataset.value;
    var demandId = $('f-apply').dataset.value;
    var userId = $('f-p-farmer').dataset.value;
    var gateId = $('f-p-gate').dataset.value;
    var amount = $('f-p-amount').value.trim();
    var start = $('f-p-start').value;
    var end = $('f-p-end').value;
    var owner = $('f-p-owner').value.trim();
    var ownerId = $('f-p-owner').dataset.value;
    var remark = $('f-p-remark').value.trim();

    if (!userId) { toast('请选择「用水户」'); return; }
    if (!gateId) { toast('请选择「调度闸口」'); return; }
    if (!amount || !(Number(amount) > 0)) { toast('请填写「计划放水量」(大于 0)'); return; }
    if (!start) { toast('请选择「开始时间」'); return; }
    if (!end) { toast('请选择「结束时间」'); return; }
    if (end <= start) { toast('结束时间需晚于开始时间'); return; }

    var payload = {
      waterUserId: userId,
      gateId: gateId,
      planAmount: Number(Number(amount).toFixed(2)), // 万m³,≤2 位小数(0.3)
      startTime: start,
      endTime: end
    };
    if (planId) payload.planId = planId;
    if (demandId) payload.demandId = demandId;
    // 负责人:下拉选中传 id(5.8 后端按 id 回查固化姓名快照,不信任文本);仅手填/存量值时按文本入库
    if (ownerId) {
      payload.ownerUserId = ownerId;
      payload.owner = ownerNameOf(ownerId) || owner;
    } else if (owner) {
      payload.owner = owner;
    }
    if (remark) payload.remark = remark;

    var btn = $('btn-form-save');
    btn.disabled = true;
    var isEdit = formMode === 'edit';
    var method = isEdit ? 'PUT' : 'POST';
    var url = isEdit ? '/water-dispatch/update?id=' + encodeURIComponent(editId) : '/water-dispatch/create';
    api(method, url, payload, function (err) {
      btn.disabled = false;
      if (err) return;
      closeModal('form-ov');
      toast(isEdit ? '已保存' : '调度方案已下达');
      renderAll();
    });
  }

  function askDelete(row) {
    delId = row.id;
    $('confirm-text').textContent = '确认删除方案 ' + (row.dispatchNo || row.id) + '？删除后不可恢复。';
    openModal('confirm-ov');
  }

  function doDelete() {
    var btn = $('btn-del-ok');
    btn.disabled = true;
    api('DELETE', '/water-dispatch/delete?id=' + encodeURIComponent(delId), null, function (err) {
      btn.disabled = false;
      if (err) return;
      closeModal('confirm-ov');
      toast('已删除');
      renderAll();
    });
  }

  /** 状态流转(5.10 /status:start/done/cancel;前端预检 + 服务端校验) */
  function doTransition(row, action) {
    if (action === 'start' && row.status !== 'pending') { toast('仅待执行方案可开始执行'); return; }
    if (action === 'done' && row.status !== 'running') { toast('仅执行中方案可完成'); return; }
    if (action === 'cancel') {
      if (row.billed) { toast('该方案已计费，请先删除关联账单后再取消'); return; }
      if (row.status !== 'pending' && row.status !== 'running') { toast('仅待执行/执行中方案可取消'); return; }
    }
    var no = row.dispatchNo || row.id;
    var okMsg = action === 'start' ? '方案 ' + no + ' 已开始执行'
      : (action === 'done' ? '方案 ' + no + ' 已完成' : '方案 ' + no + ' 已取消');
    api('POST', '/water-dispatch/status?id=' + encodeURIComponent(row.id) + '&action=' + encodeURIComponent(action), null, function (err) {
      if (err) return;
      toast(okMsg);
      renderAll();
    });
  }

  /* ==================== 事件绑定 ==================== */

  // 顶部按钮
  $('btn-add').addEventListener('click', function () { openFormModal('add'); });

  // 搜索(300ms 防抖,服务端 keyword 匹配 方案编号/户名/户号/闸口名/站码)
  var kwTimer = null;
  $('f-kw').addEventListener('input', function () {
    var v = this.value.trim();
    clearTimeout(kwTimer);
    kwTimer = setTimeout(function () {
      S.kw = v;
      S.page = 1;
      renderAll();
    }, 300);
  });

  // 筛选下拉:全部状态 / 全部关联计划
  bindSearchSelect('f-flt-status', 'flt-status-dd', function () {
    return [{ value: '', label: '全部状态' }].concat(STATUSES);
  }, '无匹配状态', function (v) { S.status = v; S.page = 1; renderAll(); });

  bindSearchSelect('f-flt-plan', 'flt-plan-dd', function () {
    return [{ value: '', label: '全部关联计划' }].concat(PLANS.map(function (p) {
      return { value: p.id, label: planLabelOf(p) };
    }));
  }, '无匹配计划', function (v) { S.planId = v; S.page = 1; renderAll(); });

  // 重置筛选
  $('btn-reset').addEventListener('click', function () {
    $('f-kw').value = '';
    setSel('f-flt-status', '全部状态', '');
    setSel('f-flt-plan', '全部关联计划', '');
    S.kw = ''; S.status = ''; S.planId = ''; S.page = 1;
    renderAll();
  });

  // 表单弹窗内下拉
  bindSearchSelect('f-plan', 'plan-dd', planOptions, '无匹配计划', onPlanPick);
  bindSearchSelect('f-apply', 'apply-dd', demandOptions, '无匹配申请', fillByDemand);
  bindSearchSelect('f-p-farmer', 'p-farmer-dd', userOptions, '无匹配用水户', onFormUserPick);
  bindSearchSelect('f-p-gate', 'p-gate-dd', gateOptions, '该户未配置关联闸口', null);
  bindSearchSelect('f-p-owner', 'p-owner-dd', ownerOptions, '无匹配负责人');

  // 表单按钮
  $('btn-form-cancel').addEventListener('click', function () { closeModal('form-ov'); });
  $('btn-form-save').addEventListener('click', saveForm);

  // 删除确认
  $('btn-del-cancel').addEventListener('click', function () { closeModal('confirm-ov'); });
  $('btn-del-ok').addEventListener('click', doDelete);

  // 关闭按钮 + 点遮罩关闭(仅小弹窗允许点遮罩关,表单弹窗防误触)
  document.querySelectorAll('[data-close]').forEach(function (b) {
    b.addEventListener('click', function () { closeModal(b.dataset.close); });
  });
  $('confirm-ov').addEventListener('click', function (e) { if (e.target === this) closeModal('confirm-ov'); });

  // 表格内操作(事件委托)
  $('tbl-body').addEventListener('click', function (e) {
    var el = e.target.closest('.act');
    if (!el) return;
    var row = findRowById(el.dataset.id);
    if (!row) return;
    if (el.dataset.action === 'edit') {
      if (row.billed) { toast('该方案已计费，请先删除关联账单后再编辑'); return; }
      if (row.status !== 'pending') { toast('仅待执行状态的调度方案可编辑'); return; }
      openFormModal('edit', row);
    } else if (el.dataset.action === 'delete') {
      if (row.billed) { toast('该方案已计费，请先删除关联账单后再删除'); return; }
      askDelete(row);
    } else if (el.dataset.action === 'start' || el.dataset.action === 'done' || el.dataset.action === 'cancel') {
      doTransition(row, el.dataset.action);
    }
  });

  // 分页(事件委托)
  $('pg-bar').addEventListener('click', function (e) {
    var btn = e.target.closest('.pg-btn');
    if (!btn || btn.disabled) return;
    var type = btn.dataset.pg;
    var pages = S.pages;
    if (type === 'prev') S.page = Math.max(1, S.page - 1);
    else if (type === 'next') S.page = Math.min(pages, S.page + 1);
    else S.page = parseInt(btn.dataset.num, 10);
    renderAll();
  });

  $('pg-bar').addEventListener('change', function (e) {
    if (e.target.id === 'pg-size') {
      S.size = parseInt(e.target.value, 10);
      S.page = 1;
      renderAll();
    }
  });

  $('pg-bar').addEventListener('keydown', function (e) {
    if (e.target.id === 'pg-jump' && e.key === 'Enter') {
      var pages = S.pages;
      var n = parseInt(e.target.value, 10);
      if (isFinite(n) && n >= 1) { S.page = Math.min(pages, n); renderAll(); }
    }
  });

  // 点击空白处关闭下拉
  document.addEventListener('click', function (e) {
    if (!e.target.closest('.select-wrap')) closeDd();
  });

  /* ==================== 初始化:并行拉取字典/下拉(接口) + 首屏 ==================== */

  setSel('f-flt-status', '全部状态', '');
  setSel('f-flt-plan', '全部关联计划', '');

  // 5.1 表单元数据:状态字典 + 调度负责人候选
  api('GET', '/water-dispatch/meta', null, function (err, d) {
    if (err || !d) return;
    if (d.statuses && d.statuses.length) STATUSES = d.statuses;
    OWNERS = d.owners || [];
  });

  // 弹窗收敛下拉(用水户/计划/闸口)统一在打开弹窗时按规则加载,此处不预拉
  loadPlansAll(); // 全量已生效计划(筛选下拉/表格徽标)
  renderAll();
})();

/* ==================== 表格宽度只增不减 ==================== */

/* 初始与变宽时铺满可用宽度;页面收窄时表格宽度保持不动(一个像素都不跟随缩),由 .tbl-wrap 立即出现横向滚动条。 */
(function initTblGrowOnlyWidth() {
  var wrap = document.querySelector('.tbl-wrap');
  var tbl = wrap && wrap.querySelector('table');
  if (!wrap || !tbl) return;
  var highW = 0; // 铺满基准:见过的最大可用宽度(只增不减)
  function sync() {
    var avail = wrap.clientWidth;
    if (avail <= 0 || avail <= highW) return; // 未超过历史最大宽度:宽度保持不动,交由横向滚动条
    highW = avail;
    tbl.style.width = avail + 'px'; // 铺满当前可用宽度
  }
  sync();
  if (window.ResizeObserver) new ResizeObserver(sync).observe(wrap);
  else window.addEventListener('resize', sync);
})();
</script>
</body>
</html>
