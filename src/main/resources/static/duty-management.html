<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>值班管理</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:#fff;color:#333;font-size:14px;-webkit-font-smoothing:antialiased}
.page-wrap{padding:20px 20px 48px}

/* 页头:左侧视图切换,右侧「导入/新增」 */
.page-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;gap:12px;flex-wrap:wrap}
.head-actions{display:flex;align-items:center;gap:8px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:36px;padding:0 16px;border:1px solid transparent;border-radius:6px;font-size:14px;font-family:inherit;cursor:pointer;white-space:nowrap;transition:all .2s}
.btn-primary{background:#1677ff;color:#fff;border-color:#1677ff}
.btn-primary:hover{background:#4096ff;border-color:#4096ff}
.btn-primary:active{background:#0958d9;border-color:#0958d9}
.btn-default{background:#fff;color:#333;border-color:#d9d9d9}
.btn-default:hover{color:#1677ff;border-color:#1677ff}
.btn-success{background:#52c41a;color:#fff;border-color:#52c41a}
.btn-success:hover{background:#73d13d;border-color:#73d13d}
.btn-danger{background:#ff4d4f;color:#fff;border-color:#ff4d4f}
.btn-danger:hover{background:#ff7875;border-color:#ff7875}
.btn:disabled{opacity:.6;cursor:not-allowed;pointer-events:none}
.btn svg{display:block;flex-shrink:0}

/* 表格 */
.tbl{width:100%;border-collapse:collapse;table-layout:fixed;font-size:14px}
.tbl th{background:#fafafa;color:#333;font-weight:600;text-align:left;padding:12px 16px;border:1px solid #f0f0f0;white-space:nowrap}
.tbl td{padding:12px 16px;border:1px solid #f0f0f0;color:#333;line-height:22px;vertical-align:middle;overflow-wrap:break-word}
.act{color:#1677ff;cursor:pointer;transition:color .2s}
.act:hover{color:#4096ff}
.tbl td .act + .act{margin-left:14px}
.sep{color:#d9d9d9;margin:0 10px}

/* 值班排班抽屉(新增/编辑/查看共用) */
.drawer-mask{position:fixed;inset:0;z-index:1050;background:rgba(0,0,0,.45);opacity:0;visibility:hidden;transition:opacity .3s,visibility .3s}
.drawer-mask.show{opacity:1;visibility:visible}
.drawer{position:fixed;top:0;right:0;z-index:1060;display:flex;flex-direction:column;width:660px;max-width:100vw;height:100vh;background:#fff;box-shadow:-6px 0 24px rgba(0,0,0,.1);transform:translateX(100%);transition:transform .3s cubic-bezier(.4,0,.2,1)}
.drawer.show{transform:translateX(0)}
.drawer-x{position:absolute;top:16px;right:16px;z-index:2;display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;padding:0;border:none;border-radius:4px;background:none;color:#595959;cursor:pointer;transition:color .2s,background .2s}
.drawer-x:hover{color:#262626;background:#f5f5f5}
.drawer-hd{flex-shrink:0;display:flex;align-items:center;height:56px;padding:0 24px;border-bottom:1px solid #f0f0f0}
.drawer-hd h3{font-size:16px;font-weight:500;color:#333}
.drawer-bd{flex:1;min-height:0;overflow-y:auto;padding:24px 24px 32px}
.drawer-ft{flex-shrink:0;display:flex;justify-content:flex-end;align-items:center;gap:8px;padding:12px 24px;border-top:1px solid #f0f0f0}
.drawer-ft .btn{height:36px;padding:0 18px}

/* 表单 */
.form-item{margin-bottom:20px}
.form-item > label{display:block;margin-bottom:8px;font-size:14px;color:#333}
.req{color:#ff4d4f;font-style:normal;margin-left:2px}
.ipt-icon{position:absolute;right:12px;top:50%;transform:translateY(-50%);display:inline-flex;pointer-events:none}
.range-wrap{position:relative;display:flex;align-items:center;height:36px;border:1px solid #d9d9d9;border-radius:6px;background:#fff;padding:0 36px 0 12px;transition:border-color .2s,box-shadow .2s}
.range-wrap:focus-within{border-color:#1677ff;box-shadow:0 0 0 2px rgba(22,119,255,.1)}
.range-wrap.error,.range-wrap.error:focus-within{border-color:#ff4d4f;box-shadow:0 0 0 2px rgba(255,77,79,.1)}
.time-error{display:none;margin-left:8px;font-size:12px;color:#ff4d4f}
.time-error.show{display:inline}
.range-input{flex:1;min-width:0;height:100%;border:0;outline:none;background:transparent;font-size:14px;font-family:inherit;color:#333;padding:0;cursor:pointer}
.range-input::placeholder{color:#bfbfbf}
.range-sep{flex-shrink:0;color:#d9d9d9;margin:0 8px;font-size:13px}
/* 值班时间日历面板 */
.cal-panel{display:none;position:absolute;left:0;top:calc(100% + 6px);z-index:20;width:284px;background:#fff;border:1px solid #f0f0f0;border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.12);padding:12px}
.cal-panel.open{display:block}
.cal-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.cal-ym{font-size:14px;font-weight:600;color:#333}
.cal-nav{display:flex;gap:4px}
.cal-nav button{width:24px;height:24px;border:0;border-radius:6px;background:transparent;color:#666;font-size:15px;line-height:1;cursor:pointer;display:inline-flex;align-items:center;justify-content:center}
.cal-nav button:hover{background:#f5f5f5;color:#1677ff}
.cal-week{display:grid;grid-template-columns:repeat(7,1fr);margin-bottom:2px}
.cal-week span{height:28px;display:flex;align-items:center;justify-content:center;font-size:12px;color:#999}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.cal-cell{height:32px;display:flex;align-items:center;justify-content:center;font-size:13px;color:#333;border-radius:6px;cursor:pointer;border:1px solid transparent}
.cal-cell:hover{background:#f5f5f5}
.cal-cell.empty{visibility:hidden}
.cal-cell.today{color:#1677ff;border-color:#91caff}
.cal-cell.sel{background:#1677ff;color:#fff}
.cal-cell.sel:hover{background:#1677ff}
.cal-ft{display:flex;align-items:center;justify-content:space-between;margin-top:8px;padding-top:10px;border-top:1px solid #f0f0f0}
.cal-time{display:flex;align-items:center;gap:4px;font-size:13px;color:#666}
.cal-time i{color:#bbb;font-style:normal;font-size:12px}
.cal-step{width:22px;height:22px;border:1px solid #d9d9d9;border-radius:6px;background:#fff;color:#666;font-size:13px;line-height:1;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;padding:0}
.cal-step:hover{border-color:#1677ff;color:#1677ff}
.cal-hm{width:30px;height:24px;border:1px solid #d9d9d9;border-radius:6px;background:#fff;text-align:center;font-weight:600;color:#333;font-size:13px;font-family:inherit;outline:none;padding:0}
.cal-hm:focus{border-color:#1677ff}
.cal-today-btn{border:0;background:transparent;color:#1677ff;font-size:13px;cursor:pointer;padding:3px 8px;border-radius:6px}
.cal-today-btn:hover{background:#e6f4ff}
.select-wrap{position:relative}
.sel-input{width:100%;height:36px;border:1px solid #d9d9d9;border-radius:6px;background:#fff;padding:0 32px 0 12px;font-size:14px;font-family:inherit;color:#333;outline:none;cursor:pointer;transition:border-color .2s,box-shadow .2s}
.sel-input:focus{border-color:#1677ff;box-shadow:0 0 0 2px rgba(22,119,255,.1)}
.chev{position:absolute;right:12px;top:50%;transform:translateY(-50%);display:inline-flex;pointer-events:none}
.sel-dd{display:none;position:absolute;left:0;right:0;top:calc(100% + 4px);z-index:10;max-height:224px;overflow-y:auto;background:#fff;border:1px solid #f0f0f0;border-radius:6px;box-shadow:0 6px 16px rgba(0,0,0,.08);padding:4px}
.sel-dd.open{display:block}
.sel-dd.up{top:auto;bottom:calc(100% + 4px)}
.dd-opt{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 12px;border-radius:4px;cursor:pointer;color:#333;font-size:14px}
.dd-opt:hover{background:#f5f5f5}
.dd-opt.active{background:#e6f4ff;color:#1677ff;font-weight:500}
.dd-opt.multi-on{color:#1677ff;font-weight:500}
.dd-empty{padding:10px 12px;font-size:13px;color:#bfbfbf;text-align:center}
.dd-check{flex-shrink:0}
.multi-box{min-height:36px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;border:1px solid #d9d9d9;border-radius:6px;padding:5px 32px 5px 8px;background:#fff;cursor:pointer;transition:border-color .2s}
.multi-box:hover{border-color:#4096ff}
.m-placeholder{color:#bfbfbf;font-size:14px;padding-left:4px}
.m-tag{display:inline-flex;align-items:center;gap:2px;height:24px;max-width:100%;padding:0 3px 0 8px;border-radius:4px;background:#f5f5f5;color:#333;font-size:13px;line-height:24px}
.m-x{display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;border-radius:50%;color:#999;font-size:14px;line-height:1;cursor:pointer;font-style:normal}
.m-x:hover{color:#595959;background:#e6e6e6}
.m-input{flex:1;min-width:70px;height:24px;border:0;outline:none;background:transparent;font-size:14px;font-family:inherit;color:#333;padding:0 2px}
.m-input::placeholder{color:#bfbfbf}
.drawer.is-view .range-wrap,.drawer.is-view .select-wrap{pointer-events:none}
.drawer.is-view .range-wrap,.drawer.is-view .sel-input,.drawer.is-view .multi-box{background:#fafafa}

/* 删除确认框 */
.confirm-overlay{display:none;position:fixed;inset:0;z-index:1300;background:rgba(0,0,0,.45);align-items:flex-start;justify-content:center;padding:20px}
.confirm-overlay.show{display:flex}
.confirm-modal{width:420px;max-width:96vw;margin-top:20vh;background:#fff;border-radius:8px;overflow:hidden;box-shadow:0 6px 22px rgba(0,0,0,.16),0 2px 8px rgba(0,0,0,.08)}
.confirm-bd{display:flex;align-items:flex-start;gap:12px;padding:24px 24px 8px}
.confirm-icon{flex-shrink:0;display:inline-flex;margin-top:1px}
.confirm-text{font-size:14px;color:#333;line-height:22px;word-break:break-all}
.confirm-ft{display:flex;justify-content:flex-end;gap:8px;padding:16px 24px 20px}

/* 轻提示 */
.toast{position:fixed;top:24px;left:50%;z-index:1500;padding:9px 18px;border:1px solid #d9d9d9;border-radius:6px;background:#fff;box-shadow:0 6px 16px rgba(0,0,0,.12);font-size:14px;color:#333;opacity:0;pointer-events:none;transform:translate(-50%,-16px);transition:opacity .25s,transform .25s}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* 分页条(表格下方,右对齐;本地切片每页 10 条) */
.pg-bar{display:flex;align-items:center;justify-content:flex-end;padding:16px 0 0;gap:8px;flex-wrap:wrap}
.pg-info{color:#333;font-size:13px;margin-right:4px}
.pg-btns{display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.pg-btn{min-width:32px;height:32px;padding:0 6px;border:1px solid #d9d9d9;background:#fff;border-radius:6px;cursor:pointer;font-size:13px;font-family:inherit;color:#333;transition:all .2s;display:inline-flex;align-items:center;justify-content:center}
.pg-btn:hover:not([disabled]):not(.active){border-color:#1677ff;color:#1677ff}
.pg-btn.active{background:#fff;border-color:#1677ff;color:#1677ff}
.pg-btn[disabled]{color:#bfbfbf;cursor:not-allowed}
.pg-btn[data-pg="prev"],.pg-btn[data-pg="next"]{border-color:transparent;background:transparent;font-size:22px;color:#8c8c8c}
.pg-btn[data-pg="prev"]:hover:not([disabled]),.pg-btn[data-pg="next"]:hover:not([disabled]){border-color:transparent;background:transparent;color:#1677ff}
.pg-ellipsis{color:#bfbfbf;padding:0 2px;font-size:13px}
.pg-jump{display:flex;align-items:center;gap:6px;font-size:13px;color:#333}
.pg-jump input{width:52px;height:32px;border:1px solid #d9d9d9;border-radius:6px;text-align:center;font-size:13px;color:#333;background:#fff;outline:none;padding:0 8px;font-family:inherit}
.pg-jump input:focus{border-color:#1677ff}

/* 视图切换分段控件 */
.seg{display:inline-flex;padding:2px;border:1px solid #d9d9d9;border-radius:6px;background:#fafafa}
.seg-btn{height:30px;padding:0 14px;border:0;border-radius:4px;background:transparent;color:#595959;font-size:14px;font-family:inherit;cursor:pointer;transition:all .2s}
.seg-btn:hover{color:#1677ff}
.seg-btn.active{background:#fff;color:#1677ff;font-weight:500;box-shadow:0 1px 2px rgba(0,0,0,.08)}

/* 日历视图 */
.cal-view{border:1px solid #f0f0f0;border-radius:8px;overflow:hidden}
.cal-view-hd{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid #f0f0f0;flex-wrap:wrap;gap:8px}
.cal-view-title{display:flex;align-items:center;gap:6px}
.cal-arrow{width:28px;height:28px;border:0;border-radius:6px;background:transparent;color:#666;font-size:20px;line-height:1;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;padding:0}
.cal-arrow:hover{background:#f5f5f5;color:#1677ff}
.cal-ym{min-width:104px;text-align:center;font-size:15px;font-weight:600;color:#333}
.cal-today-btn2{margin-left:4px;height:28px;padding:0 10px;border:1px solid #d9d9d9;border-radius:6px;background:#fff;color:#595959;font-size:13px;font-family:inherit;cursor:pointer}
.cal-today-btn2:hover{color:#1677ff;border-color:#1677ff}
.cal-legend{display:flex;align-items:center;gap:14px;font-size:13px;color:#8c8c8c}
.cal-legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:1px}
.cal-week{display:grid;grid-template-columns:repeat(7,1fr);border-bottom:1px solid #f0f0f0;background:#fafafa}
.cal-week span{height:38px;display:flex;align-items:center;justify-content:center;font-size:13px;color:#8c8c8c}
.cal-cells{display:grid;grid-template-columns:repeat(7,1fr)}
.cal-day{min-height:112px;padding:6px 8px;border-right:1px solid #f0f0f0;border-bottom:1px solid #f0f0f0;cursor:pointer;transition:background .15s;overflow:hidden}
.cal-day:nth-child(7n){border-right:0}
.cal-day:hover{background:#f5faff}
.cal-day.out{background:#fcfcfc;cursor:default}
.cal-day.out:hover{background:#fcfcfc}
.cal-day.today .d-num{background:#1677ff;color:#fff}
.cal-day-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}
.d-num{display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:22px;border-radius:50%;font-size:13px;color:#333}
.cal-day.out .d-num{color:#c8c8c8}
.d-cnt{font-size:12px;color:#bfbfbf}
.cal-ev{display:flex;align-items:center;gap:4px;height:19px;font-size:12px;color:#595959;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cal-ev i{flex-shrink:0;width:6px;height:6px;border-radius:50%}
.cal-ev.more{color:#1677ff}
.cal-empty{min-height:112px;border-right:1px solid #f0f0f0;border-bottom:1px solid #f0f0f0;background:#fcfcfc}
.cal-empty:nth-child(7n){border-right:0}

/* 当日值班人员弹窗 */
.day-overlay{display:none;position:fixed;inset:0;z-index:1200;background:rgba(0,0,0,.45);align-items:flex-start;justify-content:center;padding:20px;overflow:auto}
.day-overlay.show{display:flex}
.day-modal{width:880px;max-width:96vw;margin-top:8vh;background:#fff;border-radius:8px;overflow:hidden;box-shadow:0 6px 22px rgba(0,0,0,.16),0 2px 8px rgba(0,0,0,.08);display:flex;flex-direction:column;max-height:80vh}
.day-hd{position:relative;flex-shrink:0;display:flex;align-items:center;height:56px;padding:0 56px 0 24px;border-bottom:1px solid #f0f0f0}
.day-hd h3{font-size:16px;font-weight:500;color:#333}
.day-bd{flex:1;min-height:0;overflow:auto;padding:16px 24px 24px}
.day-tbl{width:100%;border-collapse:collapse;table-layout:fixed;font-size:14px}
.day-tbl th{background:#fafafa;color:#333;font-weight:600;text-align:left;padding:10px 12px;border:1px solid #f0f0f0;white-space:nowrap}
.day-tbl td{padding:10px 12px;border:1px solid #f0f0f0;color:#333;line-height:22px;vertical-align:middle;overflow-wrap:break-word}
.day-ft{flex-shrink:0;display:flex;justify-content:flex-end;padding:12px 24px;border-top:1px solid #f0f0f0}
.day-empty{padding:36px 0;text-align:center;color:#bfbfbf;font-size:14px}

/* 导入弹窗 */
.imp-modal{width:660px;max-width:96vw;margin-top:8vh;background:#fff;border-radius:8px;overflow:hidden;box-shadow:0 6px 22px rgba(0,0,0,.16),0 2px 8px rgba(0,0,0,.08);display:flex;flex-direction:column;max-height:80vh}
.imp-bd{flex:1;min-height:0;overflow:auto;padding:20px 24px 8px}
.imp-tip{font-size:13px;color:#8c8c8c;line-height:20px;margin-bottom:14px}
.imp-tip a{color:#1677ff;cursor:pointer;text-decoration:none}
.imp-tip a:hover{opacity:.85}
.imp-drop{min-height:150px;border:1px dashed #d0d5dd;border-radius:8px;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:24px 16px;color:#8c8c8c;cursor:pointer;transition:border-color .2s,background .2s}
.imp-drop:hover,.imp-drop.drag{border-color:#1677ff;background:#f0f7ff;color:#1677ff}
.imp-name{color:#262626;font-size:14px;font-weight:500}
.imp-meta{font-size:12px;color:#bfbfbf}
.imp-result{display:none;margin-top:14px;padding:12px 14px;border:1px solid #f0f0f0;border-radius:8px;background:#fafafa;max-height:220px;overflow:auto}
.imp-result.show{display:block}
.imp-sum{font-size:13px;color:#262626;margin-bottom:4px}
.imp-row{font-size:12px;line-height:20px;color:#595959}
.imp-row.ok{color:#389e0d}
.imp-row.fail{color:#cf1322}
.imp-ft{flex-shrink:0;display:flex;justify-content:flex-end;align-items:center;gap:8px;padding:12px 24px;border-top:1px solid #f0f0f0}

/* 带班领导联系方式(选人后自动带出,只读) */
#f-leader-phone{background:#fafafa;cursor:default}
#f-leader-phone:focus{border-color:#d9d9d9;box-shadow:none}
</style>
</head>
<body>
<div class="page-wrap">
  <!-- 页头:左侧视图切换,右侧「导入/新增」 -->
  <div class="page-head">
    <div class="seg" id="view-seg" role="tablist" aria-label="视图切换">
      <button type="button" class="seg-btn active" data-view="calendar">日历视图</button>
      <button type="button" class="seg-btn" data-view="list">列表视图</button>
    </div>
    <div class="head-actions">
      <button type="button" class="btn btn-default" id="btn-import">
        <svg width="13" height="13" viewBox="0 0 14 14" aria-hidden="true">
          <path d="M7 12.5v-7m0 0L4.2 8.3M7 5.5l2.8 2.8M2 3.8V2.4a.9.9 0 01.9-.9h8.2a.9.9 0 01.9.9v1.4" stroke="currentColor" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>导入
      </button>
      <button type="button" class="btn btn-primary" id="btn-add">
        <svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true">
          <path d="M6 1v10M1 6h10" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
        </svg>新增
      </button>
    </div>
  </div>

  <!-- 日历视图(默认):按月展示,点日期看当日值班人员 -->
  <div class="cal-view" id="cal-view">
    <div class="cal-view-hd">
      <div class="cal-view-title">
        <button type="button" class="cal-arrow" data-cal-nav="-1" aria-label="上个月">‹</button>
        <span class="cal-ym" id="cal-ym"></span>
        <button type="button" class="cal-arrow" data-cal-nav="1" aria-label="下个月">›</button>
        <button type="button" class="cal-today-btn2" id="cal-today">今天</button>
      </div>
      <div class="cal-legend">
        <span><i style="background:#52c41a"></i>白班</span>
        <span><i style="background:#1677ff"></i>中班</span>
        <span><i style="background:#fa8c16"></i>夜班</span>
      </div>
    </div>
    <div class="cal-week">
      <span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>日</span>
    </div>
    <div class="cal-cells" id="cal-cells"></div>
  </div>

  <!-- 列表视图 -->
  <div class="list-view" id="list-view" style="display:none">
    <table class="tbl">
      <colgroup>
        <col style="width:20%"><col style="width:10%"><col style="width:16%">
        <col style="width:12%"><col style="width:14%"><col style="width:12%"><col style="width:16%">
      </colgroup>
      <thead>
        <tr>
          <th>值班时间</th><th>班次</th><th>所在单位</th><th>带班领导</th>
          <th>值班人员</th><th>排班状态</th><th>操作</th>
        </tr>

<!-- 轻提示 -->
<div class="toast" id="toast"></div>

<script>
(function () {
  'use strict';

  /* ===================== 接口区 =====================
   *   接口文档 v1.0《值班交接班接口.md》:
   *   下拉选项       → GET    /duty/options
   *   排班日历       → GET    /duty/schedule/calendar?month=YYYY-MM
   *   排班列表       → GET    /duty/schedule/list
   *   排班详情       → GET    /duty/schedule/detail
   *   保存(新增/编辑) → POST   /duty/schedule/save
   *   删除           → DELETE /duty/schedule/{id}
   *   导入模板       → GET    /duty/schedule/import-template
   *   导入排班       → POST   /duty/schedule/import
   * ================================================= */

  var API_BASE = '/hltgq-site/duty';
  var OPTIONS = { shifts: [], orgs: [], users: [] }; // 下拉数据源(shifts/orgs/users)
  var LIST_DATA = [];                                // 排班列表当前数据(一次拉取,本地分页)
  var PAGE = { page: 1, size: 10 };                  // 分页状态(当前页/每页条数)
  var memberIdMap = {};                              // 值班人员姓名 → 用户 id
  var VIEW = 'calendar';                             // 当前视图:calendar(默认) / list
  var CAL = { month: null, data: {} };               // 日历当前月 yyyy-MM 与按日期分组数据
  var redirected = false;

  /** 通用请求:同域自动带 Cookie;401 按 redirectUrl 跳登录;非 2xx 抛出 message */
  function request(url, opt) {
    var init = { method: (opt && opt.method) || 'GET', headers: {} };
    if (opt && opt.body !== undefined) {
      init.headers['Content-Type'] = 'application/json';
      init.body = JSON.stringify(opt.body);
    }
    return fetch(url, init).then(function (res) {
      return res.json().catch(function () { return null; }).then(function (data) {
        if (res.status === 401) {
          // 未登录:跳同域登录页(redirectUrl 可能指向上游绝对地址,需改成本站路径,登录 Cookie 才会落在本站)
          if (!redirected && data && data.redirectUrl) {
            redirected = true;
            var loginUrl = data.redirectUrl;
            try { var u = new URL(loginUrl, location.origin); loginUrl = u.pathname + u.search; } catch (e) { /* 保持原值 */ }
            location.href = loginUrl;
          }
          throw new Error((data && data.message) || '未登录');
        }
        if (!res.ok) throw new Error((data && data.message) || ('请求失败(' + res.status + ')'));
        return data;
      });
    });
  }

  /** 下拉选项:班次字典 / 单位 / 人员 */
  function loadOptions() {
    return request(API_BASE + '/options').then(function (d) {
      OPTIONS.shifts = (d && d.shifts) || [];
      OPTIONS.orgs = (d && d.orgs) || [];
      OPTIONS.users = (d && d.users) || [];
      OPTIONS.users.forEach(function (u) { memberIdMap[u.name] = u.id; });
    });
  }

  /** 排班列表(一次拉取 100 条,分页在本地按每页 10 条切片) */
  function loadList() {
    return request(API_BASE + '/schedule/list?page=1&size=100').then(function (d) {
      LIST_DATA = (d && d.records) || [];
      // 数据变少(如删除)时当前页可能越界,回退到末页
      var totalPages = Math.max(1, Math.ceil(LIST_DATA.length / PAGE.size));
      if (PAGE.page > totalPages) PAGE.page = totalPages;
      renderList();
    });
  }

  /** 保存排班(新增/编辑) */
  function saveDuty(payload) {
    return request(API_BASE + '/schedule/save', { method: 'POST', body: payload });
  }

  /** 日历数据(按月一次拉取):records 按日期分组,供月历格子与当日弹窗使用 */
  function loadCalendar(month) {
    var q = month ? ('?month=' + encodeURIComponent(month)) : '';
    return request(API_BASE + '/schedule/calendar' + q).then(function (d) {
      CAL.month = (d && d.month) || month || '';
      CAL.data = {};
      ((d && d.records) || []).forEach(function (row) {
        var key = row.date || '';
        if (!key) return;
        (CAL.data[key] = CAL.data[key] || []).push(row);
      });
      renderCalendar();
    });
  }

  /** 刷新当前视图(保存/删除/导入后统一入口) */
  function refreshView() {
    if (VIEW === 'calendar') loadCalendar(CAL.month).catch(function (err) { toast(err.message); });
    else loadList().catch(function (err) { toast(err.message); });
  }

  /** 删除排班 */
  function deleteDuty(id) {
    return request(API_BASE + '/schedule/' + encodeURIComponent(id), { method: 'DELETE' });
  }

  // 排班状态 → 文字颜色
  var STATUS_COLORS = { '未开始': '#fa8c16', '待值班': '#8c8c8c', '值班中': '#52c41a', '已完成': '#52c41a' };

  var $ = function (id) { return document.getElementById(id); };
  var drawer = $('drawer');
  var drawerMask = $('drawer-mask');
  var confirmOverlay = $('confirm-overlay');
  var toastEl = $('toast');

  var drawerState = { mode: 'add', id: null }; // mode: add / edit / view
  var memberSel = [];        // 值班人员多选当前值
  var openDd = null;         // 当前展开的下拉面板
  var pendingDeleteId = null;

  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toast._t);
    toast._t = setTimeout(function () { toastEl.classList.remove('show'); }, 1800);
  }

  function findRow(id) {
    for (var i = 0; i < LIST_DATA.length; i++) {
      if (String(LIST_DATA[i].id) === String(id)) return LIST_DATA[i];
    }
    return null;
  }

  /* ===== 日历视图 ===== */

  var WEEK_CN = ['日', '一', '二', '三', '四', '五', '六'];
  var SHIFT_DOTS = { '#1#': '#52c41a', '#jhyu#': '#1677ff', '#zsfh#': '#fa8c16' };
  var dayOverlay = $('day-overlay');

  /** 渲染月历:周一为一周起点,每天显示前 3 条排班摘要与总班次数 */
  function renderCalendar() {
    if (!CAL.month) return;
    var y = +CAL.month.slice(0, 4);
    var m = +CAL.month.slice(5, 7);
    $('cal-ym').textContent = y + '年' + m + '月';
    var startW = (new Date(y, m - 1, 1).getDay() + 6) % 7;  // 周一=0
    var days = new Date(y, m, 0).getDate();
    var prevDays = new Date(y, m - 1, 0).getDate();
    var today = todayStr();
    var html = '';
    for (var i = startW - 1; i >= 0; i--) {
      html += '<div class="cal-empty"><div class="cal-day-hd"><span class="d-num">' + (prevDays - i) + '</span></div></div>';
    }
    for (var d = 1; d <= days; d++) {
      var ds = CAL.month + '-' + pad2(d);
      var list = CAL.data[ds] || [];
      html += '<div class="cal-day' + (ds === today ? ' today' : '') + '" data-date="' + ds + '">'
        + '<div class="cal-day-hd"><span class="d-num">' + d + '</span>'
        + (list.length ? '<span class="d-cnt">' + list.length + ' 班</span>' : '')
        + '</div>'
        + list.slice(0, 3).map(function (row) {
            return '<div class="cal-ev"><i style="background:' + (SHIFT_DOTS[row.shiftCode] || '#bfbfbf') + '"></i>'
              + esc(row.shift || '') + ' · ' + esc(row.org || '-') + '</div>';
          }).join('')
        + (list.length > 3 ? '<div class="cal-ev more">+' + (list.length - 3) + ' 条</div>' : '')
        + '</div>';
    }
    var tail = (7 - (startW + days) % 7) % 7;  // 补齐整周
    for (var t = 1; t <= tail; t++) {
      html += '<div class="cal-empty"><div class="cal-day-hd"><span class="d-num">' + t + '</span></div></div>';
    }
    $('cal-cells').innerHTML = html;
  }

  /** 切换月份(±1) */
  function shiftMonth(delta) {
    var y = +CAL.month.slice(0, 4);
    var m = +CAL.month.slice(5, 7) + delta;
    if (m < 1) { m = 12; y--; }
    if (m > 12) { m = 1; y++; }
    loadCalendar(y + '-' + pad2(m)).catch(function (err) { toast(err.message); });
  }

  /** 当日值班人员弹窗:单位/班次/带班领导/值班人员/联系电话 */
  function openDayModal(ds) {
    var list = CAL.data[ds] || [];
    var wd = WEEK_CN[new Date(ds + 'T00:00:00').getDay()];
    $('day-title').textContent = ds + '（周' + wd + '）值班人员';
    document.querySelector('.day-tbl').style.display = list.length ? '' : 'none';
    $('day-empty').style.display = list.length ? 'none' : 'block';
    $('day-tbody').innerHTML = list.map(function (row) {
      return '<tr>'
        + '<td>' + esc(row.org || '-') + '</td>'
        + '<td>' + esc(row.shift || '-') + '</td>'
        + '<td>' + esc(row.leader || '-') + '</td>'
        + '<td>' + esc(row.members || '-') + '</td>'
        + '<td>' + esc(row.leaderPhone || '-') + '</td>'
        + '</tr>';
    }).join('');
    dayOverlay.classList.add('show');
  }

  function closeDayModal() { dayOverlay.classList.remove('show'); }

  $('cal-cells').addEventListener('click', function (e) {
    var cell = e.target.closest('.cal-day');
    if (cell) openDayModal(cell.dataset.date);
  });
  document.querySelector('.cal-view-title').addEventListener('click', function (e) {
    var nav = e.target.closest('[data-cal-nav]');
    if (nav) { shiftMonth(+nav.dataset.calNav); return; }
    if (e.target.closest('#cal-today')) loadCalendar().catch(function (err) { toast(err.message); });
  });
  $('day-close').addEventListener('click', closeDayModal);
  $('day-close-btn').addEventListener('click', closeDayModal);
  dayOverlay.addEventListener('click', function (e) { if (e.target === dayOverlay) closeDayModal(); });

  /* ===== 视图切换(日历默认) ===== */
  function switchView(view) {
    VIEW = view;
    Array.prototype.forEach.call(document.querySelectorAll('#view-seg .seg-btn'), function (b) {
      b.classList.toggle('active', b.dataset.view === view);
    });
    $('cal-view').style.display = view === 'calendar' ? '' : 'none';
    $('list-view').style.display = view === 'list' ? '' : 'none';
    refreshView();
  }

  $('view-seg').addEventListener('click', function (e) {
    var btn = e.target.closest('.seg-btn');
    if (!btn || btn.dataset.view === VIEW) return;
    switchView(btn.dataset.view);
  });

  /* ===== 列表渲染 ===== */

  /** 操作列:未开始类(statusCode=#1#/#zzkl#)→ 查看/编辑/删除;其余状态仅查看 */
  function actionCell(row) {
    var id = esc(row.id);
    var html = '<span class="act" data-action="view" data-id="' + id + '">查看</span>';
    if (row.statusCode === '#1#' || row.statusCode === '#zzkl#') {
      html += '<span class="act" data-action="edit" data-id="' + id + '">编辑</span>'
            + '<span class="act" data-action="delete" data-id="' + id + '">删除</span>';
    }
    return '<td>' + html + '</td>';
  }

  /** 值班时间文本:timeStart~timeEnd;同日结束只显示 HH:mm,跨天加「次日」;历史数据(date+shiftTime)兜底 */
  function timeRangeText(row) {
    if (row.timeStart && row.timeEnd) {
      var sd = row.timeStart.slice(0, 10);
      var ed = row.timeEnd.slice(0, 10);
      var eHm = row.timeEnd.slice(11);
      if (ed === sd) return row.timeStart + ' ~ ' + eHm;
      if (ed === addDays(sd, 1)) return row.timeStart + ' ~ 次日' + eHm;
      return row.timeStart + ' ~ ' + row.timeEnd;
    }
    return row.date ? row.date + (row.shiftTime ? ' ' + row.shiftTime : '') : '-';
  }

  function renderList() {
    if (!LIST_DATA.length) {
      $('duty-tbody').innerHTML = '<tr><td colspan="7" style="text-align:center;color:#bfbfbf;padding:32px 0">暂无数据</td></tr>';
      renderPager();
      return;
    }
    // 仅渲染当前页(每页 10 条)
    var start = (PAGE.page - 1) * PAGE.size;
    var rows = LIST_DATA.slice(start, start + PAGE.size);
    $('duty-tbody').innerHTML = rows.map(function (row) {
      return '<tr>'
        + '<td>' + esc(timeRangeText(row)) + '</td>'
        + '<td>' + esc(row.shift || '-') + '</td>'
        + '<td>' + esc(row.org || '-') + '</td>'
        + '<td>' + esc(row.leader || '-') + '</td>'
        + '<td>' + esc(row.members || '-') + '</td>'
        + '<td style="color:' + (STATUS_COLORS[row.status] || '#333') + '">' + esc(row.status) + '</td>'
        + actionCell(row)
        + '</tr>';
    }).join('');
    renderPager();
  }

  /* ===== 下拉通用 ===== */
  function closeDd() {
    if (openDd) {
      var wasMember = openDd === memberDd;
      openDd.classList.remove('open');
      openDd = null;
      // 收起值班人员面板时清空搜索词,输入框回到初始态
      if (wasMember) {
        memberKw = '';
        if (drawerState.mode !== 'view') renderMemberBox();
      }
    }
  }
  // 面板内点选会重渲染(innerHTML),冒泡阶段 e.target 已脱离 DOM,closest 失效会误关面板;故用捕获阶段判断外部点击
  document.addEventListener('click', function (e) {
    if (!e.target.closest('.select-wrap')) closeDd();
  }, true);

  function openDdPanel(dd) {
    if (openDd === dd) { closeDd(); return; }
    if (openDd) openDd.classList.remove('open');
    dd.classList.add('open');
    openDd = dd;
  }

  /** 单选下拉绑定:options 为 {value,label} 数组或返回该数组的函数;选中后回调 onPick(value) */
  function bindSingleSelect(inputId, ddId, options, onPick) {
    var input = $(inputId);
    var dd = $(ddId);
    input.addEventListener('click', function () {
      if (drawerState.mode === 'view') return;
      if (openDd === dd) { closeDd(); return; }
      var opts = typeof options === 'function' ? options() : options;
      dd.innerHTML = opts.map(function (o) {
        return '<div class="dd-opt"' + (input.value === o.label ? ' active' : '') + ' data-value="' + esc(o.value) + '">' + esc(o.label) + '</div>';
      }).join('');
      openDdPanel(dd);
    });
    dd.addEventListener('click', function (e) {
      var opt = e.target.closest('.dd-opt');
      if (!opt) return;
      input.value = opt.textContent;
      input.dataset.value = opt.dataset.value || '';
      closeDd();
      if (onPick) onPick(input.dataset.value);
    });
  }

  /** 可搜索单选(带班领导/所在单位):点击展开全量(当前项高亮),输入关键字过滤,选中回填并记录 id;onPick 供选中/清空时联动 */
  function bindSearchSelect(inputId, ddId, optionsFn, emptyText, onPick) {
    var input = $(inputId);
    var dd = $(ddId);
    function renderDd(kw) {
      var opts = optionsFn().filter(function (o) { return !kw || o.label.indexOf(kw) >= 0; });
      dd.innerHTML = opts.length
        ? opts.map(function (o) {
            return '<div class="dd-opt' + (input.dataset.value === o.value ? ' active' : '') + '" data-value="' + esc(o.value) + '">' + esc(o.label) + '</div>';
          }).join('')
        : '<div class="dd-empty">' + (emptyText || '无匹配人员') + '</div>';
    }
    input.addEventListener('click', function () {
      if (drawerState.mode === 'view' || openDd === dd) return;
      // 已选中值时点击展开全量(当前项高亮);手输未选择时按输入内容过滤
      renderDd(input.dataset.value ? '' : input.value.trim());
      openDdPanel(dd);
    });
    input.addEventListener('input', function () {
      if (drawerState.mode === 'view') return;
      input.dataset.value = ''; // 手动编辑后原选中失效,需重新选择
      if (onPick) onPick('');   // 联动项随之清空(如带班领导联系方式)
      renderDd(input.value.trim());
      if (openDd !== dd) openDdPanel(dd);
    });
    dd.addEventListener('click', function (e) {
      var opt = e.target.closest('.dd-opt');
      if (!opt) return;
      input.value = opt.textContent;
      input.dataset.value = opt.dataset.value || '';
      closeDd();
      if (onPick) onPick(input.dataset.value);
    });
  }

  /** 带班领导手机号(人员档案):id → mobile;未登记返回空串 */
  function leaderPhoneOf(id) {
    if (!id) return '';
    for (var i = 0; i < OPTIONS.users.length; i++) {
      if (String(OPTIONS.users[i].id) === String(id)) return OPTIONS.users[i].mobile || '';
    }
    return '';
  }

  /** 联系方式回显(选人后自动带出,只读;清空领导时同步清空) */
  function setLeaderPhone(id) {
    $('f-leader-phone').value = leaderPhoneOf(id);
  }

  // 所在单位:数据较多,支持输入关键字过滤(空态文案"无匹配单位")
  bindSearchSelect('f-unit', 'unit-dd', function () {
    return OPTIONS.orgs.map(function (o) { return { value: o.id, label: o.name }; });
  }, '无匹配单位');
  // 带班领导:选中后自动带出人员档案手机号
  bindSearchSelect('f-leader', 'leader-dd', function () {
    return OPTIONS.users.map(function (u) { return { value: u.id, label: u.name }; });
  }, '无匹配人员', setLeaderPhone);
  // 班次默认时段兜底:接口字典未返回 defaultStart/defaultEnd 时按班次名匹配
  var SHIFT_TIME_FALLBACK = {
    '白班': ['08:00', '16:00'],
    '中班': ['16:00', '24:00'],
    '夜班': ['00:00', '08:00']
  };

  // 班次:选项来自接口字典(白班/中班/夜班);历史班次名不在字典时并入显示
  bindSingleSelect('f-shift', 'shift-dd', function () {
    var opts = OPTIONS.shifts.map(function (s) { return { value: s.code, label: s.label }; });
    var cur = $('f-shift').value.trim();
    if (cur && !opts.some(function (o) { return o.label === cur; })) opts.unshift({ value: '', label: cur });
    return opts;
  }, function (code) {
    // 切换班次:按该班次默认时段重算开始/结束时间(字典优先,缺失时用内置兜底)
    var s = null;
    for (var i = 0; i < OPTIONS.shifts.length; i++) {
      if (OPTIONS.shifts[i].code === code) { s = OPTIONS.shifts[i]; break; }
    }
    var fb = SHIFT_TIME_FALLBACK[$('f-shift').value.trim()] || [];
    var st = (s && s.defaultStart) || fb[0];
    var en = (s && s.defaultEnd) || fb[1];
    if (!st || !en) return;
    // 开始日期沿用已填开始时间的日期,未填用今天;24:00 结束折算次日 00:00
    var curStart = $('f-time-start').value;
    var d = curStart ? curStart.slice(0, 10) : todayStr();
    var hm = String(en).slice(0, 5);
    var endDate = hm === '24:00' ? addDays(d, 1) : d;
    if (hm === '24:00') hm = '00:00';
    setField('f-time-start', d + ' ' + String(st).slice(0, 5));
    setField('f-time-end', endDate + ' ' + hm);
    checkTimeOrder();
  });

  /* ===== 多选(值班人员,框内直接输入搜索) ===== */
  var memberBox = $('f-members');
  var memberDd = $('member-dd');
  var memberKw = '';         // 搜索关键字

  function renderMemberBox() {
    var canEdit = drawerState.mode !== 'view';
    if (canEdit) {
      // 标签 + 内嵌搜索输入框(样式与带班领导一致);面板展开时重建后保持输入框焦点
      memberBox.innerHTML = memberSel.map(function (m) {
        return '<span class="m-tag">' + esc(m)
          + '<i class="m-x" data-m="' + esc(m) + '" title="移除">&times;</i>'
          + '</span>';
      }).join('')
        + '<input id="member-input" class="m-input" type="text" placeholder="' + (memberSel.length ? '' : '输入姓名搜索') + '" value="' + esc(memberKw) + '">';
      if (openDd === memberDd) {
        var mi = $('member-input');
        if (mi) { mi.focus(); mi.setSelectionRange(mi.value.length, mi.value.length); }
      }
    } else {
      memberBox.innerHTML = memberSel.map(function (m) {
        return '<span class="m-tag">' + esc(m) + '</span>';
      }).join('') || '<span class="m-placeholder">请选择</span>';
    }
  }

  /** 人员列表:按关键字过滤渲染到面板(已选中行高亮勾选) */
  function renderMemberList() {
    var kw = memberKw.trim();
    var users = kw ? OPTIONS.users.filter(function (u) { return u.name.indexOf(kw) >= 0; }) : OPTIONS.users;
    memberDd.innerHTML = users.length
      ? users.map(function (u) {
          var on = memberSel.indexOf(u.name) >= 0;
          return '<div class="dd-opt' + (on ? ' multi-on' : '') + '" data-m="' + esc(u.name) + '">'
            + esc(u.name)
            + (on ? '<svg class="dd-check" width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M2 6.2L4.8 9 10 3.4" stroke="#1677ff" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>' : '')
            + '</div>';
        }).join('')
      : '<div class="dd-empty">无匹配人员</div>';
  }

  function toggleMember(m) {
    var i = memberSel.indexOf(m);
    if (i >= 0) memberSel.splice(i, 1); else memberSel.push(m);
    memberKw = ''; // 选中/取消后清空搜索词,输入框重建为空
    renderMemberBox();
    if (openDd === memberDd) renderMemberList();
  }

  memberBox.parentNode.addEventListener('click', function (e) {
    if (drawerState.mode === 'view') return;
    var x = e.target.closest('.m-x');
    if (x) { e.stopPropagation(); toggleMember(x.dataset.m); return; }
    if (e.target.closest('#member-input')) {
      // 点输入框:未展开则展开;已展开保持(不切换关闭,允许移动光标)
      if (openDd !== memberDd) { renderMemberList(); openDdPanel(memberDd); }
      return;
    }
    if (e.target.closest('.sel-dd')) return; // 面板内点击(选项/空白)不触发开合,保持展开便于连续多选
    if (openDd === memberDd) { closeDd(); return; }
    renderMemberList();
    openDdPanel(memberDd);
    var mi = $('member-input');
    if (mi) mi.focus();
  });

  memberDd.addEventListener('mousedown', function (e) {
    if (e.target.closest('.dd-opt')) e.preventDefault(); // 点选不抢走输入框焦点,便于连续多选
  });
  memberDd.addEventListener('click', function (e) {
    var opt = e.target.closest('.dd-opt');
    if (!opt) return;
    // 点选后面板已重渲染,e.target 脱离 DOM;阻止冒泡,避免外层 select-wrap 的开合逻辑把它误判成点击框体而收起面板
    e.stopPropagation();
    toggleMember(opt.dataset.m);
  });
  memberBox.addEventListener('input', function (e) {
    if (e.target.id !== 'member-input') return;
    memberKw = e.target.value;
    renderMemberList();
    if (openDd !== memberDd) openDdPanel(memberDd);
  });

  /* ===== 值班时间选择(自绘日历面板) ===== */
  var calPanel = $('cal-panel');
  var rangeWrap = document.querySelector('.range-wrap'); // 值班时间输入行(错误态描红/清除)
  var calTarget = null;        // 绑定输入框:f-time-start / f-time-end
  var calY, calM;              // 面板显示年月
  var calDate, calHh, calMm;   // 当前选择日期与时刻

  /** 开始/结束先后校验:非法时输入框描红+标签旁错误文案,并禁用保存按钮(合法则清除);返回是否合法 */
  function checkTimeOrder() {
    var s = $('f-time-start').value;
    var e = $('f-time-end').value;
    var bad = !!(s && e && e <= s);
    rangeWrap.classList.toggle('error', bad);
    $('time-error').classList.toggle('show', bad);
    $('btn-drawer-confirm').disabled = bad; // 非法时保存按钮置灰不可点
    return !bad;
  }

  function pad2(n) { return (n < 10 ? '0' : '') + n; }

  /** 打开面板:按输入框现值初始化,无值则取今天当前时刻(不代填其它字段值,时间由用户自己选) */
  function openCal(inputId) {
    closeDd();
    calTarget = inputId;
    var v = $(inputId).value;
    if (!v) {
      var now = new Date();
      v = todayStr() + ' ' + pad2(now.getHours()) + ':' + pad2(now.getMinutes());
    }
    calDate = v.slice(0, 10);
    calHh = v.slice(11, 13);
    calMm = v.slice(14, 16);
    calY = +calDate.slice(0, 4);
    calM = +calDate.slice(5, 7);
    renderCal();
    calPanel.classList.add('open');
  }

  /** 渲染面板:月份导航 + 日期网格 + 时间步进 + 今天(选择实时写回输入框) */
  function renderCal() {
    var startW = new Date(calY, calM - 1, 1).getDay();
    var days = new Date(calY, calM, 0).getDate();
    var today = todayStr();
    var html = '<div class="cal-hd"><span class="cal-ym">' + calY + '年' + calM + '月</span>'
      + '<span class="cal-nav">'
      + '<button type="button" data-nav="-1" aria-label="上个月">‹</button>'
      + '<button type="button" data-nav="1" aria-label="下个月">›</button>'
      + '</span></div>'
      + '<div class="cal-week"><span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span></div>'
      + '<div class="cal-grid">';
    for (var i = 0; i < startW; i++) html += '<div class="cal-cell empty"></div>';
    for (var d = 1; d <= days; d++) {
      var ds = calY + '-' + pad2(calM) + '-' + pad2(d);
      var cls = 'cal-cell' + (ds === calDate ? ' sel' : (ds === today ? ' today' : ''));
      html += '<div class="' + cls + '" data-day="' + ds + '">' + d + '</div>';
    }
    html += '</div>'
      + '<div class="cal-ft">'
      + '<span class="cal-time">时间'
      + '<button type="button" class="cal-step" data-step="hh" data-d="-1">−</button><input class="cal-hm" type="text" inputmode="numeric" maxlength="2" data-kind="hh" value="' + calHh + '"><button type="button" class="cal-step" data-step="hh" data-d="1">+</button>'
      + '<i>:</i>'
      + '<button type="button" class="cal-step" data-step="mm" data-d="-1">−</button><input class="cal-hm" type="text" inputmode="numeric" maxlength="2" data-kind="mm" value="' + calMm + '"><button type="button" class="cal-step" data-step="mm" data-d="1">+</button>'
      + '</span>'
      + '<button type="button" class="cal-today-btn" data-today="1">今天</button>'
      + '</div>';
    calPanel.innerHTML = html;
  }

  /** 选择结果实时写回输入框 */
  function commitCal() {
    if (calTarget) $(calTarget).value = calDate + ' ' + calHh + ':' + calMm;
  }

  calPanel.addEventListener('click', function (e) {
    var nav = e.target.closest('[data-nav]');
    if (nav) {
      calM += +nav.dataset.nav;
      if (calM < 1) { calM = 12; calY--; }
      else if (calM > 12) { calM = 1; calY++; }
      renderCal();
      return;
    }
    var day = e.target.closest('[data-day]');
    if (day) { calDate = day.dataset.day; commitCal(); checkTimeOrder(); renderCal(); return; }
    var step = e.target.closest('[data-step]');
    if (step) {
      var d = +step.dataset.d;
      if (step.dataset.step === 'hh') calHh = pad2((+calHh + d + 24) % 24);
      else calMm = pad2((+calMm + d * 5 + 60) % 60);
      commitCal(); checkTimeOrder(); renderCal(); return;
    }
    if (e.target.closest('[data-today]')) {
      calDate = todayStr();
      calY = +calDate.slice(0, 4);
      calM = +calDate.slice(5, 7);
      commitCal(); checkTimeOrder(); renderCal();
    }
  });

  // 时间输入框:支持键盘输入时分;非数字即时剔除、超范围收敛(23/59),实时写回;失焦补零/恢复,回车确认
  calPanel.addEventListener('input', function (e) {
    var inp = e.target.closest('input.cal-hm');
    if (!inp) return;
    var v = inp.value.replace(/\D/g, '').slice(0, 2);
    if (inp.value !== v) inp.value = v;
    if (!v) return; // 清空时等失焦恢复为当前值
    var n = +v;
    if (inp.dataset.kind === 'hh') calHh = pad2(n > 23 ? 23 : n);
    else calMm = pad2(n > 59 ? 59 : n);
    commitCal();
    checkTimeOrder(); // 键盘改值同样实时同步红框与按钮状态
  });
  calPanel.addEventListener('focusout', function (e) {
    var inp = e.target.closest('input.cal-hm');
    if (!inp) return;
    inp.value = inp.dataset.kind === 'hh' ? calHh : calMm;
  });
  calPanel.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && e.target.closest('input.cal-hm')) e.target.blur();
  });

  // 点击输入框打开面板;点击面板外关闭
  document.querySelector('.range-wrap').addEventListener('click', function (e) {
    var inp = e.target.closest('.range-input');
    if (!inp || drawerState.mode === 'view') return;
    if (calTarget === inp.id && calPanel.classList.contains('open')) return;
    openCal(inp.id);
  });
  // 面板内点击会重渲染(innerHTML),e.target 脱离 DOM 后 closest 会失效误关面板;故用捕获阶段判断外部点击
  document.addEventListener('click', function (e) {
    if (e.target.closest('.range-wrap')) return;
    if (calPanel.classList.contains('open')) checkTimeOrder(); // 关闭面板时同步校验状态
    calPanel.classList.remove('open');
  }, true);

  /* ===== 抽屉 ===== */

  /** 设置文本字段值 */
  function setField(id, v) {
    $(id).value = v || '';
  }

  /** 打开抽屉:编辑/查看先取详情回显;新增直接空表单 */
  function openDrawer(mode, row) {
    drawerState.mode = mode;
    drawerState.id = row ? row.id : null;
    closeDd();

    if (row) {
      request(API_BASE + '/schedule/detail?id=' + encodeURIComponent(row.id)).then(function (d) {
        fillForm(d);
        openDrawerUI(mode);
      }).catch(function (err) { toast(err.message); });
    } else {
      fillForm(null);
      openDrawerUI(mode);
    }
  }

  /** 表单回显:d=null 为空表单;d 为详情对象(§3.3) */
  function fillForm(d) {
    calPanel.classList.remove('open');
    rangeWrap.classList.remove('error');
    $('time-error').classList.remove('show');
    $('btn-drawer-confirm').disabled = false; // 重置保存按钮,避免残留禁用
    if (d) {
      setField('f-shift', d.shift);
      $('f-shift').dataset.value = d.shiftCode || '';
      setField('f-time-start', d.timeStart);
      setField('f-time-end', d.timeEnd);
      setField('f-unit', d.orgName);
      $('f-unit').dataset.value = d.orgId || '';
      setField('f-leader', d.leaderName);
      $('f-leader').dataset.value = d.leaderId || '';
      // 联系方式优先取详情返回值(与档案同源),缺失时回落下拉数据
      $('f-leader-phone').value = d.leaderPhone || leaderPhoneOf(d.leaderId);
      memberSel = (d.memberNames || []).slice();
      (d.memberNames || []).forEach(function (n, i) {
        if (d.memberIds && d.memberIds[i]) memberIdMap[n] = d.memberIds[i];
      });
    } else {
      setField('f-shift', '');
      $('f-shift').dataset.value = '';
      setField('f-time-start', '');
      setField('f-time-end', '');
      setField('f-unit', '');
      $('f-unit').dataset.value = '';
      setField('f-leader', '');
      $('f-leader').dataset.value = '';
      setField('f-leader-phone', '');
      memberSel = [];
    }
    renderMemberBox();
  }

  function openDrawerUI(mode) {
    var TITLES = { add: '新增值班排班', edit: '编辑值班排班', view: '查看值班排班' };
    $('drawer-title').textContent = TITLES[mode] || '值班排班';
    drawer.classList.toggle('is-view', mode === 'view');
    if (mode === 'view') {
      $('btn-drawer-cancel').style.display = 'none';
      $('btn-drawer-confirm').textContent = '关闭';
    } else {
      $('btn-drawer-cancel').style.display = '';
      $('btn-drawer-confirm').textContent = '保存';
    }
    drawerMask.classList.add('show');
    drawer.classList.add('show');
  }

  function closeDrawer() {
    drawer.classList.remove('show');
    drawerMask.classList.remove('show');
    closeDd();
    calPanel.classList.remove('open');
  }

  $('drawer-close').addEventListener('click', closeDrawer);
  $('btn-drawer-cancel').addEventListener('click', closeDrawer);
  $('drawer-mask').addEventListener('click', closeDrawer);

  /* ===== 表单收集与校验 ===== */
  function validateForm() {
    var checks = [
      ['班次', $('f-shift').value.trim()],
      ['值班时间(开始时间)', $('f-time-start').value],
      ['值班时间(结束时间)', $('f-time-end').value],
      ['所在单位', $('f-unit').value],
      ['带班领导', $('f-leader').value]
    ];
    for (var i = 0; i < checks.length; i++) {
      if (!checks[i][1]) return checks[i][0];
    }
    if (!$('f-shift').dataset.value) return '班次(请从下拉中重新选择)';
    if (!$('f-unit').dataset.value) return '所在单位(请从下拉中重新选择)';
    if (!$('f-leader').dataset.value) return '带班领导(请从下拉中重新选择)';
    return '';
  }

  /** 'yyyy-MM-dd' 加 n 天 */
  function addDays(dateStr, n) {
    var d = new Date(dateStr + 'T00:00:00');
    d.setDate(d.getDate() + n);
    var m = d.getMonth() + 1, day = d.getDate();
    return d.getFullYear() + '-' + (m < 10 ? '0' + m : m) + '-' + (day < 10 ? '0' + day : day);
  }

  /** 今天的 'yyyy-MM-dd' */
  function todayStr() {
    var d = new Date();
    var m = d.getMonth() + 1, day = d.getDate();
    return d.getFullYear() + '-' + (m < 10 ? '0' + m : m) + '-' + (day < 10 ? '0' + day : day);
  }

  /** 表单 → 保存请求体(§3.5):时间已是 'yyyy-MM-dd HH:mm';dutyDate 由开始时间推导(接口仍要求);时段先后由保存前校验保证 */
  function collectForm() {
    var start = $('f-time-start').value;
    var end = $('f-time-end').value;
    return {
      dutyDate: start.slice(0, 10),
      shiftCode: $('f-shift').dataset.value,
      timeStart: start,
      timeEnd: end,
      orgId: $('f-unit').dataset.value,
      leaderId: $('f-leader').dataset.value,
      memberIds: memberSel.map(function (n) { return memberIdMap[n]; }).filter(function (x) { return !!x; })
    };
  }

  /* ===== 保存(新增/编辑) ===== */
  $('btn-drawer-confirm').addEventListener('click', function () {
    if (drawerState.mode === 'view') { closeDrawer(); return; }
    var missing = validateForm();
    if (missing) { toast('请填写「' + missing + '」'); return; }

    // 时段校验:结束时间须晚于开始时间(报红+轻提示;跨天值班请在日历面板中选择次日日期)
    if (!checkTimeOrder()) { toast('结束时间需晚于开始时间'); return; }

    var isEdit = drawerState.mode === 'edit';
    var payload = collectForm();
    payload.id = isEdit ? drawerState.id : null;

    var btn = this;
    btn.disabled = true;
    saveDuty(payload).then(function () {
      btn.disabled = false;
      closeDrawer();
      refreshView();
      toast(isEdit ? '保存成功' : '新增成功');
    }).catch(function (err) {
      btn.disabled = false;
      toast(err.message);
    });
  });

  /* ===== 删除 ===== */
  function askDelete(row) {
    pendingDeleteId = row.id;
    $('confirm-text').textContent = '确定删除「' + timeRangeText(row) + ' ' + (row.shift || '') + '」这条值班排班吗?删除后不可恢复。';
    confirmOverlay.classList.add('show');
  }

  $('btn-del-cancel').addEventListener('click', function () {
    confirmOverlay.classList.remove('show');
    pendingDeleteId = null;
  });

  $('btn-del-ok').addEventListener('click', function () {
    var btn = this;
    btn.disabled = true;
    deleteDuty(pendingDeleteId).then(function () {
      btn.disabled = false;
      confirmOverlay.classList.remove('show');
      pendingDeleteId = null;
      refreshView();
      toast('删除成功');
    }).catch(function (err) {
      btn.disabled = false;
      confirmOverlay.classList.remove('show');
      pendingDeleteId = null;
      toast(err.message);
    });
  });

  /* ===== 表格操作入口 ===== */
  $('btn-add').addEventListener('click', function () { openDrawer('add', null); });

  /** 统一执行记录操作:查看 / 编辑 / 删除 */
  function handleAction(action, row) {
    if (!row) return;
    if (action === 'view') openDrawer('view', row);
    else if (action === 'edit') openDrawer('edit', row);
    else if (action === 'delete') askDelete(row);
  }

  $('duty-tbody').addEventListener('click', function (e) {
    var el = e.target.closest('.act');
    if (!el) return;
    handleAction(el.dataset.action, findRow(el.dataset.id));
  });

  /* ===== 分页(本地切片,每页 10 条) ===== */
  /** 页码序列:≤7 页全显,否则 首…当前±1…末 */
  function pageNumbers(cur, total) {
    if (total <= 7) {
      var all = [];
      for (var i = 1; i <= total; i++) all.push(i);
      return all;
    }
    var out = [1];
    var start = Math.max(2, cur - 1);
    var end = Math.min(total - 1, cur + 1);
    if (start > 2) out.push('...');
    for (var p = start; p <= end; p++) out.push(p);
    if (end < total - 1) out.push('...');
    out.push(total);
    return out;
  }

  /** 渲染分页条:共 N 条 / ‹ 页码 › / 跳至 X 页 */
  function renderPager() {
    var totalPages = Math.max(1, Math.ceil(LIST_DATA.length / PAGE.size));
    var html = '<span class="pg-info">共 ' + LIST_DATA.length + ' 条</span><div class="pg-btns">' +
      '<button type="button" class="pg-btn" data-pg="prev"' + (PAGE.page <= 1 ? ' disabled' : '') + '>‹</button>';
    pageNumbers(PAGE.page, totalPages).forEach(function (p) {
      html += p === '...'
        ? '<span class="pg-ellipsis">···</span>'
        : '<button type="button" class="pg-btn' + (p === PAGE.page ? ' active' : '') + '" data-pg="' + p + '">' + p + '</button>';
    });
    html += '<button type="button" class="pg-btn" data-pg="next"' + (PAGE.page >= totalPages ? ' disabled' : '') + '>›</button></div>' +
      '<span class="pg-jump">跳至<input type="text" id="pg-jump" inputmode="numeric" aria-label="跳至页码"' +
      ' value="' + PAGE.page + '" autocomplete="off">页</span>';
    $('pg-bar').innerHTML = html;
  }

  /** 跳页:解析输入并夹取到有效范围后重渲染;无效输入恢复当前页显示 */
  function jumpToPage(val) {
    var totalPages = Math.max(1, Math.ceil(LIST_DATA.length / PAGE.size));
    var n = parseInt(String(val).trim(), 10);
    var target = isNaN(n) ? PAGE.page : Math.min(totalPages, Math.max(1, n));
    if (target !== PAGE.page) {
      PAGE.page = target;
      renderList();
    } else {
      renderPager(); // 恢复输入框显示为实际页码
    }
  }

  $('pg-bar').addEventListener('click', function (e) {
    var btn = e.target.closest('[data-pg]');
    if (!btn || btn.disabled) return;
    var totalPages = Math.max(1, Math.ceil(LIST_DATA.length / PAGE.size));
    var v = btn.dataset.pg;
    if (v === 'prev') PAGE.page = Math.max(1, PAGE.page - 1);
    else if (v === 'next') PAGE.page = Math.min(totalPages, PAGE.page + 1);
    else PAGE.page = Number(v);
    renderList();
  });
  $('pg-bar').addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && e.target && e.target.id === 'pg-jump') {
      e.preventDefault();
      jumpToPage(e.target.value);
    }
  });

  /* ===== 导入(模板下载 + 上传逐行结果) ===== */
  var impOverlay = $('imp-overlay');
  var impFile = null;

  function openImport() {
    impClear();
    impOverlay.classList.add('show');
  }

  function closeImport() { impOverlay.classList.remove('show'); }

  /** 清空已选文件(保留导入结果) */
  function impResetFile() {
    impFile = null;
    $('imp-file').value = '';
    $('imp-name').textContent = '';
    $('imp-meta').textContent = '支持 .xlsx';
  }

  function impHideResult() {
    $('imp-result').classList.remove('show');
    $('imp-sum').textContent = '';
    $('imp-rows').innerHTML = '';
  }

  function impClear() {
    impResetFile();
    impHideResult();
  }

  function impSetFile(file) {
    if (!file) return;
    if (!/\.xlsx$/i.test(file.name)) { toast('请上传 .xlsx 文件'); return; }
    impFile = file;
    $('imp-name').textContent = file.name;
    $('imp-meta').textContent = (file.size / 1024).toFixed(1) + ' KB';
    impHideResult();
  }

  function impShowResult(data) {
    var total = Number(data && data.total) || 0;
    var success = Number(data && data.success) || 0;
    var failed = Number(data && data.failed) || 0;
    var rows = (data && data.rows) || [];
    $('imp-sum').textContent = '共 ' + total + ' 行，成功 ' + success + '，失败 ' + failed;
    $('imp-rows').innerHTML = rows.map(function (r) {
      var extra = r.ok && r.dutyDate ? '（' + r.dutyDate + ' ' + (r.shift || '') + '）' : '';
      var msg = r.message ? ' — ' + r.message : (r.ok ? ' — 成功' : '');
      return '<div class="imp-row ' + (r.ok ? 'ok' : 'fail') + '">第 ' + r.row + ' 行' + esc(extra) + esc(msg) + '</div>';
    }).join('');
    $('imp-result').classList.add('show');
  }

  /** 模板下载(从 Content-Disposition 取文件名,与站点导入同口径) */
  function downloadDutyTemplate() {
    return fetch(API_BASE + '/schedule/import-template', { credentials: 'include' }).then(function (res) {
      return res.blob().then(function (blob) {
        if (!res.ok) {
          return blob.text().then(function (text) {
            var msg = text;
            try { var j = JSON.parse(text); msg = (j && j.message) || text; } catch (e) { /* 非 JSON 响应 */ }
            throw new Error(msg || '模板下载失败');
          });
        }
        var name = '值班排班导入模板.xlsx';
        var dispo = res.headers.get('Content-Disposition') || '';
        var star = dispo.match(/filename\*=UTF-8''([^;]+)/i);
        if (star) { try { name = decodeURIComponent(star[1]); } catch (e) { name = star[1]; } }
        else {
          var plain = dispo.match(/filename="?([^";]+)"?/i);
          if (plain) name = plain[1];
        }
        var url = URL.createObjectURL(blob);
        var a = document.createElement('a');
        a.href = url;
        a.download = name;
        document.body.appendChild(a);
        a.click();
        a.remove();
        URL.revokeObjectURL(url);
      });
    });
  }

  /** 上传导入:逐行结果由后端返回(整体性错误走非 2xx message) */
  function submitImport() {
    if (!impFile) { toast('请先选择文件'); return; }
    var btn = $('imp-submit');
    btn.disabled = true;
    var fd = new FormData();
    fd.append('file', impFile);
    fetch(API_BASE + '/schedule/import', { method: 'POST', credentials: 'include', body: fd })
      .then(function (res) {
        return res.text().then(function (text) {
          var json = null;
          try { json = text ? JSON.parse(text) : null; } catch (e) { /* 非 JSON 响应 */ }
          if (!res.ok) throw new Error((json && json.message) || text || ('导入失败(' + res.status + ')'));
          return json || {};
        });
      })
      .then(function (data) {
        impShowResult(data);
        impResetFile();   // 保留逐行结果,清空已选文件
        toast('成功 ' + (Number(data.success) || 0) + ' / 失败 ' + (Number(data.failed) || 0));
        refreshView();
      })
      .catch(function (err) { toast((err && err.message) || '导入失败'); })
      .then(function () { btn.disabled = false; });
  }

  $('btn-import').addEventListener('click', openImport);
  $('imp-close').addEventListener('click', closeImport);
  $('imp-overlay').addEventListener('click', function (e) { if (e.target === impOverlay) closeImport(); });
  $('imp-reset').addEventListener('click', impClear);
  $('imp-submit').addEventListener('click', submitImport);
  $('imp-tpl').addEventListener('click', function (e) {
    e.preventDefault();
    downloadDutyTemplate().catch(function (err) { toast((err && err.message) || '模板下载失败'); });
  });
  $('imp-drop').addEventListener('click', function () { $('imp-file').click(); });
  $('imp-drop').addEventListener('dragover', function (e) { e.preventDefault(); this.classList.add('drag'); });
  $('imp-drop').addEventListener('dragleave', function () { this.classList.remove('drag'); });
  $('imp-drop').addEventListener('drop', function (e) {
    e.preventDefault();
    this.classList.remove('drag');
    impSetFile(e.dataTransfer.files && e.dataTransfer.files[0]);
  });
  $('imp-file').addEventListener('change', function () { impSetFile(this.files && this.files[0]); });

  /* ===== 初始化:加载下拉选项 / 日历(默认视图) ===== */
  loadOptions().catch(function (err) { toast(err.message); });
  loadCalendar().catch(function (err) { toast(err.message); });
})();
</script>
</body>
</html>
