<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>值班/交接班</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:#fff;color:#333;font-size:14px;-webkit-font-smoothing:antialiased}
.page{padding:20px 24px 48px}
.page-title{font-size:20px;font-weight:600;color:#1f1f1f;margin-bottom:18px}
.lyt{display:flex;gap:36px;align-items:flex-start}
.col-left{width:380px;flex-shrink:0}
.col-right{flex:1;min-width:0}
@media (max-width:900px){.lyt{flex-direction:column}.col-left{width:100%}}
.duty-card{background:#f5f8fd;border-radius:8px;padding:18px 18px 16px}
.duty-card-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.duty-card-hd h3{font-size:16px;font-weight:600;color:#333}
.badge{display:inline-flex;align-items:center;height:22px;padding:0 10px;border-radius:11px;font-size:12px;font-weight:500;flex-shrink:0}
.badge.notstarted{background:#fff7e6;color:#fa8c16}
.badge.ongoing,.badge.completed{background:#e6f4ff;color:#1677ff}
.badge.none{background:#f0f0f0;color:#8c8c8c}
.record-no{font-size:13px;color:#8c8c8c;margin-bottom:10px}
.kv{display:flex;justify-content:space-between;gap:14px;line-height:28px;font-size:14px}
.kv .k{color:#8c8c8c;flex-shrink:0}
.kv .v{color:#333;text-align:right;word-break:break-all}
.card-acts{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;height:34px;padding:0 16px;border:1px solid transparent;border-radius:6px;font-size:14px;font-family:inherit;cursor:pointer;white-space:nowrap;transition:all .2s}
.btn-primary{background:#1677ff;color:#fff;border-color:#1677ff}
.btn-primary:hover{background:#4096ff;border-color:#4096ff}
.btn-default{background:#fff;color:#333;border-color:#d9d9d9}
.btn-default:hover{color:#1677ff;border-color:#1677ff}
.btn-sm{height:30px;padding:0 12px;font-size:13px}
.right-hd{display:flex;align-items:center;gap:8px;font-size:16px;font-weight:600;color:#1f1f1f;margin-bottom:20px}
.right-hd::before{content:'';width:4px;height:16px;border-radius:2px;background:#1677ff}
.timeline{position:relative;padding-left:30px}
.timeline::before{content:'';position:absolute;left:10px;top:10px;bottom:10px;width:1px;background:#e8e8e8}
.tl-item{position:relative;margin-bottom:16px}
.tl-item:last-child{margin-bottom:0}
.tl-dot{position:absolute;left:-30px;top:14px;width:20px;height:20px;display:inline-flex;align-items:center;justify-content:center;background:#fff}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block}
.dot-green{background:#52c41a}
.dot-orange{background:#fa8c16}
.tl-card{background:#fff;border:1px solid #f0f0f0;border-radius:8px;padding:12px 16px}
.tl-item.active .tl-card{border-color:#ffd591;background:#fffdf5}
.tl-top{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.tl-tag{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:4px;font-size:12px;font-weight:500}
.tl-tag.green{background:#f6ffed;color:#52c41a}
.tl-tag.orange{background:#fff7e6;color:#fa8c16}
.tl-time{font-size:13px;color:#333;white-space:nowrap}
.tl-body{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}
.person{display:flex;align-items:center;gap:10px;min-width:0}
.person-r .p-info{text-align:right}
.avatar{width:36px;height:36px;flex-shrink:0;display:inline-flex;align-items:center;justify-content:center;border-radius:50%;background:#4a7dff;color:#fff;font-size:15px;font-weight:500;line-height:1;user-select:none}
.p-info{display:flex;flex-direction:column;line-height:1.35;min-width:0}
.p-info b{font-size:14px;font-weight:500;color:#333;white-space:nowrap}
.p-info i{font-style:normal;font-size:12px;color:#8c8c8c;white-space:nowrap}
.crown{font-size:12px;margin-left:2px;vertical-align:2px}
.flow-icon{display:flex;flex-direction:column;align-items:center;gap:1px;font-size:12px;color:#8c8c8c;flex-shrink:0}
.flow-icon .fi{font-size:16px;line-height:1}
/* 倒计时禁止被 flex 压缩/换行截断(反馈:距交班0h42min 显示成 0h42m) */
.countdown{font-size:13px;color:#fa8c16;font-weight:500;white-space:nowrap;flex-shrink:0;margin-left:auto}
.ov{display:none;position:fixed;inset:0;z-index:1000;background:rgba(0,0,0,.45);align-items:flex-start;justify-content:center;padding:24px;overflow-y:auto}
.ov.show{display:flex}
.modal{background:#fff;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);width:100%}
.modal-sm{max-width:460px;margin-top:16vh}
.modal-lg{max-width:760px;margin-top:7vh}
.modal-xl{max-width:1200px;margin-top:5vh;position:relative}
.modal-hd{padding:20px 24px 0;font-size:18px;font-weight:600;color:#1f1f1f}
.modal-bd{padding:16px 24px 0}
.modal-ft{display:flex;justify-content:flex-end;gap:8px;padding:16px 24px 20px;border-top:1px solid #f0f0f0;margin-top:18px}
.form-item{margin-bottom:18px}
.form-item>label{display:block;margin-bottom:8px;font-size:14px;color:#333}
.req{color:#ff4d4f;font-style:normal;margin-left:2px}
textarea{width:100%;min-height:104px;border:1px solid #d9d9d9;border-radius:6px;padding:10px 12px;font-size:14px;font-family:inherit;color:#333;outline:none;resize:vertical;transition:border-color .2s,box-shadow .2s}
textarea:focus{border-color:#1677ff;box-shadow:0 0 0 2px rgba(22,119,255,.1)}
textarea::placeholder{color:#bfbfbf}
/* 必填校验错误态:红框 + 标签旁红字(与管理页错误态风格一致) */
textarea.error,textarea.error:focus{border-color:#ff4d4f;box-shadow:0 0 0 2px rgba(255,77,79,.1)}
.multi-box.error,.multi-box.error:hover{border-color:#ff4d4f;box-shadow:0 0 0 2px rgba(255,77,79,.1)}
.field-error{display:none;margin-left:8px;font-size:12px;color:#ff4d4f}
.field-error.show{display:inline}
.tips-text{font-size:14px;color:#333;line-height:22px;margin-bottom:12px}
.success-inner{padding:18px 0 6px;text-align:center}
.success-title{font-size:16px;font-weight:600;color:#333;margin:12px 0 8px}
.success-text{font-size:14px;color:#595959;line-height:22px}
.info-inner{display:flex;align-items:flex-start;gap:12px;padding:6px 0}
.info-title{font-size:15px;font-weight:600;color:#333;margin-bottom:4px}
.info-text{font-size:14px;color:#595959;line-height:22px}
.select-wrap{position:relative}
.multi-box{min-height:36px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;border:1px solid #d9d9d9;border-radius:6px;padding:5px 32px 5px 8px;background:#fff;cursor:pointer;transition:border-color .2s}
.multi-box:hover{border-color:#4096ff}
.m-placeholder{color:#bfbfbf;font-size:14px;padding-left:4px}
.m-tag{display:inline-flex;align-items:center;height:24px;padding:0 2px 0 8px;border-radius:4px;background:#f5f5f5;color:#333;font-size:13px}
.m-x{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;margin-left:2px;border-radius:50%;color:#999;font-size:15px;line-height:1;cursor:pointer;font-style:normal}
.m-input{flex:1;min-width:70px;height:24px;border:0;outline:none;background:transparent;font-size:14px;font-family:inherit;color:#333;padding:0 2px}
.m-input::placeholder{color:#bfbfbf}
.m-x:hover{color:#595959;background:#e6e6e6}
.chev{position:absolute;right:12px;top:50%;transform:translateY(-50%);display:inline-flex;pointer-events:none}
.sel-dd{display:none;position:absolute;left:0;right:0;top:calc(100% + 4px);z-index:20;max-height:220px;overflow-y:auto;background:#fff;border:1px solid #f0f0f0;border-radius:6px;box-shadow:0 6px 16px rgba(0,0,0,.08);padding:4px}
.sel-dd.open{display:block}
.dd-opt{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 12px;border-radius:4px;cursor:pointer;color:#333;font-size:14px}
.dd-opt:hover{background:#f5f5f5}
.dd-opt.multi-on{color:#1677ff;font-weight:500}
.dd-empty{padding:10px 12px;font-size:13px;color:#bfbfbf;text-align:center}
.toast{position:fixed;top:24px;left:50%;z-index:1500;padding:9px 18px;border:1px solid #d9d9d9;border-radius:6px;background:#fff;box-shadow:0 6px 16px rgba(0,0,0,.12);font-size:14px;color:#333;opacity:0;pointer-events:none;transform:translate(-50%,-16px);transition:opacity .25s,transform .25s;max-width:80vw}
.toast.show{opacity:1;transform:translate(-50%,0)}
.tl-empty{margin:16px 0;font-size:13px;color:#bfbfbf}
</style>
</head>
<body>
<div class="page">
  <h1 class="page-title">值班/交接班</h1>
  <div class="lyt">
    <aside class="col-left">
      <div class="duty-card">
        <div class="duty-card-hd">
          <h3>当前值班</h3>
          <span class="badge" id="duty-badge">值班中</span>
        </div>
        <p class="record-no" id="duty-record">记录编号:ZBJL-20260910-01</p>
        <div id="duty-kvs"></div>
        <div class="card-acts" id="duty-acts"></div>
      </div>
    </aside>
    <section class="col-right">
      <h3 class="right-hd">今日交接班动态</h3>
      <div class="timeline" id="timeline"></div>
    </section>
  </div>
</div>
<!-- 开始值班/值班签到弹窗(按待签到子形态自适应文案) -->
<div class="ov" id="start-ov">
  <div class="modal modal-sm" role="dialog" aria-label="开始值班">
    <div class="modal-hd" id="start-hd">开始值班</div>
    <div class="modal-bd">
      <div id="start-stage-1">
        <p class="tips-text" id="start-tips">今日您有值班安排,确认后开始值班并记录实际开始时间。</p>
        <div id="start-info"></div>
      </div>
      <div class="success-inner" id="start-stage-2" style="display:none">
        <svg width="48" height="48" viewBox="0 0 48 48" aria-hidden="true"><circle cx="24" cy="24" r="22" fill="#f6ffed" stroke="#52c41a" stroke-width="2"/><path d="M15 24.5l6 6 12-12" stroke="#52c41a" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <p class="success-title">值班签到成功</p>
        <p class="success-text">您已进入值班状态,请坚守岗位,认真做好各项工作。</p>
      </div>
    </div>
    <div class="modal-ft">
      <button type="button" class="btn btn-default" id="btn-start-cancel">取消</button>
      <button type="button" class="btn btn-primary" id="btn-start-ok">开始值班</button>
    </div>
  </div>
</div>

<!-- 通用提示弹窗(已完成值班 / 无值班安排) -->
<div class="ov" id="info-ov">
  <div class="modal modal-sm" role="dialog" aria-label="提示">
    <div class="modal-hd" id="info-hd">提示</div>
    <div class="modal-bd">
      <div class="info-inner">
        <span id="info-icon-done"><svg width="40" height="40" viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="18" fill="#f6ffed" stroke="#52c41a" stroke-width="2"/><path d="M12 20.5l5 5 10-10" stroke="#52c41a" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
        <span id="info-icon-info" style="display:none"><svg width="40" height="40" viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="18" fill="#e6f4ff" stroke="#1677ff" stroke-width="2"/><circle cx="20" cy="13.6" r="1.8" fill="#1677ff"/><path d="M20 18.6v9.4" stroke="#1677ff" stroke-width="2.6" stroke-linecap="round"/></svg></span>
        <div>
          <p class="info-title" id="info-title"></p>
          <p class="info-text" id="info-text"></p>
        </div>
      </div>
    </div>
    <div class="modal-ft">
      <button type="button" class="btn btn-primary" id="btn-info-ok">知道了</button>
    </div>
  </div>
</div>

<!-- 填写值班报告弹窗 -->
<div class="ov" id="report-ov">
  <div class="modal modal-lg" role="dialog" aria-label="填写值班报告">
    <div class="modal-hd">填写值班报告</div>
    <div class="modal-bd">
      <div class="form-item">
        <label>重大事件记载 <i class="req">*</i></label>
        <textarea id="f-events" placeholder="请输入本班发生的重大事件、处理措施与影响情况"></textarea>
      </div>
      <div class="form-item">
        <label>值班情况综述 <i class="req">*</i></label>
        <textarea id="f-summary" maxlength="800" placeholder="请输入本班值班重点工作、巡查发现、设备运行情况等总结"></textarea>
      </div>
    </div>
    <div class="modal-ft">
      <button type="button" class="btn btn-default" data-close>取消</button>
      <button type="button" class="btn btn-primary" id="btn-report-submit">提交报告</button>
    </div>
  </div>
</div>

<!-- 交接班弹窗 -->
<div class="ov" id="handover-ov">
  <div class="modal modal-lg" role="dialog" aria-label="交接班">
    <div class="modal-hd">交接班</div>
    <div class="modal-bd">
      <div class="form-item">
        <label>接班人员 <i class="req">*</i><span class="field-error" id="err-handover-users">请选择接班人员</span></label>
        <div class="select-wrap" id="handover-wrap">
          <div class="multi-box" id="handover-box"></div>
          <span class="chev"><svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M2.5 4.5L6 8l3.5-3.5" stroke="#bfbfbf" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
          <div class="sel-dd" id="handover-dd"></div>
        </div>
      </div>
      <div class="form-item">
        <label>待办移交事项 <i class="req">*</i><span class="field-error" id="err-handover-matters">请填写待办移交事项</span></label>
        <textarea id="f-matters" placeholder="请输入需移交给下一班的待办事项、注意事项与跟进要求"></textarea>
      </div>
    </div>
    <div class="modal-ft">
      <button type="button" class="btn btn-default" data-close>取消</button>
      <button type="button" class="btn btn-primary" id="btn-handover-ok">确认</button>
    </div>
  </div>
</div>

<!-- 轻提示 -->
<div class="toast" id="toast"></div>
<script>
(function () {
  'use strict';

  /* ===================== 接口区 =====================
   * 接口文档 v1.0《值班交接班接口.md》:
   *   今日值班四态 → GET  /duty/attendance/today
   *   开始值班     → POST /duty/attendance/start
   *   提交值班报告 → POST /duty/attendance/report
   *   交接班       → POST /duty/attendance/handover
   * ================================================= */

  var API_BASE = '/hltgq-site/duty';
  var redirected = false;

  /** 通用请求:同域自动带 Cookie;401 按 redirectUrl 跳登录;非 2xx 抛出 message */
  function request(url, opt) {
    var init = { method: (opt && opt.method) || 'GET', headers: {} };
    if (opt && opt.body !== undefined) {
      init.headers['Content-Type'] = 'application/json';
      init.body = JSON.stringify(opt.body);
    }
    return fetch(url, init).then(function (res) {
      return res.json().catch(function () { return null; }).then(function (data) {
        if (res.status === 401) {
          // 未登录:跳同域登录页(redirectUrl 可能指向上游绝对地址,需改成本站路径,登录 Cookie 才会落在本站)
          if (!redirected && data && data.redirectUrl) {
            redirected = true;
            var loginUrl = data.redirectUrl;
            try { var u = new URL(loginUrl, location.origin); loginUrl = u.pathname + u.search; } catch (e) { /* 保持原值 */ }
            location.href = loginUrl;
          }
          throw new Error((data && data.message) || '未登录');
        }
        if (!res.ok) throw new Error((data && data.message) || ('请求失败(' + res.status + ')'));
        return data;
      });
    });
  }

  /** 今日值班四态(ongoing/notstarted/completed/none) */
  function fetchTodayDuty() {
    return request(API_BASE + '/attendance/today');
  }

  /** 重新拉取今日值班并刷新卡片(同步刷新右栏动态) */
  function refreshToday() {
    return fetchTodayDuty().then(function (d) {
      current = d;
      renderDutyCard(current);
      loadTimeline();
    }).catch(function (err) { toast(err.message); });
  }

  /** 开始值班(签到):body 传 {scheduleId}(按排班签到,服务端为当前登录人生成/复用本人的值班记录;同班每人各签各的记录) */
  function startDuty(payload) {
    return request(API_BASE + '/attendance/start', { method: 'POST', body: payload });
  }

  /** 提交值班报告 */
  function submitReport(payload) {
    return request(API_BASE + '/attendance/report', { method: 'POST', body: payload });
  }

  /** 交接班 */
  function submitHandover(payload) {
    return request(API_BASE + '/attendance/handover', { method: 'POST', body: payload });
  }

  /* ===================== 基础工具 ===================== */
  function $(id) { return document.getElementById(id); }
  function esc(s) {
    return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }
  var toastTimer = null;
  function toast(msg) {
    var el = $('toast');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { el.classList.remove('show'); }, 2200);
  }
  function showOv(id) { $(id).classList.add('show'); }
  function hideOv(id) { $(id).classList.remove('show'); }

  // 弹窗取消/关闭按钮:统一按 [data-close] 处理
  Array.prototype.forEach.call(document.querySelectorAll('[data-close]'), function (btn) {
    btn.addEventListener('click', function () {
      var ov = btn.closest('.ov');
      if (ov) ov.classList.remove('show');
    });
  });

  /* ===================== 左侧:当前值班卡片 ===================== */
  var current = null;

  function renderDutyCard(data) {
    var badge = $('duty-badge');
    badge.textContent = data.badge;
    badge.className = 'badge ' + data.status;
    $('duty-record').textContent = '记录编号:' + (data.recordNo || '-');
    var rows = [
      ['值班日期', data.date],
      ['班次时间', data.shiftTime],
      ['单位', data.org],
      ['带班领导', data.leader],
      ['值班人员', data.members]
    ];
    if (data.status === 'ongoing' && data.myCheckinAt) {
      rows.push(['我的签到', data.myCheckinAt]);
    }
    if (data.status === 'completed') {
      rows.push(['实际开始', data.actualStart], ['实际交班', data.actualEnd]);
    }
    rows.push(['摘要', data.summary || '-']);
    $('duty-kvs').innerHTML = rows.map(function (r) {
      return '<div class="kv"><span class="k">' + r[0] + '</span><span class="v">' + esc(r[1] || '-') + '</span></div>';
    }).join('');
    renderDutyActs(data);
  }

  /** 操作按钮:值班中 → 填写报告/交班;未开始(含待签到)→ 开始值班/去签到;已完成/无安排 → 不显示按钮 */
  function renderDutyActs(data) {
    var html = '';
    if (data.status === 'ongoing') {
      html = '<button type="button" class="btn btn-primary" data-act="report">填写值班报告</button>'
           + '<button type="button" class="btn btn-primary" data-act="handover">交班</button>';
    } else if (data.status === 'notstarted') {
      // 「未开始」两子形态:badge「待签到」=班次已在途、本人尚未签到(去签到,签到后生成自己的记录);badge「未开始」=我的待值班排班(开始值班)
      var startLabel = data.badge === '待签到' ? '去签到' : '开始值班';
      html = '<button type="button" class="btn btn-primary" data-act="start">' + startLabel + '</button>';
    }
    $('duty-acts').innerHTML = html;
    $('duty-acts').style.display = html ? '' : 'none';
  }

  $('duty-acts').addEventListener('click', function (e) {
    var btn = e.target.closest('button[data-act]');
    if (!btn) return;
    var act = btn.dataset.act;
    if (act === 'start') openStartModal();
    else if (act === 'report') openReportModal();
    else if (act === 'handover') openHandoverModal();
  });

  /* ===================== 右栏:今日交接班动态(GET /duty/attendance/timeline) ===================== */
  var timelineOngoing = null; // 当前「值守中」行,用于倒计时刷新

  /** 拉取并渲染今日交接班动态;失败时给出明确提示,避免误读为真实数据 */
  function loadTimeline() {
    return request(API_BASE + '/attendance/timeline').then(function (d) {
      renderTimeline((d && d.items) || []);
    }).catch(function (err) {
      $('timeline').innerHTML = '<p class="tl-empty">' + esc(err.message || '动态加载失败') + '</p>';
    });
  }

  /** 渲染三类节点:已交班(绿点)/值守中(橙点高亮+倒计时)/待交接(缺口环) */
  function renderTimeline(items) {
    timelineOngoing = null;
    if (!items.length) {
      $('timeline').innerHTML = '<p class="tl-empty">今日暂无交接班动态</p>';
      return;
    }
    var html = '';
    for (var i = 0; i < items.length; i++) {
      var it = items[i];
      if (it.type === 'ongoing') timelineOngoing = it;
      html += it.type === 'handover' ? tlHandoverHtml(it) : (it.type === 'ongoing' ? tlOngoingHtml(it) : tlPendingHtml(it));
    }
    $('timeline').innerHTML = html;
  }

  /** 人员头像:取姓名最后一个字,蓝底圆形白字 */
  function avatarHtml(name) {
    var ch = String(name || '').trim();
    return '<span class="avatar">' + esc(ch ? ch.slice(-1) : '?') + '</span>';
  }

  /** 时间线人员:左侧(头像在前) */
  function tlPersonLeft(name, label) {
    return '<span class="person">' + avatarHtml(name)
      + '<span class="p-info"><b>' + esc(name) + '</b><i>' + label + '</i></span></span>';
  }

  /** 时间线人员:右侧(头像在后) */
  function tlPersonRight(name, label) {
    return '<span class="person person-r">'
      + '<span class="p-info"><b>' + esc(name) + '</b><i>' + label + '</i></span>'
      + avatarHtml(name) + '</span>';
  }

  function tlHandoverHtml(it) {
    var from = (it.fromUsers || []).map(function (n) { return tlPersonLeft(n, '交班人'); }).join('');
    var to = (it.toUsers || []).map(function (n) { return tlPersonRight(n, '接班人'); }).join('');
    return '<div class="tl-item done">'
      + '<span class="tl-dot"><i class="dot dot-green"></i></span>'
      + '<div class="tl-card">'
      + '<div class="tl-top"><span class="tl-tag green">' + esc(it.title) + '</span><span class="tl-time">' + esc(it.time || '') + '</span></div>'
      + '<div class="tl-body">' + from
      + '<span class="flow-icon"><span class="fi">🤝</span><i>交接</i></span>' + to
      + '</div></div></div>';
  }

  function tlOngoingHtml(it) {
    // 班次时段并入卡片头标签(只显示一次),人员行仅标注本人签到状态,避免长文案逐人重复
    var persons = (it.dutyUsers || []).map(function (n) { n = typeof n === 'string' ? { name: n, checkedIn: true } : (n || {});
      return '<span class="person">' + avatarHtml(n.name)
        + '<span class="p-info"><b>' + esc(n.name) + (n.leader ? '<span class="crown" title="带班领导">👑</span>' : '')
        + '</b><i>' + (n.checkedIn ? '正在值守' : '待签到') + '</i></span></span>';
    }).join('');
    return '<div class="tl-item active">'
      + '<span class="tl-dot"><i class="dot dot-orange"></i></span>'
      + '<div class="tl-card">'
      + '<div class="tl-top"><span class="tl-tag orange">' + esc(it.title) + (it.shiftTime ? ' ' + esc(String(it.shiftTime).replace(/-/g, '—')) : '') + '</span><span class="tl-time">' + esc(it.time || '') + '</span></div>'
      + '<div class="tl-body">' + persons
      + '<span class="countdown" id="tl-countdown">' + countdownText(it) + '</span>'
      + '</div></div></div>';
  }

  function tlPendingHtml(it) {
    var to = (it.toUsers || []).map(function (n) { return tlPersonRight(n, '接班人'); }).join('');
    return '<div class="tl-item">'
      + '<span class="tl-dot"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 1.8a6.2 6.2 0 1 1-6.2 6.2" fill="none" stroke="#fa8c16" stroke-width="1.6" stroke-linecap="round"/></svg></span>'
      + '<div class="tl-card">'
      + '<div class="tl-top"><span class="tl-tag orange">' + esc(it.title) + (it.shiftTime ? ' ' + esc(String(it.shiftTime).replace(/-/g, '—')) : '') + '</span><span class="tl-time">' + esc(it.time || '') + '</span></div>'
      + '<div class="tl-body"><span class="flow-icon"><span class="fi">⏳</span><i>待交接</i></span>' + to
      + '</div></div></div>';
  }

  /** 距交班倒计时:根据 shiftTime(如 08:00-16:00 / 20:00-次日08:00)计算 */
  function countdownText(it) {
    var m = /(\d{1,2}:\d{2})\s*-\s*(次日)?\s*(\d{1,2}:\d{2})/.exec((it && it.shiftTime) || '');
    if (!m) return '';
    var now = new Date();
    function at(hhmm, addDay) {
      var parts = hhmm.split(':');
      var d = new Date(now.getFullYear(), now.getMonth(), now.getDate(), parseInt(parts[0], 10), parseInt(parts[1], 10), 0);
      if (addDay) d.setDate(d.getDate() + 1);
      return d;
    }
    var start = at(m[1], false);
    var end = at(m[3], !!m[2] || at(m[3], false) <= start);
    var diff = end.getTime() - now.getTime();
    if (diff <= 0) return '待交班';
    var h = Math.floor(diff / 3600000);
    var mm = Math.floor((diff % 3600000) / 60000);
    return '距交班 ' + h + 'h' + mm + 'min';
  }

  /* ===================== 开始值班/待签到(两阶段) ===================== */
  function openStartModal() {
    // 待签到子形态(班次已在途、本人尚未签到,badge=待签到):弹窗按签到语义展示;否则为开始值班
    var isCheckin = !!(current && current.status === 'notstarted' && current.badge === '待签到');
    $('start-stage-1').style.display = '';
    $('start-stage-2').style.display = 'none';
    $('btn-start-cancel').style.display = '';
    $('start-hd').textContent = isCheckin ? '值班签到' : '开始值班';
    $('start-tips').textContent = isCheckin
      ? '当前班次已在值班中,您尚未签到。确认后将为您签到并生成您自己的值班记录。'
      : '今日您有值班安排,确认后开始值班并记录实际开始时间。';
    $('btn-start-ok').textContent = isCheckin ? '确认签到' : '开始值班';
    $('btn-start-ok').disabled = false;
    var d = current || {};
    var rows = [
      ['值班日期', d.date], ['班次时间', d.shiftTime], ['单位', d.org],
      ['带班领导', d.leader], ['值班人员', d.members]
    ];
    $('start-info').innerHTML = rows.map(function (r) {
      return '<div class="kv"><span class="k">' + r[0] + '</span><span class="v">' + esc(r[1] || '-') + '</span></div>';
    }).join('');
    showOv('start-ov');
  }

  $('btn-start-cancel').addEventListener('click', function () { hideOv('start-ov'); });
  $('btn-start-ok').addEventListener('click', function () {
    var btn = this;
    if ($('start-stage-1').style.display !== 'none') {
      // 阶段一:确认开始值班 → POST /duty/attendance/start(按排班签到,服务端为登录人生成/复用本人记录)
      var scheduleId = current && current.scheduleId;
      if (!scheduleId) { toast('缺少排班信息,无法开始值班'); return; }
      btn.disabled = true;
      startDuty({ scheduleId: scheduleId }).then(function (res) {
        btn.disabled = false;
        if (current) {
          current.recordId = (res && res.recordId) || current.recordId;
          current.recordNo = (res && res.recordNo) || current.recordNo;
        }
        $('start-stage-1').style.display = 'none';
        $('start-stage-2').style.display = '';
        $('btn-start-cancel').style.display = 'none';
        btn.textContent = '知道了';
      }).catch(function (err) {
        btn.disabled = false;
        toast(err.message);
      });
    } else {
      // 阶段二:签到成功,刷新卡片进入值班中
      hideOv('start-ov');
      refreshToday();
    }
  });

  /* ===================== 通用提示弹窗(已完成 / 无安排) ===================== */
  function openInfoModal(title, text, type) {
    $('info-title').textContent = title;
    $('info-text').textContent = text;
    $('info-icon-done').style.display = type === 'done' ? '' : 'none';
    $('info-icon-info').style.display = type === 'info' ? '' : 'none';
    showOv('info-ov');
  }
  $('btn-info-ok').addEventListener('click', function () { hideOv('info-ov'); });

  /* ===================== 填写值班报告 ===================== */
  /** 打开报告弹窗:回显本人已填报告(重大事件/综述均回显;各人报告独立,互不可见互不覆盖) */
  function openReportModal() {
    $('f-events').value = (current && current.events) || '';
    $('f-summary').value = (current && current.summary) || '';
    showOv('report-ov');
  }

  $('btn-report-submit').addEventListener('click', function () {
    var events = $('f-events').value.trim();
    var summary = $('f-summary').value.trim();
    if (!events) { toast('请填写重大事件记载'); return; }
    if (!summary) { toast('请填写值班情况综述'); return; }
    var recordId = current && current.recordId;
    if (!recordId) { toast('缺少值班记录,无法提交报告'); return; }
    var btn = this;
    btn.disabled = true;
    submitReport({ recordId: recordId, events: events, summary: summary }).then(function () {
      btn.disabled = false;
      hideOv('report-ov');
      if (current) {
        current.summary = summary || current.summary;
        current.events = events || current.events;
      }
      toast('值班报告已提交');
    }).catch(function (err) {
      btn.disabled = false;
      toast(err.message);
    });
  });

  /* ===================== 交接班(接班人员多选) ===================== */
  var handoverSel = [];      // 已选接班人员 id 数组
  var handoverOpts = [];     // 候选项 [{id,name}]
  var handoverKw = '';       // 接班人员搜索关键字
  var handoverTouched = false;    // 点过确认或改动过字段后才展示必填错误态(避免打开即红)
  var handoverSubmitting = false; // 交班请求进行中(防联动解禁导致重复提交)

  /** 交接班必填校验:接班人员与待办移交事项均不可为空;刷新红框红字并与确认按钮禁用强一致 */
  function refreshHandoverErr() {
    var noUsers = !handoverSel.length;
    var noMatters = !$('f-matters').value.trim();
    $('handover-box').classList.toggle('error', handoverTouched && noUsers);
    $('err-handover-users').classList.toggle('show', handoverTouched && noUsers);
    $('f-matters').classList.toggle('error', handoverTouched && noMatters);
    $('err-handover-matters').classList.toggle('show', handoverTouched && noMatters);
    $('btn-handover-ok').disabled = handoverSubmitting || (handoverTouched && (noUsers || noMatters));
    return !noUsers && !noMatters;
  }

  function openHandoverModal() {
    // 默认选中 today 的下一班候选(receiverCandidates);为空时用 /duty/options 的人员兜底
    handoverOpts = ((current && current.receiverCandidates) || []).slice();
    handoverSel = handoverOpts.map(function (u) { return u.id; });
    $('f-matters').value = '';
    handoverKw = '';
    handoverTouched = false; // 重置校验展示态:打开弹窗只展示初始值,点确认或改动后才提示
    renderHandoverBox();
    $('handover-dd').classList.remove('open');
    refreshHandoverErr();
    showOv('handover-ov');
    if (!handoverOpts.length) {
      request(API_BASE + '/options').then(function (d) {
        handoverOpts = ((d && d.users) || []).map(function (u) { return { id: u.id, name: u.name }; });
        if ($('handover-dd').classList.contains('open')) renderHandoverList();
      }).catch(function () {});
    }
  }
  function nameOfHandover(id) {
    for (var i = 0; i < handoverOpts.length; i++) { if (handoverOpts[i].id === id) return handoverOpts[i].name; }
    return id;
  }
  function renderHandoverBox() {
    // 标签 + 内嵌搜索输入框(与带班领导样式一致);面板展开时重建后保持输入框焦点
    $('handover-box').innerHTML = handoverSel.map(function (id) {
      return '<span class="m-tag">' + esc(nameOfHandover(id)) + '<i class="m-x" data-id="' + esc(id) + '">&times;</i></span>';
    }).join('')
      + '<input id="handover-input" class="m-input" type="text" placeholder="' + (handoverSel.length ? '' : '输入姓名搜索') + '" value="' + esc(handoverKw) + '">';
    if ($('handover-dd').classList.contains('open')) {
      var mi = $('handover-input');
      if (mi) { mi.focus(); mi.setSelectionRange(mi.value.length, mi.value.length); }
    }
  }
  /** 人员列表:按关键字过滤渲染到面板(已选中行高亮勾选) */
  function renderHandoverList() {
    var kw = handoverKw.trim();
    var opts = kw ? handoverOpts.filter(function (u) { return u.name.indexOf(kw) >= 0; }) : handoverOpts;
    $('handover-dd').innerHTML = opts.length
      ? opts.map(function (u) {
          var on = handoverSel.indexOf(u.id) >= 0;
          return '<div class="dd-opt' + (on ? ' multi-on' : '') + '" data-id="' + esc(u.id) + '">' + esc(u.name)
            + (on ? '<svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M2 6.2L4.8 9 10 3.4" stroke="#1677ff" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>' : '')
            + '</div>';
        }).join('')
      : '<div class="dd-empty">无匹配人员</div>';
  }
  function toggleHandover(id) {
    var i = handoverSel.indexOf(id);
    if (i >= 0) handoverSel.splice(i, 1); else handoverSel.push(id);
    handoverTouched = true; // 已操作选择框:即时校验(选空立即提示,重新选中立即消除)
    renderHandoverBox();
    renderHandoverList();
    refreshHandoverErr();
  }

  $('handover-wrap').addEventListener('click', function (e) {
    var x = e.target.closest('.m-x');
    if (x) { toggleHandover(x.dataset.id); return; }
    var opt = e.target.closest('.dd-opt');
    if (opt) { toggleHandover(opt.dataset.id); return; }
    if (e.target.closest('.sel-dd')) return; // 面板内空白点击不触发开合,保持展开便于连续多选
    var dd = $('handover-dd');
    if (e.target.closest('#handover-input')) {
      // 点输入框:未展开则展开;已展开保持(不切换关闭,允许移动光标)
      if (!dd.classList.contains('open')) { renderHandoverList(); dd.classList.add('open'); }
      return;
    }
    if (dd.classList.contains('open')) {
      dd.classList.remove('open');
      handoverKw = '';
      renderHandoverBox();
    } else {
      renderHandoverList();
      dd.classList.add('open');
      var mi = $('handover-input');
      if (mi) mi.focus();
    }
  });
  $('handover-dd').addEventListener('mousedown', function (e) {
    if (e.target.closest('.dd-opt')) e.preventDefault(); // 点选不抢走输入框焦点,便于连续多选
  });
  $('handover-box').addEventListener('input', function (e) {
    if (e.target.id !== 'handover-input') return;
    handoverKw = e.target.value;
    renderHandoverList();
    var dd = $('handover-dd');
    if (!dd.classList.contains('open')) dd.classList.add('open');
  });
  document.addEventListener('click', function (e) {
    if (!e.target.closest('#handover-wrap')) {
      var dd = $('handover-dd');
      if (dd.classList.contains('open')) {
        dd.classList.remove('open');
        handoverKw = '';
        renderHandoverBox();
      }
    }
  });

  // 待办移交事项:修改即进入即时校验(清空立即提示,补全立即消除)
  $('f-matters').addEventListener('input', function () {
    handoverTouched = true;
    refreshHandoverErr();
  });

  $('btn-handover-ok').addEventListener('click', function () {
    handoverTouched = true; // 点确认即进入校验展示态
    if (!refreshHandoverErr()) return; // 必填未过:红框红字已展示,拦截提交
    var recordId = current && current.recordId;
    if (!recordId) { toast('缺少值班记录,无法交班'); return; }
    var btn = this;
    handoverSubmitting = true;
    btn.disabled = true;
    submitHandover({ recordId: recordId, receiverIds: handoverSel.slice(), matters: $('f-matters').value.trim() }).then(function () {
      handoverSubmitting = false;
      btn.disabled = false;
      hideOv('handover-ov');
      toast('交接班已确认');
      refreshToday();
    }).catch(function (err) {
      handoverSubmitting = false;
      btn.disabled = false;
      refreshHandoverErr(); // 按最新字段值恢复红态与按钮禁用联动
      toast(err.message);
    });
  });

  /* ===================== 初始化:拉取今日值班 → 渲染卡片 → 按状态弹窗 ===================== */
  fetchTodayDuty().then(function (data) {
    current = data;
    renderDutyCard(current);
    if (data.status === 'notstarted') {
      openStartModal();
    } else if (data.status === 'completed') {
      openInfoModal('今日值班已完成', '您今日的值班已完成交班,辛苦了!', 'done');
    } else if (data.status === 'none') {
      openInfoModal('今日暂无值班安排', '您今日暂无值班安排,可前往值班管理查看排班情况。', 'info');
    }
    // ongoing:不弹窗,直接进入值班中页面
  }).catch(function (err) { toast(err.message); });

  // 右栏「今日交接班动态」独立加载
  loadTimeline();
  // 倒计时每分钟刷新一次
  setInterval(function () {
    var el = $('tl-countdown');
    if (el && timelineOngoing) el.textContent = countdownText(timelineOngoing);
  }, 60000);
})();
</script>
</body>
</html>
