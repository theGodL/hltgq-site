<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>用水总结</title>
<script src="./lib/echarts.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;max-width:100%;overflow:hidden}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:#f0f2f5;color:#333;font-size:14px}
.page-wrap{height:100%;min-height:0;padding:16px;display:flex;flex-direction:column;gap:12px;width:100%;max-width:100%;overflow:hidden}
.breadcrumb{color:#999;font-size:13px;flex-shrink:0}
.breadcrumb .sep{margin:0 6px}
.breadcrumb .cur{color:#333}

.card{background:#fff;border-radius:8px;box-shadow:0 1px 2px rgba(0,0,0,.03)}
.filter-card{padding:14px 16px;flex-shrink:0}
.filter-bar{display:flex;align-items:center;flex-wrap:wrap;gap:12px}

.seg{
  display:inline-flex;align-items:center;height:32px;padding:2px;gap:2px;
  border:none;border-radius:6px;overflow:hidden;background:#EBF1F8;flex-shrink:0;
}
.seg-btn{
  min-width:52px;padding:0 14px;border:none;background:transparent;color:#8aa0b8;font-size:14px;
  cursor:pointer;line-height:28px;height:28px;border-radius:4px;transition:all .15s;
}
.seg-btn:hover{color:#3d5a80}
.seg-btn.active{
  background:#fff;color:#2D679C;font-weight:500;
  box-shadow:0 1px 2px rgba(45,103,156,.12);
}

.date-range,.year-pick,.season-pick{
  display:inline-flex;align-items:center;gap:6px;height:32px;border:1px solid #d9d9d9;border-radius:6px;
  padding:0 10px;background:#fff;color:#333;flex-shrink:0;
}
.date-range:focus-within,.year-pick:focus-within,.season-pick:focus-within{
  border-color:#1677ff;box-shadow:0 0 0 2px rgba(22,119,255,.1);
}
.date-range input,.year-pick input,.season-pick select{
  border:none;outline:none;height:28px;font-size:13px;color:#333;background:transparent;font-family:inherit;
}
.date-range input[type=month]{width:128px}
.year-pick input[type=number]{width:64px;text-align:center}
.season-pick select{min-width:120px;cursor:pointer}
.date-sep{color:#bfbfbf;font-size:13px;user-select:none}
.cal-ico{color:#bfbfbf;display:inline-flex;flex-shrink:0}
.cal-ico svg{display:block}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:5px;padding:0 16px;height:32px;border:1px solid transparent;border-radius:6px;cursor:pointer;font-size:14px;white-space:nowrap;transition:all .2s;background:#fff}
.btn-primary{background:#1677ff;color:#fff;border-color:#1677ff}
.btn-primary:hover{background:#4096ff;border-color:#4096ff}
.btn-default{background:#fff;color:#333;border-color:#d9d9d9}
.btn-default:hover{color:#1677ff;border-color:#1677ff}
.btn-icon{
  width:32px;padding:0;color:#595959;
}
.btn-icon:hover{color:#1677ff;border-color:#1677ff}

.main-scroll{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;display:flex;flex-direction:column;gap:12px}
.main-scroll > *{flex-shrink:0}

.section-hd{
  display:flex;align-items:center;justify-content:space-between;padding:14px 16px 8px;gap:12px;
}
.section-title{
  display:flex;align-items:center;gap:8px;font-size:15px;font-weight:600;color:#1f1f1f;line-height:22px;
}
.section-title::before{
  content:'';width:3px;height:14px;border-radius:2px;background:#1677ff;flex-shrink:0;
}

.charts-row{
  display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:0 12px 16px;min-height:320px;
}
.chart-box{width:100%;height:320px;min-width:0;overflow:visible}

.table-card .section-bd{padding:0 0 8px}
.table-wrap{width:100%;overflow-x:auto;padding:0 16px}
table.data-table{width:100%;border-collapse:collapse;font-size:13px;table-layout:fixed}
table.data-table thead th{
  background:#F7FAFD !important;color:#595959;font-weight:500;padding:12px 10px;
  border-bottom:1px solid #f0f0f0;text-align:center !important;vertical-align:middle;white-space:nowrap;
}
table.data-table tbody td{
  padding:13px 10px;border-bottom:1px solid #f0f0f0;text-align:center !important;vertical-align:middle;color:#333;white-space:nowrap;
}
table.data-table tbody tr:last-child td{border-bottom:none}
table.data-table tbody tr:hover td{background:#fafafa}

.hidden{display:none !important}

@media (max-width:1100px){
  .charts-row{grid-template-columns:1fr}
}
@media (max-width:720px){
  html,body{overflow:auto}
  .page-wrap{height:auto;min-height:100%;overflow:visible}
}

@media print{
  html,body{overflow:visible;height:auto;background:#fff}
  .page-wrap{height:auto;overflow:visible;padding:0}
  .breadcrumb,.filter-card,.no-print{display:none !important}
  .main-scroll{overflow:visible}
  .card{box-shadow:none;border:1px solid #eee}
  .charts-row{break-inside:avoid}
}
</style>
</head>
<body>
<div class="page-wrap">
  <!-- 面包屑暂隐藏，后续可能不需要
  <div class="breadcrumb">
    <span>业务中心</span><span class="sep">/</span>
    <span class="cur">用水总结</span>
  </div>
  -->

  <div class="card filter-card no-print">
    <div class="filter-bar">
      <!-- 左侧统计维度 -->
      <div class="seg" id="seg-a" data-group="a">
        <button type="button" class="seg-btn active" data-dim="month">月</button>
        <button type="button" class="seg-btn" data-dim="season">灌季</button>
        <button type="button" class="seg-btn" data-dim="year">年</button>
      </div>
      <div class="date-range" id="pick-a-month">
        <input type="month" id="a-start" value="2026-01">
        <span class="date-sep">—</span>
        <input type="month" id="a-end" value="2026-09">
        <span class="cal-ico" aria-hidden="true">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>
          </svg>
        </span>
      </div>
      <div class="season-pick hidden" id="pick-a-season">
        <select id="a-season"></select>
      </div>
      <div class="year-pick hidden" id="pick-a-year">
        <input type="number" id="a-year" value="2026" min="2000" max="2100">
        <span class="cal-ico" aria-hidden="true">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>
          </svg>
        </span>
      </div>

      <!-- 右侧对比/辅助维度（按设计稿还原） -->
      <div class="seg" id="seg-b" data-group="b">
        <button type="button" class="seg-btn" data-dim="month">月</button>
        <button type="button" class="seg-btn" data-dim="season">灌季</button>
        <button type="button" class="seg-btn active" data-dim="year">年</button>
      </div>
      <div class="date-range hidden" id="pick-b-month">
        <input type="month" id="b-start" value="2026-01">
        <span class="date-sep">—</span>
        <input type="month" id="b-end" value="2026-09">
        <span class="cal-ico" aria-hidden="true">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>
          </svg>
        </span>
      </div>
      <div class="season-pick hidden" id="pick-b-season">
        <select id="b-season"></select>
      </div>
      <div class="year-pick" id="pick-b-year">
        <input type="number" id="b-year" value="2026" min="2000" max="2100">
        <span class="cal-ico" aria-hidden="true">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>
          </svg>
        </span>
      </div>

      <button type="button" class="btn btn-primary" id="btn-query">查询</button>
      <button type="button" class="btn btn-default" id="btn-reset">重置</button>
      <button type="button" class="btn btn-default btn-icon" id="btn-more" title="更多" aria-label="更多">
        <svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.6">
          <path d="M2 4l4 4 4-4"/>
        </svg>
      </button>
    </div>
  </div>

  <div class="main-scroll">
    <div class="card">
      <div class="section-hd">
        <div class="section-title">用水综合分析</div>
      </div>
      <div class="charts-row">
        <div class="chart-box" id="chart-usage"></div>
        <div class="chart-box" id="chart-fee"></div>
      </div>
    </div>

    <div class="card table-card">
      <div class="section-hd">
        <div class="section-title">灌溉用水总结报表</div>
        <button type="button" class="btn btn-default no-print" id="btn-print">打印报表</button>
      </div>
      <div class="section-bd">
        <div class="table-wrap">
          <table class="data-table">
            <thead>
              <tr>
                <th>统计时段</th>
                <th>用水量(万m³)</th>
                <th>灌溉水利用系数</th>
                <th>应收水费(万元)</th>
              </tr>
            </thead>
            <tbody id="tbody"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
(function () {
  var API = '/hltgq-site';
  var $ = function (id) { return document.getElementById(id); };

  var state = { a: 'month', b: 'year' };
  var chartUsage = null;
  var chartFee = null;

  function pad2(n) { return n < 10 ? '0' + n : String(n); }
  function todayYmd() {
    var d = new Date();
    return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
  }
  function thisMonth() {
    var d = new Date();
    return d.getFullYear() + '-' + pad2(d.getMonth() + 1);
  }
  function thisYear() { return String(new Date().getFullYear()); }

  function lastDayOfMonth(ym) {
    var p = String(ym || '').split('-');
    var y = Number(p[0]);
    var m = Number(p[1]);
    if (!y || !m) return '';
    var d = new Date(y, m, 0);
    return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
  }

  function seasonRange(key) {
    var y = String(key || '').slice(0, 4);
    if (!/^\d{4}$/.test(y)) return null;
    if (String(key).indexOf('autumn') >= 0) {
      return { start: y + '-09-01', end: y + '-10-31', label: y + '秋灌' };
    }
    return { start: y + '-05-01', end: y + '-08-31', label: y + '夏灌' };
  }

  function fillSeasonSelects() {
    var y = Number(thisYear());
    var opts = [];
    for (var i = y; i >= y - 2; i--) {
      opts.push('<option value="' + i + '-summer">' + i + '夏灌</option>');
      opts.push('<option value="' + i + '-autumn">' + i + '秋灌</option>');
    }
    var html = opts.join('');
    $('a-season').innerHTML = html;
    $('b-season').innerHTML = html;
    $('a-season').value = y + '-summer';
    $('b-season').value = y + '-summer';
  }

  function setDefaultDates() {
    var ym = thisMonth();
    var y = thisYear();
    $('a-start').value = y + '-01';
    $('a-end').value = ym;
    $('b-start').value = y + '-01';
    $('b-end').value = ym;
    $('a-year').value = y;
    $('b-year').value = y;
  }

  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
  function dash() { return '—'; }
  function fmt2(n) {
    if (n == null || n === '') return dash();
    var v = Number(n);
    if (!Number.isFinite(v)) return dash();
    return v.toFixed(2);
  }
  function fmt3(n) {
    if (n == null || n === '') return dash();
    var v = Number(n);
    if (!Number.isFinite(v)) return dash();
    return v.toFixed(3);
  }

  function toast(msg) {
    var el = document.getElementById('wus-toast');
    if (!el) {
      el = document.createElement('div');
      el.id = 'wus-toast';
      el.style.cssText = 'position:fixed;left:50%;top:24px;transform:translateX(-50%);background:rgba(0,0,0,.75);color:#fff;padding:8px 16px;border-radius:6px;font-size:13px;z-index:2000;opacity:0;pointer-events:none;transition:opacity .2s';
      document.body.appendChild(el);
    }
    el.textContent = msg;
    el.style.opacity = '1';
    clearTimeout(toast._t);
    toast._t = setTimeout(function () { el.style.opacity = '0'; }, 2400);
  }

  async function fetchApi(path) {
    var res = await fetch(API + path, { credentials: 'include' });
    var body = null;
    try { body = await res.json(); } catch (e) { body = null; }
    if (!res.ok) {
      var msg = (body && (body.message || body.msg)) || ('HTTP ' + res.status);
      throw new Error(msg);
    }
    if (body && typeof body === 'object' && !Array.isArray(body) && ('data' in body) && ('code' in body || 'msg' in body || 'message' in body)) {
      if (body.code != null && Number(body.code) !== 0) {
        throw new Error(body.msg || body.message || '请求失败');
      }
      return body.data;
    }
    return body;
  }

  function mapRows(list) {
    return (Array.isArray(list) ? list : []).map(function (r) {
      return {
        period: r.label || r.period || '—',
        usage: r.usage,
        coef: r.irrigationCoef,
        receivable: r.receivable
      };
    });
  }

  function resolveParams(group) {
    var dim = state[group];
    if (dim === 'month') {
      var startYm = $(group + '-start').value;
      var endYm = $(group + '-end').value;
      if (!startYm || !endYm) return { ok: false, msg: '请选择月份区间' };
      if (startYm > endYm) return { ok: false, msg: '开始月份不能晚于结束月份' };
      var start = startYm + '-01';
      var end = lastDayOfMonth(endYm);
      var spanY = Number(endYm.slice(0, 4)) - Number(startYm.slice(0, 4));
      if (spanY > 10 || (spanY === 10 && endYm.slice(5) > startYm.slice(5))) {
        return { ok: false, msg: '查询跨度不能超过 10 年' };
      }
      return { ok: true, dimension: 'month', startTime: start, endTime: end };
    }
    if (dim === 'season') {
      var key = $(group + '-season').value;
      var range = seasonRange(key);
      if (!range) return { ok: false, msg: '请选择灌季' };
      return { ok: true, dimension: 'season', startTime: range.start, endTime: range.end };
    }
    var year = String($(group + '-year').value || '').trim();
    if (!/^\d{4}$/.test(year)) return { ok: false, msg: '请输入有效年份' };
    return { ok: true, dimension: 'year', startTime: year + '-01-01', endTime: year + '-12-31' };
  }

  function qs(p) {
    return 'dimension=' + encodeURIComponent(p.dimension) +
      '&startTime=' + encodeURIComponent(p.startTime) +
      '&endTime=' + encodeURIComponent(p.endTime);
  }

  function niceMax(vals, fallback) {
    var max = 0;
    (vals || []).forEach(function (v) {
      var n = Number(v);
      if (Number.isFinite(n) && n > max) max = n;
    });
    if (max <= 0) return fallback;
    var step = Math.pow(10, Math.floor(Math.log10(max)));
    return Math.ceil(max / step) * step;
  }

  function niceCoefRange(vals) {
    var nums = (vals || []).map(Number).filter(Number.isFinite);
    if (!nums.length) return { min: 0, max: 1 };
    var min = Math.min.apply(null, nums);
    var max = Math.max.apply(null, nums);
    var pad = Math.max(0.05, (max - min) * 0.15);
    return {
      min: Math.max(0, +(min - pad).toFixed(3)),
      max: +Math.min(1.5, max + pad).toFixed(3)
    };
  }

  function renderTable(rows) {
    var tbody = $('tbody');
    if (!rows.length) {
      tbody.innerHTML = '<tr><td colspan="4" style="color:#bbb;padding:36px 10px">暂无数据</td></tr>';
      return;
    }
    tbody.innerHTML = rows.map(function (r) {
      return '<tr>' +
        '<td>' + esc(r.period) + '</td>' +
        '<td>' + esc(fmt2(r.usage)) + '</td>' +
        '<td>' + esc(fmt3(r.coef)) + '</td>' +
        '<td>' + esc(fmt2(r.receivable)) + '</td>' +
        '</tr>';
    }).join('');
  }

  function axisLabelOpt(x) {
    var many = (x || []).length > 6;
    return {
      color: '#8c8c8c',
      fontSize: 11,
      interval: 0,
      hideOverlap: false,
      rotate: many ? 35 : 0,
      margin: 10
    };
  }

  function gridOpt(x, extraRight) {
    var many = (x || []).length > 6;
    return {
      left: 12,
      right: Math.max(extraRight || 20, many ? 36 : 20),
      top: 44,
      bottom: many ? 64 : 36,
      containLabel: true
    };
  }

  function usageOption(rows) {
    var x = rows.map(function (r) { return r.period; });
    var usage = rows.map(function (r) { return r.usage == null ? null : Number(r.usage); });
    var coef = rows.map(function (r) { return r.coef == null ? null : Number(r.coef); });
    var cr = niceCoefRange(coef);
    return {
      color: ['#3b82f6', '#f5a623'],
      tooltip: {
        trigger: 'axis',
        axisPointer: { type: 'shadow' },
        backgroundColor: 'rgba(255,255,255,.96)',
        borderColor: '#e8e8e8',
        borderWidth: 1,
        textStyle: { color: '#333', fontSize: 12 },
        formatter: function (params) {
          if (!params || !params.length) return '';
          var head = params[0].axisValue;
          var lines = params.map(function (p) {
            var v = p.seriesName === '灌溉水利用系数' ? fmt3(p.value) : fmt2(p.value);
            return p.marker + p.seriesName + '  <b>' + v + '</b>';
          });
          return head + '<br/>' + lines.join('<br/>');
        }
      },
      legend: {
        top: 4, left: 'center', itemWidth: 10, itemHeight: 10, icon: 'roundRect',
        textStyle: { color: '#666', fontSize: 12 },
        data: [
          { name: '用水量', icon: 'roundRect' },
          { name: '灌溉水利用系数', icon: 'circle' }
        ]
      },
      grid: gridOpt(x, 48),
      xAxis: {
        type: 'category', data: x, axisTick: { show: false },
        axisLine: { lineStyle: { color: '#e8e8e8' } },
        axisLabel: axisLabelOpt(x)
      },
      yAxis: [
        {
          type: 'value', name: '万m³',
          nameTextStyle: { color: '#8c8c8c', fontSize: 11 },
          min: 0, max: niceMax(usage, 10),
          axisLine: { show: false }, axisTick: { show: false },
          splitLine: { lineStyle: { color: '#f0f0f0' } },
          axisLabel: { color: '#8c8c8c', fontSize: 12 }
        },
        {
          type: 'value', name: '系数',
          nameTextStyle: { color: '#8c8c8c', fontSize: 11 },
          min: cr.min, max: cr.max,
          axisLine: { show: false }, axisTick: { show: false },
          splitLine: { show: false },
          axisLabel: { color: '#8c8c8c', fontSize: 12 }
        }
      ],
      series: [
        {
          name: '用水量', type: 'bar', barWidth: 18, data: usage,
          itemStyle: {
            borderRadius: [3, 3, 0, 0],
            color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [
              { offset: 0, color: '#5b9cff' },
              { offset: 1, color: '#3b82f6' }
            ])
          }
        },
        {
          name: '灌溉水利用系数', type: 'line', yAxisIndex: 1, smooth: false,
          symbol: 'circle', symbolSize: 7, data: coef,
          lineStyle: { width: 2, color: '#f5a623' },
          itemStyle: { color: '#f5a623', borderColor: '#fff', borderWidth: 1 }
        }
      ]
    };
  }

  function feeOption(rows) {
    var x = rows.map(function (r) { return r.period; });
    var rec = rows.map(function (r) { return r.receivable == null ? null : Number(r.receivable); });
    return {
      color: ['#7eb6ff'],
      tooltip: {
        trigger: 'axis',
        axisPointer: { type: 'shadow' },
        backgroundColor: 'rgba(255,255,255,.96)',
        borderColor: '#e8e8e8',
        borderWidth: 1,
        textStyle: { color: '#333', fontSize: 12 },
        formatter: function (params) {
          if (!params || !params.length) return '';
          var head = params[0].axisValue;
          var lines = params.map(function (p) {
            return p.marker + p.seriesName + '  <b>' + fmt2(p.value) + '</b> 万元';
          });
          return head + '<br/>' + lines.join('<br/>');
        }
      },
      legend: {
        top: 4, left: 'center', itemWidth: 10, itemHeight: 10, icon: 'roundRect',
        textStyle: { color: '#666', fontSize: 12 }
      },
      grid: gridOpt(x, 28),
      xAxis: {
        type: 'category', data: x, axisTick: { show: false },
        axisLine: { lineStyle: { color: '#e8e8e8' } },
        axisLabel: axisLabelOpt(x)
      },
      yAxis: {
        type: 'value', name: '万元',
        nameTextStyle: { color: '#8c8c8c', fontSize: 11 },
        min: 0, max: niceMax(rec, 10),
        axisLine: { show: false }, axisTick: { show: false },
        splitLine: { lineStyle: { color: '#f0f0f0' } },
        axisLabel: { color: '#8c8c8c', fontSize: 12 }
      },
      series: [
        {
          name: '应收水费', type: 'bar', barWidth: 18, data: rec,
          itemStyle: { color: '#7eb6ff', borderRadius: [2, 2, 0, 0] }
        }
      ]
    };
  }

  function renderCharts(rows) {
    if (!chartUsage) chartUsage = echarts.init($('chart-usage'));
    if (!chartFee) chartFee = echarts.init($('chart-fee'));
    chartUsage.setOption(usageOption(rows), true);
    chartFee.setOption(feeOption(rows), true);
  }

  function syncPickers(group) {
    var dim = state[group];
    ['month', 'season', 'year'].forEach(function (k) {
      var el = $('pick-' + group + '-' + k);
      if (el) el.classList.toggle('hidden', k !== dim);
    });
  }

  function bindSeg(group) {
    var root = $('seg-' + group);
    root.addEventListener('click', function (e) {
      var btn = e.target.closest('.seg-btn');
      if (!btn) return;
      root.querySelectorAll('.seg-btn').forEach(function (b) { b.classList.remove('active'); });
      btn.classList.add('active');
      state[group] = btn.getAttribute('data-dim');
      syncPickers(group);
    });
  }

  function mergeRows(a, b) {
    var map = {};
    var order = [];
    function add(list) {
      (list || []).forEach(function (r) {
        var k = String(r.period || '');
        if (!k) return;
        if (!map[k]) {
          order.push(k);
          map[k] = {
            period: r.period,
            usage: r.usage,
            coef: r.coef,
            receivable: r.receivable
          };
          return;
        }
        var cur = map[k];
        // 同标签去重：优先保留已有非空值，空位用另一组补齐
        if (cur.usage == null && r.usage != null) cur.usage = r.usage;
        if (cur.coef == null && r.coef != null) cur.coef = r.coef;
        if (cur.receivable == null && r.receivable != null) cur.receivable = r.receivable;
      });
    }
    add(a);
    add(b);
    return order.map(function (k) { return map[k]; });
  }

  async function loadGroup(group) {
    var p = resolveParams(group);
    if (!p.ok) throw new Error(p.msg);
    var data = await fetchApi('/water-use-summary/report?' + qs(p));
    return mapRows(data);
  }

  async function refresh(showToast) {
    var btn = $('btn-query');
    btn.disabled = true;
    try {
      var results = await Promise.allSettled([loadGroup('a'), loadGroup('b')]);
      var errors = [];
      var rowsA = [];
      var rowsB = [];
      if (results[0].status === 'fulfilled') rowsA = results[0].value;
      else errors.push(results[0].reason && results[0].reason.message);
      if (results[1].status === 'fulfilled') rowsB = results[1].value;
      else errors.push(results[1].reason && results[1].reason.message);

      // 按统计时段去重合并，避免 A/B 同区间拼成「1~9 + 1~9」导致横轴乱序观感
      var rows = mergeRows(rowsA, rowsB);
      renderCharts(rows);
      renderTable(rows);

      if (errors.length === 2) toast(errors[0] || '数据加载失败');
      else if (errors.length) toast('部分数据加载失败：' + errors[0]);
      else if (showToast) toast('已刷新');
    } catch (e) {
      console.error(e);
      renderCharts([]);
      renderTable([]);
      toast((e && e.message) || '查询失败');
    } finally {
      btn.disabled = false;
    }
  }

  function resetFilters() {
    state.a = 'month';
    state.b = 'year';
    document.querySelectorAll('#seg-a .seg-btn').forEach(function (b) {
      b.classList.toggle('active', b.getAttribute('data-dim') === 'month');
    });
    document.querySelectorAll('#seg-b .seg-btn').forEach(function (b) {
      b.classList.toggle('active', b.getAttribute('data-dim') === 'year');
    });
    setDefaultDates();
    fillSeasonSelects();
    syncPickers('a');
    syncPickers('b');
    refresh(false);
  }

  fillSeasonSelects();
  setDefaultDates();
  bindSeg('a');
  bindSeg('b');
  syncPickers('a');
  syncPickers('b');

  $('btn-query').addEventListener('click', function () { refresh(true); });
  $('btn-reset').addEventListener('click', resetFilters);
  $('btn-print').addEventListener('click', function () { window.print(); });
  $('btn-more').addEventListener('click', function () {});

  window.addEventListener('resize', function () {
    if (chartUsage) chartUsage.resize();
    if (chartFee) chartFee.resize();
  });

  refresh(false);
})();
</script>
</body>
</html>
