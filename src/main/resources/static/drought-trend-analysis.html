<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>智能抗旱决策</title>
<script src="./lib/echarts.min.js"></script>
<script src="./lib/model-api.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;max-width:100%;overflow:hidden}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:#f0f2f5;color:#333;font-size:14px}
.page-wrap{height:100%;min-height:0;padding:16px;display:flex;flex-direction:column;gap:12px;width:100%;max-width:100%;box-sizing:border-box;overflow:hidden}
.breadcrumb{color:#999;font-size:13px;flex-shrink:0}
.breadcrumb .sep{margin:0 6px}
.breadcrumb .cur{color:#333}

.card{background:#fff;border-radius:8px;box-shadow:0 1px 2px rgba(0,0,0,.03)}
.filter-card{padding:14px 16px;flex-shrink:0}
.filter-bar{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap}
.filter-left{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.filter-left .lbl{color:#666;font-size:13px;white-space:nowrap}
.date-range{display:flex;align-items:center;gap:6px}
.field{height:32px;border:1px solid #d9d9d9;border-radius:6px;padding:0 10px;font-size:13px;outline:none;background:#fff;color:#333}
.field:focus{border-color:#1677ff;box-shadow:0 0 0 2px rgba(22,119,255,.1)}
.date-range .field{width:140px}
.select{min-width:180px;max-width:280px}
.date-sep{color:#999}
.filter-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:5px;padding:0 16px;height:32px;border:1px solid transparent;border-radius:6px;cursor:pointer;font-size:14px;white-space:nowrap;transition:all .2s;background:#fff}
.btn-primary{background:#1677ff;color:#fff;border-color:#1677ff}
.btn-primary:hover{background:#4096ff;border-color:#4096ff}
.btn-primary[disabled],.btn[disabled]{opacity:.55;cursor:not-allowed}
.btn-default{color:#333;border-color:#d9d9d9}
.btn-default:hover{color:#1677ff;border-color:#1677ff}
.hint{font-size:12px;color:#999}
.mock-tip{font-size:12px;color:#fa8c16;margin-left:4px}

.main-scroll{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;display:block;padding-right:2px}
.main-scroll > * + *{margin-top:12px}
.section-label{font-size:13px;font-weight:700;color:#1f1f1f;padding:2px 2px 0}
.chart-card{padding:16px 16px 12px;display:flex;flex-direction:column;flex-shrink:0}
.chart-hd{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:8px;flex-shrink:0;flex-wrap:wrap}
.chart-title{font-size:14px;font-weight:700;color:#1f1f1f;line-height:22px}
.chart-tip{font-size:12px;color:#999;margin-left:8px;font-weight:400}
.chart-box{width:100%;height:360px;min-height:360px;flex-shrink:0}
.seg-list{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px;flex-shrink:0}
.seg-chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:4px;font-size:12px;background:#f5f5f5;color:#595959}
.seg-chip.lv2{background:#fff7e6;color:#d48806}
.seg-chip.lv3{background:#fff1f0;color:#cf1322}
.seg-chip.lv4{background:#fff1f0;color:#a8071a;font-weight:600}
.seg-chip.lv5{background:#f9f0ff;color:#531dab;font-weight:600}

.toast{position:fixed;left:50%;top:24px;transform:translateX(-50%);background:rgba(0,0,0,.75);color:#fff;padding:8px 16px;border-radius:6px;font-size:13px;z-index:2000;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}

@media (max-width:900px){
  .chart-box{height:300px;min-height:300px}
}
</style>
</head>
<body>
<div class="page-wrap">
  <div class="breadcrumb">
    <span>智能决策</span><span class="sep">/</span>
    <span class="cur">智能抗旱决策</span>
  </div>

  <div class="card filter-card">
    <div class="filter-bar">
      <div class="filter-left">
        <span class="lbl">站点</span>
        <select class="field select" id="query-stcd"></select>
        <span class="lbl">日期</span>
        <div class="date-range">
          <input type="date" class="field" id="query-start">
          <span class="date-sep">—</span>
          <input type="date" class="field" id="query-end">
        </div>
      </div>
      <div class="filter-actions">
        <button type="button" class="btn btn-primary" id="query-btn">查询</button>
        <button type="button" class="btn btn-default" id="reset-btn">重置</button>
      </div>
    </div>
  </div>

  <div class="main-scroll" id="drought-scroll">
    <div class="section-label">实测墒情</div>
    <div class="card chart-card">
      <div class="chart-hd">
        <div class="chart-title">含水率（10/20/30cm） <span class="chart-tip" id="obs-tip"></span></div>
      </div>
      <div class="chart-box" id="chart-obs"></div>
    </div>

    <div class="section-label">预测墒情</div>
    <div class="card chart-card">
      <div class="chart-hd">
        <div class="chart-title">含水率 / 降雨（含国标干旱等级） <span class="chart-tip" id="pred-tip"></span></div>
      </div>
      <div class="chart-box" id="chart-pred"></div>
      <div id="drought-segs" class="seg-list"></div>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
(function () {
  function $(id) { return document.getElementById(id); }
  function toast(msg) {
    var el = $('toast');
    if (!el) return;
    el.textContent = msg || '';
    el.classList.add('show');
    clearTimeout(toast._t);
    toast._t = setTimeout(function () { el.classList.remove('show'); }, 2200);
  }
  function pad(n) { return n < 10 ? '0' + n : '' + n; }
  function fmtDate(d) {
    return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
  }
  function maxOf(arr, floor) {
    var m = floor == null ? 0 : floor;
    (arr || []).forEach(function (v) {
      if (v != null && isFinite(Number(v)) && Number(v) > m) m = Number(v);
    });
    return m;
  }
  function niceCeil(v, step) {
    step = step || 1;
    if (v <= 0) return step;
    return Math.ceil(v / step) * step;
  }
  function sanitizeMoisture(v) {
    if (v == null || v === '') return null;
    var n = Number(v);
    if (!isFinite(n) || n === -999 || n === -9991) return null;
    return n;
  }
  function shortLabel(t) {
    var s = String(t || '');
    return s.length > 16 ? s.slice(5, 16) : s;
  }

  var API = window.ModelApi;
  var charts = { obs: null, pred: null };
  var DROUGHT_LABEL = { '#1#': '无旱', '#2#': '轻旱', '#3#': '中旱', '#4#': '重旱', '#5#': '特旱' };

  function ensureChart(key, el) {
    if (!el || !window.echarts) return null;
    if (!charts[key]) charts[key] = echarts.init(el);
    return charts[key];
  }
  function emptyChart(key, elId, tip) {
    var c = ensureChart(key, $(elId));
    if (!c) return;
    c.clear();
    c.setOption({
      title: {
        text: tip || '暂无数据',
        left: 'center',
        top: 'middle',
        textStyle: { color: '#bbb', fontSize: 14, fontWeight: 'normal' }
      }
    });
    requestAnimationFrame(function () { c.resize(); });
  }
  function resizeCharts() {
    requestAnimationFrame(function () {
      Object.keys(charts).forEach(function (k) {
        if (charts[k]) charts[k].resize();
      });
    });
  }

  function fillStationSelect(el, list, selected) {
    list = list || [];
    el.innerHTML = list.map(function (s) {
      var id = s.stcd || s.code || '';
      var name = s.stnm || s.name || id;
      return '<option value="' + id + '">' + name + '</option>';
    }).join('');
    if (selected) el.value = selected;
    if (!el.value && list[0]) el.value = list[0].stcd || list[0].code || '';
  }

  function setDefaultDates() {
    var end = new Date();
    var start = new Date();
    start.setDate(end.getDate() - 14);
    $('query-start').value = fmtDate(start);
    $('query-end').value = fmtDate(end);
  }

  function droughtText(code) { return DROUGHT_LABEL[code] || code || '—'; }

  function aggregateDroughtSegments(rows) {
    var segs = [];
    var cur = null;
    (rows || []).forEach(function (r) {
      var level = r.droughtLevel || r.droughtCode;
      var tm = r.tm || r.hour || '';
      if (!level) return;
      if (!cur || cur.level !== level) {
        if (cur) segs.push(cur);
        cur = { level: level, start: tm, end: tm };
      } else {
        cur.end = tm;
      }
    });
    if (cur) segs.push(cur);
    return segs.filter(function (s) { return s.level && s.level !== '#1#'; });
  }

  function renderDroughtSegs(rows) {
    var box = $('drought-segs');
    var segs = aggregateDroughtSegments(rows);
    if (!segs.length) {
      box.innerHTML = '<span class="hint">当前站点无轻旱及以上时段</span>';
      return;
    }
    box.innerHTML = segs.map(function (s) {
      var n = String(s.level || '').replace(/#/g, '');
      var cls = 'seg-chip' + (n ? (' lv' + n) : '');
      var range = s.start === s.end ? s.start : (s.start + ' ~ ' + s.end);
      return '<span class="' + cls + '">' + droughtText(s.level) + ' · ' + range + '</span>';
    }).join('');
  }

  function renderObserved(payload) {
    var c = ensureChart('obs', $('chart-obs'));
    if (!c) return;
    var points = (payload && payload.observed && payload.observed.points) || [];
    if (!points.length) {
      emptyChart('obs', 'chart-obs', '暂无实测墒情');
      $('obs-tip').textContent = '';
      return;
    }
    $('obs-tip').textContent = (payload.stnm || payload.stcd || '') +
      ' · ' + [payload.startDate, payload.endDate].filter(Boolean).join(' ~ ');
    var labels = points.map(function (p) { return shortLabel(p.hour); });
    c.setOption({
      color: ['#867AF7', '#F0978E', '#66C0DC'],
      tooltip: { trigger: 'axis', valueFormatter: function (v) { return v == null ? '—' : v + '%'; } },
      legend: { bottom: 4, data: ['10cm', '20cm', '30cm'], textStyle: { color: '#666', fontSize: 12 } },
      grid: { left: 48, right: 24, top: 28, bottom: 48 },
      xAxis: {
        type: 'category', data: labels, boundaryGap: false,
        axisTick: { show: false },
        axisLine: { lineStyle: { color: '#e8e8e8' } },
        axisLabel: { color: '#8c8c8c', fontSize: 10, hideOverlap: true }
      },
      yAxis: {
        type: 'value', name: '%',
        nameTextStyle: { color: '#8c8c8c', fontSize: 11 },
        axisLabel: { color: '#8c8c8c' },
        splitLine: { lineStyle: { type: 'dashed', color: '#f0f0f0' } }
      },
      series: [
        {
          name: '10cm', type: 'line', showSymbol: false,
          itemStyle: { color: '#867AF7' }, lineStyle: { width: 2, color: '#867AF7' },
          data: points.map(function (p) { return sanitizeMoisture(p.mten); }),
          connectNulls: false
        },
        {
          name: '20cm', type: 'line', showSymbol: false,
          itemStyle: { color: '#F0978E' }, lineStyle: { width: 2, color: '#F0978E' },
          data: points.map(function (p) { return sanitizeMoisture(p.mtwenty); }),
          connectNulls: false
        },
        {
          name: '30cm', type: 'line', showSymbol: false,
          itemStyle: { color: '#66C0DC' }, lineStyle: { width: 2, color: '#66C0DC' },
          data: points.map(function (p) { return sanitizeMoisture(p.mthirty); }),
          connectNulls: false
        }
      ]
    }, true);
    requestAnimationFrame(function () { c.resize(); });
  }

  function renderForecast(payload) {
    var c = ensureChart('pred', $('chart-pred'));
    if (!c) return;
    var rows = (payload && payload.forecast && payload.forecast.points) || [];
    if (!rows.length) {
      emptyChart('pred', 'chart-pred', '暂无预测墒情');
      $('pred-tip').textContent = '';
      $('drought-segs').innerHTML = '';
      return;
    }
    $('pred-tip').textContent = (payload.stnm || payload.stcd || '') +
      ' · ' + [payload.startDate, payload.endDate].filter(Boolean).join(' ~ ');

    var labels = rows.map(function (r) { return shortLabel(r.tm); });
    var rain = rows.map(function (r) { return r.rainfall; });
    var m10 = rows.map(function (r) { return sanitizeMoisture(r.mten); });
    var m20 = rows.map(function (r) { return sanitizeMoisture(r.mtwenty); });
    var m30 = rows.map(function (r) { return sanitizeMoisture(r.mthirty); });
    var rainMax = niceCeil(Math.max(5, maxOf(rain, 0)), 1);

    c.setOption({
      color: ['#5B8FF9', '#867AF7', '#F0978E', '#66C0DC'],
      tooltip: { trigger: 'axis', axisPointer: { type: 'cross', link: [{ xAxisIndex: 'all' }] } },
      legend: {
        bottom: 4, left: 'center',
        data: ['降雨', '10cm', '20cm', '30cm'],
        textStyle: { color: '#666', fontSize: 12 }
      },
      axisPointer: { link: [{ xAxisIndex: 'all' }] },
      grid: [
        { left: 48, right: 24, top: 24, height: '26%' },
        { left: 48, right: 24, top: '44%', height: '38%' }
      ],
      xAxis: [
        {
          type: 'category', gridIndex: 0, data: labels, boundaryGap: true,
          axisLabel: { show: false }, axisTick: { show: false },
          axisLine: { lineStyle: { color: '#e8e8e8' } }
        },
        {
          type: 'category', gridIndex: 1, data: labels, boundaryGap: false,
          axisTick: { show: false },
          axisLine: { lineStyle: { color: '#e8e8e8' } },
          axisLabel: { color: '#8c8c8c', fontSize: 10, hideOverlap: true }
        }
      ],
      yAxis: [
        {
          type: 'value', gridIndex: 0, name: 'mm', min: 0, max: rainMax,
          nameTextStyle: { color: '#8c8c8c', fontSize: 11 },
          axisLabel: { color: '#8c8c8c' },
          splitLine: { lineStyle: { type: 'dashed', color: '#f0f0f0' } }
        },
        {
          type: 'value', gridIndex: 1, name: '%',
          nameTextStyle: { color: '#8c8c8c', fontSize: 11 },
          axisLabel: { color: '#8c8c8c' },
          splitLine: { lineStyle: { type: 'dashed', color: '#f0f0f0' } }
        }
      ],
      series: [
        {
          name: '降雨', type: 'bar', xAxisIndex: 0, yAxisIndex: 0, barMaxWidth: 10,
          itemStyle: { color: '#5B8FF9', borderRadius: [2, 2, 0, 0] }, data: rain
        },
        {
          name: '10cm', type: 'line', xAxisIndex: 1, yAxisIndex: 1, showSymbol: false,
          lineStyle: { width: 2, color: '#867AF7' }, data: m10, connectNulls: false
        },
        {
          name: '20cm', type: 'line', xAxisIndex: 1, yAxisIndex: 1, showSymbol: false,
          lineStyle: { width: 2, color: '#F0978E' }, data: m20, connectNulls: false
        },
        {
          name: '30cm', type: 'line', xAxisIndex: 1, yAxisIndex: 1, showSymbol: false,
          lineStyle: { width: 2, color: '#66C0DC' }, data: m30, connectNulls: false
        }
      ]
    }, true);
    renderDroughtSegs(rows);
    requestAnimationFrame(function () { c.resize(); });
  }

  async function loadSites() {
    var list = await API.droughtDecision.sites();
    fillStationSelect($('query-stcd'), list || []);
  }

  async function runQuery() {
    var stcd = ($('query-stcd').value || '').trim();
    var start = ($('query-start').value || '').trim();
    var end = ($('query-end').value || '').trim();
    if (!stcd) return toast('请选择站点');
    if (!start || !end) return toast('请选择日期');
    if (start > end) return toast('起始日期不能晚于截止日期');

    var btn = $('query-btn');
    btn.disabled = true;
    btn.textContent = '查询中…';
    emptyChart('obs', 'chart-obs', '加载中…');
    emptyChart('pred', 'chart-pred', '加载中…');
    $('drought-segs').innerHTML = '';

    try {
      var data = await API.droughtDecision.query(stcd, start, end);
      renderObserved(data);
      renderForecast(data);
    } catch (e) {
      emptyChart('obs', 'chart-obs', (e && e.message) || '查询失败');
      emptyChart('pred', 'chart-pred', (e && e.message) || '查询失败');
      toast((e && e.message) || '查询失败');
    } finally {
      btn.disabled = false;
      btn.textContent = '查询';
      resizeCharts();
    }
  }

  async function init() {
    setDefaultDates();
    emptyChart('obs', 'chart-obs', '请选择站点与日期后查询');
    emptyChart('pred', 'chart-pred', '请选择站点与日期后查询');

    $('query-btn').addEventListener('click', runQuery);
    $('reset-btn').addEventListener('click', function () {
      setDefaultDates();
      runQuery();
    });
    window.addEventListener('resize', resizeCharts);

    if (!API || !API.droughtDecision) {
      toast('接口客户端未加载');
      return;
    }
    try {
      await loadSites();
      await runQuery();
    } catch (e) {
      toast((e && e.message) || '初始化失败');
    }
  }

  init();
})();
</script>
</body>
</html>
