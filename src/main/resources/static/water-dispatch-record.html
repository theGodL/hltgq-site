<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>调度记录</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:#fff;color:#333;font-size:14px;-webkit-font-smoothing:antialiased}
.page-wrap{padding:20px 24px 48px}

/* 页面头部:左侧标题 + 统计小字,右侧「新增调度记录」 */
.page-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}
.head-left{display:flex;align-items:baseline;gap:10px;min-width:0}
.page-title{font-size:18px;font-weight:600;color:#1f1f1f}
.head-sub{font-size:13px;color:#8c8c8c;white-space:nowrap}

/* 按钮(与需水上报/调度方案页保持一致) */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:36px;padding:0 16px;border:1px solid transparent;border-radius:6px;font-size:14px;font-family:inherit;cursor:pointer;white-space:nowrap;transition:all .2s}
.btn-primary{background:#1677ff;color:#fff;border-color:#1677ff}
.btn-primary:hover{background:#4096ff;border-color:#4096ff}
.btn-primary:active{background:#0958d9;border-color:#0958d9}
.btn-default{background:#fff;color:#333;border-color:#d9d9d9}
.btn-default:hover{color:#1677ff;border-color:#1677ff}
.btn-danger{background:#ff4d4f;color:#fff;border-color:#ff4d4f}
.btn-danger:hover{background:#ff7875;border-color:#ff7875}
.btn:disabled{opacity:.6;cursor:not-allowed;pointer-events:none}
.btn svg{display:block;flex-shrink:0}

/* 工具栏:搜索框 + 用水户/闸口筛选下拉 + 重置 */
.toolbar{display:flex;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.search-wrap{position:relative;width:280px}
.srch-icon{position:absolute;left:10px;top:50%;transform:translateY(-50%);display:inline-flex;color:#bfbfbf;pointer-events:none}
.search-input{width:100%;height:36px;border:1px solid #d9d9d9;border-radius:6px;padding:0 12px 0 32px;font-size:14px;font-family:inherit;color:#333;outline:none;transition:border-color .2s,box-shadow .2s}
.search-input:focus{border-color:#1677ff;box-shadow:0 0 0 2px rgba(22,119,255,.1)}
.search-input::placeholder{color:#bfbfbf}
.filter-sel{width:200px}

/* 表格横向滚动容器:宽度只增不减(脚本 initTblGrowOnlyWidth 控制),页面收窄时表格宽度保持不动,由本容器出现横向滚动条 */
.tbl-wrap{overflow-x:auto}

/* 表格(与项目其他页面保持一致) */
.tbl{width:100%;border-collapse:collapse;table-layout:fixed;font-size:14px}
.tbl th{background:#fafafa;color:#333;font-weight:600;text-align:left;padding:12px 16px;border:1px solid #f0f0f0;white-space:nowrap}
.tbl td{padding:12px 16px;border:1px solid #f0f0f0;color:#333;line-height:22px;vertical-align:middle;overflow-wrap:break-word}
.cell-main{font-weight:600;color:#1f1f1f;line-height:22px}
.amt{font-weight:600;color:#1f1f1f}
.amt .unit{margin-left:2px;font-size:12px;color:#8c8c8c;font-weight:400}
.empty-cell{text-align:center;color:#bfbfbf;padding:32px 0}

/* 操作类型徽标:圆点 + 文字(提升=绿 / 下降=橙 / 流量调整=蓝) */
.st-tag{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:12px;font-size:12px;font-weight:500;line-height:1;white-space:nowrap}
.st-tag::before{content:'';width:6px;height:6px;border-radius:50%;background:currentColor;flex-shrink:0}
.st-tag.up{background:#f6ffed;color:#52c41a}
.st-tag.down{background:#fff7e6;color:#fa8c16}
.st-tag.adjust{background:#e6f4ff;color:#1677ff}

/* 操作列链接 */
.act{color:#1677ff;cursor:pointer;transition:color .2s;white-space:nowrap}
.act:hover{color:#4096ff}
.act.del{color:#ff4d4f}
.act.del:hover{color:#ff7875}
.tbl td .act + .act{margin-left:14px}

/* 分页栏(居右:共 N 条 / 页码 / 每页条数 / 跳页) */
.pg-bar{display:flex;align-items:center;justify-content:flex-end;padding:16px 0 0;gap:8px;flex-wrap:wrap}
.pg-info{color:#333;font-size:13px;margin-right:4px}
.pg-btns{display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.pg-btn{min-width:32px;height:32px;padding:0 6px;border:1px solid #d9d9d9;background:#fff;border-radius:6px;cursor:pointer;font-size:13px;color:#333;transition:all .2s;display:inline-flex;align-items:center;justify-content:center}
.pg-btn:hover:not([disabled]):not(.active){border-color:#1677ff;color:#1677ff}
.pg-btn.active{border-color:#1677ff;color:#1677ff}
.pg-btn[disabled]{color:#bfbfbf;cursor:not-allowed}
.pg-btn[data-pg="prev"],.pg-btn[data-pg="next"]{border-color:transparent;background:transparent;font-size:16px;color:#8c8c8c}
.pg-btn[data-pg="prev"]:hover:not([disabled]),.pg-btn[data-pg="next"]:hover:not([disabled]){border-color:transparent;background:transparent;color:#1677ff}
.pg-ellipsis{min-width:20px;height:32px;display:inline-flex;align-items:center;justify-content:center;color:#8c8c8c;font-size:13px;user-select:none;letter-spacing:1px}
.pg-size{height:32px;border:1px solid #d9d9d9;border-radius:6px;font-size:13px;color:#333;background:#fff;padding:0 8px;outline:none}
.pg-jump{display:flex;align-items:center;gap:6px;font-size:13px;color:#333}
.pg-jump input{width:52px;height:32px;border:1px solid #d9d9d9;border-radius:6px;text-align:center;font-size:13px;color:#333;background:#fff;outline:none;padding:0 8px}
.pg-jump input:focus{border-color:#1677ff}

/* 弹窗(居中模态:新增/编辑、删除确认共用) */
.ov{display:none;position:fixed;inset:0;z-index:1000;background:rgba(0,0,0,.45);align-items:flex-start;justify-content:center;padding:24px;overflow-y:auto}
.ov.show{display:flex}
.modal{position:relative;background:#fff;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);width:100%}
.modal-sm{max-width:460px;margin-top:16vh}
.modal-lg{max-width:720px;margin-top:6vh}
.modal-x{position:absolute;top:16px;right:16px;display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;padding:0;border:none;border-radius:4px;background:none;color:#595959;cursor:pointer;transition:color .2s,background .2s}
.modal-x:hover{color:#262626;background:#f5f5f5}
.modal-hd{padding:20px 24px 0;font-size:18px;font-weight:600;color:#1f1f1f}
.modal-sub{margin-top:4px;font-size:13px;color:#8c8c8c;font-weight:400}
.modal-bd{padding:16px 24px 0}
.modal-ft{display:flex;justify-content:flex-end;gap:8px;padding:16px 24px 20px;border-top:1px solid #f0f0f0;margin-top:18px}
.modal-ft .btn{height:36px;padding:0 18px}
.confirm-text{font-size:14px;color:#333;line-height:22px;word-break:break-all}

/* 表单(弹窗内:两列网格 + 必填红星 + 字段提示) */
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}
.form-grid .span2{grid-column:span 2}
.form-item{margin-bottom:18px}
.form-item > label{display:block;margin-bottom:8px;font-size:14px;color:#333}
.req{color:#ff4d4f;font-style:normal;margin-left:2px}
.ipt{width:100%;height:36px;border:1px solid #d9d9d9;border-radius:6px;background:#fff;padding:0 12px;font-size:14px;font-family:inherit;color:#333;outline:none;transition:border-color .2s,box-shadow .2s}
.ipt:focus{border-color:#1677ff;box-shadow:0 0 0 2px rgba(22,119,255,.1)}
.ipt::placeholder{color:#bfbfbf}
textarea.ipt{height:auto;min-height:88px;padding:8px 12px;line-height:22px;resize:vertical}
input[type="datetime-local"].ipt{cursor:pointer}
input[type="number"].ipt::-webkit-outer-spin-button,input[type="number"].ipt::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
input[type="number"].ipt{-moz-appearance:textfield;appearance:textfield}
.f-tip{margin-top:6px;font-size:12px;color:#8c8c8c;line-height:18px}

/* 下拉(统一支持输入模糊搜索) */
.select-wrap{position:relative}
.sel-input{width:100%;height:36px;border:1px solid #d9d9d9;border-radius:6px;background:#fff;padding:0 32px 0 12px;font-size:14px;font-family:inherit;color:#333;outline:none;cursor:pointer;transition:border-color .2s,box-shadow .2s}
.sel-input:focus{border-color:#1677ff;box-shadow:0 0 0 2px rgba(22,119,255,.1)}
.sel-input::placeholder{color:#bfbfbf}
.chev{position:absolute;right:12px;top:50%;transform:translateY(-50%);display:inline-flex;pointer-events:none}
.sel-dd{display:none;position:absolute;left:0;right:0;top:calc(100% + 4px);z-index:30;max-height:224px;overflow-y:auto;background:#fff;border:1px solid #f0f0f0;border-radius:6px;box-shadow:0 6px 16px rgba(0,0,0,.08);padding:4px}
.sel-dd.open{display:block}
.dd-opt{padding:8px 12px;border-radius:4px;cursor:pointer;color:#333;font-size:14px;line-height:20px}
.dd-opt:hover{background:#f5f5f5}
.dd-opt.active{background:#e6f4ff;color:#1677ff;font-weight:500}
.dd-empty{padding:10px 12px;font-size:13px;color:#bfbfbf;text-align:center}

/* 轻提示 */
.toast{position:fixed;top:24px;left:50%;z-index:1500;padding:9px 18px;border:1px solid #d9d9d9;border-radius:6px;background:#fff;box-shadow:0 6px 16px rgba(0,0,0,.12);font-size:14px;color:#333;opacity:0;pointer-events:none;transform:translate(-50%,-16px);transition:opacity .25s,transform .25s;max-width:80vw}
.toast.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<div class="page-wrap">
  <!-- 页面头部:标题 + 统计,右侧新增按钮 -->
  <div class="page-head">
    <div class="head-left">
      <h1 class="page-title">调度记录</h1>
      <span class="head-sub" id="head-sub">共 0 条 · 闸口操作留痕，不涉及水量与费用</span>
    </div>
    <button type="button" class="btn btn-primary" id="btn-add">
      <svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true">
        <path d="M6 1v10M1 6h10" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
      </svg>新增调度记录
    </button>
  </div>

  <!-- 工具栏:搜索 + 用水户筛选 + 闸口筛选 + 重置 -->
  <div class="toolbar">
    <div class="search-wrap">
      <span class="srch-icon">
        <svg width="14" height="14" viewBox="0 0 16 16" fill="none" aria-hidden="true">
          <circle cx="7" cy="7" r="4.5" stroke="currentColor" stroke-width="1.4"/>
          <path d="M10.6 10.6L14.4 14.4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
        </svg>
      </span>
      <input type="text" class="search-input" id="f-kw" placeholder="搜索操作人 / 备注 / 方案编号" autocomplete="off">
    </div>
    <div class="filter-sel">
      <div class="select-wrap">
        <input type="text" class="sel-input" id="f-flt-farmer" placeholder="全部用水户" autocomplete="off">
        <span class="chev"><svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M2.5 4.5L6 8l3.5-3.5" stroke="#bfbfbf" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
        <div class="sel-dd" id="flt-farmer-dd"></div>
      </div>
    </div>
    <div class="filter-sel">
      <div class="select-wrap">
        <input type="text" class="sel-input" id="f-flt-gate" placeholder="全部闸口" autocomplete="off">
        <span class="chev"><svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M2.5 4.5L6 8l3.5-3.5" stroke="#bfbfbf" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
        <div class="sel-dd" id="flt-gate-dd"></div>
      </div>
    </div>
    <button type="button" class="btn btn-default" id="btn-reset">重置</button>
  </div>

  <!-- 调度记录列表(宽度只增不减:收窄时表格不动,容器出横向滚动条) -->
  <div class="tbl-wrap">
    <table class="tbl">
      <colgroup>
        <col style="width:13%"><col style="width:11%"><col style="width:8%"><col style="width:11%"><col style="width:10%">
        <col style="width:8%"><col style="width:10%"><col style="width:21%"><col style="width:8%">
      </colgroup>
      <thead>
        <tr>
          <th>操作闸口</th><th>用水户</th><th>关联方案</th><th>操作时间</th><th>操作类型</th>
          <th>升降高度</th><th>操作人</th><th>备注</th><th>操作</th>
        </tr>
      </thead>
      <tbody id="tbl-body"></tbody>
    </table>
  </div>

  <!-- 分页栏 -->
  <div class="pg-bar" id="pg-bar"></div>
</div>

<!-- 新增/编辑调度记录弹窗(共用) -->
<div class="ov" id="form-ov">
  <div class="modal modal-lg" role="dialog" aria-label="调度记录">
    <button type="button" class="modal-x" data-close="form-ov" aria-label="关闭">
      <svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true">
        <path d="M1.5 1.5l11 11M12.5 1.5l-11 11" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
      </svg>
    </button>
    <div class="modal-hd">
      <div id="form-title">新增调度记录</div>
      <div class="modal-sub">闸口操作留痕：记录操作人、操作时间、操作闸口、升降高度等信息</div>
    </div>
    <div class="modal-bd">
      <div class="form-grid">
        <div class="form-item">
          <label>关联调度方案</label>
          <div class="select-wrap">
            <input type="text" class="sel-input" id="f-r-plan" placeholder="选择关联的调度方案" autocomplete="off">
            <span class="chev"><svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M2.5 4.5L6 8l3.5-3.5" stroke="#bfbfbf" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
            <div class="sel-dd" id="r-plan-dd"></div>
          </div>
        </div>
        <div class="form-item">
          <label>用水户 <i class="req">*</i></label>
          <div class="select-wrap">
            <input type="text" class="sel-input" id="f-r-farmer" placeholder="输入名称/编号搜索" autocomplete="off">
            <span class="chev"><svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M2.5 4.5L6 8l3.5-3.5" stroke="#bfbfbf" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
            <div class="sel-dd" id="r-farmer-dd"></div>
          </div>
        </div>
        <div class="form-item">
          <label>操作闸口 <i class="req">*</i></label>
          <div class="select-wrap">
            <input type="text" class="sel-input" id="f-r-gate" placeholder="输入名称/编号搜索" autocomplete="off">
            <span class="chev"><svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M2.5 4.5L6 8l3.5-3.5" stroke="#bfbfbf" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
            <div class="sel-dd" id="r-gate-dd"></div>
          </div>
          <div class="f-tip">指定闸口：按正位归集</div>
        </div>
        <div class="form-item">
          <label>操作时间 <i class="req">*</i></label>
          <input type="datetime-local" class="ipt" id="f-r-time">
        </div>
        <div class="form-item">
          <label>操作类型</label>
          <div class="select-wrap">
            <input type="text" class="sel-input" id="f-r-type" placeholder="闸门提升" autocomplete="off">
            <span class="chev"><svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M2.5 4.5L6 8l3.5-3.5" stroke="#bfbfbf" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
            <div class="sel-dd" id="r-type-dd"></div>
          </div>
        </div>
        <div class="form-item">
          <label>升降高度（cm）</label>
          <input type="number" class="ipt" id="f-r-height" min="0" max="999" step="1" placeholder="如 35" autocomplete="off">
          <div class="f-tip">闸门提升 / 下降的开度变化值，流量调整可填微调值</div>
        </div>
        <div class="form-item">
          <label>操作人 / 闸管员 <i class="req">*</i></label>
          <input type="text" class="ipt" id="f-r-operator" placeholder="如 闸管-马强" autocomplete="off" maxlength="50">
        </div>
        <div class="form-item span2">
          <label>备注</label>
          <textarea class="ipt" id="f-r-remark" placeholder="如 现场情况、指令依据等"></textarea>
        </div>
      </div>
    </div>
    <div class="modal-ft">
      <button type="button" class="btn btn-default" id="btn-form-cancel">取消</button>
      <button type="button" class="btn btn-primary" id="btn-form-save">
        <svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M2 6.2L4.8 9 10 3.4" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>保存
      </button>
    </div>
  </div>
</div>

<!-- 删除确认弹窗 -->
<div class="ov" id="confirm-ov">
  <div class="modal modal-sm" role="dialog" aria-label="删除确认">
    <button type="button" class="modal-x" data-close="confirm-ov" aria-label="关闭">
      <svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true">
        <path d="M1.5 1.5l11 11M12.5 1.5l-11 11" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
      </svg>
    </button>
    <div class="modal-hd">删除调度记录</div>
    <div class="modal-bd">
      <p class="confirm-text" id="confirm-text"></p>
    </div>
    <div class="modal-ft">
      <button type="button" class="btn btn-default" id="btn-del-cancel">取消</button>
      <button type="button" class="btn btn-danger" id="btn-del-ok">
        <svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M2 6.2L4.8 9 10 3.4" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>确认删除
      </button>
    </div>
  </div>
</div>

<!-- 轻提示 -->
<div class="toast" id="toast"></div>

<script>
(function () {
  'use strict';

  /* ==================== 接口层(数据全部来自后端接口,经 dev-proxy 代理) ==================== */

  var API_BASE = '/hltgq-site';

  function api(method, url, body, cb) {
    var opts = { method: method, headers: {} };
    if (body != null) {
      opts.headers['Content-Type'] = 'application/json';
      opts.body = JSON.stringify(body);
    }
    fetch(API_BASE + url, opts).then(function (res) {
      return res.json().catch(function () { return {}; }).then(function (data) {
        if (res.status === 401) { toast(data.message || '未登录或会话已过期'); cb(new Error('unauthorized')); return; }
        if (!res.ok) { toast(data.message || ('请求失败(' + res.status + ')')); cb(new Error(data.message || String(res.status))); return; }
        cb(null, data);
      });
    }, function () {
      /* 仅收拢 fetch 自身的网络故障;业务回调(渲染等)内的异常不再吞掉,直接冒泡到控制台便于排查 */
      toast('网络异常，请稍后重试');
      cb(new Error('network'));
    });
  }

  /* 下拉/字典数据源(初始化或联动时自接口加载,前端不写死) */
  var USERS = [];       // 用水户 4.5 /water-demand/users: {id,name,userNo}
  var GATES = [];       // 闸口池 1.1 /water-user/meta: {id,code,name}

  var LINK_PLANS = [];  // 未取消方案 6.4 /water-dispatch-record/plans
  var OP_TYPE_LIST = [  // 操作类型下拉(6.1 meta.opTypes 覆盖;默认与 0.4 一致)
    { value: 'up', label: '闸门提升' },
    { value: 'down', label: '闸门下降' },
    { value: 'adjust', label: '流量调整' }
  ];

  /** 操作类型徽标样式(英文码 → 文案/配色) */
  var OP_TYPES = {
    up: { text: '闸门提升', cls: 'up' },
    down: { text: '闸门下降', cls: 'down' },
    adjust: { text: '流量调整', cls: 'adjust' }
  };

  /* ==================== 基础工具 ==================== */

  function $(id) { return document.getElementById(id); }

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function pad2(n) { return (n < 10 ? '0' : '') + n; }

  function todayStr() {
    var d = new Date();
    return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
  }

  function nowInputStr() {
    var d = new Date();
    return todayStr() + 'T' + pad2(d.getHours()) + ':' + pad2(d.getMinutes());
  }

  /** datetime-local 值(2026-10-08T08:00) → 展示格式(2026-10-08 08:00) */
  function dtToText(v) { return String(v || '').replace('T', ' '); }

  var toastTimer = null;
  function toast(msg) {
    var t = $('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.classList.remove('show'); }, 2200);
  }

  /** 用水户下拉回填文案:名称（户号） */
  function userLabel(u) { return u.name + '（' + u.userNo + '）'; }
  function rowUserLabel(r) { return (r.waterUserName || '-') + (r.waterUserNo ? '（' + r.waterUserNo + '）' : ''); }
  function userOptions() { return USERS.map(function (u) { return { value: u.id, label: userLabel(u) }; }); }

  function gateOptions() { return GATES.map(function (g) { return { value: g.id, label: g.name }; }); }

  /** 关联方案下拉文案:方案编号 · 户名 · 闸口名(6.4) */
  function linkPlanLabel(p) { return (p.dispatchNo || '') + ' · ' + (p.waterUserName || '') + ' · ' + (p.gateName || ''); }
  function linkPlanOptions() {
    return [{ value: '', label: '不关联（独立操作）' }].concat(LINK_PLANS.map(function (p) {
      return { value: p.id, label: linkPlanLabel(p) };
    }));
  }
  function findLinkPlan(id) {
    for (var i = 0; i < LINK_PLANS.length; i++) { if (LINK_PLANS[i].id === id) return LINK_PLANS[i]; }
    return null;
  }

  /** 操作类型下拉(6.1 meta.opTypes) */
  function opTypeOptions() { return OP_TYPE_LIST; }

  /* ==================== 通用模糊搜索下拉 ==================== */

  var openDd = null;

  function closeDd() {
    if (openDd) openDd.classList.remove('open');
    openDd = null;
  }

  function openDdPanel(dd) {
    closeDd();
    dd.classList.add('open');
    openDd = dd;
  }

  function bindSearchSelect(inputId, ddId, optionsFn, emptyText, onPick) {
    var input = $(inputId);
    var dd = $(ddId);

    function renderDd(kw) {
      var list = optionsFn();
      var lower = String(kw || '').toLowerCase();
      var data = list.filter(function (o) {
        return !lower || String(o.label).toLowerCase().indexOf(lower) !== -1;
      });
      if (!data.length) {
        dd.innerHTML = '<div class="dd-empty">' + esc(emptyText || '无匹配数据') + '</div>';
        return;
      }
      dd.innerHTML = data.map(function (o) {
        var active = input.dataset.value && o.value === input.dataset.value ? ' active' : '';
        return '<div class="dd-opt' + active + '" data-value="' + esc(o.value) + '">' + esc(o.label) + '</div>';
      }).join('');
    }

    // 点击展开:未手动输入(输入为空,或与最近一次选中/回填的文案快照一致)时展示全量枚举;手动输入内容后才按关键词过滤
    input.addEventListener('click', function () {
      if (openDd === dd) { closeDd(); return; }
      var kw = input.value.trim();
      // 不能按 dataset.value 判空(“全部用水户/不关联”类选项的 value 为 '')；以选中/回填时记录的文案快照为准,枚举命中仅作兜底
      var pristine = !kw || kw === (input.dataset.label || '')
        || optionsFn().some(function (o) { return String(o.label) === kw; });
      renderDd(pristine ? '' : kw);
      openDdPanel(dd);
    });

    input.addEventListener('input', function () {
      input.dataset.value = '';
      input.dataset.label = ''; // 手动输入后清除文案快照,展开时按输入内容过滤
      renderDd(input.value.trim());
      if (openDd !== dd) openDdPanel(dd);
    });

    dd.addEventListener('mousedown', function (e) {
      var opt = e.target.closest('.dd-opt');
      if (!opt) return;
      e.preventDefault();
      input.value = opt.textContent;
      input.dataset.label = opt.textContent; // 记录选中项文案快照(供展开时判断“未手动输入”,“不关联”类空值选项同样适用)
      input.dataset.value = opt.dataset.value || '';
      closeDd();
      if (onPick) onPick(input.dataset.value);
    });
  }

  /* ==================== 列表渲染与筛选分页 ==================== */

  /** 列表状态:筛选/分页参数 + 最近一次服务端响应(0.1 分页结构) */
  var S = { kw: '', waterUserId: '', gateId: '', page: 1, size: 10, total: 0, pages: 1, rows: [] };

  /** 按 id 从当前页行数据中找(操作列/弹窗用) */
  function findRowById(id) {
    for (var i = 0; i < S.rows.length; i++) {
      if (S.rows[i].id === id) return S.rows[i];
    }
    return null;
  }

  /** 拉取列表(服务端筛选+分页,6.2) */
  var listSeq = 0;
  function loadList() {
    var seq = ++listSeq;
    var q = '?page=' + S.page + '&size=' + S.size;
    if (S.kw) q += '&keyword=' + encodeURIComponent(S.kw);
    if (S.waterUserId) q += '&waterUserId=' + encodeURIComponent(S.waterUserId);
    if (S.gateId) q += '&gateId=' + encodeURIComponent(S.gateId);
    api('GET', '/water-dispatch-record/page' + q, null, function (err, data) {
      if (err || seq !== listSeq) return;
      S.total = data.total || 0;
      S.pages = Math.max(1, data.pages || 1);
      S.rows = data.records || [];
      if (S.page > S.pages) { S.page = S.pages; loadList(); return; }
      renderRows(S.rows);
      renderPager();
      $('head-sub').textContent = '共 ' + S.total + ' 条 · 闸口操作留痕，不涉及水量与费用';
    });
  }

  function opTypeCell(r) {
    var meta = OP_TYPES[r.opType] || {};
    return '<td><span class="st-tag ' + (meta.cls || '') + '">' + esc(r.opTypeName || meta.text || r.opType) + '</span></td>';
  }

  function actionCell(r) {
    var id = esc(r.id);
    return '<td><span class="act" data-action="edit" data-id="' + id + '">编辑</span>'
      + '<span class="act del" data-action="delete" data-id="' + id + '">删除</span></td>';
  }

  function renderRows(rows) {
    if (!rows.length) {
      $('tbl-body').innerHTML = '<tr><td class="empty-cell" colspan="9">暂无数据</td></tr>';
      return;
    }
    $('tbl-body').innerHTML = rows.map(function (r) {
      var heightHtml = (r.height || r.height === 0)
        ? '<span class="amt">' + esc(r.height) + '<span class="unit">cm</span></span>'
        : '-';
      return '<tr>'
        + '<td><span class="cell-main">' + esc(r.gateName || '-') + (r.gateCode ? '（' + esc(r.gateCode) + '）' : '') + '</span></td>'
        + '<td>' + esc(r.waterUserName || '-') + '</td>'
        + '<td>' + esc(r.dispatchNo || '-') + '</td>'
        + '<td>' + esc(r.opTime) + '</td>'
        + opTypeCell(r)
        + '<td>' + heightHtml + '</td>'
        + '<td>' + esc(r.operator || '-') + '</td>'
        + '<td>' + esc(r.remark || '-') + '</td>'
        + actionCell(r)
        + '</tr>';
    }).join('');
  }

  /** 页码序列:超过7页时用省略号收缩 */
  function pageNumbers(total, cur) {
    if (total <= 7) {
      var arr = [];
      for (var i = 1; i <= total; i++) arr.push(i);
      return arr;
    }
    if (cur <= 4) return [1, 2, 3, 4, 5, '...', total];
    if (cur >= total - 3) return [1, '...', total - 4, total - 3, total - 2, total - 1, total];
    return [1, '...', cur - 1, cur, cur + 1, '...', total];
  }

  function renderPager() {
    var pages = S.pages;
    if (S.page > pages) S.page = pages;
    var nums = pageNumbers(pages, S.page);
    var btns = nums.map(function (n) {
      if (n === '...') return '<span class="pg-ellipsis">···</span>';
      return '<button type="button" class="pg-btn' + (n === S.page ? ' active' : '') + '" data-pg="page" data-num="' + n + '">' + n + '</button>';
    }).join('');
    $('pg-bar').innerHTML =
      '<span class="pg-info">共 ' + S.total + ' 条</span>'
      + '<span class="pg-btns">'
      + '<button type="button" class="pg-btn" data-pg="prev"' + (S.page <= 1 ? ' disabled' : '') + '>‹</button>'
      + btns
      + '<button type="button" class="pg-btn" data-pg="next"' + (S.page >= pages ? ' disabled' : '') + '>›</button>'
      + '</span>'
      + '<select class="pg-size" id="pg-size">'
      + [10, 20, 50].map(function (n) { return '<option value="' + n + '"' + (n === S.size ? ' selected' : '') + '>' + n + ' 条/页</option>'; }).join('')
      + '</select>'
      + '<span class="pg-jump">前往<input type="number" id="pg-jump" min="1" max="' + pages + '" value="' + S.page + '">页</span>';
  }

  function renderAll() {
    loadList();
  }

  /* ==================== 弹窗逻辑 ==================== */

  var formMode = 'add'; // add | edit
  var editId = '';
  var delId = '';

  function openModal(id) { $(id).classList.add('show'); }
  function closeModal(id) { $(id).classList.remove('show'); }

  function setSel(inputId, label, value) {
    var el = $(inputId);
    el.value = label || '';
    el.dataset.value = value || '';
    el.dataset.label = label || ''; // 记录回填文案快照:展开下拉时据此判断“未手动输入”
  }

  /** 选中关联调度方案后,自动带出用水户与操作闸口 */
  /** 选中关联调度方案后,自动带出用水户与操作闸口(6.4;提交时后端仍校验一致性) */
  function fillByPlan() {
    var p = findLinkPlan($('f-r-plan').dataset.value);
    if (!p) return;
    setSel('f-r-farmer', rowUserLabel(p), p.waterUserId || '');
    setSel('f-r-gate', (p.gateName || '') + (p.gateCode ? '（' + p.gateCode + '）' : ''), p.gateId || '');
  }

  function openFormModal(mode, row) {
    formMode = mode;
    editId = row ? row.id : '';
    $('form-title').textContent = mode === 'edit' ? '编辑调度记录' : '新增调度记录';

    if (mode === 'edit' && row) {
      setSel('f-r-plan', row.dispatchNo ? linkPlanLabel(row) : '不关联（独立操作）', row.dispatchId || '');
      setSel('f-r-farmer', rowUserLabel(row), row.waterUserId);
      setSel('f-r-gate', (row.gateName || '') + (row.gateCode ? '（' + row.gateCode + '）' : ''), row.gateId);
      $('f-r-time').value = String(row.opTime || '').replace(' ', 'T');
      setSel('f-r-type', row.opTypeName || (OP_TYPES[row.opType] || {}).text || '闸门提升', row.opType || 'up');
      $('f-r-height').value = (row.height === null || row.height === undefined) ? '' : row.height;
      $('f-r-operator').value = row.operator || '';
      $('f-r-remark').value = row.remark || '';
    } else {
      setSel('f-r-plan', '不关联（独立操作）', '');
      setSel('f-r-farmer', '', '');
      setSel('f-r-gate', '', '');
      $('f-r-time').value = nowInputStr();
      setSel('f-r-type', '闸门提升', 'up');
      $('f-r-height').value = '';
      $('f-r-operator').value = '';
      $('f-r-remark').value = '';
    }
    openModal('form-ov');
  }

  function saveForm() {
    var dispatchId = $('f-r-plan').dataset.value;
    var userId = $('f-r-farmer').dataset.value;
    var gateId = $('f-r-gate').dataset.value;
    var opTime = $('f-r-time').value;
    var opType = $('f-r-type').dataset.value || 'up';
    var heightRaw = $('f-r-height').value.trim();
    var operator = $('f-r-operator').value.trim();
    var remark = $('f-r-remark').value.trim();

    if (!userId) { toast('请选择「用水户」'); return; }
    if (!gateId) { toast('请选择「操作闸口」'); return; }
    if (!opTime) { toast('请选择「操作时间」'); return; }
    if (!operator) { toast('请输入「操作人 / 闸管员」'); return; }
    var height = null;
    if (heightRaw !== '') {
      height = Number(heightRaw);
      if (!isFinite(height) || height < 0 || height > 999) { toast('请输入正确的升降高度（0-999 cm）'); return; }
    }

    var payload = {
      waterUserId: userId,
      gateId: gateId,
      opTime: opTime,
      opType: opType,
      operator: operator
    };
    if (dispatchId) payload.dispatchId = dispatchId;
    if (height != null) payload.height = height;
    if (remark) payload.remark = remark;

    var btn = $('btn-form-save');
    btn.disabled = true;
    var isEdit = formMode === 'edit';
    var method = isEdit ? 'PUT' : 'POST';
    var url = isEdit ? '/water-dispatch-record/update?id=' + encodeURIComponent(editId) : '/water-dispatch-record/create';
    api(method, url, payload, function (err) {
      btn.disabled = false;
      if (err) return;
      closeModal('form-ov');
      toast(isEdit ? '已保存' : '新增成功');
      renderAll();
    });
  }

  function askDelete(row) {
    delId = row.id;
    $('confirm-text').textContent = '确认删除该条调度记录（' + (row.gateName || '-') + ' · ' + row.opTime + '）？删除后不可恢复。';
    openModal('confirm-ov');
  }

  function doDelete() {
    var btn = $('btn-del-ok');
    btn.disabled = true;
    api('DELETE', '/water-dispatch-record/delete?id=' + encodeURIComponent(delId), null, function (err) {
      btn.disabled = false;
      if (err) return;
      closeModal('confirm-ov');
      toast('已删除');
      renderAll();
    });
  }

  /* ==================== 事件绑定 ==================== */

  // 顶部按钮
  $('btn-add').addEventListener('click', function () { openFormModal('add'); });

  // 搜索(300ms 防抖,服务端 keyword 匹配 操作人/备注/方案编号)
  var kwTimer = null;
  $('f-kw').addEventListener('input', function () {
    var v = this.value.trim();
    clearTimeout(kwTimer);
    kwTimer = setTimeout(function () {
      S.kw = v;
      S.page = 1;
      renderAll();
    }, 300);
  });

  // 筛选下拉:全部用水户 / 全部闸口
  bindSearchSelect('f-flt-farmer', 'flt-farmer-dd', function () {
    return [{ value: '', label: '全部用水户' }].concat(USERS.map(function (u) {
      return { value: u.id, label: userLabel(u) };
    }));
  }, '无匹配用水户', function (v) { S.waterUserId = v; S.page = 1; renderAll(); });

  bindSearchSelect('f-flt-gate', 'flt-gate-dd', function () {
    return [{ value: '', label: '全部闸口' }].concat(GATES.map(function (g) {
      return { value: g.id, label: g.name };
    }));
  }, '无匹配闸口', function (v) { S.gateId = v; S.page = 1; renderAll(); });

  // 重置筛选
  $('btn-reset').addEventListener('click', function () {
    $('f-kw').value = '';
    setSel('f-flt-farmer', '全部用水户', '');
    setSel('f-flt-gate', '全部闸口', '');
    S.kw = ''; S.waterUserId = ''; S.gateId = ''; S.page = 1;
    renderAll();
  });

  // 表单弹窗内下拉
  bindSearchSelect('f-r-plan', 'r-plan-dd', linkPlanOptions, '无匹配方案', fillByPlan);
  bindSearchSelect('f-r-farmer', 'r-farmer-dd', userOptions, '无匹配用水户', null);
  bindSearchSelect('f-r-gate', 'r-gate-dd', gateOptions, '无匹配闸口', null);
  bindSearchSelect('f-r-type', 'r-type-dd', opTypeOptions, '无匹配类型', null);

  // 表单按钮
  $('btn-form-cancel').addEventListener('click', function () { closeModal('form-ov'); });
  $('btn-form-save').addEventListener('click', saveForm);

  // 删除确认
  $('btn-del-cancel').addEventListener('click', function () { closeModal('confirm-ov'); });
  $('btn-del-ok').addEventListener('click', doDelete);

  // 关闭按钮 + 点遮罩关闭(仅小弹窗允许点遮罩关,表单弹窗防误触)
  document.querySelectorAll('[data-close]').forEach(function (b) {
    b.addEventListener('click', function () { closeModal(b.dataset.close); });
  });
  $('confirm-ov').addEventListener('click', function (e) { if (e.target === this) closeModal('confirm-ov'); });

  // 表格内操作(事件委托)
  $('tbl-body').addEventListener('click', function (e) {
    var el = e.target.closest('.act');
    if (!el) return;
    var row = findRowById(el.dataset.id);
    if (!row) return;
    if (el.dataset.action === 'edit') openFormModal('edit', row);
    else if (el.dataset.action === 'delete') askDelete(row);
  });

  // 分页(事件委托)
  $('pg-bar').addEventListener('click', function (e) {
    var btn = e.target.closest('.pg-btn');
    if (!btn || btn.disabled) return;
    var type = btn.dataset.pg;
    var pages = S.pages;
    if (type === 'prev') S.page = Math.max(1, S.page - 1);
    else if (type === 'next') S.page = Math.min(pages, S.page + 1);
    else S.page = parseInt(btn.dataset.num, 10);
    renderAll();
  });

  $('pg-bar').addEventListener('change', function (e) {
    if (e.target.id === 'pg-size') {
      S.size = parseInt(e.target.value, 10);
      S.page = 1;
      renderAll();
    }
  });

  $('pg-bar').addEventListener('keydown', function (e) {
    if (e.target.id === 'pg-jump' && e.key === 'Enter') {
      var pages = S.pages;
      var n = parseInt(e.target.value, 10);
      if (isFinite(n) && n >= 1) { S.page = Math.min(pages, n); renderAll(); }
    }
  });

  // 点击空白处关闭下拉
  document.addEventListener('click', function (e) {
    if (!e.target.closest('.select-wrap')) closeDd();
  });

  /* ==================== 初始化:并行拉取字典/下拉(接口) + 首屏 ==================== */

  setSel('f-flt-farmer', '全部用水户', '');
  setSel('f-flt-gate', '全部闸口', '');

  // 6.1 操作类型字典(操作人 / 闸管员为纯文本输入,不做联想)
  api('GET', '/water-dispatch-record/meta', null, function (err, d) {
    if (!err && d && d.opTypes && d.opTypes.length) OP_TYPE_LIST = d.opTypes;
  });
  // 1.1 闸口池(操作闸口只能从该池选择)
  api('GET', '/water-user/meta', null, function (err, d) {
    if (!err && d) GATES = d.gates || [];
  });
  // 4.5 用水户下拉
  api('GET', '/water-demand/users', null, function (err, d) {
    if (!err) USERS = Array.isArray(d) ? d : [];
  });
  // 6.4 关联调度方案下拉(未取消的全部方案)
  api('GET', '/water-dispatch-record/plans', null, function (err, arr) {
    if (!err) LINK_PLANS = arr || [];
  });

  renderAll();
})();

/* ==================== 表格宽度只增不减 ==================== */

/* 初始与变宽时铺满可用宽度;页面收窄时表格宽度保持不动(一个像素都不跟随缩),由 .tbl-wrap 立即出现横向滚动条。 */
(function initTblGrowOnlyWidth() {
  var wrap = document.querySelector('.tbl-wrap');
  var tbl = wrap && wrap.querySelector('table');
  if (!wrap || !tbl) return;
  var highW = 0; // 铺满基准:见过的最大可用宽度(只增不减)
  function sync() {
    var avail = wrap.clientWidth;
    if (avail <= 0 || avail <= highW) return; // 未超过历史最大宽度:宽度保持不动,交由横向滚动条
    highW = avail;
    tbl.style.width = avail + 'px'; // 铺满当前可用宽度
  }
  sync();
  if (window.ResizeObserver) new ResizeObserver(sync).observe(wrap);
  else window.addEventListener('resize', sync);
})();
</script>
</body>
</html>
