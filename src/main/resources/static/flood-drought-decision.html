<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>防洪抗旱决策</title>
<script src="./lib/echarts.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;max-width:100%;overflow:hidden}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:#f0f2f5;color:#333;font-size:14px}
.page-wrap{height:100%;min-height:0;padding:16px;display:flex;flex-direction:column;gap:12px;width:100%;max-width:100%;box-sizing:border-box;overflow:hidden}
.breadcrumb{color:#999;font-size:13px;flex-shrink:0}
.breadcrumb .sep{margin:0 6px}
.breadcrumb .cur{color:#333}

.card{background:#fff;border-radius:8px;box-shadow:0 1px 2px rgba(0,0,0,.03)}

.filter-card{padding:14px 16px;flex-shrink:0}
.filter-bar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.filter-left{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.filter-left .lbl{color:#666;font-size:14px;white-space:nowrap}
.date-range{display:flex;align-items:center;gap:6px}
.date-range .field{width:140px;height:32px;border:1px solid #d9d9d9;border-radius:6px;padding:0 11px;font-size:13px;outline:none;background:#fff;color:#333}
.date-range .field:focus{border-color:#1677ff;box-shadow:0 0 0 2px rgba(22,119,255,.1)}
.date-sep{color:#999}
.filter-actions{display:flex;align-items:center;gap:8px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:5px;padding:0 16px;height:32px;border:1px solid transparent;border-radius:6px;cursor:pointer;font-size:14px;white-space:nowrap;transition:all .2s;background:#fff}
.btn-primary{background:#1677ff;color:#fff;border-color:#1677ff}
.btn-primary:hover{background:#4096ff;border-color:#4096ff}
.btn-default{color:#333;border-color:#d9d9d9}
.btn-default:hover{color:#1677ff;border-color:#1677ff}

.main-scroll{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;display:flex;flex-direction:column;gap:12px;padding-right:2px}

.chart-card{padding:16px 16px 12px;display:flex;flex-direction:column;min-height:0}
.chart-hd{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:8px;flex-shrink:0}
.chart-title{font-size:14px;font-weight:700;color:#1f1f1f;line-height:22px}
.chart-sub{font-size:13px;color:#666}
.chart-hydro{width:100%;height:420px}
.chart-soil{width:100%;height:320px}

.toast{position:fixed;left:50%;top:24px;transform:translateX(-50%);background:rgba(0,0,0,.75);color:#fff;padding:8px 16px;border-radius:6px;font-size:13px;z-index:2000;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}

@media (max-width:900px){
  .chart-hydro{height:480px}
  .chart-soil{height:280px}
}
</style>
</head>
<body>
<div class="page-wrap">
  <div class="breadcrumb">
    <span>智能决策</span><span class="sep">/</span>
    <span class="cur">防洪抗旱决策</span>
  </div>

  <div class="card filter-card">
    <div class="filter-bar">
      <div class="filter-left">
        <span class="lbl">日期</span>
        <div class="date-range">
          <input type="date" class="field" id="start-date">
          <span class="date-sep">—</span>
          <input type="date" class="field" id="end-date">
        </div>
      </div>
      <div class="filter-actions">
        <button type="button" class="btn btn-primary" id="query-btn">查询</button>
        <button type="button" class="btn btn-default" id="reset-btn">重置</button>
      </div>
    </div>
  </div>

  <div class="main-scroll">
    <div class="card chart-card">
      <div class="chart-hd">
        <div class="chart-title">水文关系预测分析图</div>
      </div>
      <div class="chart-hydro" id="chart-hydro"></div>
    </div>

    <div class="card chart-card">
      <div class="chart-hd">
        <div class="chart-title">墒情分析</div>
        <div class="chart-sub" id="soil-station">太怀监测站</div>
      </div>
      <div class="chart-soil" id="chart-soil"></div>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
(function () {
  function $(id) { return document.getElementById(id); }
  function toast(msg) {
    var el = $('toast');
    if (!el) return;
    el.textContent = msg || '';
    el.classList.add('show');
    clearTimeout(toast._t);
    toast._t = setTimeout(function () { el.classList.remove('show'); }, 2200);
  }
  function pad(n) { return n < 10 ? '0' + n : '' + n; }
  function fmtDate(d) {
    return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
  }
  function parseDate(s) {
    var p = String(s || '').split('-');
    if (p.length < 3) return null;
    return new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2]));
  }
  function addDays(d, n) {
    var x = new Date(d.getTime());
    x.setDate(x.getDate() + n);
    return x;
  }

  var hydroChart = null;
  var soilChart = null;
  var defaultStart = '2026-09-01';
  var defaultEnd = '2026-09-15';

  /** mock：实测段天数（其余为预测） */
  var OBSERVED_DAYS = 3;

  function buildHydroMock(start, end) {
    var s = parseDate(start) || parseDate(defaultStart);
    var e = parseDate(end) || parseDate(defaultEnd);
    if (e < s) { var t = s; s = e; e = t; }
    var dates = [];
    var cur = new Date(s.getTime());
    while (cur <= e) {
      dates.push(fmtDate(cur));
      cur = addDays(cur, 1);
    }
    if (!dates.length) dates = [fmtDate(s)];

    var n = dates.length;
    var split = Math.min(OBSERVED_DAYS, Math.max(1, n - 1));

    var rainObs = [];
    var rainPred = [];
    var levelObs = [];
    var levelPred = [];
    var flowObs = [];
    var flowPred = [];

    // 与设计稿接近的水位/流量走势
    var levelSeed = [72, 68, 55, 48, 52, 58, 62, 70, 66, 60, 55, 50, 48, 52, 58];
    var flowSeed = [42, 40, 36, 38, 41, 39, 37, 40, 43, 41, 39, 38, 40, 42, 44];
    var rainSeed = [8, 18, 12, 6, 10, 14, 9, 11, 7, 13, 16, 8, 10, 12, 9];

    for (var i = 0; i < n; i++) {
      var rain = rainSeed[i % rainSeed.length] + (i % 3);
      var level = levelSeed[i % levelSeed.length];
      var flow = flowSeed[i % flowSeed.length];

      if (i < split) {
        rainObs.push(rain);
        rainPred.push(null);
        levelObs.push(level);
        levelPred.push(null);
        flowObs.push(flow);
        flowPred.push(null);
      } else {
        rainObs.push(null);
        rainPred.push(rain);
        levelObs.push(null);
        levelPred.push(level);
        flowObs.push(null);
        flowPred.push(flow);
      }
    }

    // 分界点写入预测序列，保证折线视觉连续
    if (split > 0 && split <= n) {
      var join = split - 1;
      levelPred[join] = levelObs[join];
      flowPred[join] = flowObs[join];
    }

    return {
      dates: dates,
      split: split,
      rainObs: rainObs,
      rainPred: rainPred,
      levelObs: levelObs,
      levelPred: levelPred,
      flowObs: flowObs,
      flowPred: flowPred
    };
  }

  function buildSoilMock() {
    var depths = [
      { name: '10cm', color: '#c084fc', base: 26.5 },
      { name: '20cm', color: '#f9a8d4', base: 27.2 },
      { name: '30cm', color: '#fcd34d', base: 25.8 },
      { name: '40cm', color: '#86efac', base: 24.6 },
      { name: '50cm', color: '#67e8f9', base: 28.1 },
      { name: '60cm', color: '#93c5fd', base: 26.0 },
      { name: '80cm', color: '#a5b4fc', base: 23.5 },
      { name: '100cm', color: '#fda4af', base: 22.8 }
    ];
    var times = [];
    var start = new Date(2026, 6, 14, 4, 1);
    for (var i = 0; i < 12; i++) {
      var d = new Date(start.getTime() + i * 30 * 3600 * 1000);
      times.push(pad(d.getMonth() + 1) + '/' + pad(d.getDate()) + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes()));
    }
    var series = depths.map(function (dep, di) {
      var data = times.map(function (_, ti) {
        var wave = Math.sin((ti + di) * 0.55) * 1.2 + Math.cos(ti * 0.35 + di) * 0.6;
        return Math.round((dep.base + wave) * 10) / 10;
      });
      return {
        name: dep.name,
        type: 'line',
        smooth: true,
        showSymbol: true,
        symbol: 'circle',
        symbolSize: 7,
        itemStyle: { color: dep.color, borderColor: dep.color, borderWidth: 1.5 },
        lineStyle: { width: 2, color: dep.color },
        areaStyle: { color: dep.color, opacity: 0.06 },
        data: data
      };
    });
    return { times: times, series: series, station: '太怀监测站' };
  }

  function renderHydro(data) {
    if (!hydroChart) hydroChart = echarts.init($('chart-hydro'));
    var axisCommon = {
      axisLine: { lineStyle: { color: '#e8e8e8' } },
      axisTick: { show: false },
      axisLabel: { color: '#8c8c8c', fontSize: 11 },
      splitLine: { show: true, lineStyle: { type: 'dashed', color: '#f0f0f0' } }
    };

    hydroChart.setOption({
      color: ['#5B8FF9', '#91A7FF', '#F6BD16', '#F6BD16', '#73C892', '#5B8FF9'],
      tooltip: {
        trigger: 'axis',
        axisPointer: { type: 'cross', link: [{ xAxisIndex: 'all' }] }
      },
      legend: {
        bottom: 4,
        left: 'center',
        itemWidth: 14,
        itemHeight: 10,
        textStyle: { color: '#666', fontSize: 12 },
        data: [
          { name: '实测水位', icon: 'circle' },
          { name: '预测水位', icon: 'emptyCircle' },
          { name: '实测流量', icon: 'circle' },
          { name: '预测流量', icon: 'emptyCircle' },
          { name: '实际降雨量', icon: 'rect' },
          { name: '预测降雨量', icon: 'rect' }
        ]
      },
      axisPointer: { link: [{ xAxisIndex: 'all' }] },
      grid: [
        { left: 56, right: 56, top: 28, height: '28%' },
        { left: 56, right: 56, top: '48%', height: '36%' }
      ],
      xAxis: [
        {
          type: 'category',
          gridIndex: 0,
          data: data.dates,
          boundaryGap: true,
          axisLabel: { show: false },
          axisTick: { show: false },
          axisLine: { lineStyle: { color: '#e8e8e8' } },
          splitLine: { show: false }
        },
        {
          type: 'category',
          gridIndex: 1,
          data: data.dates,
          boundaryGap: true,
          axisLabel: { color: '#8c8c8c', fontSize: 11, rotate: 0 },
          axisTick: { show: false },
          axisLine: { lineStyle: { color: '#e8e8e8' } }
        }
      ],
      yAxis: [
        Object.assign({
          type: 'value',
          gridIndex: 0,
          name: 'mm',
          nameTextStyle: { color: '#8c8c8c', fontSize: 11, padding: [0, 28, 0, 0] },
          min: 0,
          max: 20,
          splitNumber: 2
        }, axisCommon),
        Object.assign({
          type: 'value',
          gridIndex: 1,
          name: 'm',
          nameTextStyle: { color: '#8c8c8c', fontSize: 11, padding: [0, 28, 0, 0] },
          min: 0,
          max: 100,
          splitNumber: 4
        }, axisCommon),
        Object.assign({
          type: 'value',
          gridIndex: 1,
          name: 'm³/s',
          nameTextStyle: { color: '#8c8c8c', fontSize: 11, padding: [0, 0, 0, 8] },
          min: 0,
          max: 50,
          splitNumber: 2,
          splitLine: { show: false }
        }, {
          axisLine: { show: false },
          axisTick: { show: false },
          axisLabel: { color: '#8c8c8c', fontSize: 11 }
        })
      ],
      series: [
        {
          name: '实际降雨量',
          type: 'bar',
          xAxisIndex: 0,
          yAxisIndex: 0,
          barMaxWidth: 22,
          itemStyle: { color: '#73C892', borderRadius: [2, 2, 0, 0] },
          data: data.rainObs
        },
        {
          name: '预测降雨量',
          type: 'bar',
          xAxisIndex: 0,
          yAxisIndex: 0,
          barMaxWidth: 22,
          itemStyle: { color: '#5B8FF9', borderRadius: [2, 2, 0, 0] },
          data: data.rainPred
        },
        {
          name: '实测水位',
          type: 'line',
          xAxisIndex: 1,
          yAxisIndex: 1,
          showSymbol: true,
          symbol: 'circle',
          symbolSize: 8,
          itemStyle: { color: '#1D39C4' },
          lineStyle: { width: 3.5, color: '#1D39C4' },
          data: data.levelObs,
          connectNulls: false,
          z: 5
        },
        {
          name: '预测水位',
          type: 'line',
          xAxisIndex: 1,
          yAxisIndex: 1,
          showSymbol: true,
          symbol: 'emptyCircle',
          symbolSize: 8,
          itemStyle: { color: '#91A7FF', borderWidth: 1.5 },
          lineStyle: { width: 2, color: '#91A7FF' },
          data: data.levelPred,
          connectNulls: false,
          z: 4
        },
        {
          name: '实测流量',
          type: 'line',
          xAxisIndex: 1,
          yAxisIndex: 2,
          showSymbol: true,
          symbol: 'circle',
          symbolSize: 8,
          itemStyle: { color: '#F6BD16' },
          lineStyle: { width: 2.5, color: '#F6BD16' },
          data: data.flowObs,
          connectNulls: false,
          z: 3
        },
        {
          name: '预测流量',
          type: 'line',
          xAxisIndex: 1,
          yAxisIndex: 2,
          showSymbol: true,
          symbol: 'emptyCircle',
          symbolSize: 8,
          itemStyle: { color: '#F6BD16', borderWidth: 1.5 },
          lineStyle: { width: 2, color: '#F6BD16' },
          data: data.flowPred,
          connectNulls: false,
          z: 2
        }
      ]
    }, true);
  }

  function renderSoil(data) {
    if (!soilChart) soilChart = echarts.init($('chart-soil'));
    $('soil-station').textContent = data.station || '太怀监测站';
    soilChart.setOption({
      tooltip: { trigger: 'axis' },
      legend: {
        bottom: 0,
        left: 'center',
        itemWidth: 14,
        itemHeight: 8,
        textStyle: { color: '#666', fontSize: 12 },
        data: data.series.map(function (s) { return s.name; })
      },
      grid: { left: 48, right: 24, top: 24, bottom: 48 },
      xAxis: {
        type: 'category',
        data: data.times,
        boundaryGap: false,
        axisTick: { show: false },
        axisLine: { lineStyle: { color: '#e8e8e8' } },
        axisLabel: { color: '#8c8c8c', fontSize: 11 }
      },
      yAxis: {
        type: 'value',
        name: '%',
        nameTextStyle: { color: '#8c8c8c', fontSize: 11, padding: [0, 24, 0, 0] },
        min: 15,
        max: 35,
        splitNumber: 5,
        axisTick: { show: false },
        axisLine: { show: false },
        axisLabel: { color: '#8c8c8c', fontSize: 11 },
        splitLine: { lineStyle: { type: 'dashed', color: '#f0f0f0' } }
      },
      series: data.series
    }, true);
  }

  function loadAll() {
    var start = $('start-date').value || defaultStart;
    var end = $('end-date').value || defaultEnd;
    renderHydro(buildHydroMock(start, end));
    renderSoil(buildSoilMock());
  }

  function resetDates() {
    $('start-date').value = defaultStart;
    $('end-date').value = defaultEnd;
  }

  function init() {
    resetDates();
    loadAll();
    $('query-btn').addEventListener('click', function () {
      if (!$('start-date').value || !$('end-date').value) {
        toast('请选择日期');
        return;
      }
      loadAll();
    });
    $('reset-btn').addEventListener('click', function () {
      resetDates();
      loadAll();
    });
    window.addEventListener('resize', function () {
      if (hydroChart) hydroChart.resize();
      if (soilChart) soilChart.resize();
    });
  }

  init();
})();
</script>
</body>
</html>
