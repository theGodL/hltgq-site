<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>智能防洪决策</title>
<script src="./lib/echarts.min.js"></script>
<script src="./lib/model-api.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;max-width:100%;overflow:hidden}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:#f0f2f5;color:#333;font-size:14px}
.page-wrap{height:100%;min-height:0;padding:16px;display:flex;flex-direction:column;gap:12px;width:100%;max-width:100%;box-sizing:border-box;overflow:hidden}
.breadcrumb{color:#999;font-size:13px;flex-shrink:0}
.breadcrumb .sep{margin:0 6px}
.breadcrumb .cur{color:#333}

.card{background:#fff;border-radius:8px;box-shadow:0 1px 2px rgba(0,0,0,.03)}
.tabs{display:flex;gap:0;flex-shrink:0;background:#fff;border-radius:8px;overflow:hidden;box-shadow:0 1px 2px rgba(0,0,0,.03)}
.tab-btn{flex:0 0 auto;min-width:120px;height:40px;border:none;background:#fff;color:#666;font-size:14px;cursor:pointer;border-bottom:2px solid transparent;padding:0 20px}
.tab-btn:hover{color:#1677ff}
.tab-btn.active{color:#1677ff;font-weight:600;border-bottom-color:#1677ff}

.panel{display:flex;flex:1;min-height:0;overflow:hidden;flex-direction:column;gap:12px}

.filter-card{padding:14px 16px;flex-shrink:0}
.filter-bar{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap}
.filter-left{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.filter-left .lbl,.pred-filter .lbl{color:#666;font-size:13px;white-space:nowrap}
.date-range{display:flex;align-items:center;gap:6px}
.field{height:32px;border:1px solid #d9d9d9;border-radius:6px;padding:0 10px;font-size:13px;outline:none;background:#fff;color:#333}
.field:focus{border-color:#1677ff;box-shadow:0 0 0 2px rgba(22,119,255,.1)}
.date-range .field{width:140px}
.field.dt{width:180px}
.select{min-width:160px;max-width:260px}
.date-sep{color:#999}
.filter-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:5px;padding:0 16px;height:32px;border:1px solid transparent;border-radius:6px;cursor:pointer;font-size:14px;white-space:nowrap;transition:all .2s;background:#fff}
.btn-primary{background:#1677ff;color:#fff;border-color:#1677ff}
.btn-primary:hover{background:#4096ff;border-color:#4096ff}
.btn-primary[disabled],.btn[disabled]{opacity:.55;cursor:not-allowed}
.btn-default{color:#333;border-color:#d9d9d9}
.btn-default:hover{color:#1677ff;border-color:#1677ff}
.switch-row{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.switch-item{display:inline-flex;align-items:center;gap:6px;color:#666;font-size:13px;cursor:pointer;user-select:none}
.switch-item input{width:14px;height:14px}
.hint{font-size:12px;color:#999}

.main-scroll{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;display:block;padding-right:2px}
.main-scroll > * + *{margin-top:12px}
.section-label{font-size:13px;font-weight:700;color:#1f1f1f;padding:2px 2px 0}
.chart-card{padding:16px 16px 12px;display:flex;flex-direction:column;flex-shrink:0}
.chart-hd{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:8px;flex-shrink:0;flex-wrap:wrap}
.chart-title{font-size:14px;font-weight:700;color:#1f1f1f;line-height:22px}
.chart-tip{font-size:12px;color:#999;margin-left:8px;font-weight:400}
.chart-box{width:100%;height:300px;min-height:300px;flex-shrink:0}
.chart-box.tall{height:400px;min-height:400px}
.chart-box.flood-combo{height:560px;min-height:560px}
.pred-filter{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pred-filter .select{min-width:220px;max-width:420px}
.seg-list{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px;flex-shrink:0}
.seg-chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:4px;font-size:12px;background:#f5f5f5;color:#595959}
.seg-chip.lv2{background:#fff7e6;color:#d48806}
.seg-chip.lv3{background:#fff1f0;color:#cf1322}
.seg-chip.lv4{background:#fff1f0;color:#a8071a;font-weight:600}
.seg-chip.lv5{background:#f9f0ff;color:#531dab;font-weight:600}

.toast{position:fixed;left:50%;top:24px;transform:translateX(-50%);background:rgba(0,0,0,.75);color:#fff;padding:8px 16px;border-radius:6px;font-size:13px;z-index:2000;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}

@media (max-width:900px){
  .chart-box{height:280px;min-height:280px}
  .chart-box.tall{height:340px;min-height:340px}
  .chart-box.flood-combo{height:480px;min-height:480px}
}
</style>
</head>
<body>
<div class="page-wrap">
  <div class="breadcrumb">
    <span>智能决策</span><span class="sep">/</span>
    <span class="cur">智能防洪决策</span>
  </div>

  <!-- ========== 智能防洪（实测+预测拼图） ========== -->
  <div class="panel active" id="panel-flood" style="display:flex">
    <div class="card filter-card">
      <div class="filter-bar">
        <div class="filter-left">
          <span class="lbl">日期</span>
          <div class="date-range">
            <input type="date" class="field" id="flood-start">
            <span class="date-sep">—</span>
            <input type="date" class="field" id="flood-end">
          </div>
          <span class="lbl">站点</span>
          <select class="field select" id="flood-stcd"></select>
        </div>
        <div class="filter-actions">
          <button type="button" class="btn btn-primary" id="flood-query-btn">查询</button>
          <button type="button" class="btn btn-default" id="flood-reset-btn">重置</button>
        </div>
      </div>
    </div>

    <div class="main-scroll" id="flood-scroll">
      <div class="card chart-card">
        <div class="chart-hd">
          <div class="chart-title">水文关系预测分析图 <span class="chart-tip" id="flood-tip"></span></div>
        </div>
        <div class="chart-box flood-combo" id="chart-flood"></div>
      </div>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
(function () {
  function $(id) { return document.getElementById(id); }
  function toast(msg) {
    var el = $('toast');
    if (!el) return;
    el.textContent = msg || '';
    el.classList.add('show');
    clearTimeout(toast._t);
    toast._t = setTimeout(function () { el.classList.remove('show'); }, 2200);
  }
  function pad(n) { return n < 10 ? '0' + n : '' + n; }
  function fmtDate(d) {
    return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
  }
  function fmtDateTimeLocal(d) {
    return fmtDate(d) + 'T' + pad(d.getHours()) + ':' + pad(d.getMinutes());
  }
  function toApiDateTime(localVal) {
    return String(localVal || '').replace('T', ' ').slice(0, 16);
  }
  function hoursInclusive(startLocal, endLocal) {
    var a = new Date(startLocal);
    var b = new Date(endLocal);
    if (!isFinite(a.getTime()) || !isFinite(b.getTime())) return 0;
    return Math.round((b - a) / 3600000) + 1;
  }
  function daysBetween(a, b) {
    var t0 = new Date(a + 'T00:00:00').getTime();
    var t1 = new Date(b + 'T00:00:00').getTime();
    return Math.floor((t1 - t0) / 86400000) + 1;
  }
  function maxOf(arr, floor) {
    var m = floor == null ? 0 : floor;
    (arr || []).forEach(function (v) {
      if (v != null && isFinite(Number(v)) && Number(v) > m) m = Number(v);
    });
    return m;
  }
  function niceCeil(v, step) {
    step = step || 1;
    if (v <= 0) return step;
    return Math.ceil(v / step) * step;
  }

  var API = window.ModelApi;
  var charts = { flood: null };
  var stationsLoaded = false;
  var COLOR = {
    rainObs: '#73C892',
    rainPred: '#5B8FF9',
    levelObs: '#1D39C4',
    levelPred: '#8C9EFF',
    flowObs: '#D48806',
    flowPred: '#F5D48A'
  };

  function ensureChart(key, el) {
    if (!el || !window.echarts) return null;
    if (!charts[key]) charts[key] = echarts.init(el);
    return charts[key];
  }
  function emptyChart(key, elId, tip) {
    var c = ensureChart(key, $(elId));
    if (!c) return;
    c.clear();
    c.setOption({
      title: {
        text: tip || '暂无数据',
        left: 'center',
        top: 'middle',
        textStyle: { color: '#bbb', fontSize: 14, fontWeight: 'normal' }
      }
    });
    requestAnimationFrame(function () { c.resize(); });
  }
  function resizeCharts() {
    requestAnimationFrame(function () {
      Object.keys(charts).forEach(function (k) {
        if (charts[k]) charts[k].resize();
      });
    });
  }

  /* ---------- shared station helpers ---------- */
  function fillStationSelect(el, list, selected) {
    list = list || [];
    el.innerHTML = list.map(function (s) {
      var id = s.stcd || s.code || '';
      var name = s.stnm || s.name || id;
      return '<option value="' + id + '">' + name + '</option>';
    }).join('');
    if (selected) el.value = selected;
    if (!el.value && list[0]) el.value = list[0].stcd || list[0].code || '';
  }
  function syncStationSelect(el, stcd) {
    if (!stcd || !el) return;
    var found = false;
    for (var i = 0; i < el.options.length; i++) {
      if (el.options[i].value === stcd) { found = true; break; }
    }
    if (!found) {
      var opt = document.createElement('option');
      opt.value = stcd;
      opt.textContent = stcd;
      el.appendChild(opt);
    }
    el.value = stcd;
  }

  /* ========== 智能防洪：实测 + 预测拼图 ========== */
  function addDays(dateStr, n) {
    var d = new Date(dateStr + 'T00:00:00');
    d.setDate(d.getDate() + n);
    return fmtDate(d);
  }
  function eachDate(start, end) {
    var out = [];
    if (!start || !end || start > end) return out;
    var cur = start;
    while (cur <= end) {
      out.push(cur);
      cur = addDays(cur, 1);
    }
    return out;
  }
  function setFloodDefaultDates() {
    var today = new Date();
    var start = new Date(today);
    start.setDate(today.getDate() - 2);
    var end = new Date(today);
    end.setDate(today.getDate() + 12);
    $('flood-start').value = fmtDate(start);
    $('flood-end').value = fmtDate(end);
  }

  /** 短期预报逐小时 → 按日聚合（雨量和、水位/流量取当日 08 时附近或末日值） */
  function aggregateForecastDaily(dailies) {
    var map = {};
    (dailies || []).forEach(function (row) {
      var t = String(row.forecastDate || '');
      if (!t) return;
      var day = t.slice(0, 10);
      if (!/^\d{4}-\d{2}-\d{2}$/.test(day)) return;
      if (!map[day]) map[day] = { rain: 0, rainHit: false, level: null, flow: null, level08: null, flow08: null };
      var rain = row.rainfall;
      if (rain != null && isFinite(Number(rain))) {
        map[day].rain += Number(rain);
        map[day].rainHit = true;
      }
      var hhmm = t.length >= 16 ? t.slice(11, 16) : '';
      var level = row.waterLevel;
      var flow = row.outflowRate != null ? row.outflowRate : row.inflowRate;
      if (level != null && isFinite(Number(level))) {
        map[day].level = Number(level);
        if (hhmm === '08:00') map[day].level08 = Number(level);
      }
      if (flow != null && isFinite(Number(flow))) {
        map[day].flow = Number(flow);
        if (hhmm === '08:00') map[day].flow08 = Number(flow);
      }
    });
    Object.keys(map).forEach(function (day) {
      var m = map[day];
      if (m.level08 != null) m.level = m.level08;
      if (m.flow08 != null) m.flow = m.flow08;
      if (!m.rainHit) m.rain = null;
      else m.rain = Math.round(m.rain * 10) / 10;
    });
    return map;
  }

  function mapByDate(dates, values) {
    var m = {};
    (dates || []).forEach(function (d, i) {
      m[d] = values && values[i] != null && values[i] !== '' ? values[i] : null;
    });
    return m;
  }

  function renderFloodCombo(payload) {
    var c = ensureChart('flood', $('chart-flood'));
    if (!c) return;
    var dates = (payload && payload.dates) || [];
    if (!dates.length) {
      emptyChart('flood', 'chart-flood', '暂无数据');
      $('flood-tip').textContent = '';
      return;
    }
    var split = payload.splitDate || '';
    var obsRain = [], predRain = [], obsLevel = [], predLevel = [], obsFlow = [], predFlow = [];
    dates.forEach(function (d) {
      var isObs = !split || d <= split;
      var isPred = split ? d > split : false;
      var r = payload.rainMap[d];
      var lv = payload.levelMap[d];
      var fl = payload.flowMap[d];
      obsRain.push(isObs ? r : null);
      predRain.push(isPred ? r : null);
      obsLevel.push(isObs ? lv : null);
      predLevel.push(isPred ? lv : null);
      obsFlow.push(isObs ? fl : null);
      predFlow.push(isPred ? fl : null);
    });

    var rainMax = niceCeil(Math.max(20, maxOf(obsRain.concat(predRain), 0)), 5);
    var levelVals = obsLevel.concat(predLevel).filter(function (v) {
      return v != null && isFinite(Number(v));
    }).map(Number);
    var levelMin = 0, levelMax = 100;
    if (levelVals.length) {
      levelMin = Math.max(0, Math.floor(Math.min.apply(null, levelVals) - 2));
      levelMax = Math.ceil(Math.max.apply(null, levelVals) + 2);
      if (levelMax <= levelMin) levelMax = levelMin + 2;
    }
    var flowMax = niceCeil(Math.max(10, maxOf(obsFlow.concat(predFlow), 0)), 5);

    var tipParts = [];
    if (payload.stnm) tipParts.push('站点：' + payload.stnm);
    if (split) tipParts.push('分界：' + split + '（含）实测 / 之后预测');
    $('flood-tip').textContent = tipParts.join(' · ');

    c.setOption({
      tooltip: {
        trigger: 'axis',
        axisPointer: { type: 'cross', link: [{ xAxisIndex: 'all' }] }
      },
      legend: {
        bottom: 6, left: 'center', itemWidth: 14, itemHeight: 10,
        textStyle: { color: '#666', fontSize: 12 },
        data: ['实测水位', '预测水位', '实测流量', '预测流量', '实际降雨量', '预测降雨量']
      },
      axisPointer: { link: [{ xAxisIndex: 'all' }] },
      grid: [
        { left: 56, right: 56, top: 28, height: '30%' },
        { left: 56, right: 56, top: '44%', height: '40%' }
      ],
      xAxis: [
        {
          type: 'category', gridIndex: 0, data: dates, boundaryGap: true,
          axisLabel: { show: false }, axisTick: { show: false },
          axisLine: { lineStyle: { color: '#e8e8e8' } }
        },
        {
          type: 'category', gridIndex: 1, data: dates, boundaryGap: false,
          axisTick: { show: false },
          axisLine: { lineStyle: { color: '#e8e8e8' } },
          axisLabel: { color: '#8c8c8c', fontSize: 11, hideOverlap: true }
        }
      ],
      yAxis: [
        {
          type: 'value', gridIndex: 0, name: 'mm', min: 0, max: rainMax,
          nameTextStyle: { color: '#8c8c8c', fontSize: 11 },
          axisLabel: { color: '#8c8c8c' },
          splitLine: { lineStyle: { type: 'dashed', color: '#f0f0f0' } }
        },
        {
          type: 'value', gridIndex: 1, name: 'm', min: levelMin, max: levelMax,
          nameTextStyle: { color: '#8c8c8c', fontSize: 11 },
          axisLabel: { color: '#8c8c8c' },
          splitLine: { lineStyle: { type: 'dashed', color: '#f0f0f0' } }
        },
        {
          type: 'value', gridIndex: 1, name: 'm³/s', min: 0, max: flowMax,
          nameTextStyle: { color: '#8c8c8c', fontSize: 11 },
          axisLabel: { color: '#8c8c8c' },
          splitLine: { show: false }
        }
      ],
      series: [
        {
          name: '实际降雨量', type: 'bar', xAxisIndex: 0, yAxisIndex: 0, barMaxWidth: 18,
          itemStyle: { color: COLOR.rainObs, borderRadius: [2, 2, 0, 0] },
          data: obsRain
        },
        {
          name: '预测降雨量', type: 'bar', xAxisIndex: 0, yAxisIndex: 0, barMaxWidth: 18,
          itemStyle: { color: COLOR.rainPred, borderRadius: [2, 2, 0, 0] },
          data: predRain
        },
        {
          name: '实测水位', type: 'line', xAxisIndex: 1, yAxisIndex: 1,
          showSymbol: true, symbol: 'emptyCircle', symbolSize: 8,
          itemStyle: { color: COLOR.levelObs },
          lineStyle: { width: 2.5, color: COLOR.levelObs },
          data: obsLevel, connectNulls: false
        },
        {
          name: '预测水位', type: 'line', xAxisIndex: 1, yAxisIndex: 1,
          showSymbol: true, symbol: 'emptyCircle', symbolSize: 8,
          itemStyle: { color: COLOR.levelPred },
          lineStyle: { width: 2.5, color: COLOR.levelPred },
          data: predLevel, connectNulls: false
        },
        {
          name: '实测流量', type: 'line', xAxisIndex: 1, yAxisIndex: 2,
          showSymbol: true, symbol: 'emptyCircle', symbolSize: 8,
          itemStyle: { color: COLOR.flowObs },
          lineStyle: { width: 2.5, color: COLOR.flowObs },
          data: obsFlow, connectNulls: false
        },
        {
          name: '预测流量', type: 'line', xAxisIndex: 1, yAxisIndex: 2,
          showSymbol: true, symbol: 'emptyCircle', symbolSize: 8,
          itemStyle: { color: COLOR.flowPred },
          lineStyle: { width: 2.5, color: COLOR.flowPred },
          data: predFlow, connectNulls: false
        }
      ]
    }, true);
    requestAnimationFrame(function () { c.resize(); });
  }

  async function loadFloodStations() {
    var data = await API.floodDrought.stations();
    var levels = data.waterLevel || [];
    fillStationSelect($('flood-stcd'), levels);
    // 优先坝上
    var prefer = levels.find(function (s) {
      return /坝上|花凉亭/.test(String(s.stnm || ''));
    });
    if (prefer) $('flood-stcd').value = prefer.stcd;
    stationsLoaded = true;
  }

  async function loadFloodCombo() {
    var start = ($('flood-start').value || '').trim();
    var end = ($('flood-end').value || '').trim();
    if (!start || !end) return toast('请选择日期');
    if (start > end) return toast('起始日期不能晚于截止日期');
    if (daysBetween(start, end) > 90) return toast('日期区间不能超过 90 天');

    var today = fmtDate(new Date());
    var histEnd = end < today ? end : today;
    var histStart = start;
    var hasHist = histStart <= histEnd && histStart <= today;
    var predStart = hasHist ? addDays(histEnd, 1) : (start > today ? start : addDays(today, 1));
    if (predStart < start) predStart = start;
    var hasPred = predStart <= end;

    var btn = $('flood-query-btn');
    btn.disabled = true;
    btn.textContent = '查询中…';
    emptyChart('flood', 'chart-flood', '加载中…');

    var rainMap = {};
    var levelMap = {};
    var flowMap = {};
    var stnm = '';
    var splitDate = hasHist ? histEnd : '';

    try {
      if (hasHist) {
        var hist = await API.floodDrought.history(histStart, histEnd, {
          levelStcd: $('flood-stcd').value || null
        });
        if (hist.level && hist.level.stcd) syncStationSelect($('flood-stcd'), hist.level.stcd);
        stnm = (hist.level && hist.level.stnm) || stnm;
        Object.assign(rainMap, mapByDate(hist.dates, hist.rain && hist.rain.values));
        Object.assign(levelMap, mapByDate(hist.dates, hist.level && hist.level.values));
        Object.assign(flowMap, mapByDate(hist.dates, hist.flow && hist.flow.values));
      }

      if (hasPred) {
        var predHours = daysBetween(predStart, end) * 24;
        if (predHours < 1 || predHours > 384) {
          toast('预测区间需在 1～16 天内（对应短期预报窗口）');
        } else if (API.showLoading) {
          API.showLoading('短期来水预测计算中…');
        }
        if (predHours >= 1 && predHours <= 384) {
          try {
            var body = {
              start: predStart + ' 08:00',
              end: addDays(end, 1) + ' 08:00',
              enablePower: false,
              enableTunnel: false,
              enableSpillway: false,
              schemeName: '智能防洪_' + predStart + '_' + end
            };
            var res = await API.short.submit(body);
            var recordId = res && (res.recordId || res.id);
            if (!recordId) throw new Error('未返回预测任务 ID');
            await API.short.wait(recordId);
            var detail = await API.short.detail(recordId);
            var dailyMap = aggregateForecastDaily(detail && detail.dailies);
            Object.keys(dailyMap).forEach(function (day) {
              if (day < predStart || day > end) return;
              var m = dailyMap[day];
              rainMap[day] = m.rain;
              levelMap[day] = m.level;
              flowMap[day] = m.flow;
            });
          } catch (predErr) {
            toast(API.friendlyError
              ? API.friendlyError(predErr, '预测计算失败，已展示实测段')
              : ((predErr && predErr.message) || '预测计算失败，已展示实测段'));
          } finally {
            if (API.hideLoading) API.hideLoading();
          }
        }
      }

      if (!stnm) {
        var opt = $('flood-stcd').selectedOptions[0];
        stnm = opt ? opt.textContent : '';
      }

      renderFloodCombo({
        dates: eachDate(start, end),
        splitDate: splitDate,
        rainMap: rainMap,
        levelMap: levelMap,
        flowMap: flowMap,
        stnm: stnm
      });
    } catch (e) {
      emptyChart('flood', 'chart-flood', (e && e.message) || '查询失败');
      toast(API.friendlyError ? API.friendlyError(e, '查询失败') : ((e && e.message) || '查询失败'));
    } finally {
      btn.disabled = false;
      btn.textContent = '查询';
      if (charts.flood) charts.flood.resize();
    }
  }

  /* ---------- bind & init ---------- */
  function initFlood() {
    setFloodDefaultDates();
    emptyChart('flood', 'chart-flood', '请选择日期后查询');

    $('flood-query-btn').addEventListener('click', loadFloodCombo);
    $('flood-reset-btn').addEventListener('click', function () {
      setFloodDefaultDates();
      loadFloodCombo();
    });
    $('flood-stcd').addEventListener('change', function () {
      if (stationsLoaded) loadFloodCombo();
    });

    window.addEventListener('resize', resizeCharts);

    (async function () {
      if (!API || !API.floodDrought) {
        toast('接口客户端未加载');
        return;
      }
      try {
        await loadFloodStations();
      } catch (e) {
        toast((e && e.message) || '站点列表加载失败');
      }
      await loadFloodCombo();
    })();
  }

  initFlood();
})();
</script>
</body>
</html>
